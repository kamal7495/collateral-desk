n, or natively from an anonymous automated trading system, in which case there's no novation step at all since the CCP was already the original counterparty from execution.","GC Pooling (Eurex Repo / Eurex Clearing / Clearstream Banking) is a real, named end-to-end system worth knowing as a concrete example of the abstract 'trading → clearing → settlement' pipeline: a cash borrower posts an anonymous quote on Eurex Repo, a lender accepts it, Eurex Repo passes trade details to Eurex Clearing (which becomes CCP to both sides — note: NOT via novation, since Eurex Clearing was the original counterparty from the start), Eurex Clearing nets each member's position and passes the net obligation to Clearstream Banking, which actually settles it DvP and reports back to both parties.","RepoClear (part of LCH.Clearnet) runs the equivalent standardised process for CCP-cleared repo more broadly: bilaterally-agreed trades are matched (e.g. via ETCMS) and forwarded to RepoClear for validation and novation to LCH.Clearnet Ltd, while trades from anonymous automated trading systems arrive without a novation step since the CCP was already the counterparty; either way RepoClear nets same-currency, same-closing-date gross trades per firm down to a single settlement obligation before handing it to the actual place of settlement."],"examples":[{"title":"Same trade, two presentations","body":"A classic repo lends USD 30,071,791.67 (bond value + accrued interest) at 3.42%, repaid as USD 30,091,789.41 (principal + USD 19,997.74 repo interest) at close. Treated instead as a buy/sell-back, the same USD 30,071,791.67 opening value is repaid via a closing leg priced at 99.934374% clean plus accrued interest to the new date — which nets to the identical USD 30,091,789.41, just expressed as a bond price rather than principal-plus-interest."},{"title":"Multilateral netting collapses 9 trades into 1","body":"Firm A has executed 5 repos in Bond X (delivering USD 50,000,000 bonds vs. receiving USD 60,000,000 cash across several counterparties) plus 4 reverse repos in the same bond (receiving USD 40,000,000 bonds vs. paying USD 51,000,000 cash). Left bilateral, all 9 trades need individual risk management and potential margin calls with each separate counterparty. Novated to a CCP, the CCP's multilateral netting collapses all 9 into a single net settlement obligation for Firm A: deliver USD 10,000,000 of bonds against receiving USD 9,000,000 cash — one settlement instead of nine, and one position to risk-manage instead of nine bilateral relationships."},{"title":"GC Pooling, step by step","body":"A bank wanting to borrow cash posts an anonymous quote on Eurex Repo naming currency, amount, term, required rate and required collateral basket. Another member accepts it anonymously and becomes the lender. Eurex Repo captures both legs (each counterparty to Eurex Clearing) and passes details to Eurex Clearing, which is CCP to both sides from the outset. Eurex Clearing nets the member's overall position and passes the net settlement obligation to Clearstream Banking, which settles it DvP and reports the result back to both original parties — the whole trading-to-settlement chain runs through three named institutions with a defined handoff at each step."},{"title":"General Collateral vs. Special Collateral, side by side","body":"A cash-rich fund wants to lend USD 50,000,000 overnight against ANY good-quality government bond — it doesn't care which specific bond it receives, so it repos at the going General Collateral (GC) rate, say 2.10%. Meanwhile, a dealer urgently needs one SPECIFIC bond (a particular 10-year Treasury that's in short supply because everyone's shorting it) to make a delivery — they're willing to lend cash at a much lower rate, say 0.25% (a 'special' repo rate), just to get their hands on THAT bond. Same repo mechanics, opposite motivations: GC trades are about the cash; special trades are about the specific security."}],"key_terms":["Buy/Sell Back","Delivery By Value","DBV","GMRA","Tri-Party Repo","Central Counterparty","Novation","Multilateral Netting","Clearing House","Market Risk Neutral","General Collateral"],"stage":null},{"num":8,"title":"Sale & Repurchase (Repo) Trades and Collateral – The Global Master Repurchase Agreement","pages":"121–160","digest":["The GMRA is the standard bilateral legal agreement for repo trades, published and periodically updated by ICMA (International Capital Market Association) — the 2011 version is the one reproduced in this book's Chapter 8, superseding the 1995 and 2000 versions still referenced in some legacy relationships.","Structurally it works like the ISDA framework for derivatives: a largely un-negotiated main body of standard terms, customized per counterparty via an attached Annex I ('Supplemental Terms and Conditions') that records things like eligible collateral, haircuts, margin-call deadlines, and whether substitution is permitted — because Annex I is individually negotiated per counterparty, no two firms' GMRA relationships are guaranteed identical.","Its core protective mechanism is close-out netting on an Event of Default: if a counterparty defaults (or becomes insolvent), the agreement permits all obligations relating to all open trades falling under the agreement to be immediately terminated and set off against each other, settled on a net basis, rather than gross trade-by-trade — without this right of set-off a non-defaulting firm could be forced to make ALL its own payments while waiting (potentially months or years, in an insolvency) to receive what it's owed back.","It establishes that collateral moves on a title-transfer basis — the collateral taker becomes full legal owner during the trade (able to freely reuse the collateral: sell it, repo it, lend it, or use it to satisfy an unrelated margin call elsewhere) while the collateral giver retains beneficial ownership and is owed equivalent (not necessarily identical) securities back at close.","The GMRA's defined terms and structural provisions cover far more than just default: definitions of deliverable securities and equivalent securities, the exact content required in trade confirmations, the settlement method for both opening and closing legs, margin call conditions, collateral substitution conditions, and the treatment of income payments (coupons and dividends) arising on collateral held during a trade's life — all of it designed to remove ambiguity about who owes what to whom, and when.","Because Annex I is individually negotiated per counterparty, a firm's repo operations staff must work strictly according to the specific terms agreed with THAT counterparty, not a generic assumption — get this wrong and a firm risks under-mitigating its own exposure, or over-collateralizing a counterparty's."],"examples":[],"key_terms":["GMRA","Title Transfer","Collateral Giver","Collateral Taker","International Capital Market Association","ISDA Master Agreement","Eligible Collateral","Event of Default","Securities","Bilateral","Default","SIFMA","Repo","ICMA","ISDA"],"stage":null,"note":"The GMRA's actual legal-agreement text is reproduced in the book as flattened, non-extractable vector graphics (likely intentional copy-protection for ICMA's licensed template). This digest is built from documented, public knowledge of the GMRA's structure rather than page extraction."},{"num":9,"title":"Securities Lending & Borrowing and Collateral – Introduction to SL&B","pages":"161–166","digest":["SL&B is the mirror image of repo with the primary asset flipped: instead of borrowing cash against securities collateral, you're borrowing a SPECIFIC security against collateral (cash or securities) that's worth MORE than the loaned security — the lender is the one taking security this time.","Lending is entirely optional and firm-by-firm — there's no regulatory requirement to lend, and many large asset owners choose not to; it's purely a way to earn extra yield on assets already sitting idle in custody.","Securities borrowing exists almost entirely to solve a delivery problem: a firm that has sold securities it doesn't yet have available needs to borrow them to settle on time, avoid a costly buy-in, and receive its sale proceeds without delay.","'Open' loans (no fixed closing date, recallable/returnable by either side at any time) are far more common than 'term' loans, because flexibility matters more to both sides than the small extra certainty a fixed term buys.","The GMSLA plays the identical structural role for SL&B that the GMRA plays for repo — the standard legal wrapper defining both parties' rights, particularly around default — and it's just as essential to have signed before trading as the GMRA is for repo.","The lender keeps beneficial ownership throughout the loan (price gains, income, corporate actions all still belong to them) — lending doesn't mean giving up the economics of owning the security, only its physical/legal possession.","Four value-date labels describe the same two dates and are used interchangeably across firms and systems: 'opening value date' = 'start value date' = 'onside value date' = 'first leg value date' (when securities and collateral first exchange); 'closing value date' = 'end value date' = 'offside value date' = 'second leg value date' (when they're returned).","Standard settlement cycles are exactly why borrowing urgency exists: T+1 for US/UK government bonds, T+2 for European equity, US equity and Eurobonds — a seller who can't deliver within that window either eats an interest loss doing nothing, or borrows to settle on time.","The buy-in mechanism is the real teeth behind 'the buyer can enforce settlement' — in some markets the buyer can invoke it as soon as ONE day after value date, which is why a firm facing a failing purchase treats borrowing as urgent, not optional.","Borrowing is a pure cost-benefit calculation, not a reflex: the book's own example compares a 1.1% borrowing cost against sale proceeds that could be lent out at 3% — most firms would judge that borrowing to settle on time is clearly worthwhile.","The typical cast is asymmetric: lenders are overwhelmingly buy-side institutions (pension funds, mutual funds, insurance companies, national investment authorities) sitting on long-term inventory; borrowers are typically investment banks and hedge funds plugging a specific delivery gap — though sell-side firms with proprietary positions can lend too.","'Securities financing' is the book's umbrella term covering repo AND securities lending & borrowing together — worth knowing since regulatory text (e.g. SFTR) and vendor systems group both under this single label."],"examples":[{"title":"Deciding whether to borrow: a real cost/benefit check","body":"A firm's purchase fails to settle on value date, threatening its onward sale. Borrowing the securities costs 1.1% annualized. If the firm instead does nothing, it loses the ability to lend out the sale proceeds at the prevailing 3% rate for however many days the fail lasts. Since 3% > 1.1%, borrowing is financially worthwhile — receive the sale proceeds now, earn 3% on them, and pay only 1.1% for the borrow, netting the 1.9% spread for the delay period."}],"key_terms":["Securities Lending","Beneficial Owner and Beneficial Ownership","Legal Owner and Legal Ownership","GMSLA","Buy-In","Settlement Failure","Securities Financing","Contractual Settlement Date"],"stage":null},{"num":10,"title":"Securities Lending & Borrowing and Collateral – Principles of SL&B","pages":"167–210","digest":["Three distinct motivations drive lending, and they're not equally reputable: increasing return on idle assets (the mainstream case), reducing custody safekeeping costs (a minor secondary benefit), and arbitrage strategies exploiting differences in dividend tax treatment or reinvestment-plan terms (which the book explicitly flags may be unlawful in some jurisdictions — read as legally grey, not a recommended playbook).","A 'technical short' and outright 'short selling' both create the same operational problem — a delivery obligation the firm can't currently meet — but for different underlying reasons: technical short comes from someone else's settlement failure on YOUR purchase, short selling comes from deliberately selling something you never owned.","Borrowing to cover a technical short or short sale is only worth doing if the numbers work: cost of borrowing the securities must be less than the benefit gained (receiving sale proceeds early to reinvest, avoiding a buy-in, keeping a client relationship intact) — the book's example makes this an explicit rate comparison, not a reflexive action.","'Naked' short selling (selling without first confirming you can borrow) is now restricted or banned in many markets post-crisis — 'covered' short selling (borrow first, then sell) is the compliant version.","Post-2008 regulation (EMIR in Europe, Dodd-Frank in the US) increasingly requires firms to post specific types of high-quality collateral (cash or HQLA government bonds) for OTC derivative exposures — firms that don't naturally hold enough HQLA now have a second, growing reason to borrow securities: not to cover a delivery fail, but specifically to generate eligible collateral to post elsewhere.","A technical short walkthrough shows the full mechanics: Firm X buys from Party D and simultaneously sells the identical quantity to Party K on identical terms. If D fails to deliver, X borrows from Lender G to settle its sale with K anyway, receiving proceeds immediately; once D's delivery finally arrives, those securities are used to repay Lender G, closing the borrow — the borrow is a bridge, not a permanent position.","Lendable/borrowable assets span far beyond plain domestic equity: global equity, ADRs, GDRs, ETFs, government/supranational/agency/corporate bonds, and mortgage-backed securities are all named explicitly as assets that move through the SL&B market.","The intermediary landscape has four distinct types serving different needs: national CSDs (per-country, domestic securities), the two ICSDs — Clearstream (Luxembourg) and Euroclear (Brussels) — for international/multi-currency securities, global custodians (a single point of contact across many markets via a sub-custodian network), and central counterparties (which become buyer-to-every-seller either at execution or via later novation).","Legal documentation is uniquely important because of the set-off right it grants: on a counterparty default, the GMSLA lets ALL open trades be terminated and settled net rather than gross — without this right, a firm could be forced to pay everything it owes while waiting months or years in an insolvency process to recover what it's owed.","Ownership under the GMSLA moves by TITLE TRANSFER on both legs at once: the borrower becomes full legal owner of the lent security (lender keeps only beneficial rights), and symmetrically the lender becomes full legal owner of any securities collateral (borrower keeps only beneficial rights) — this is exactly why the collateral TAKER is legally free to reuse it (sell, repo, lend, or re-pledge) without the giver's permission, so long as equivalent securities come back at closure.","Standard margin percentages exist for automation purposes — 102% same-currency, 105% cross-currency, ~110% for equity collateral — but real negotiated percentages between two specific firms are increasingly customized and recorded in the Schedule rather than left at these defaults.","Trade confirmation exists because SL&B is executed OTC/bilaterally with no exchange checking anyone's work — a received confirmation must be actively compared against internal records, and any mismatch investigated immediately, or a wrong number silently propagates into every downstream exposure calculation.","Cash collateral settles by true DvP (simultaneous); securities collateral historically settles by TWO independent one-way FoP deliveries (since DvD wasn't available at most CSDs) — meaning each side must accept 'on-risk' exposure between sending its own delivery and receiving the counterparty's, unless a platform like Target2 Securities offers genuine Effective DvD.","Cash collateral reinvestment is a genuine risk position, not a free spread: the securities lender contractually owes the rebate rate regardless of what it actually earns reinvesting the cash — if money-market rates fall below the agreed rebate, the lender loses money on the trade even though the loan itself was fully collateralized.","A 'special' is a security in short supply and high demand — the rebate rate can go NEGATIVE, meaning the borrower pays the lender rebate on top of the securities lending fee, a reversal of the normal cash-flow direction that only happens when scarcity, not credit risk, is what's being priced.","Exposure behaves completely differently depending on collateral type: with cash collateral only the lent security's price needs marking (cash is static by definition), so only ONE side of the equation can move; with securities collateral BOTH the lent security and the collateral itself must be marked daily, and a call is only triggered by the NET of both moving apart.","Portfolio reconciliation exists in SL&B for the same reason as in OTC derivatives — a firm that has correctly dropped a closed trade from its books can still get a margin call dispute from a counterparty whose records haven't caught up; triOptima's triResolve is named as the dominant third-party comparison service.","Securities collateral substitution follows the exact same historical settlement-risk problem as the primary collateral leg: two independent FoP deliveries (replacement in, original out) with no native DvD at most CSDs, meaning the collateral TAKER must never release the original before the replacement is actually in hand.","Income treatment hinges on whether the borrower is still holding the borrowed security at record date: if it's been on-delivered (the normal case), the borrower pays a 'manufactured dividend/coupon' from its own funds since it never actually received the real payment; if the borrower still holds it (e.g. mid-arbitrage-strategy), it simply passes through the real payment it did receive — no manufacturing needed either way, the lender ends up whole.","Voting rights transfer along with legal title for the whole duration of the loan — the borrower has NO obligation to vote the way the beneficial owner wants; a lender that cares about an upcoming vote has only one lever available under an 'open' loan: recall the securities before the record date.","Recalls (lender-initiated closure) and returns (borrower-initiated closure) both require agreeing an actual closing value date and updating books & records from 'open' to that date before settlement instructions can even be issued — an 'open' trade doesn't close itself, someone has to actively trigger it.","Fee/rebate settlement is deliberately decoupled from principal settlement: even after the securities and collateral have fully returned, the cash rebate (for cash collateral) or fee (for securities collateral) is calculated daily but invoiced and settled monthly, by the 10th business day of the following month — a trade being economically 'closed' doesn't mean every cashflow tied to it is finished."],"examples":[{"title":"Dividend reinvestment plan (DRiP) arbitrage — a 9-step round trip","body":"An issuer announces a dividend reinvestment plan; a beneficial owner is restricted to the cash option (e.g. an index fund that can't deviate from its weightings), but a borrower is free to elect stock. The owner lends the shares to that borrower before the dividend's record date; the borrower elects the stock option, receives the shares at a discount to market price, sells them in the open market, and shares the resulting profit with the lender — while separately paying the lender a 'manufactured' cash dividend so the lender still receives exactly what it would have gotten by not lending at all. Both sides profit purely from the DRiP's built-in discount, which the restricted lender could never have captured alone."},{"title":"Cash collateral: full worked trade with a margin call","body":"Party L lends 2,000,000 shares (price EUR 15.37, market value EUR 30,740,000.00) to Party B on an open basis. At 102% margin, required cash collateral is EUR 31,354,800.00, delivered DvP. One day later the shares are marked to EUR 16.05 (new value EUR 32,100,000.00); required collateral at 102% is now EUR 32,742,000.00 — a EUR 1,387,200.00 shortfall — so Party L calls Party B, who pays the difference. The rebate rate agreed at execution (0.85%) accrues daily on the outstanding collateral balance (EUR 31,354,800.00 × 0.85% / 360 = EUR 740.32 for that first day) and is invoiced monthly in arrears."},{"title":"Securities collateral: bond valuation with accrued interest, then a substitution","body":"Party L2 lends 800,000 shares (market value USD 17,000,000.00) against USD 18,000,000 face of US Treasury 4.5% bonds priced at 97.55% clean. Market value = principal (18,000,000 × 97.55% = 17,559,000.00) + accrued interest (18,000,000 × 4.5% / 360 × 133 days = 292,744.56) = USD 17,851,744.56 — comfortably above the 105%-margined requirement of USD 17,850,000.00. One week later, Party B2 sells that Treasury position elsewhere and must substitute: it delivers GBP 15,000,000.00 UK Government 4.1% bonds as replacement collateral, and only once those are confirmed does Party L2 release the original US Treasury bonds back — never the other way around."},{"title":"A stock split during a loan creates zero exposure","body":"200,000 shares of Issuer X USD 1.00 Common Stock are held as securities collateral. The issuer announces a 2:1 stock split: the market price of USD 140.00/share halves to USD 70.00, while the share quantity doubles to 400,000. Pre-split market value was USD 28,000,000.00; post-split it's still USD 28,000,000.00 — a mandatory corporate action that mechanically changes the security's identity and quantity but creates no margin call for either party, since total value is unchanged."},{"title":"Fee and rebate arithmetic, side by side","body":"Cash collateral: USD 20,000,000.00 lent security value (post-margin), rebate rate 0.35%, over 12 days → rebate payable to the borrower = 20,000,000 × 0.35% / 360 × 12 = USD 2,333.33. If the lender reinvests that same cash at 0.68%, it earns USD 4,533.33 — netting USD 2,200.00 of pure lending profit on the spread alone. Securities collateral: a EUR 34,000,000.00 lent position at a 28 bppa fee for 3 days = EUR 793.33 payable by the borrower directly to the lender, with no rebate/reinvestment split since no cash changed hands."},{"title":"A buy-in forces delivery","body":"A firm sells 100,000 shares it doesn't actually have available (having lent them out or mis-tracked its position) and fails to deliver on settlement date. After the exchange's standard grace period passes with still no delivery, the buyer initiates a buy-in: it purchases the 100,000 shares directly in the open market — at whatever price the market demands, even if that's well above the original trade price — and bills the difference plus costs back to the failing seller. The failing seller has no say in the price paid; the buy-in exists precisely to remove their ability to stall indefinitely."}],"key_terms":["Beneficial Owner and Beneficial Ownership","Rebate Rate","Reinvestment Rate","Withholding Tax","Buy-In","Settlement Failure","Naked Short","Covered Short","Corporate Action","Record Date","Global Custodian","Central Counterparty","International Central Securities Depository","Event of Default","Legal Title","Required Collateral Value","Portfolio Reconciliation","Manufactured Coupon, Manufactured Dividend and Manufactured Income","Stock Split","Mortgage-Backed Security","American Depository Receipt","Global Depository Receipts","Exchange-Traded Funds"],"stage":null},{"num":11,"title":"Securities Lending & Borrowing and Collateral – The SL&B Trade Lifecycle","pages":"211–236","digest":["This chapter is the SL&B equivalent of Chapter 5's repo lifecycle walkthrough — one fully worked cash-collateralized loan taken from pre-trading legal setup all the way through recall, closing settlement, and rebate payment.","The core exposure mechanic differs subtly from repo: in SL&B the exposure test compares the CURRENT VALUE of the lent security (plus margin) against the collateral held — the collateral side is usually the fixed/starting reference point that gets tested against a moving security value, the reverse framing from repo's 'is the collateral still worth enough.'","Cash collateral triggers a rebate rate obligation running the OPPOSITE direction from what's intuitive: the securities LENDER (who is really the cash collateral TAKER) pays a rebate rate back to the securities BORROWER (the cash collateral GIVER) — the lender's actual securities-lending fee is the spread between what it earns reinvesting that cash and what it pays out as rebate.","Threshold and MTA work exactly as in a CSA: a real, correctly-calculated exposure can still result in NO margin call if it falls inside the agreed threshold — this isn't an error, it's the contract working as designed.","Because this trade was 'open' (no fixed closing date), either party can end it at will — the lender recalling securities it needs to sell, or the borrower returning securities it no longer needs — and closing doesn't happen instantly: the two sides have to agree an actual closing value date once someone triggers a recall or return.","Rebate settlement happens separately from and after the trade's closing leg, on a monthly cycle (by the 10th of the following month) — a trade being fully unwound operationally does not mean every cashflow tied to it is finished; the rebate calculation is done daily but invoiced and settled monthly in arrears.","Pre-trading sets up exactly four things before the first trade can happen: the signed GMSLA, a Schedule fixing base currency/eligible collateral currencies/exposure frequency/threshold/MTA/margin-call deadline, exchanged SSIs, and all of that loaded into both firms' static data — miss any one of these and the very first trade has nowhere to reference its terms from.","Trade execution itself is a two-sided matching exercise: the lender first identifies and communicates its own lendable inventory; separately the borrower identifies a genuine borrowing need and searches for a match — only once both sides' independent processes intersect does a trade get agreed, with full details (security, quantity, price, margin %, collateral type, rebate rate, trade/value dates) captured identically by both parties.","Trade enrichment adds the operational plumbing that execution alone doesn't capture: place of settlement (determined by which market the security is held/traded in) and each party's specific settlement account numbers, sourced from SSIs already sitting in static data — without this step a perfectly good trade has no addressable destination to actually settle to.","The lifecycle's five consecutive daily mark-to-market cycles show every possible outcome in one worked run: a call against the borrower (day 1), a smaller call against the borrower (day 2), a genuine exposure that's rejected because it sits inside the Threshold — literally zero transferred that day (day 3), then two consecutive calls against the LENDER as the security's price recovers (days 4-5) — exposure direction is not sticky; it can flip parties from one day to the next purely on price movement.","A margin call notification (MCN) received after the documented deadline is treated as late regardless of informal counterparty leniency — settling it then requires issuing a funds preadvice to the receiving bank so the payment gets 'good value' same-day; skip the preadvice and the exposed party's protection is delayed by a value date, not by choice.","Recall mechanics show the full trigger chain: a trader deciding to SELL the lent security is what forces a recall (not a change of heart about the loan itself) — the lender identifies the conflict from its own reconciled books & records, contacts the borrower, agrees a closing value date, and only then do both sides update 'open' to that specific date internally before any settlement instruction is issued.","A recalled borrower isn't left stranded: the book notes Bank K simply borrows the same securities from a DIFFERENT lender to keep fulfilling its own ongoing delivery need — a recall closes one specific loan relationship, not the borrower's underlying requirement.","Overall profitability for the lender nets THREE things, not one: reinvestment earnings on cash collateral, PLUS avoided custody safekeeping fees on securities no longer sitting idle, MINUS the rebate paid out — the true fee lenders quote is only ever the middle term of that calculation.","The borrower's benefit calculation depends entirely on WHY it borrowed: for a technical short, the benefit nets the borrowing fee/rebate cost against interest earned lending out the freed sale proceeds (zero trading P&L, since the buy and sell were on identical terms); for an outright short sale, the same borrowing-cost math applies but is layered against the actual directional trade — the price sold at versus the price ultimately paid to buy back and close the short.","Had this same trade used securities collateral instead of cash, several things change simultaneously: typically a HIGHER margin is required, settlement risk is worse (two independent one-way FoP legs instead of true DvP), marking-to-market work doubles (the collateral itself now needs daily revaluation too, including accrued interest if bonds), and both collateral substitution and income/corporate-action processing become live possibilities that simply don't exist when collateral is cash."],"examples":[{"title":"A full week of a real SL&B loan (Institution C lends Rolls-Royce shares to Bank K)","body":"Institution C lends 2,950,000 Rolls-Royce shares (price GBP 7.045, 2% margin) to Bank K for GBP cash collateral of GBP 21,198,405.00 (market value + margin), settled DvP on Oct 29. Day+1 (Oct 30): price falls to GBP 6.873, required collateral drops to GBP 20,680,857.00 — Bank K is over-collateralized and is owed back GBP 517,548.00. Day+2 (Oct 31): price falls further to GBP 6.762, required collateral GBP 20,346,858.00 — another GBP 333,999.00 returned to Bank K. Day+3 (Nov 1): price rebounds to GBP 6.819; the resulting exposure of GBP 171,513.00 (now Institution C's favour) falls INSIDE the GBP 250,000.00 threshold, so no call is made — the collateral balance simply carries forward unchanged. Day+4 (Nov 2): price rises again to GBP 6.963, pushing the exposure to GBP 604,809.00 (through the threshold), so Institution C properly calls and receives that amount from Bank K."},{"title":"Closing the loan and settling the rebate","body":"On Nov 2, Institution C's trader decides to sell the lent shares outright, forcing a recall; a closing value date of Nov 3 is agreed, both firms update records from 'open' accordingly, and DvP settlement instructions exchange the 2,950,000 shares back for the final GBP 20,951,667.00 collateral balance. The trade is now fully unwound except for the rebate: at 45 bppa against the fluctuating daily collateral balance (Oct 29 through Nov 2), the accrued rebate totals GBP 1,276.33 — split GBP 767.17 for October (payable by Nov 10) and GBP 509.16 for November (payable by Dec 10) — settled separately, weeks after the securities themselves have already moved."}],"key_terms":["Securities Lending","GMSLA","Rebate Rate","Reinvestment Rate","Cash Collateral","Non-Cash Collateral","Threshold","Minimum Transfer Amount","Delivery versus payment","Funds Pre-Advice","Margin Call Notification","Books & Records","Standing Settlement Instruction","Trade Confirmation"],"stage":null},{"num":12,"title":"Securities Lending & Borrowing and Collateral – Accessing the SL&B Marketplace","pages":"237–252","digest":["Beyond direct bilateral lending, two other access routes exist: agency lending (outsourcing the whole lending operation to a specialist agent) and ICSD auto-lending/borrowing (an anonymous, automatic service purely to plug settlement fails).","Before lending OR borrowing directly, both sides must actually verify their position first — a lender must confirm securities are truly available (not already committed to a sale or other transaction), and a borrower must confirm a REAL borrowing need exists (premature borrowing based on an assumption a purchase will fail wastes money if it settles fine after all).","Agency lending outsources effort, not control: the beneficial owner still dictates which borrowers are acceptable, what collateral is eligible, margin levels, and mark-to-market frequency — the agent just executes within those parameters and typically indemnifies the owner against a borrower default.","Exclusive lending guarantees the beneficial owner steady fee income (one borrower gets sole access to a portfolio for a fixed term) at the cost of upside — discretionary lending pays per-loan market rates with no guarantee, trading certainty for potential extra yield.","ICSD auto-lending/borrowing is purely a settlement-fail-prevention mechanism, not a yield strategy — it's automatic, anonymous (lender and borrower never know each other's identity), and there's no guarantee a match will be found on any given day even if you've opted in.","Regardless of the access route used, the collateral mechanics (margin, mark-to-market, margin calls, rebate/fee) described in Chapter 11 apply identically underneath — the routing method changes who does the operational work and how counterparties are matched, not the underlying collateral economics.","Exclusive lending's auction mechanism has real structure, not just a handshake: the beneficial owner hands its lendable list to the agent, the agent publishes it to pre-approved borrowers, borrowers submit bids simultaneously without seeing each other's numbers (a competitive blind auction), and the owner/agent jointly assess before awarding sole access for a fixed term (e.g. 12 months) — the winning borrower pays for exclusivity whether or not it actually uses the full portfolio.","ICSD auto-lending is entity-blind by legal design: the lender has legally lent TO THE ICSD (not to whoever ultimately borrows), and the borrower has legally borrowed FROM THE ICSD — this is precisely why identities stay hidden on both sides throughout the loan's life.","The ICSD's fee spread is the service's entire business model: lenders might earn 1.20% while borrowers are charged 1.75% on the identical loan — the ICSD keeps the 55bp differential for running the automated matching, guarantee, and administration.","Under ICSD auto-lending, the lender receives no physical collateral at all — instead the ICSD provides a credit guarantee (return of securities or cash-equivalent value) and the borrower must maintain adequate cover (cash and/or securities) inside its own ICSD account throughout, with any shortfall automatically swept from that account.","Tri-party agents (used both in agency lending and, more fully, by the ICSDs) exist specifically to automate what would otherwise be manual daily work: they revalue both the lent security and collateral, calculate and execute margin calls automatically, detect when a recall/return or substitution is needed from incoming settlement instructions, and effect that substitution — all without either original party lifting a finger day-to-day.","A tri-party agent explicitly does NOT take on the counterparty risk of the underlying trade itself — if the borrower defaults, the exposed party is still the lender, not the tri-party agent; the agent's job is pure administration, not risk-bearing.","Lenders retain real, granular control even when using a tri-party agent, via 'collateral baskets' — defined eligibility rules such as a minimum bond rating (e.g. no lower than AA) or concentration limits on how much of any one issuer's paper can be posted."],"examples":[{"title":"Exclusive lending auction, step by step","body":"A pension fund hands its entire lendable equity portfolio to a lending agent. The agent publishes the list to several pre-approved borrowers, who each submit a sealed bid without seeing competitors' terms. The agent and pension fund jointly review the bids and award a 12-month exclusive contract to the highest bidder — that borrower now has sole access to the whole portfolio for the year, paying a guaranteed fee regardless of how heavily it actually draws on the securities, while the pension fund forgoes any chance of a better rate mid-contract even if market demand for those specific names rises."},{"title":"An ICSD auto-lend closing a settlement fail anonymously","body":"Firm M has bought from Firm G and sold the identical quantity to Firm P on the same value date. Firm G's delivery to Firm M fails. The ICSD detects the resulting fail-cascade risk, identifies that Firm L has the same securities available to lend, and — without Firm L or Firm M ever learning of each other's identity — moves the securities from Firm L's account through the ICSD into Firm M's account, which immediately triggers Firm M's onward delivery to Firm P. Firm L now earns a lending fee (say 1.20%) while Firm M pays a borrowing fee (say 1.75%) to the ICSD, and when Firm G's delayed securities eventually arrive in Firm M's account days later, the ICSD automatically recognizes the borrowing and returns the equivalent quantity to Firm L."}],"key_terms":["Lending Agent","Agency Lending","Competitive Blind Auction","International Central Securities Depository","Portfolio","Settlement Failure","Central Counterparty","Global Custodian","Concentration Limit","Eligible Collateral"],"stage":null},{"num":13,"title":"Securities Lending & Borrowing and Collateral – The Global Master Securities Lending Agreement","pages":"253–294","digest":["The GMSLA is the standard bilateral legal agreement for securities lending, published by ISLA (International Securities Lending Association) — the 2010 version is the one reproduced in this book's Chapter 13.","It plays the same structural role as the GMRA does for repo and the ISDA Master Agreement does for OTC derivatives: standardized core terms plus counterparty-specific customization (via a signed Schedule) covering eligible collateral, margin percentages, base currency, and exposure-calculation frequency.","Its central protection is the same close-out netting logic seen throughout the book: on an Event of Default, all open loans between the two parties are terminated and settled on a single net basis rather than gross trade-by-trade.","Collateral under the GMSLA moves on a title-transfer basis — the collateral taker gets full legal title (and reuse rights) while the giver retains beneficial ownership and is owed equivalent collateral back, mirroring the GMRA's treatment of repo collateral and the English Law CSA's treatment of OTC derivative collateral.","It defines both parties' rights to terminate an 'open' loan on demand (lender's recall right, borrower's return right) and the mechanics of settling fees/rebates — the practical hooks that Chapter 11's worked lifecycle example puts into action.","The GMSLA's default definitions are deliberately broad, covering not just outright insolvency but also failure to deliver/return securities or collateral by the required time and failure to pay fees/rebates when due — any of these can trigger the non-defaulting party's right to close out.","Base Currency is a defined Schedule term with real teeth: it's the currency into which all outstanding exposures and collateral values are converted for the purposes of calculating a single net figure at default, exactly analogous to Base Currency's role in an OTC derivative CSA.","The Schedule is where two counterparties actually diverge from the standard text — eligible collateral types, margin/haircut percentages, threshold and MTA (if applied), which currencies are acceptable, and the margin call notification deadline are all negotiated per-relationship, meaning no two firms' GMSLA relationships look identical even though the base agreement is the same document."],"examples":[],"key_terms":["GMSLA","Securities Lending","Beneficial Owner and Beneficial Ownership","Legal Owner and Legal Ownership","International Securities Lending Association","Equivalent Collateral","ISDA Master Agreement","Eligible Collateral","Collateral Taker","Event of Default","English Law CSA","OTC Derivative","Base Currency","Legal Title","Securities","Derivative","Bilateral","Borrower","Default","GMRA","Repo","ISLA","ISDA"],"stage":null,"note":"The GMSLA's actual legal-agreement text is reproduced in the book as flattened, non-extractable vector graphics (likely intentional copy-protection for ISLA's licensed template). This digest is built from documented, public knowledge of the GMSLA's structure rather than page extraction."},{"num":14,"title":"OTC Derivatives and Collateral – Transaction Types – Introduction","pages":"295–302","digest":["Buying a derivative only requires paying a fraction of the underlying's value rather than 100% of it — that's leverage: gains and losses are magnified relative to owning the underlying outright.","Exchange-traded derivatives (futures, options) are standardised, and the investor's true counterparty becomes the exchange's clearing house, not the other trader — this is what makes them liquid and low-counterparty-risk. Only exchange members (usually sell-side firms, called clearing members) can trade directly; buy-side firms must appoint a clearing member to access the exchange on their behalf.","A futures contract is a two-sided OBLIGATION (both buyer and seller must perform at the agreed price on the agreed date); an option instead gives the HOLDER a right without an obligation — a call option is the right to buy, a put option the right to sell, both at a pre-agreed strike price, in exchange for an upfront premium the holder pays regardless of outcome.","OTC derivatives are the opposite of exchange-traded: privately negotiated bilateral contracts, tailored to the two parties, with no exchange standing in the middle — so each party carries direct counterparty risk to the other for the trade's entire life, which can run to decades. The trade-off is stark: exchange-traded wins on standardisation, price transparency and liquidity; OTC wins on being tailored to exactly what a firm actually needs.","The four swap families the book focuses on are interest rate swaps (rate risk), credit default swaps (issuer default risk), FX swaps (currency risk) and cross-currency swaps (cash borrowing in a foreign currency) — each gets its own chapter.","Because OTC trades can run for years with two-sided ongoing risk, collateral management exists specifically to manage that multi-year counterparty exposure — this is the entire reason the rest of Part 4a exists.","Post-2008 regulation pushes standardised OTC derivatives toward mandatory central clearing and mandatory trade reporting to trade repositories, deliberately making OTC trading behave more like the exchange-traded model to close the visibility gap that let 2008-style risk build up unseen — regulators simply couldn't see OTC risk building up beforehand, since none of it was centrally reported."],"examples":[{"title":"Futures vs. holding the stock","body":"Investor A owns 5,000 shares at USD 42.00 and sells a futures contract obligating them to sell at USD 42.00 in 9 months. If the price falls to USD 39.00, the futures contract protects A by USD 3.00/share (15,000 total) versus just selling in the market then; if the price rises to USD 46.00, A misses out on the USD 4.00/share gain because they're locked into the 42.00 sale price."},{"title":"Call option payoff","body":"Investor B buys a call on 1,000 shares of Company X, strike EUR 20.00, expiring in 3 months, for a premium. If the price rises to EUR 24.50, B exercises: profit = 1,000 × (24.50 − 20.00) = EUR 4,500, less the premium paid. If the price stays at EUR 18.75, B simply lets the option lapse and loses only the premium — the asymmetry (capped loss, uncapped gain) is the whole point of buying options versus futures."},{"title":"Only exchange members trade directly","body":"A pension fund (buy-side, not an exchange member) wants to buy a futures contract on Eurex. It cannot trade directly — it must route the order through a clearing member (typically an investment bank that IS a Eurex member), which executes on the fund's behalf and stands between the fund and Eurex Clearing, the actual central counterparty to every trade on the exchange."}],"key_terms":["Derivative","Futures","Options","Interest Rate Swap","Credit Default Swap","Foreign Exchange Swap","Cross-Currency Swap","Bilateral","Call Option","Put Option","Clearing Member","Central Counterparty"],"stage":null},{"num":15,"title":"OTC Derivatives and Collateral – Transaction Types – Generic Structural Aspects","pages":"303–310","digest":["The notional principal is never actually paid — it's a theoretical reference quantity used only to size the real cashflows, like the insured value of a car you never actually hand over, only the premium (a EUR 30,000,000 notional at 3.15% pays EUR 945,000/year of real interest; the 30,000,000 itself never moves).","OTC derivative settlement is fundamentally different from securities settlement: securities trades are dependent (buyer and seller exchange simultaneously), OTC derivative payments are one-sided and unconditional on a due date — miss it and you're simply in breach, there's no automatic fail-safe.","Every OTC trade has a well-defined set of generic components regardless of product: Parties (typically an institutional investor and an investment bank), Term (no official minimum/maximum, up to 50 years is normal), Notional Principal, Rates, three key Dates (Trade Date, Effective Date — when calculations start, and Scheduled Maturity Date), Settlement mechanics, and Exiting — how the trade can end early.","Every OTC trade runs two parallel operational tracks that must not be confused: trade processing (confirmation + settlement of the product's own periodic cashflows, e.g. IRS interest — typically owned by a Derivative Operations department) and collateral processing (exposure calculation + margin calls + collateral movement — typically owned by a separate Collateral Management department) — different desks, different purposes, connected only by the same underlying trade.","Exposure is driven by replacement cost: if your counterparty defaulted today, what would it cost you to re-enter an equivalent trade at today's market rate? The gap between that and the original trade rate is what collateral exists to cover.","Exposure is marked and margin-called at whatever frequency the legal contract specifies (daily is typical) — collateral already held from prior calls must always be netted against the new exposure figure, not re-collateralized from zero each time.","Novation (stepping out of a trade while another party steps in) demands immediate books & records updates — get it wrong and you can end up double-counting, missing, or misdirecting exposures and payments.","Trade closure — whether by reaching scheduled maturity or by an earlier exit event — stops BOTH trade processing and collateral processing simultaneously, and any collateral still held or given on that trade must be returned; the various ways a trade can exit early (novation, unwind, offset, credit event) are covered in their own later chapters."],"examples":[{"title":"Notional isn't paid — a CDS and an IRS side by side","body":"CDS: USD 30,000,000 notional at 1.65% annual premium → USD 495,000/year paid, notional never changes hands. IRS: EUR 45,000,000 notional at 3.15% → EUR 1,417,500/year of interest paid, again the 45,000,000 itself never moves. Only the rate applied to the notional produces real cash."},{"title":"Exposure evolving over four weekly mark-to-markets","body":"Firm A buys an OTC product from Firm B at USD 100. Replacement cost rises to 120 (A is owed 20, margin call to B), then to 128 a week later (A margin-calls B for the extra 8, netting against collateral already held), then falls to 109 (B margin-calls A back for 19), then to 97 (B margin-calls A for the remaining 9 plus 3 more of A's own collateral). The lesson: every call nets against collateral already in hand, never against zero."},{"title":"The car-insurance analogy for notional principal","body":"You buy a USD 10,000 car and insure it for USD 300/year over 5 years. Neither you nor the insurer ever exchanges the car's USD 10,000 value — that figure only exists to size your USD 300 premium. Only in a total-loss claim would the full USD 10,000 actually change hands. A derivative's notional principal works identically: it sizes the real cashflow without ever being paid itself."}],"key_terms":["Notional Principal","Replacement Cost","Novation","Bilateral","Static Data and Static Data Repository","Trade Execution","Books & Records"],"stage":null},{"num":16,"title":"OTC Derivatives and Collateral – Transaction Types – Interest Rate Swaps","pages":"311–318","digest":["An interest rate swap swaps a stream of fixed-rate interest for a stream of floating-rate interest on the same notional — nobody actually needs to have a related underlying loan; firms use it purely to convert their existing rate exposure from fixed to floating or vice versa.","Only the net differential between the fixed and floating leg is actually paid each period, not both legs gross — this is why IRS cashflow tables show one 'net payment' column with the payer flipping direction as rates move. The party paying fixed is conventionally called the 'payer' (or 'buyer'); the party receiving fixed is the 'receiver' (or 'seller').","The floating rate resets each period against a published benchmark (historically Libor, calculated daily across 5 currencies — EUR, USD, GBP, CHF, JPY — for 7 standard maturities from overnight to 12 months) fixed shortly before the reset date (the 'fixing date' is commonly 2 days before the 'reset date') — so the exact cash amount for a future period is unknown until close to when it's due, and this uncertainty is the entire risk an IRS is designed to transfer.","Day-count mechanics matter for real money: the interest formula (Notional × Rate ÷ 360 or 365 × actual days in the period) means two 6-month periods with different calendar-day counts produce different cash amounts even at an unchanged rate — a 181-day half-year period pays measurably more than a 184-day one at the identical annualised rate would suggest, purely from the day-count difference working the other way.","Not every IRS is fixed-for-floating — a floating-for-floating structure (swapping one floating benchmark for another) is called a basis swap, and some IRS deals add a fixed margin (e.g. '6-month EUR Libor + 0.25%') permanently added to or subtracted from the floating rate for the life of the trade.","A quick reference profile for IRS operationally: no premium is payable, no notional principal is ever exchanged, it's a single-currency product, but it requires MULTIPLE settlements over the trade's life, and those settlements are always NET (fixed leg minus floating leg), never gross — contrast this directly with CDS (gross payments) later in this Part.","After execution, IRS collateral management runs on the same daily mark-to-market → exposure → margin call cycle as every other OTC product — the swap's own interest payments (trade processing) and its collateral exposure (collateral processing) are handled completely separately."],"examples":[{"title":"Firm X hedges a fixed borrowing with a receive-fixed/pay-floating IRS","body":"Firm X owes a fixed 4.0% on EUR 30,000,000 to Party D. To offset a matching floating-rate receipt from Party E, Firm X enters an IRS with Bank T: receive fixed 4.0% / pay 6-month EUR Libor, notional EUR 30,000,000, 5-year term. On the first payment date the floating rate resets at 2.9764% over 181 days: Bank T pays Firm X €603,333.33 (fixed leg: 30m × 4.0% / 360 × 181) while Firm X pays Bank T €448,940.33 (floating leg: 30m × 2.9764% / 360 × 181) — net €154,393.00 flows from Bank T to Firm X."},{"title":"The net payment direction flips as floating rates rise","body":"Same EUR 30,000,000 IRS as above, tracked across five reset dates: floating fixes at 2.9764% (Bank T pays Firm X a net €154,393.00), then 3.4781% (net narrows to €80,024.66 to Firm X), then 3.9052% (narrows further to just €14,299.00 to Firm X), then 4.3179% — for the first time exceeding the 4.0% fixed rate, so the net payment FLIPS direction and Firm X now pays Bank T €48,744.67, then at 4.0196% Firm X pays a much smaller €2,956.34. Nothing about the trade changed — only the floating benchmark did, and it alone decided which party paid which."}],"key_terms":["Interest Rate Swap","Libor","Notional Principal","Mark-to-Market","Basis Points Per Annum"],"stage":null},{"num":17,"title":"OTC Derivatives and Collateral – Transaction Types – Credit Default Swaps","pages":"319–328","digest":["A CDS is insurance against a third party's default: the protection buyer pays a periodic premium to the protection seller, and if the reference entity has a 'credit event' (default, bankruptcy, restructuring), the seller pays out the full notional and the contract terminates immediately.","The reference entity (the bond issuer being insured against) is not a party to the CDS at all — it's a purely bilateral contract between buyer and seller referencing a third party's creditworthiness; the specific underlying bond is called the reference obligation (or reference asset), and confusingly the premium itself is sometimes also called the 'coupon.'","Premium is quoted in basis points per annum (e.g. 132 bppa = 1.32%/year of notional) and, unlike an IRS, is paid gross on fixed quarterly dates (20th Mar/Jun/Sep/Dec) for the life of the trade — there's no netting against an offsetting leg, and the operational profile is the mirror image of an IRS: premium IS payable, no notional exchange happens UNLESS a credit event occurs, and payments are GROSS not net.","A credit event ends the contract early via one of two settlement routes: physical settlement (buyer delivers the actual bond, receives 100% of notional in cash — only possible if the buyer actually owns the bond) or cash settlement (seller just pays 100% minus the bond's post-default market value, used when the buyer doesn't hold the underlying bond) — both are designed to deliver the same economic protection.","What actually counts as a credit event must be agreed at trade execution — typically failure to pay interest/principal, bankruptcy, and debt restructuring — and disputes over whether one has genuinely occurred are resolved by ISDA's Regional Determination Committees, whose ruling is final and binding on ISDA members.","Protection sellers carry real tail risk (a full notional payout on a low-probability event) and commonly hedge it by buying offsetting protection from a third party rather than holding the risk naked — executing an equal-and-opposite 'trade #2' as protection buyer so a credit event payout on the first trade is funded by a matching receipt on the second.","CDS variations extend the basic single-name structure: a Basket Default Swap references MULTIPLE reference entities at once, triggering payout on either a First-to-Default basis (any one default in the basket triggers payment) or Second-to-Default (the first default doesn't trigger, but the next one does); a Loan CDS protects against default of a cash borrower rather than a bond issuer.","CDS collateral management follows the identical daily mark-to-market → exposure → margin call cycle as every other OTC product, driven by the premium's current market price moving away from the contract's fixed premium."],"examples":[{"title":"Buying protection on a bond holding","body":"A mutual fund holds USD 10,000,000 of Issuer X bonds maturing 2025 and grows worried about Issuer X's credit. Rather than sell, it buys a 10-year CDS from Bank B at 132 bppa (1.32%/year), i.e. USD 132,000/year, paid ~25% each quarter (≈USD 33,000/quarter, adjusted for actual days). If Issuer X defaults, Bank B pays the fund the full USD 10,000,000 and the CDS terminates; if no default occurs, the fund just pays premium for 10 years and the contract expires worthless (which is the 'insurance never claimed' outcome, not a loss on the hedge itself)."},{"title":"Quarterly premium varies purely from day-count","body":"On the same USD 10,000,000 / 132 bppa trade, four consecutive quarters produce four different premium amounts despite the identical 1.32% annual rate: 20th March (90 days) = USD 33,000.00; 20th June (92 days) = USD 33,733.33; 20th September (92 days) = USD 33,733.33; 20th December (91 days) = USD 33,366.67 — the day-count convention alone, not any change in rate, explains the difference."},{"title":"First-to-default on a basket of five issuers","body":"A protection buyer purchases a First-to-Default basket CDS referencing five corporate issuers. Issuer #3 in the basket defaults first. The protection seller pays out the full notional immediately and the ENTIRE contract terminates — even though issuers #1, #2, #4 and #5 never defaulted, the basket only ever paid out once, on whichever reference entity failed first."}],"key_terms":["Credit Default Swap","Protection Buyer","Protection Seller","Reference Entity","Reference Obligation","Basis Points Per Annum","Physical Settlement","Cash Settlement","Basket Default Swap"],"stage":null},{"num":18,"title":"OTC Derivatives and Collateral – Transaction Types – Foreign Exchange Swaps","pages":"329–340","digest":["An FX swap is two linked legs of a real currency exchange (not theoretical, unlike a notional): spot leg now, opposite forward leg later, both at rates agreed on trade date — it's economically a currency loan, not a bet on rates, and because full principal genuinely changes hands, the word 'notional' doesn't even apply; the terms 'principal' or 'principal amount' are used instead.","Spot FX (2-day standard settlement, with USD/CAD as a notable 1-day exception) settles the traditional way — each party fires an unmatched, uncollateralized payment instruction to its own cash correspondent — which is exactly why cross-time-zone settlement risk (Herstatt Risk) exists: the eastern-currency payer can pay hours before knowing whether the western-currency leg was received. The risk is most extreme between very distant time zones — NZD against USD, for example, leaves Wellington paying up to 17 hours before New York's business day even opens.","CLS Bank exists specifically to eliminate Herstatt Risk via payment-versus-payment (PvP): both currency legs settle simultaneously through CLS member accounts, the FX equivalent of DvP in securities — though for currencies CLS doesn't cover, or firms that haven't opted in, the traditional unmatched settlement method remains the only option.","A forward FX trade locks in today's rate for a future date, protecting a firm from adverse rate movement between now and a known future cash need — the cost of that certainty is giving up any favorable move too; it's identical to a spot trade in every way except the settlement cycle extends beyond the standard 2 days, and the rate applied is typically at a premium or discount to the spot rate rather than the spot rate itself.","The FX swap's 'forward margin' (the gap between its spot and forward legs) isn't speculation — it mechanically reflects the interest-rate differential between the two currencies over the swap's term, compensating whichever party gives up the higher-yielding currency for the period.","Despite commonly being lumped in with OTC derivatives, FX swaps technically aren't true derivatives by the book's own definition: there's no underlying product, full principal actually changes hands, and there's no uncertain payment to manage — yet they still go through the same daily mark-to-market/exposure/margin-call collateral cycle, and operationally have their own distinct profile: no premium, principal IS exchanged on both legs, multiple currencies, multiple gross settlements.","A Forward/Forward FX Swap (also called a forward start, delayed start, or deferred start swap) is a variant where BOTH legs are forward-dated rather than one spot and one forward — e.g. a '3/6 forward/forward swap' nets out to simply buying the base currency 3 months forward and selling it 6 months forward, once the two legs' offsetting spot components cancel out."],"examples":[{"title":"Firm M hedges a 3-month USD receivable with an FX swap","body":"Firm M (EUR-based) will receive USD 10,000,000 from a buyer in 3 months but must pay the same USD 10,000,000 to a supplier in 2 days — a timing mismatch that leaves it exposed to EUR/USD movement for 3 months. Doing nothing: at spot EUR1.00/USD1.1108 it pays EUR 9,002,520.71 now; if the rate drifts to EUR1.00/USD1.1313 by the receipt date it only gets back EUR 8,839,388.31 — a EUR 163,132.40 loss. Instead it executes an FX swap with Bank Q: Leg 1 (spot) buy USD 10m for EUR 9,002,520.71 at 1.1108; Leg 2 (3-month forward) sell USD 10m back for EUR 9,031,791.91 at 1.1072. Both amounts are now fixed regardless of where the spot rate actually ends up in 3 months."},{"title":"Herstatt Risk at its most extreme","body":"A firm sells NZD and buys USD in a spot FX trade. Wellington is 17 hours ahead of New York, so the firm's NZD payment goes out during its own business day — many hours before the New York business day handling the USD leg has even begun. For that entire window the firm has paid away real value with no way of confirming the USD side will actually arrive — precisely the settlement risk CLS Bank's payment-versus-payment mechanism was built to eliminate."}],"key_terms":["Foreign Exchange Swap","Herstatt Risk","CLS Bank","Bilateral","Standing Settlement Instruction","Funds Pre-Advice"],"stage":null},{"num":19,"title":"OTC Derivatives and Collateral – Transaction Types – Cross-Currency Swaps","pages":"341–348","digest":["A cross-currency swap is an FX swap plus periodic interest payments on both legs throughout its life — full principal exchanged at start, interest exchanged periodically in each original currency, principal re-exchanged at maturity at the original (not a new) exchange rate.","CCS exploits each firm's comparative advantage borrowing in its own domestic market — each company actually borrows locally at its own best rate, then the two firms swap the proceeds, so each effectively accesses a foreign currency loan at a better rate than it could get borrowing that currency directly overseas; the underlying reason a firm gets a worse rate borrowing abroad is straightforward — foreign banks are typically far less willing to lend to an international corporation than a borrower's own domestic bank, which already has an ongoing relationship with it.","Interest obligations don't cancel out: each firm still owes its own domestic lender in the original borrowed currency, so a CCS commits both firms to a stream of cross-currency interest payments at the two agreed (and different) rates for the swap's life — critically, each firm pays interest in the CURRENCY AND RATE of the OTHER firm's domestic loan, precisely so that payment can be passed straight through to cover that firm's own lender.","Because the original exchange rate is reused at maturity for principal re-exchange, both firms carry real FX risk on the final repayment — if the counterparty's currency has moved against you, unwinding the swap to source that currency back can be materially more expensive than at trade date.","CCS differs from an FX swap on two structural points: FX swaps use two different rates (spot then forward) with no periodic interest, CCS uses one fixed rate throughout but does pay periodic interest — worth knowing cold since the products are easy to conflate given the similar names, and like FX swaps, CCS legs are real principal exchanges, not notional, so 'principal' rather than 'notional principal' is the correct term.","Like any cross-time-zone currency exchange, the initial exchange of principal in a CCS carries the same Herstatt Risk that FX swaps do, and is mitigated the same way — via CLS Bank's payment-versus-payment settlement, where the currency pair and firms involved use it."],"examples":[{"title":"Company T (UK) and Company V (Australia) swap borrowings","body":"Company T can borrow GBP domestically at 3%; Company V can borrow AUD domestically at 4% — each faces a much worse rate borrowing the other's currency directly. They execute a 4-year CCS at GBP1.00/AUD1.5572: Company T borrows GBP 100,000,000 from its UK bank and passes it to Company V; Company V borrows AUD 155,720,000 from its Australian bank and passes it to Company T. Each year, Company T pays Company V AUD interest at 4% (AUD 6,228,800) and receives GBP interest at 3% (GBP 3,000,000) to cover its own UK loan — at maturity both principal amounts are simply swapped back at the original 1.5572 rate, regardless of where the market rate has since moved."}],"key_terms":["Cross-Currency Swap","Comparative Advantage","Foreign Exchange Swap","Libor","Trade Date","Swap","Herstatt Risk","CLS Bank"],"stage":null},{"num":20,"title":"OTC Derivatives and Collateral – Legal Protection – Introduction","pages":"349–350","digest":["OTC derivative legal documentation exists purely because of duration: securities trades settle in a matter of days (T+0 to T+2 depending on the market) so counterparty risk is fleeting, but an OTC derivative can run 50 years, so the two parties need a durable rulebook covering what happens if the other side doesn't perform.","The ISDA Master Agreement is the industry-standard starting point for that rulebook, produced by the International Swaps and Derivatives Association (ISDA), with the 1992 and 2002 versions both still in active use today.","This standardisation itself has a history: when OTC derivatives first became popular in the early 1980s, firms drafted bespoke legal documentation per trade, which was slow and repetitive since most of the wording didn't actually vary — ISDA was formed in the mid-1980s specifically to solve this, producing the first standard master agreement so firms wouldn't have to reinvent the legal wheel on every trade.","This is the first of three chapters setting up the legal stack (Master Agreement/Schedule, then CSA) — a firm should sign this entire framework with a counterparty before executing its first trade with them, not after."],"examples":[],"key_terms":["ISDA","ISDA Master Agreement","Bilateral"],"stage":null},{"num":21,"title":"OTC Derivatives and Collateral – Legal Protection – Master Agreement and Schedule","pages":"351–360","digest":["The legal framework is three stacked documents: the ISDA Master Agreement (standard, untailored boilerplate defining core rights/obligations), the Schedule (records the two parties' negotiated amendments to the Master Agreement), and the Credit Support Annex (the collateral-specific rulebook) — the Master Agreement is the umbrella under which the other two sit, and it is used by an enormous range of institution types (governments, supranationals, corporations, mutual funds, pension funds, insurance companies, asset managers, investment banks and regional banks all sign the same standard document).","Because the Schedule and CSA are individually negotiated, no two counterparty relationships are identical — a firm with 100 counterparties realistically has close to 100 different sets of terms, which is precisely why collateral management can't apply one blanket process across all counterparties.","An Event of Default (applicable to either party) covers five specific situations: Failure to Pay or Delivery (missing a cash or securities obligation past a grace period), Breach of Agreement (failing to act on any OTHER aspect of the agreement), Collateral Default (specifically failing on a CSA obligation — filed under 'Credit Support Default'), Bankruptcy, and Merger (where a combined entity fails to assume the original party's obligations) — any of these triggers a right to terminate all trades with that counterparty early, beyond which no further collateral obligation arises.","A Termination Event is similar in effect but isn't anyone's fault — a Change in Law making the trade unlawful (filed under 'Illegality') or a Change in Tax Law imposing new tax obligations (filed under 'Tax Event') — yet it still forces early termination of the affected trades just like an Event of Default does.","Close-out netting is what makes default survivable: instead of settling every outstanding trade gross (paying out winners in full while waiting on a bankruptcy process for what's owed on losers), all trades are marked to a single net figure and only that net amount changes hands — this collapses gross exposure into one manageable number and denies a bankrupt counterparty's liquidator the ability to cherry-pick which trades to honor; if the defaulting party owes the net figure, any collateral already held by the non-defaulting party can be applied directly against it.","Trade confirmation immediately after execution exists to catch capture errors before they compound — a notional entered as 1,000,000 instead of 10,000,000 doesn't just misstate one trade, it makes every subsequent exposure calculation on that trade exactly 10x wrong.","The Schedule itself typically records: which optional provisions do or don't apply to each party, additional conditions on specific termination events, which documents (e.g. tax certificates) each party must deliver and by when, notification contact details for both firms, the governing law (a choice between English law and New York law), and whether recorded phone conversations between the two desks are admissible as evidence in a dispute."],"examples":[{"title":"Close-out netting collapses 5 trades into one payment","body":"Party B defaults on 5 open trades with Party A. Replacement costs: trades 1 & 4 & 5 favor Party B (3.2m + 3.75m + 0.475m = 7.425m owed by A), trades 2 & 3 favor Party A (0.65m + 4.1m = 4.75m owed by B). Without close-out netting, Party A must pay the full 7.425m immediately while waiting on Party B's bankruptcy estate for the 4.75m it's owed — likely at a steep discount and after a long delay. With close-out netting built into the ISDA Master Agreement, the two amounts net to a single payment: Party A owes Party B just USD 2,675,000.00 (7.425m − 4.75m), settled once."}],"key_terms":["ISDA Master Agreement","Event of Default","Close Out Netting","ISDA","Collateral Management","Credit Support Annex","Trade Confirmation","Early Termination","Gross Exposure","Failure to Pay","Bankruptcy","Execution","Default"],"stage":null},{"num":22,"title":"OTC Derivatives and Collateral – Legal Protection – Credit Support Annex","pages":"361–400","digest":["The CSA is the operational rulebook a collateral desk actually lives in day to day — it doesn't just say 'post collateral,' it defines every parameter (currency, eligible assets, haircuts, thresholds, minimum amounts, rounding) that turns a raw exposure number into an actual delivery instruction.","The legal stack has a strict order: the ISDA Master Agreement is negotiated first (largely standard boilerplate), the Schedule records the two parties' amendments to it, and the CSA sits on top as the collateral-specific rulebook — trading can only begin once all three are signed, and CSA terms only apply to trades executed after signing unless the two firms agree otherwise via a Long Form Confirmation for the interim period.","Firms accumulate CSAs of wildly different vintages with different counterparties over the years — renegotiating an outdated 'legacy' CSA takes weeks to months through the Legal Department, so amendments to specific clauses are far more common in practice than full renegotiation, and a firm's 100 counterparty CSAs can genuinely mean close to 100 different rule sets.","Exposure only exists for the party currently in-the-money: at trade date every OTC derivative has zero value to both sides, but as rates move one party accumulates a positive mark-to-market (replacement cost has risen in their favor) and only THAT party has counterparty risk worth collateralizing — a concrete illustration: a CDS bought at 115 bppa is profitable (and risk-bearing) for the buyer if the market moves to 122 bppa, but carries zero counterparty risk for that same buyer if the market instead falls to 109 bppa, since replacing the trade at 109 would actually be cheaper, not more expensive.","CSA legal structure determines who owns posted securities collateral: under a title-transfer CSA (the English Law CSA) full legal title passes to the collateral taker, who can freely reuse it; under a security-interest CSA (the New York Law CSA or the English Law Credit Support Deed) the giver retains legal title and any use by the taker is called rehypothecation, not reuse, and requires separate permission — cash collateral is unaffected by this distinction since cash is fungible regardless of structure.","Day-to-day, the Collateral Department's job under any CSA reduces to three comparisons at the agreed frequency: calculate exposure, calculate current collateral value, then either return excess collateral (value > exposure), call for more (exposure > value), or do nothing (the two are close enough) — everything else in the CSA exists to make those three steps unambiguous between two firms.","A CSA's generic vocabulary is worth knowing cold since it recurs constantly: Base Currency (the currency exposure is calculated in), Delivery Amount (what's owed to the exposed party), Eligible Credit Support (acceptable collateral types), Exposure (replacement cost net of existing collateral), Return Amount (excess collateral to give back), Transferee (the collateral taker / exposed party) and Transferor (the collateral giver / non-exposed party) — this Transferee/Transferor pairing is used throughout the CSA instead of 'buyer/seller.'","A CSA only covers the specific OTC product TYPES it lists (interest rate swaps, FRAs, FX forwards, FX swaps, cross-currency swaps, CDS, total return swaps, equity options, variance swaps are the typical menu) — a trade in a product not listed falls completely outside the CSA's protection and must be managed via a bespoke, separately-tracked arrangement (a Long Form Confirmation) until the CSA is formally amended to include it.","Collateral direction can be two-way (mutual — typical between similarly-rated firms, whichever side has positive exposure calls the other) or one-way (only the weaker-rated party ever posts, even when the trade moves in ITS favour) — one-way CSAs are common where an investment bank trades with a supranational (World Bank, EBRD, Asian Development Bank) or a sovereign, since the bank is credit-weaker than those counterparties by definition.","Standing Settlement Instructions (SSIs) — each party's specific bank and custodian account numbers for cash and securities movements — are exchanged before the first trade and stored in static data specifically so daily settlement instructions can be generated automatically; large firms operating multiple legal entities or (for a mutual fund manager) multiple underlying funds may need dozens of SSI combinations, and getting the wrong one risks a payment or delivery going to the wrong account entirely.","Base Currency and Eligible Currency are two distinct CSA fields often confused: Base Currency is purely the currency the EXPOSURE CALCULATION is expressed in (so a firm with GBP, EUR and USD trades converts all three into one Base Currency Equivalent before comparing to collateral); Eligible Currency is separately which currency (or currencies) cash COLLATERAL may actually be posted in — a CSA can have a EUR base currency while still allowing USD or GBP cash to be delivered against it.","Eligible Collateral is typically restricted to major-currency cash plus G-7/G-10 government bonds (historically low volatility, hence popular); equity is rarely eligible at all, and where it is, it's normally restricted to constituents of a major national index (FTSE-100, DAX, Nikkei-225, etc.) specifically because their liquidity and price behaviour is well understood.","Haircut percentages in a real negotiated CSA are usually tiered by BOTH issuer/asset type and residual maturity (a bond with 20+ years to maturity might carry an 8% haircut versus 0.5% for the same issuer's bond maturing within a year, since more time means more price-movement risk before the collateral could be liquidated) — and some CSAs go further, stating two different valuation percentages for the same bond conditional on the issuer's current credit rating, so a ratings downgrade automatically tightens the haircut without needing to renegotiate the CSA itself.","Independent Amount and Threshold pull in opposite directions and are essentially never both present for the same party in the same CSA: Independent Amount adds a protective buffer of extra collateral ABOVE pure exposure (fixed sum or a percentage of notional, e.g. 6% on an $80m IRS = $4.8m extra), typically demanded from a weaker-rated counterparty; Threshold instead carves out an amount of uncollateralized exposure each party is allowed to run before any collateral is required at all — a firm receiving an independent amount from a counterparty would not also expect a threshold working the other way for that same counterparty.","Thresholds can be symmetric (two-way, same figure both directions) or an Asymmetrical Threshold, where the weaker-rated party has a hard threshold (say $2m, below which it simply cannot call) while the stronger-rated party retains the right to call for any exposure amount at all, however small — this asymmetry is a direct, negotiated reflection of relative credit quality.","Minimum Transfer Amount (MTA) is applied AFTER threshold has already been subtracted from raw exposure, purely to avoid the operational cost of moving trivial collateral amounts daily, and can differ by direction — e.g. a firm might have a $250,000 MTA when IT calls, but face a $500,000 MTA when the counterparty calls, reflecting different negotiating leverage rather than a symmetric rule.","Rounding rules exist purely to avoid transferring odd-cent collateral amounts (e.g. rounding a $4,116,806.92 requirement up to the nearest $100,000 = $4,200,000) and are typically specified separately for delivery versus return amounts (a CSA might round delivery UP but round return DOWN, which is not symmetric and slightly favours the exposed party over a long relationship) — and a rounding rule agreed for the base currency is normally extended to every other eligible currency too, or a mismatch in rounding treatment between currencies can quietly reintroduce the exact odd-amount problem rounding was meant to solve.","Valuation involves two genuinely separate things that must each be priced independently: the open OTC trades themselves, AND (if collateral is securities rather than cash) the collateral's own current market value — cash collateral in the base currency literally cannot change value day to day, so only the trade side needs re-pricing, but securities collateral can move in EITHER direction independently of the trade's exposure, meaning a single day can see the trade exposure rise AND the collateral's value fall simultaneously, compounding into a larger call than either factor alone would produce.","A Valuation Agent (either party, or occasionally an independent third party) is responsible for producing the official mark-to-market; where none is explicitly named in the CSA, the party making the mar
