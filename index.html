        <button class="hero-btn" style="max-width:260px;margin:20px auto 0;" id="btn-quiz-restart">New quiz →</button>
      </div>`;
    }
    const chips = PART_GROUPS.map(g=>{
      const active = QUIZ_FILTER.includes(g.key);
      return `<button class="deskchip ${active?'is-active':''}" data-qgroup="${g.key}">${escapeHtml(g.label)}</button>`;
    }).join("");
    const poolSize = quizPool().length;
    return `
    <div class="stack">
      <div class="eyebrow">Choose your topics</div>
      <div class="deskrow">${chips}</div>
      <div class="card" style="text-align:center;padding:34px 18px;">
        <span style="font-size:30px;display:block;margin-bottom:10px;">🧠</span>
        <h3 style="font-size:18px;">Scenario quiz</h3>
        <p class="muted" style="margin-top:8px;font-size:13.5px;">${poolSize} question${poolSize===1?'':'s'} available across the topics selected above — concept checks and real calculations, drawn straight from the book.</p>
        <button class="hero-btn" style="margin-top:18px;" id="btn-quiz-start" ${poolSize===0?'disabled':''}>Start quiz →</button>
      </div>
    </div>`;
  }

  const q = QUIZ.find(x=>x.id===QUIZ_SESSION.queue[QUIZ_SESSION.idx]);
  const dotsHtml = QUIZ_SESSION.queue.map((id,i)=>`<span class="pdot ${i<QUIZ_SESSION.idx?'done':(i===QUIZ_SESSION.idx?'current':'')}"></span>`).join("");
  const g = groupForChapter(q.chapter_ref);
  const nextLabel = QUIZ_SESSION.idx+1>=QUIZ_SESSION.queue.length ? 'See results →' : 'Next →';

  let body;
  if(q.type === "mc"){
    if(!QUIZ_SESSION.answered){
      const opts = q.options.map((o,i)=>`<button class="quiz-opt" data-opt="${i}">${escapeHtml(o)}</button>`).join("");
      body = `<div class="quiz-q">${escapeHtml(q.question)}</div><div class="quiz-opts">${opts}</div>`;
    } else {
      const opts = q.options.map((o,i)=>{
        let cls="";
        if(o===q.answer) cls="is-correct";
        else if(i===QUIZ_SESSION.selected) cls="is-wrong";
        return `<button class="quiz-opt ${cls}" disabled>${escapeHtml(o)}</button>`;
      }).join("");
      body = `<div class="quiz-q">${escapeHtml(q.question)}</div><div class="quiz-opts">${opts}</div>
        <div class="quiz-explain">${escapeHtml(q.explanation)}</div>
        <button class="hero-btn quiz-next" id="quiz-next">${nextLabel}</button>`;
    }
  } else {
    if(!QUIZ_SESSION.revealed){
      body = `<div class="quiz-q">${escapeHtml(q.question)}</div>
        <div class="quiz-selfgrade">
          <button data-conf="0" style="background:var(--paper-sunken);color:var(--ink-soft);">Not sure — reveal</button>
          <button class="yes" data-conf="1">Confident — reveal</button>
        </div>`;
    } else if(!QUIZ_SESSION.answered){
      body = `<div class="quiz-q">${escapeHtml(q.question)}</div>
        <div class="quiz-answer-box"><div class="quiz-answer-label">Answer</div><div class="quiz-answer-val">${escapeHtml(q.answer)}</div></div>
        <div class="quiz-explain">${escapeHtml(q.explanation)}</div>
        <div class="quiz-selfgrade">
          <button class="no" data-self="0">Got it wrong</button>
          <button class="yes" data-self="1">Got it right</button>
        </div>`;
    } else {
      body = `<div class="quiz-q">${escapeHtml(q.question)}</div>
        <div class="quiz-answer-box"><div class="quiz-answer-label">Answer</div><div class="quiz-answer-val">${escapeHtml(q.answer)}</div></div>
        <div class="quiz-explain">${escapeHtml(q.explanation)}</div>
        <button class="hero-btn quiz-next" id="quiz-next">${nextLabel}</button>`;
    }
  }

  return `
  <div class="progressline">
    <span class="progresstext"><b>${QUIZ_SESSION.idx+1}</b> / ${QUIZ_SESSION.queue.length}</span>
    <div class="dots">${dotsHtml}</div>
  </div>
  <span class="stamp" style="background:var(--accent-soft);color:var(--accent);margin-bottom:10px;">Ch ${q.chapter_ref}${g?' · '+escapeHtml(g.label):''}</span>
  <div class="flash" style="text-align:left;">${body}</div>`;
}

/* ---------- Calculation drills (randomized) ---------- */
function fmtNum(n){ return Math.round(n).toLocaleString('en-US'); }
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function randChoice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

const DRILLS = [
  { key:"haircut", title:"Haircut → Collateral Value",
    generate(){ return { marketValue: randInt(2,40)*250000, haircut: randChoice([1,2,3,5,7,8,10,12,15,20]) }; },
    question(p){ return `A firm holds bond collateral with a market value of USD ${fmtNum(p.marketValue)}. The CSA specifies a ${p.haircut}% haircut. What is the deliverable collateral value?`; },
    answer(p){ return Math.round(p.marketValue*(1-p.haircut/100)); },
    explain(p,a){ return `Collateral value = market value × (1 − haircut) = ${fmtNum(p.marketValue)} × ${(1-p.haircut/100).toFixed(2)} = USD ${fmtNum(a)}.`; } },

  { key:"margincall", title:"Margin Call (Threshold + MTA)",
    generate(){ return { threshold: randChoice([0,250000,500000,1000000]), mta: randChoice([50000,100000,150000,250000]), exposure: randInt(3,25)*100000 }; },
    question(p){ return `Exposure is USD ${fmtNum(p.exposure)}. Threshold is USD ${fmtNum(p.threshold)} and MTA is USD ${fmtNum(p.mta)}. What is the margin call amount?`; },
    answer(p){ const excess = Math.max(0, p.exposure - p.threshold); return excess < p.mta ? 0 : excess; },
    explain(p,a){ const excess = Math.max(0, p.exposure - p.threshold);
      if(excess < p.mta) return `Excess over threshold = ${fmtNum(p.exposure)} − ${fmtNum(p.threshold)} = ${fmtNum(excess)}, which is below the ${fmtNum(p.mta)} MTA, so no call is made (USD 0).`;
      return `Excess over threshold = ${fmtNum(p.exposure)} − ${fmtNum(p.threshold)} = ${fmtNum(excess)}, which exceeds the ${fmtNum(p.mta)} MTA, so the full USD ${fmtNum(a)} is called.`; } },

  { key:"accrued", title:"Accrued Interest → Dirty Value",
    generate(){ return { face: randInt(2,20)*500000, rate: randChoice([2.25,2.75,3.15,3.60,4.00,4.75,5.25]), days: randInt(20,340), cleanPct: randChoice([97.5,98.2,99.0,99.4,100.1,101.3,102.6]) }; },
    question(p){ return `A USD ${fmtNum(p.face)} face-value bond pays a ${p.rate}% coupon and is marked at a clean price of ${p.cleanPct}%. ${p.days} days of interest have accrued (actual/360). What is the bond's dirty (total market) value?`; },
    answer(p){ return Math.round(p.face*p.cleanPct/100 + p.face*(p.rate/100)/360*p.days); },
    explain(p,a){ const clean = Math.round(p.face*p.cleanPct/100); const accrued = Math.round(p.face*(p.rate/100)/360*p.days);
      return `Clean value = ${fmtNum(p.face)} × ${p.cleanPct}% = USD ${fmtNum(clean)}. Accrued interest = ${fmtNum(p.face)} × ${p.rate}% / 360 × ${p.days} = USD ${fmtNum(accrued)}. Dirty value = ${fmtNum(clean)} + ${fmtNum(accrued)} = USD ${fmtNum(a)}.`; } },

  { key:"cds", title:"CDS Credit Event Payout",
    generate(){ return { notional: randInt(2,50)*1000000, recovery: randChoice([15,20,25,30,35,40,45,50,60]) }; },
    question(p){ return `A USD ${fmtNum(p.notional)} notional CDS references an issuer that defaults. The ISDA auction sets the recovery rate at ${p.recovery} cents on the dollar. How much does the protection seller pay the protection buyer?`; },
    answer(p){ return Math.round(p.notional*(1-p.recovery/100)); },
    explain(p,a){ return `Payout = notional × (1 − recovery) = ${fmtNum(p.notional)} × (1 − ${(p.recovery/100).toFixed(2)}) = USD ${fmtNum(a)}.`; } },

  { key:"repointerest", title:"Repo Interest",
    generate(){ return { principal: randInt(3,60)*500000, rate: randChoice([1.75,2.10,2.45,2.90,3.25,3.60]), days: randInt(7,180), basis: randChoice([360,365]) }; },
    question(p){ return `A firm borrows USD ${fmtNum(p.principal)} via repo at ${p.rate}% for ${p.days} actual days (day basis: ${p.basis}). How much repo interest is owed at close?`; },
    answer(p){ return Math.round(p.principal*(p.rate/100)/p.basis*p.days); },
    explain(p,a){ return `Interest = principal × rate × days / basis = ${fmtNum(p.principal)} × ${p.rate}% × ${p.days} / ${p.basis} = USD ${fmtNum(a)}.`; } },

  { key:"mtm", title:"Mark-to-Market Shortfall",
    generate(){ return { exposureMove: randChoice([50000,100000,150000,200000,250000,300000]), collateralDrop: randChoice([0,10000,20000,30000,40000,50000]) }; },
    question(p){ return `Yesterday's exposure was fully collateralized. Today the exposure rises by USD ${fmtNum(p.exposureMove)}, and the bond collateral already held loses USD ${fmtNum(p.collateralDrop)} of its own value. What total amount must be called today?`; },
    answer(p){ return p.exposureMove + p.collateralDrop; },
    explain(p,a){ return `Total shortfall = exposure increase + collateral value loss = ${fmtNum(p.exposureMove)} + ${fmtNum(p.collateralDrop)} = USD ${fmtNum(a)}.`; } },
];

let DRILL_SESSION = null;
function startDrill(){
  const rounds = [];
  for(let i=0;i<8;i++){ const t = randChoice(DRILLS); rounds.push({key:t.key, params:t.generate()}); }
  DRILL_SESSION = {rounds, idx:0, revealed:false, lastInput:"", correct:0, total:0};
  render();
}

function viewDrill(){
  if(!DRILL_SESSION || DRILL_SESSION.idx >= (DRILL_SESSION.rounds?DRILL_SESSION.rounds.length:0)){
    if(DRILL_SESSION && DRILL_SESSION.total>0 && DRILL_SESSION.idx>=DRILL_SESSION.rounds.length){
      const s = DRILL_SESSION;
      DRILL_SESSION = null;
      recordDrillSession(s.correct, s.total);
      return `
      <div class="flash session-summary">
        <div class="eyebrow">Drill complete</div>
        <div class="summary-num" style="margin-top:10px;">${Math.round((s.correct/s.total)*100)}%</div>
        <p class="muted summary-sub">${s.correct} of ${s.total} correct.</p>

      <button class="hero-btn" style="margin-top:18px;" id="btn-drill-start">Start drill →</button>
    </div>`;
  }

  const round = DRILL_SESSION.rounds[DRILL_SESSION.idx];

  const dotsHtml = DRILL_SESSION.rounds.map((r,i)=>`<span class="pdot ${i<DRILL_SESSION.idx?'done':(i===DRILL_SESSION.idx?'current':'')}"></span>`).join("");

      <button class="hero-btn" id="drill-submit">Check answer →</button>`;
  } else {
    const raw = DRILL_SESSION.lastInput || "";
    const userVal = parseFloat(raw.replace(/[, ]/g,""));
    const tolerance = Math.max(1, Math.abs(correctAnswer)*0.001);
    const isCorrect = !isNaN(userVal) && Math.abs(userVal-correctAnswer) <= tolerance;
    body = `

  }

  return `
  <div class="progressline">
    <span class="progresstext"><b>${DRILL_SESSION.idx+1}</b> / ${DRILL_SESSION.rounds.length}</span>
    <div class="dots">${dotsHtml}</div>

/* ---------- study / session ---------- */

function shuffleArr(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

function roundRobinMerge(byCat, cats, limit, result){
  let added = true;
  while(added && result.length < limit){
    added = false;
    for(const cat of cats){
      const g = byCat[cat];
      if(g && g.length){
        result.push(g.shift());
        added = true;
        if(result.length >= limit) break;
      }
    }
  }
  return result;
}

function buildQueue(catKeys, limit=12){
  const scoped = cardsForCats(catKeys);
  if(scoped.length===0) return [];
  // Interleaving with due-priority preserved: due cards (soonest first, per desk) are
  // round-robin merged across desks first — so review priority isn't lost — then any
  // remaining slots are filled the same way from shuffled fresh cards. Each phase is
  // genuinely mixed across desks rather than leaving it to chance.
  const byDue = {}, byFresh = {};
  scoped.forEach(c => {
    if(isDue(c.id) && !isNew(c.id)) (byDue[c.cat] = byDue[c.cat] || []).push(c);
    else if(isNew(c.id)) (byFresh[c.cat] = byFresh[c.cat] || []).push(c);
  });
  Object.keys(byDue).forEach(cat => byDue[cat].sort((a,b)=> STATE.cards[a.id].due - STATE.cards[b.id].due));
  Object.keys(byFresh).forEach(cat => shuffleArr(byFresh[cat]));

  const dueCats = shuffleArr(Object.keys(byDue));
  const freshCats = shuffleArr(Object.keys(byFresh));
  const dueLimit = Math.ceil(limit*0.7);

  let result = roundRobinMerge(byDue, dueCats, dueLimit, []);
  result = roundRobinMerge(byFresh, freshCats, limit, result);
  if(result.length===0) result = shuffleArr(scoped.slice()).slice(0, limit);
  return result.map(c=>c.id);
}

function startSession(){
  const queue = buildQueue(STATE.selectedCats, 12);
  // bidirectional retrieval: only flip previously-seen cards to definition->term,
  // so a card's very first exposure is always the normal term->definition direction
  const directions = queue.map(id => (!isNew(id) && Math.random() < 0.35) ? "reverse" : "forward");
  SESSION = { queue, directions, idx:0, revealed:false, correct:0, total:0 };
  nav("study");
  render();
}

  const root = document.getElementById("modal-root");

  <div class="modal-overlay" id="modal-overlay">

      <div class="modal-foot">
        <button id="modal-study">Study this card</button>

      </div>

  </div>`;

  document.getElementById("modal-close").onclick = closeModal;
  document.getElementById("modal-done").onclick = closeModal;

    nav("study"); render();

function closeModal(){
  const ov = document.getElementById("modal-overlay");
  if(!ov) return;
  ov.classList.remove("open");
  setTimeout(()=>{ document.getElementById("modal-root").innerHTML=""; }, 200);
}

/* ---------- render + events ---------- */
function render(){
  if(ROUTE==="search") ROUTE = "tree";
  setActiveTab();
  const view = document.getElementById("view");
  if(ROUTE==="home") view.innerHTML = viewHome();
  else if(ROUTE==="chapters") view.innerHTML = viewChapters();
  else if(ROUTE==="tree"){ view.innerHTML = viewTree(); document.getElementById("tree-search").addEventListener("input", (e)=>renderTreeSearch(e.target.value)); }
  else if(ROUTE==="study") view.innerHTML = viewStudy();
  else if(ROUTE==="quiz") view.innerHTML = viewQuiz();
  else if(ROUTE==="stats") view.innerHTML = viewStats();
  else view.innerHTML = viewHome();
  document.getElementById("topchip").textContent = STATE.selectedCats.length===Object.keys(CATS).length ? CARDS.length+" terms" : cardsForCats(STATE.selectedCats).length+" in scope";
}

document.getElementById("tabbar").addEventListener("click",(e)=>{
  const btn = e.target.closest(".tab");
  if(!btn) return;
  nav(btn.dataset.tab);
});

document.addEventListener("click",(e)=>{
  const themeBtn = e.target.closest("#theme-toggle");
  if(themeBtn){ cycleTheme(); return; }

  const startBtn = e.target.closest("#btn-start-session, #btn-restart");
  if(startBtn){ startSession(); return; }

  const gotoChapters = e.target.closest("#btn-goto-chapters");
  if(gotoChapters){ nav("chapters"); render(); return; }

  const gotoFoundations = e.target.closest("#btn-goto-foundations");
  if(gotoFoundations){ nav("chapters"); render(); return; }

  const gotoQuiz = e.target.closest("#btn-goto-quiz");
  if(gotoQuiz){ nav("quiz"); render(); return; }

  const deskChip = e.target.closest(".deskchip");
  if(deskChip){
    const k = deskChip.dataset.desk;
    const sel = STATE.selectedCats;
    if(sel.includes(k)){
      if(sel.length>1) STATE.selectedCats = sel.filter(x=>x!==k);
    } else {
      STATE.selectedCats = [...sel, k];
    }
    saveState();
    render();
    return;
  }

  const accHead = e.target.closest("[data-toggle]");
  if(accHead){
    const key = accHead.dataset.toggle;
    const item = accHead.closest(".acc-item");
    const willOpen = !item.classList.contains("is-open");
    document.querySelectorAll(".acc-item.is-open").forEach(el=>{ if(el!==item) el.classList.remove("is-open"); });
    item.classList.toggle("is-open", willOpen);
    if(willOpen) renderTreePanel(key);
    return;
  }

  const rowOpen = e.target.closest("[data-open]");
  if(rowOpen){ openModal(rowOpen.dataset.open); return; }

  const revealBtn = e.target.closest("#btn-reveal");
  if(revealBtn && SESSION){ SESSION.revealed = true; render(); return; }

  const gradeBtn = e.target.closest("[data-grade]");
  if(gradeBtn && SESSION){
    const grade = gradeBtn.dataset.grade;
    const id = SESSION.queue[SESSION.idx];
    gradeCard(id, grade);
    SESSION.total += 1;
    if(grade!=="again") SESSION.correct += 1;
    if(SESSION.idx+1 >= SESSION.queue.length){
      recordSession(SESSION.correct, SESSION.total);
    }
    SESSION.idx += 1;
    SESSION.revealed = false;
    render();
    return;
  }

  const partHead = e.target.closest("[data-toggle-part]");
  if(partHead){
    const key = partHead.dataset.togglePart;
    const item = partHead.closest(".part-item");
    const willOpen = !item.classList.contains("is-open");
    document.querySelectorAll(".part-item.is-open").forEach(el=>{ if(el!==item) el.classList.remove("is-open"); });
    item.classList.toggle("is-open", willOpen);
    if(willOpen) renderPartPanel(key);
    return;
  }

  const chRow = e.target.closest("[data-chapter]");
  if(chRow){ openChapterModal(parseInt(chRow.dataset.chapter,10)); return; }

  const fRow = e.target.closest("[data-foundation]");
  if(fRow){ openFoundationModal(parseInt(fRow.dataset.foundation,10)); return; }

  const lcBtn = e.target.closest("[data-lifecycle]");
  if(lcBtn){ startLifecycle(lcBtn.dataset.lifecycle); return; }

  const lcOpenChapter = e.target.closest("[data-open-chapter]");
  if(lcOpenChapter){ openChapterModal(parseInt(lcOpenChapter.dataset.openChapter,10)); return; }

  const lcClose = e.target.closest("#lc-close");
  if(lcClose){ LIFECYCLE = null; render(); return; }

  const lcPrev = e.target.closest("#lc-prev");
  if(lcPrev && LIFECYCLE){ LIFECYCLE.idx = Math.max(0, LIFECYCLE.idx-1); render(); return; }

  const lcNext = e.target.closest("#lc-next");
  if(lcNext && LIFECYCLE){
    const steps = LIFECYCLES[LIFECYCLE.key].steps;
    if(LIFECYCLE.idx+1 >= steps.length){ LIFECYCLE = null; } else { LIFECYCLE.idx += 1; }
    render();
    return;
  }

  const lcMode = e.target.closest("[data-lc-mode]");
  if(lcMode && LIFECYCLE){ LIFECYCLE.mode = lcMode.dataset.lcMode; render(); return; }

  const lcPick = e.target.closest("[data-lc-pick]");
  if(lcPick && LIFECYCLE && LIFECYCLE.drill){
    const stepIdx = parseInt(lcPick.dataset.lcPick,10);
    const d = LIFECYCLE.drill;
    const poolPos = d.pool.indexOf(stepIdx);
    if(poolPos>=0){ d.pool.splice(poolPos,1); d.picked.push(stepIdx); }
    render();
    return;
  }

  const lcCheck = e.target.closest("#lc-drill-check");
  if(lcCheck && LIFECYCLE && LIFECYCLE.drill){ LIFECYCLE.drill.checked = true; render(); return; }

  const lcRetry = e.target.closest("#lc-drill-retry");
  if(lcRetry && LIFECYCLE){ LIFECYCLE.drill = null; render(); return; }

  const quizStart = e.target.closest("#btn-quiz-start, #btn-quiz-restart");
  if(quizStart){ startQuiz(); return; }

  const qGroup = e.target.closest("[data-qgroup]");
  if(qGroup){
    const k = qGroup.dataset.qgroup;
    if(QUIZ_FILTER.includes(k)){
      if(QUIZ_FILTER.length>1) QUIZ_FILTER = QUIZ_FILTER.filter(x=>x!==k);
    } else {
      QUIZ_FILTER = [...QUIZ_FILTER, k];
    }
    render();
    return;
  }

  const quizOpt = e.target.closest(".quiz-opt[data-opt]");
  if(quizOpt && QUIZ_SESSION && !QUIZ_SESSION.answered){
    const idx = parseInt(quizOpt.dataset.opt,10);
    const q = QUIZ.find(x=>x.id===QUIZ_SESSION.queue[QUIZ_SESSION.idx]);
    const correct = q.options[idx] === q.answer;
    QUIZ_SESSION.selected = idx;
    QUIZ_SESSION.answered = true;
    QUIZ_SESSION.total += 1;
    if(correct) QUIZ_SESSION.correct += 1;
    recordQuizAnswer(correct);
    render();
    return;
  }

  const quizConf = e.target.closest("[data-conf]");
  if(quizConf && QUIZ_SESSION){
    QUIZ_SESSION.confidence = quizConf.dataset.conf === "1";
    QUIZ_SESSION.revealed = true;
    render();
    return;
  }

  const quizSelf = e.target.closest("[data-self]");
  if(quizSelf && QUIZ_SESSION){
    const correct = quizSelf.dataset.self === "1";
    QUIZ_SESSION.answered = true;
    QUIZ_SESSION.total += 1;
    if(correct) QUIZ_SESSION.correct += 1;
    recordQuizAnswer(correct, QUIZ_SESSION.confidence);
    render();
    return;
  }

  const quizNext = e.target.closest("#quiz-next");
  if(quizNext && QUIZ_SESSION){
    QUIZ_SESSION.idx += 1;
    QUIZ_SESSION.revealed = false;
    QUIZ_SESSION.answered = false;
    QUIZ_SESSION.selected = null;
    QUIZ_SESSION.confidence = undefined;
    render();
    return;
  }

  const quizModeBtn = e.target.closest("[data-quiz-mode]");
  if(quizModeBtn){ QUIZ_MODE = quizModeBtn.dataset.quizMode; render(); return; }

  const drillStart = e.target.closest("#btn-drill-start, #btn-drill-restart");
  if(drillStart){ startDrill(); return; }

  const drillSubmit = e.target.closest("#drill-submit");
  if(drillSubmit && DRILL_SESSION){
    const input = document.getElementById("drill-input");
    const raw = input ? input.value : "";
    const round = DRILL_SESSION.rounds[DRILL_SESSION.idx];
    const template = DRILLS.find(d=>d.key===round.key);
    const correctAnswer = template.answer(round.params);
    const userVal = parseFloat(raw.replace(/[, ]/g,""));
    const tolerance = Math.max(1, Math.abs(correctAnswer)*0.001);
    const isCorrect = !isNaN(userVal) && Math.abs(userVal-correctAnswer) <= tolerance;
    DRILL_SESSION.lastInput = raw;
    DRILL_SESSION.revealed = true;
    DRILL_SESSION.total += 1;
    if(isCorrect) DRILL_SESSION.correct += 1;
    render();
    return;
  }

  const drillNext = e.target.closest("#drill-next");
  if(drillNext && DRILL_SESSION){
    DRILL_SESSION.idx += 1;
    DRILL_SESSION.revealed = false;
    DRILL_SESSION.lastInput = "";
    render();
    return;
  }
});

applyTheme();
render();
</script>

</body></html>
