posed party as agreement — so best practice is always to respond explicitly, whether accepting or disputing, and to do so in writing when disputing so the counterparty can submit a corrected proposal without delay.","chapter_ref":35},{"id":"exp5q4","question":"Under an English Law CSA (title transfer), if the collateral taker becomes insolvent after reusing the collateral it received, what is the collateral giver's legal position?","type":"mc","options":["The giver retains direct ownership and can reclaim the specific bonds immediately","The giver becomes an unsecured creditor of the insolvent taker, potentially facing significant delay and only partial recovery","The giver automatically receives priority over all other creditors","The giver has no claim at all, since title transfer means the giver gave up all rights"],"answer":"The giver becomes an unsecured creditor of the insolvent taker, potentially facing significant delay and only partial recovery","explanation":"Under title transfer, full legal title passed to the taker — the giver's only right is a contractual claim to equivalent collateral, not a proprietary right to specific assets. If the taker becomes insolvent, the giver joins the pool of general unsecured creditors, which real cases show can mean lengthy delay and only partial recovery.","chapter_ref":36},{"id":"exp5q5","question":"Party B holds a bond as OTC derivative collateral from Party A, and reuses it by REPO'ing it to Party C. On the bond's coupon record date, who ends up entitled to keep the coupon economically, and does Party B need to pay anything out of its own pocket?","type":"mc","options":["Party C keeps the coupon; Party B owes Party A the value from its own funds (manufactured income)","Party A keeps the coupon directly; neither Party B nor Party C are involved","Party B claims the coupon back from Party C and passes it to Party A; no out-of-pocket payment is needed from Party B","Party C keeps the coupon permanently, and Party A has no claim on anyone"],"answer":"Party B claims the coupon back from Party C and passes it to Party A; no out-of-pocket payment is needed from Party B","explanation":"A repo only temporarily transfers the bond — Party C must return it at the repo's close, so Party C isn't entitled to keep the coupon. Party B can and should reclaim it from Party C, then pass that same value to Party A — unlike an outright sale (where the new owner keeps the coupon and Party B must pay Party A out of pocket, i.e. manufactured income), this is just a pass-through.","chapter_ref":43},{"id":"exp6q1","question":"A CCP has just novated a trade between Firm A (buyer) and Firm B (seller). What is the CCP's resulting position, and why does this matter?","type":"mc","options":["The CCP becomes seller to Firm A and buyer to Firm B, leaving it with a perfectly offsetting zero position — this is what 'market risk neutral' means","The CCP takes on Firm A's original directional exposure as its own trading position","The CCP only becomes counterparty to whichever party is currently out of the money","The CCP's position depends on which clearing member has the larger house account balance"],"answer":"The CCP becomes seller to Firm A and buyer to Firm B, leaving it with a perfectly offsetting zero position — this is what 'market risk neutral' means","explanation":"Novation splits one trade into two: CCP-vs-A and CCP-vs-B, with the CCP taking the opposite side of each. Across every trade it processes this must net to zero — a CCP must never carry a directional position for its own account.","chapter_ref":47},{"id":"exp6q2","question":"Firm T buys USD 45,000,000 notional from Firm U, buys USD 15,000,000 from Firm V, and sells USD 25,000,000 to Firm W, all in the same interest rate swap product. Once all three trades are novated to the same CCP, what is Firm T's single net position with the CCP?","type":"calc","options":[],"answer":"+35,000,000","explanation":"45,000,000 + 15,000,000 − 25,000,000 = 35,000,000. Multilateral netting collapses three separate bilateral relationships (each needing its own margin/collateral management) into this one net figure with the CCP.","chapter_ref":46},{"id":"exp6q3","question":"Firm C is a client of clearing member Firm M at a CCP (Firm C is not itself a clearing member). If the CCP needs to communicate about Firm C's trade, who does it contact?","type":"mc","options":["Firm M only — the CCP has no direct legal relationship with Firm C","Firm C directly, since it is the economic owner of the trade","Both Firm M and Firm C simultaneously","Whichever party initiated the original trade"],"answer":"Firm M only — the CCP has no direct legal relationship with Firm C","explanation":"The legal chain is strictly CCP↔CM and, separately, CM↔client (NCM). The CCP never has a direct relationship with a non-clearing member — all communication and margin call flow-through happens via the clearing member.","chapter_ref":47},{"id":"exp6q4","question":"A clearing member defaults. Its posted initial margin isn't enough to cover the resulting loss after close-out. Where does the CCP turn next?","type":"mc","options":["The mutualised default fund contributed by all clearing members","The CCP's own general corporate capital, immediately","Other clearing members' individual initial margin, without their consent","The defaulting member's clients' segregated assets, regardless of account type"],"answer":"The mutualised default fund contributed by all clearing members","explanation":"The default fund exists precisely for this waterfall step: defaulting member's own IM first, then the mutualised (loss-shared) default fund, before the CCP's own capital or unrelated members' individual margin is threatened.","chapter_ref":47},{"id":"exp6q5","question":"A firm posts USD 8,000,000 cash as collateral against a EUR-denominated non-centrally-cleared trade exposure. What haircut applies if this is Initial Margin, versus if it is Variation Margin?","type":"calc","options":[],"answer":"IM: 8% haircut (USD 7,360,000 value); VM: 0% haircut (full USD 8,000,000 value)","explanation":"Under the Final RTS, cash collateral in a different currency from the exposure gets an 8% haircut for Initial Margin, but a 0% haircut for Variation Margin regardless of currency — identical asset, different regulatory treatment depending on which margin type it satisfies.","chapter_ref":48},{"id":"exp6q6","question":"Two firms want to execute a new non-centrally-cleared interest rate swap. Firm A's AANA crossed the EUR 2.25 trillion threshold in September 2017. Firm B's AANA only crosses the EUR 8 billion threshold in September 2020. From what date does mandatory Initial Margin exchange apply between them?","type":"mc","options":["September 2020 — the later (less constraining) of the two deadlines governs","September 2017 — the earlier deadline always governs once either party is in scope","February 2017 — the earliest possible AANA deadline overall","Immediately upon trade execution, regardless of either firm's AANA"],"answer":"September 2020 — the later (less constraining) of the two deadlines governs","explanation":"Mandatory IM exchange only begins once BOTH parties are in scope. Even though Firm A individually crossed its threshold in 2017, their mutual IM requirement doesn't start until Firm B is also captured, in September 2020.","chapter_ref":48},{"id":"cd1q1","question":"The book divides all transaction types that give rise to collateral into two categories. Which category do repo and securities lending & borrowing transactions belong to?","type":"mc","options":["Transaction Types Involving Loaning of Assets","Transaction Types That Accumulate Value Over Time","Transaction Types Requiring Central Clearing","Transaction Types Exempt from Collateralisation"],"answer":"Transaction Types Involving Loaning of Assets","explanation":"The book's two categories are 'Transaction Types Involving Loaning of Assets' (repo and securities lending & borrowing, where the lender risks not getting the lent asset back) and 'Transaction Types That Accumulate Value Over Time' (OTC derivatives, where exposure builds up as market value shifts).","chapter_ref":1},{"id":"cd1q2","question":"A lender has taken bond collateral against a cash loan. The bond's market value falls below the value of the cash lent. According to the book, what should the lender do?","type":"mc","options":["Make a margin call on the borrower to request additional collateral","Return part of the collateral to the borrower","Terminate the loan immediately without notice","Do nothing, since bonds are exempt from revaluation"],"answer":"Make a margin call on the borrower to request additional collateral","explanation":"When collateral value falls below the exposure it's meant to cover, the lender (the exposed party) has a shortfall and must make a margin call requesting the borrower to post additional collateral.","chapter_ref":1},{"id":"cd2q1","question":"What is the key difference between a Standing Settlement Instruction (SSI) and a settlement instruction, as the book defines them?","type":"mc","options":["An SSI is static bank account data held in a firm's static data repository; a settlement instruction is the individual message (currency, amount, value date, SSIs) issued to a nostro for a specific payment","An SSI is used only for securities settlement, while a settlement instruction is used only for cash","A settlement instruction is stored permanently in static data, while an SSI is issued fresh for every payment","There is no real difference — the terms are interchangeable"],"answer":"An SSI is static bank account data held in a firm's static data repository; a settlement instruction is the individual message (currency, amount, value date, SSIs) issued to a nostro for a specific payment","explanation":"The book treats these as distinct: an SSI is bank account information stored in static data ('our SSI' and 'their SSI' per currency/counterparty), while a settlement instruction is the actual per-payment message sent to a nostro, built using that stored SSI data.","chapter_ref":2},{"id":"cd2q2","question":"According to the book, what determines the coupon rate paid by a Floating Rate Note (FRN)?","type":"mc","options":["A defined floating benchmark rate, such as Libor","The issuer's share price performance","A fixed rate set at issuance that never changes","The bond's secondary market trading price"],"answer":"A defined floating benchmark rate, such as Libor","explanation":"FRNs are issued with coupon rates based on a defined floating benchmark rate (e.g. Libor), giving investors exposure to current interest rates rather than a fixed coupon.","chapter_ref":2},{"id":"cd3q1","question":"An investment bank borrows cash via repo from Counterparty X, then re-lends that same cash via repo to Counterparty Y at a slightly higher repo rate, profiting on the spread. What is this practice called?","type":"mc","options":["Running a matched book","Executing a stock-based repo","GC Pooling","Reverse repo arbitrage"],"answer":"Running a matched book","explanation":"The book describes this exact structure — borrowing cash from one counterparty and lending it to another at a slightly higher rate — as operating a repo 'matched book', profiting on the repo interest differential.","chapter_ref":3},{"id":"cd3q2","question":"A firm executes a repo trade specifically because it needs to obtain a particular bond to satisfy a delivery commitment elsewhere, rather than because it needs cash. What is this repo motivation called?","type":"mc","options":["Stock-based repo","Cash-based repo","General collateral repo","Tri-party repo"],"answer":"Stock-based repo","explanation":"The book distinguishes two repo motivations: cash-based repo (the need to borrow cash) and stock-based repo (the need to borrow a specific security, typically to meet a delivery obligation).","chapter_ref":3},{"id":"cd6q1","question":"In a stock-based repo, why is the repo rate typically appreciably lower than the general collateral repo rate?","type":"mc","options":["The cash lender must effectively pay for the privilege of borrowing the specific security, so the cash borrower pays less interest on the cash received","Stock-based repos always carry higher credit risk, so regulators cap the rate","Stock-based repo trades are always shorter in duration than cash-based repos","The GMSLA legally fixes the rate below the general collateral rate"],"answer":"The cash lender must effectively pay for the privilege of borrowing the specific security, so the cash borrower pays less interest on the cash received","explanation":"Because the cash lender in a stock-based repo actually wants the specific bond (not just any eligible collateral), they accept a lower repo rate as the 'price' of obtaining that security — the opposite incentive from general collateral repo.","chapter_ref":6},{"id":"cd6q2","question":"A particular security is in high demand among potential borrowers but short supply. What happens to its repo rate, and what is this situation called?","type":"mc","options":["The repo rate is forced substantially lower than the general collateral rate — this is called a 'special' repo","The repo rate rises sharply above the general collateral rate — this is called a 'premium' repo","The trade is blocked until supply increases","The repo rate is unaffected, since only cash-based repo rates respond to security scarcity"],"answer":"The repo rate is forced substantially lower than the general collateral rate — this is called a 'special' repo","explanation":"High demand and short supply for a specific bond push its stock-based repo rate down (potentially into negative territory) relative to the general collateral rate — the book calls this a 'special' repo.","chapter_ref":6},{"id":"cd7q1","question":"In a tri-party repo, who is responsible for daily mark-to-market, determining exposure, and processing margin calls during the trade's lifetime?","type":"mc","options":["The tri-party agent","The two trading parties directly, as in a bilateral repo","A central counterparty","The cash lender only"],"answer":"The tri-party agent","explanation":"That is the defining feature of a tri-party repo: the tri-party agent takes on the operational tasks — mark-to-market, exposure determination, margin calls, collateral substitution — that the two trading parties would otherwise have to handle themselves in a bilateral repo.","chapter_ref":7},{"id":"cd7q2","question":"What is a 'collateral basket' in the context of a tri-party repo?","type":"mc","options":["A cash lender-defined set of eligible-collateral criteria (e.g. minimum issuer credit rating, haircut levels) that the tri-party agent uses to auto-select collateral","The physical vault where a custodian stores bond certificates","A pool of cash contributed by multiple lenders to a single borrower","A list of currencies acceptable as cash collateral"],"answer":"A cash lender-defined set of eligible-collateral criteria (e.g. minimum issuer credit rating, haircut levels) that the tri-party agent uses to auto-select collateral","explanation":"The cash lender defines the collateral basket's eligibility criteria (such as a minimum credit rating or haircut level); the tri-party agent then uses this to auto-select suitable collateral from the borrower's inventory.","chapter_ref":7},{"id":"cd8q1","question":"Chapter 8 reproduces a complete legal document in full, with the express permission of ICMA and SIFMA. Which document is it?","type":"mc","options":["The Global Master Repurchase Agreement (GMRA) 2011","The Global Master Securities Lending Agreement (GMSLA)","The ISDA Master Agreement","The Credit Support Annex (CSA)"],"answer":"The Global Master Repurchase Agreement (GMRA) 2011","explanation":"Chapter 8 exists specifically to give readers the full text of the GMRA 2011, reproduced with permission of ICMA and SIFMA, tying together the preceding repo chapters (3-7).","chapter_ref":8},{"id":"cd9q1","question":"In securities lending, how does the lending fee earned differ between cash collateral and securities collateral?","type":"mc","options":["Cash collateral: the fee is the spread between the reinvestment rate earned and the rebate rate paid to the borrower. Securities collateral: the fee is a flat cash amount based on an agreed basis-points-per-annum rate on the lent security's market value","Cash collateral always earns a fixed 2% fee; securities collateral earns whatever the borrower's custodian charges","There is no fee on cash collateral, only on securities collateral","Both forms of collateral generate identical fees, calculated the same way"],"answer":"Cash collateral: the fee is the spread between the reinvestment rate earned and the rebate rate paid to the borrower. Securities collateral: the fee is a flat cash amount based on an agreed basis-points-per-annum rate on the lent security's market value","explanation":"With cash collateral, the lender's fee is the differential between what it earns reinvesting the cash and the rebate rate it pays the borrower; with securities collateral, the borrower simply pays a cash fee based on an agreed bppa rate on the lent security's market value.","chapter_ref":9},{"id":"cd9q2","question":"A securities lending trade is executed on an 'open' basis rather than a 'term' basis. What does this mean?","type":"mc","options":["Neither party fixed the closing value date at execution — the lender may 'recall' the securities or the borrower may 'return' them at any time","The trade has no legal agreement in place and can be voided by either party","The closing value date is fixed at trade execution and cannot be changed","Collateral is not required until the trade closes"],"answer":"Neither party fixed the closing value date at execution — the lender may 'recall' the securities or the borrower may 'return' them at any time","explanation":"'Open' trades leave the closing value date undetermined at execution; the lender retains the right to recall the securities and the borrower the right to return them at any time, giving flexibility at the cost of the lending-fee certainty a 'term' loan provides.","chapter_ref":9},{"id":"cd13q1","question":"What does Chapter 13 reproduce in full, and why?","type":"mc","options":["The complete text of the Global Master Securities Lending Agreement (GMSLA) 2010, so readers can relate the SL&B chapters back to the actual legal document","A worked numerical example of a securities lending fee calculation, to accompany Chapter 12","A glossary of every term used in Part 3 of the book","The full text of the GMRA, for comparison against the GMSLA"],"answer":"The complete text of the Global Master Securities Lending Agreement (GMSLA) 2010, so readers can relate the SL&B chapters back to the actual legal document","explanation":"The chapter's intro states it reproduces the GMSLA 2010 in full (with ISLA's permission) so readers can connect the content of Chapters 9-12 back to the actual legal agreement text.","chapter_ref":13},{"id":"cd14q1","question":"On 1st January, Investor A owns 5,000 Company T shares (market price USD 42.00) and enters a futures contract obligating them to sell the 5,000 shares at USD 42.00 in 9 months. At settlement, the market price has fallen to USD 39.00. Compared with having taken no action, what is Investor A's total gain from the futures contract?","type":"calc","options":[],"answer":"USD 15,000.00","explanation":"The futures contract locks in USD 42.00/share versus a market price that fell to USD 39.00 — a benefit of USD 3.00 per share. Across 5,000 shares: 5,000 × USD 3.00 = USD 15,000.00.","chapter_ref":14},{"id":"cd14q2","question":"According to the book, why did new regulation after the 2008 financial crisis require standardised OTC derivatives to be cleared via central counterparties and reported to trade repositories?","type":"mc","options":["Because the lack of mandatory transaction reporting of OTC derivatives left regulators blind to the risks that contributed to the crisis","Because OTC derivatives were found to be entirely fraudulent products that needed banning outright","Because exchange-traded derivatives had become too illiquid to remain useful","Because central counterparties had lobbied regulators to capture more trading volume"],"answer":"Because the lack of mandatory transaction reporting of OTC derivatives left regulators blind to the risks that contributed to the crisis","explanation":"The book states that the lack of mandatory transaction reporting of OTC derivatives meant regulators were blind to the risks that caused problems during and after 2008 — hence the push toward CCP clearing and trade repository reporting.","chapter_ref":14},{"id":"cd15q1","question":"An interest rate swap has a notional principal of EUR 60,000,000.00 and an annual fixed rate of 2.80%. Using the book's stated formula (notional × rate), what is the annual interest amount?","type":"calc","options":[],"answer":"EUR 1,680,000.00","explanation":"Annual interest = notional principal × annual rate = EUR 60,000,000.00 × 2.80% = EUR 1,680,000.00, following the same method the book uses for its EUR 45,000,000.00 at 3.15% example.","chapter_ref":15},{"id":"cd15q2","question":"In the book's Firm A/Firm B OTC derivative example, the replacement cost falls from USD 109 to USD 97 one week after Firm B had already returned some collateral. What happens next, and why?","type":"mc","options":["Firm B issues a margin call to Firm A, requesting return of the rest of its collateral plus some of Firm A's own collateral, because Firm A's exposure has now fallen below the original contract price","Firm A issues a further margin call to Firm B, because Firm A's exposure has increased","No margin call is needed, since the contract is approaching its scheduled maturity date","Firm A is automatically declared in default for failing to maintain the replacement cost"],"answer":"Firm B issues a margin call to Firm A, requesting return of the rest of its collateral plus some of Firm A's own collateral, because Firm A's exposure has now fallen below the original contract price","explanation":"As replacement cost keeps falling (128 → 109 → 97, below the original USD 100), Firm A's exposure keeps shrinking, so Firm B keeps reclaiming collateral — first the remainder held from earlier, then some of Firm A's own collateral, exactly as the book's step-by-step example describes.","chapter_ref":15},{"id":"cd18q1","question":"In its FXS with Bank Q, Firm M buys USD 10,000,000.00 in the spot leg at a rate of EUR 1.00/USD 1.1108. How much EUR does Firm M pay?","type":"calc","options":[],"answer":"EUR 9,002,520.71","explanation":"EUR amount = USD amount ÷ exchange rate = USD 10,000,000.00 ÷ 1.1108 = EUR 9,002,520.71, exactly as captured in the book's FXS trade component table.","chapter_ref":18},{"id":"cd18q2","question":"In a foreign exchange swap, what does the 'forward margin' — the difference between the spot rate and the forward rate — represent?","type":"mc","options":["An adjustment for the interest rate differential between the two currencies over the life of the trade, compensating the party giving up the higher-interest currency","A broker's commission built into both legs of the swap","A credit risk premium charged to the weaker-rated counterparty","An arbitrary spread set independently by each currency's central bank"],"answer":"An adjustment for the interest rate differential between the two currencies over the life of the trade, compensating the party giving up the higher-interest currency","explanation":"The book explains the forward margin relates to the interest rate differential between the two currencies — each party has use of a currency over the trade's life, and the margin compensates the party giving up the higher-interest-bearing currency.","chapter_ref":18},{"id":"cd20q1","question":"According to the book, why does OTC derivative trading rely on formal legal documentation like the ISDA Master Agreement in a way that securities trading generally does not?","type":"mc","options":["OTC derivative trades can run for years or decades, creating long-lived counterparty risk, whereas securities trades typically settle within days","Securities trades are guaranteed by central counterparties while OTC derivative trades never are","OTC derivatives always involve larger notional amounts than securities trades","Regulators mandate legal documentation only for derivatives, never for securities"],"answer":"OTC derivative trades can run for years or decades, creating long-lived counterparty risk, whereas securities trades typically settle within days","explanation":"The book contrasts OTC derivatives' multi-year (sometimes 50-year) lifetimes, which create ongoing counterparty risk, against securities trades that settle within a few days (T+0 to T+2), which is why securities trading historically hasn't needed comparable legal documentation.","chapter_ref":20},{"id":"cd20q2","question":"At the time of writing, what is the standard securities settlement cycle in Europe and the USA, compared with Saudi Arabia's T+0?","type":"mc","options":["T+2","T+1","T+3","T+5"],"answer":"T+2","explanation":"The book states settlement cycles ranging from T+0 (e.g. Saudi Arabia) and T+1 (e.g. US Treasuries and UK Gilts) to T+2 in Europe and the USA generally.","chapter_ref":20},{"id":"cd21q1","question":"Party A and Party B have 5 outstanding OTC derivative trades when Party B defaults. Replacement costs: Trade 1 USD 3,200,000.00 in favour of Party B; Trade 2 USD 650,000.00 in favour of Party A; Trade 3 USD 4,100,000.00 in favour of Party A; Trade 4 USD 3,750,000.00 in favour of Party B; Trade 5 USD 475,000.00 in favour of Party B. Applying close-out netting, what single net payment is required?","type":"calc","options":[],"answer":"USD 2,675,000.00, payable by Party A to Party B","explanation":"Trades in favour of Party A total USD 650,000 + 4,100,000 = 4,750,000. Trades in favour of Party B total USD 3,200,000 + 3,750,000 + 475,000 = 7,425,000. Net payable = 7,425,000 − 4,750,000 = USD 2,675,000.00, owed by Party A to Party B — exactly the book's worked example.","chapter_ref":21},{"id":"cd21q2","question":"Which document, sitting alongside the ISDA Master Agreement and its Schedule, specifically records the collateral-related terms agreed between two OTC derivative counterparties?","type":"mc","options":["The Credit Support Annex (CSA)","The Trade Confirmation","The GMSLA","The Schedule itself"],"answer":"The Credit Support Annex (CSA)","explanation":"The book describes a three-document framework: the ISDA Master Agreement (standard terms), the Schedule (negotiated amendments), and the CSA specifically for collateral-related arrangements.","chapter_ref":21},{"id":"cd23q1","question":"A firm sells USD 5,000,000.00 notional of a single-name credit default swap on Reference Entity XYZ (maturity 20th June 2030), and separately holds an existing purchase of USD 20,000,000.00 notional of the same reference entity and maturity. Using the Reference Entity Database's Pair CLIP to recognise these as the same product, what is the firm's net notional position?","type":"calc","options":[],"answer":"USD 15,000,000.00 net purchased (long)","explanation":"The existing USD 20,000,000.00 purchase offsets the USD 5,000,000.00 sale, leaving a net position of USD 20,000,000.00 − 5,000,000.00 = USD 15,000,000.00 of notional principal still purchased — exactly the book's worked example.","chapter_ref":23},{"id":"cd23q2","question":"An ISIN (International Securities Identification Number) is a 12-character code. What do its components represent?","type":"mc","options":["A 2-character country code, a 9-character national securities identification number, and a 1-character check digit","A 3-character currency code, an 8-character serial number, and a 1-character version flag","A 2-character exchange code, a 9-digit CUSIP, and a 1-character issuer flag","A 4-character issuer code and an 8-digit sequential number"],"answer":"A 2-character country code, a 9-character national securities identification number, and a 1-character check digit","explanation":"The book defines the ISIN's structure exactly this way: 2-character country code of the issuer, 9-character national securities identification number, and a final check digit.","chapter_ref":23},{"id":"cd24q1","question":"For every single OTC derivative trade a firm executes, the book describes two parallel processing streams that run alongside each other for the trade's whole lifetime. What are they?","type":"mc","options":["Trade processing and collateral processing","Front office processing and back office processing","Legal processing and regulatory processing","Settlement processing and reporting processing"],"answer":"Trade processing and collateral processing","explanation":"The book states each OTC derivative trade has two parallel streams — trade processing and collateral processing — each with its own logical, sequential lifecycle, and warns that risk is introduced if a trade doesn't follow the same path through both.","chapter_ref":24},{"id":"cd24q2","question":"This chapter's 5-stage lifecycle diagram (Pre-Trading, Trading, Post-Trading, Throughout Lifetime of Trade, Trade Termination) is then explored in detail across a run of chapters. Which chapters does the book say bracket that detailed 20-chapter walkthrough?","type":"mc","options":["Chapter 25 to Chapter 44","Chapter 14 to Chapter 33","Chapter 24 to Chapter 43","Chapter 1 to Chapter 20"],"answer":"Chapter 25 to Chapter 44","explanation":"The book says: \"The following 20 chapters, beginning with Chapter 25 'Pre-Trading – Legal Documentation', and ending with Chapter 44 'Trade Termination', focus on each major step in the collateral lifecycle.\"","chapter_ref":24},{"id":"cd25q1","question":"A firm's existing legal documentation with a counterparty already covers interest rate swaps and credit default swaps. The firm then executes a variance swap with the same counterparty — a product NOT covered by that documentation. Per the book, what must happen?","type":"mc","options":["A long form confirmation must be issued by one party and signed and returned by the other, since a short form (used only for already-covered products) doesn't apply","The trade is automatically void until the master agreement is fully renegotiated","A short form confirmation suffices, since the counterparty relationship is already established","The trade must be routed through a central counterparty since it falls outside bilateral documentation"],"answer":"A long form confirmation must be issued by one party and signed and returned by the other, since a short form (used only for already-covered products) doesn't apply","explanation":"The book distinguishes: for products already covered by existing documentation, only a short form confirmation (comparing trade details) is needed; for a product not covered — like the variance swap here — a long form confirmation must be issued, signed, and returned.","chapter_ref":25},{"id":"cd25q2","question":"If a firm and its counterparty choose NOT to amend their legal documentation to add a newly-traded, not-yet-covered OTC derivative product, what's the collateral management consequence, per the book?","type":"mc","options":["That trade's exposure can't form part of the normal daily exposure calculations under the existing CSA and must be managed separately","The trade is automatically cancelled by the custodian","The counterparty's credit rating is automatically downgraded internally","The firm must post double margin on all existing trades with that counterparty"],"answer":"That trade's exposure can't form part of the normal daily exposure calculations under the existing CSA and must be managed separately","explanation":"The book states that without amending the CSA to include the new product, associated exposure calculations (and subsequent margin calls) for that trade can't form part of the normal daily process and must be managed separately, according to the long form confirmation's terms.","chapter_ref":25},{"id":"cd26q1","question":"Per the book's list of static data components, setting up which one facilitates \"identification of marking-to-market frequency,\" \"identification of exposures,\" AND \"issuance of margin calls,\" all before the first trade is even executed?","type":"mc","options":["CSA details","The specific OTC derivative product","Cash standing settlement instructions","Securities collateral details"],"answer":"CSA details","explanation":"The book lists CSA details as facilitating identification of marking-to-market frequency, identification of exposures, issuance of margin calls, and identification of eligible collateral — all set up as static data ahead of the first trade.","chapter_ref":26},{"id":"cd26q2","question":"Which single piece of static data, per the book, facilitates \"immediate capture of the trade,\" \"marking-to-market of the OTC derivative trade,\" AND \"identification of OTC derivative trade exposures\"?","type":"mc","options":["The specific OTC derivative product","The trade confirmation/affirmation method","Securities standing settlement instructions","The counterparty's legal entity and location"],"answer":"The specific OTC derivative product","explanation":"The book lists that having the specific OTC derivative product set up as static data (ahead of the first trade) facilitates immediate trade capture, ongoing marking-to-market, and ongoing identification of exposures.","chapter_ref":26},{"id":"cd28q1","question":"A discrepancy is found between a firm's captured trade and its counterparty's version, and it's an \"economic\" term (e.g. notional principal) that differs. Per the book, who alone is empowered to amend it?","type":"mc","options":["The trader","Any member of the Operations Department","The Middle Office","The firm's compliance function"],"answer":"The trader","explanation":"The book states it is \"highly dangerous\" to permit non-trading staff to amend the economic details of a trade — only the trader is empowered to do so, with the amendment then flowing through to the operations processing system.","chapter_ref":28},{"id":"cd28q2","question":"What does the book call the daily internal check that confirms trades entered into a firm's trading system have also been successfully received into its (separate) operations processing system?","type":"mc","options":["FO/BO (front office/back office) reconciliation","Portfolio reconciliation","Trade affirmation","Static data validation"],"answer":"FO/BO (front office/back office) reconciliation","explanation":"The book names this the FO/BO reconciliation — a daily, formal, internal system-to-system check, distinct from portfolio reconciliation (which is performed against the counterparty, not internally).","chapter_ref":28},{"id":"cd29q1","question":"Two sell-side firms trade with each other and exchange \"trade confirmations.\" A sell-side firm then trades with a buy-side client instead, and the process is called \"trade affirmation.\" What, per the book, actually distinguishes the two terms?","type":"mc","options":["Confirmation is between two equal trading parties; affirmation reflects a service-provider relationship where the passive buy-side client simply affirms the sell-side firm's issued trade details","Confirmation is always electronic, affirmation is always on paper","Confirmation applies only to interest rate swaps, affirmation to all other product types","Affirmation is only used after a trade dispute has already occurred"],"answer":"Confirmation is between two equal trading parties; affirmation reflects a service-provider relationship where the passive buy-side client simply affirms the sell-side firm's issued trade details","explanation":"The book explains trade confirmation applies between two equal sell-side firms, while trade affirmation reflects the sell-side's service-provider role to a buy-side client, who is passive and simply affirms the details the sell-side issues.","chapter_ref":29},{"id":"cd29q2","question":"A sell-side firm executes one USD 50,000,000 notional block interest rate swap with a buy-side mutual fund client, who then allocates it as USD 10,000,000 to Fund A, USD 25,000,000 to Fund B, and USD 15,000,000 to Fund C. Per the book, why must the sell-side firm replace the single block trade with three separate contracts rather than just recording the allocation as a note?","type":"mc","options":["Each fund is a distinct legal entity requiring its own contract, and each typically has its own segregated cash accounts for trade and collateral payments","Regulators cap block trade notional principal at USD 20,000,000 per trade","The three funds each negotiated a different fixed rate on the swap","Only individually-booked trades, not block trades, can be marked-to-market"],"answer":"Each fund is a distinct legal entity requiring its own contract, and each typically has its own segregated cash accounts for trade and collateral payments","explanation":"The book explains each fund is a legal entity in its own right requiring an individual contract, and normally has its own segregated cash accounts for payments relating to both trade processing and collateral processing.","chapter_ref":29},{"id":"cd31q1","question":"An OTC derivative trade is exited by being reversed and closed out with a new opposite-direction trade. Per the book, what's the defining difference between calling this an \"unwind\" versus an \"offset\"?","type":"mc","options":["An unwind's closing trade is with the SAME original counterparty; an offset's closing trade is with a DIFFERENT counterparty","An unwind needs regulatory pre-approval, an offset does not","An unwind applies only to interest rate swaps, an offset only to credit default swaps","An unwind is always initiated by the buy-side, an offset always by the sell-side"],"answer":"An unwind's closing trade is with the SAME original counterparty; an offset's closing trade is with a DIFFERENT counterparty","explanation":"The book states an unwind reverses and closes out a trade via a new opposite trade with the same counterparty, while an offset is the same idea but the new opposite trade is with a different counterparty.","chapter_ref":31},{"id":"cd31q2","question":"At the time the book was written, what share of the global BILATERAL COLLATERALISED OTC derivatives trade population did the triResolve reconciliation service reconcile on a regular basis?","type":"mc","options":["More than 90%","More than 50%","More than 25%","100%, since it is mandatory for all firms"],"answer":"More than 90%","explanation":"The book states triResolve reconciles more than 75% of bilateral OTC derivatives globally, and more than 90% of the global bilateral COLLATERALISED OTC derivatives trade population specifically.","chapter_ref":31},{"id":"cd32q1","question":"A securities lender has received CASH collateral (not securities collateral) against a lent security. Per the book's collateral-impact table, what happens if the lent security's market value FALLS?","type":"mc","options":["The lender returns some collateral to the borrower","The lender is due more collateral from the borrower","No collateral movement occurs, since only securities-for-securities lending is marked daily","The loan must be recalled immediately"],"answer":"The lender returns some collateral to the borrower","explanation":"Per the book's Table 32.1: with cash collateral against a lent security, a decrease in the lent security's value means the lender returns some collateral (an increase means the lender is due more).","chapter_ref":32},{"id":"cd32q2","question":"In a cash-based repo, securities have been given as collateral against the cash. Per the book's collateral-impact table, what happens if the collateral security's price DECREASES?","type":"mc","options":["The cash borrower must give more collateral","The cash lender must return some collateral","No action is required since repo collateral isn't marked-to-market daily","The trade automatically converts into a buy/sell-back"],"answer":"The cash borrower must give more collateral","explanation":"Per the book's Table 32.3: in a cash-based repo, only the securities collateral component has price-fluctuation risk, so a decrease in its value means the cash borrower must give more collateral (an increase means the cash lender returns some).","chapter_ref":32},{"id":"cd37q1","question":"Of the four post-trade execution events described for OTC derivatives (novation, unwind, offset, credit events), which one applies only to credit default swap trades and not to other OTC derivative types?","type":"mc","options":["Novation","Unwind","Offset","Credit events"],"answer":"Credit events","explanation":"The book lists novation, unwind and offset as general post-trade execution events for OTC derivatives, but notes credit events apply \"in the case of credit default swaps only.\"","chapter_ref":37},{"id":"cd37q2","question":"According to the book, \"Post-Trade Execution Events\" is an umbrella term for events affecting a trade during which window in its life?","type":"mc","options":["Between trade execution and the trade's scheduled maturity date","Between pre-trading and trade execution","Only during settlement of the opening leg","After the trade's scheduled maturity date has passed"],"answer":"Between trade execution and the trade's scheduled maturity date","explanation":"The book defines the term as referring to \"any event that affects trades, following trade execution and prior to the trade's scheduled maturity date.\"","chapter_ref":37},{"id":"cd38q1","question":"When an OTC derivative trade is novated, who settles the trade's current market value between themselves, and is the remaining party involved?","type":"mc","options":["The novation transferor and novation transferee settle directly; the remaining party is not involved","The remaining party pays the market value to the novation transferee","All three parties split the market value equally","The remaining party's custodian settles on behalf of all three parties"],"answer":"The novation transferor and novation transferee settle directly; the remaining party is not involved","explanation":"The book states: \"the current market value of the trade is settled directly between the novation transferor and novation transferee; the remaining party is not involved in this action and remains unaffected.\"","chapter_ref":38},{"id":"cd38q2","question":"In the book's partial novation example, a fund manager's USD 100,000,000 block trade is allocated as Fund A USD 15,000,000, Fund B USD 30,000,000, Fund C USD 20,000,000, and Fund D USD 35,000,000. If Fund C novates out of its allocation, what total notional remains across Funds A, B and D combined?","type":"calc","options":[],"answer":"USD 80,000,000.00","explanation":"Total block notional (USD 100,000,000) minus Fund C's exiting allocation (USD 20,000,000) = USD 80,000,000, which also equals A + B + D = 15,000,000 + 30,000,000 + 35,000,000.","chapter_ref":38},{"id":"cd39q1","question":"In the book's unwind example, the insurance company was originally the Protection Buyer in a credit default swap. What position does it record in the closing (unwind) trade with the same counterparty?","type":"mc","options":["Protection Seller (to Unwind)","Protection Buyer (a second time)","Novation Transferee","Reference Entity"],"answer":"Protection Seller (to Unwind)","explanation":"Unwinding requires taking an economically equal and opposite position to the original trade — since the insurance company was originally Protection Buyer, its unwind trade is recorded as \"Protection Seller (to Unwind),\" per Table 39.2.","chapter_ref":39},{"id":"cd39q2","question":"What is the key difference in ongoing counterparty exposure between an unwind and an offset?","type":"mc","options":["An unwind leaves zero ongoing exposure with either party; an offset leaves ongoing exposure with two counterparties","An unwind leaves exposure with two counterparties; an offset leaves zero exposure","Both leave zero ongoing exposure, but only offset requires a new counterparty","Both leave ongoing exposure with two counterparties, but only unwind requires ISDA protocol adherence"],"answer":"An unwind leaves zero ongoing exposure with either party; an offset leaves ongoing exposure with two counterparties","explanation":"An unwind closes the trade entirely with no outstanding exposure, whereas an offset creates an opposing trade with a *different* counterparty, leaving the firm with ongoing exposure to both the original and the new counterparty.","chapter_ref":39},{"id":"cd40q1","question":"In an offset, why does the exiting firm end up with exposure to two counterparties instead of zero exposure?","type":"mc","options":["Because the opposing trade is executed with a different counterparty than the original trade, rather than closing the original trade itself","Because offsets always split the original notional in half between the two counterparties","Because the original counterparty refuses to update its books & records","Because offset trades require both the original and a backup ISDA Master Agreement to remain open"],"answer":"Because the opposing trade is executed with a different counterparty than the original trade, rather than closing the original trade itself","explanation":"An offset neutralises market risk by executing an equal and opposite trade with a *different* counterparty, so the original trade with Party B stays open alongside the new trade with Party C — unlike an unwind, which closes the original trade directly with the same counterparty.","chapter_ref":40},{"id":"cd40q2","question":"In the book's partial offset example, a firm originally buys protection for a notional of EUR 60,000,000, then partially offsets by selling protection for a notional of EUR 50,000,000. What is the firm's remaining net (unhedged) notional exposure?","type":"calc","options":[],"answer":"EUR 10,000,000.00","explanation":"EUR 60,000,000 (original bought protection) minus EUR 50,000,000 (offsetting sold protection) leaves EUR 10,000,000 of the original notional still unhedged.","chapter_ref":40},{"id":"cd41q1","question":"Introduced via a 2009 ISDA protocol, which body has binding authority across all signed-up parties to determine whether a qualifying credit event has actually occurred?","type":"mc","options":["A Regional Determination Committee (RDC)","The Trade Repository","The Central Counterparty's Default Management Committee","The bond's Registrar"],"answer":"A Regional Determination Committee (RDC)","explanation":"The book states that during 2009 an ISDA protocol introduced regional determination committees (RDCs), empowered to ascertain whether a credit event occurred, with their decision binding on all parties that signed up to the protocol.","chapter_ref":41},{"id":"cd41q2","question":"How do credit events differ from novation, unwind, and offset in terms of what triggers them?","type":"mc","options":["Credit events are triggered by the default of a third party (e.g. the bond issuer/reference entity), not by either trading party choosing to exit","Credit events are triggered only when both trading parties mutually agree to exit","Credit events are triggered by a change in interest rates, not by any party's action","Credit events and novation are triggered identically, both requiring third-party consent"],"answer":"Credit events are triggered by the default of a third party (e.g. the bond issuer/reference entity), not by either trading party choosing to exit","explanation":"The book contrasts them directly: \"Events such as novation, unwind and offset are triggered by one party to a contract wishing to exit that contract. Conversely, credit events are triggered by...the bankruptcy or default of an obligor...rather than by parties to the CDS contract.\"","chapter_ref":41},{"id":"cd42q1","question":"In the book's collateral substitution example, why does Party A need to request substitution of the bond currently held by Party B as collateral?","type":"mc","options":["Party A has sold that bond to a third party and needs it back to make delivery","The bond has matured and must be replaced","Party B has requested a higher-rated bond under the CSA","The bond's coupon payment date has passed"],"answer":"Party A has sold that bond to a third party and needs it back to make delivery","explanation":"Party A's bond trader sold the USD 10,000,000 bonds on a T+2 basis, but the bonds were being held as collateral by Party B rather than by Party A's custodian, forcing Party A to request their return via substitution with replacement collateral.","chapter_ref":42},{"id":"cd42q2","question":"The book gives an example of delivering replacement bond collateral as three separate pieces: GBP 2,000,000, GBP 2,200,000, and GBP 1,000,000. What is the total nominal value of this three-bond replacement package?","type":"calc","options":[],"answer":"GBP 5,200,000.00","explanation":"2,000,000 + 2,200,000 + 1,000,000 = GBP 5,200,000, illustrating that replacement bond collateral can be delivered as multiple pieces provided the total collateral value covers the exposure.","chapter_ref":42},{"id":"cd44q1","question":"Once an OTC derivative trade passes its scheduled maturity date and counterparty exposure ceases, what must happen to any cash or bond collateral that was given or taken?","type":"mc","options":["It must be returned to the collateral giver","It is automatically forfeited to the collateral taker","It is transferred to the Central Counterparty for safekeeping","It remains with the collateral taker until the next portfolio reconciliation"],"answer":"It must be returned to the collateral giver","explanation":"The book states that once counterparty exposure has ceased at maturity, \"any cash or bond collateral given or taken must be returned to the collateral giver.\"","chapter_ref":44},{"id":"cd44q2","question":"According to the book, which of these is a reason an OTC derivative trade might terminate before reaching its scheduled maturity date?","type":"mc","options":["Trade/portfolio netting (trade compression)","A change in the trade's governing time zone","An unrelated audit by the firm's external accountants","A change to the counterparty's registered office address"],"answer":"Trade/portfolio netting (trade compression)","explanation":"The book lists trade/portfolio netting (compression), novation, unwind and offset as reasons a trade may fail to reach its scheduled maturity date, with credit events causing early termination specifically for CDS trades.","chapter_ref":44}];
const LIFECYCLES = {"repo":{"source":"Chapter 5","steps":[{"step":1,"title":"Pre-Trading","detail":"Before any trade, the GMRA (and Annex) must be signed with the counterparty, SSIs exchanged, and static data set up — counterparty details, eligible collateral, exposure-calculation frequency, pricing source, MTA, and margin-call deadlines."},{"step":2,"title":"Trade Execution","detail":"The cash borrower determines its borrowing need, selects specific bond collateral from inventory, and executes the repo with a counterparty — trade date, both value dates, price, repo rate, and haircut are all agreed at this point."},{"step":3,"title":"Pre-Settlement","detail":"Immediately after execution: trade capture into books & records, enrichment with accrued-interest and SSI data, issuance of a trade confirmation to the counterparty (who checks it against their own records), then submission of a matching DvP settlement instruction to the CSD for the opening leg."},{"step":4,"title":"Settlement of Opening Leg","detail":"At the CSD, cash and bonds exchange simultaneously (DvP) once instructions are matched, value date is reached, and both sides have what they need to deliver. The firm receives an advice of settlement, updates its books & records, and reconciles both its securities and cash positions against the CSD's statements."},{"step":5,"title":"Throughout Lifetime of Trade","detail":"Daily, for as long as the trade is open: mark-to-market the collateral, run portfolio reconciliation with the counterparty, calculate gross exposure (collateral value vs. cash value including accrued repo interest), check it against any threshold/MTA, and — if a valid exposure exists — issue or receive, agree, and settle a margin call, then update books & records."},{"step":6,"title":"Settlement of Closing Leg","detail":"A closing-leg DvP settlement instruction is submitted a couple of days ahead of the closing value date. On that date, the borrowed cash plus accrued repo interest is exchanged back for the original (or equivalent) bonds; any cash or securities still held from margin calls during the trade's life are separately returned to their original owner, at which point the trade carries no further counterparty exposure."}],"name":"The Repo Trade Lifecycle"},"slb":{"source":"Chapter 11","steps":[{"step":1,"title":"Pre-Trading","detail":"Before any trade, the GMSLA and Schedule are signed (base currency, eligible collateral currencies, exposure-calc frequency, threshold, MTA, margin-call deadline), SSIs are exchanged, and these terms are loaded into both firms' static data / collateral systems."},{"step":2,"title":"Trade Execution","detail":"The lender identifies and communicates which securities it has available to lend; the borrower identifies a borrowing need (e.g. a delivery commitment) and matches it against a lender's available list; the trade — security, quantity, margin percentage, collateral type, rebate rate — is executed bilaterally."},{"step":3,"title":"Pre-Settlement","detail":"Both sides capture the trade and calculate the required collateral value (market value of the lent security plus margin). The borrower issues a trade confirmation the lender checks against its own records, and both sides submit matching DvP settlement instructions for the opening leg."},{"step":4,"title":"Settlement of Opening Leg","detail":"At the CSD, the security and cash collateral exchange simultaneously (DvP). Both parties get an advice of settlement, update books & records, reconcile, and update their collateral balance record. The borrower on-delivers the security to solve whatever need drove the borrow; the lender typically reinvests the cash collateral it received."},{"step":5,"title":"Throughout Lifetime of Trade","detail":"Daily: mark-to-market the lent security, recalculate required collateral value against collateral currently held, check the difference against threshold/MTA, and — where a valid exposure exists — issue/receive, validate, and settle a margin call (adjusting collateral in whichever direction is needed), then update books & records."},{"step":6,"title":"Recall / Return of Securities","detail":"Either party can end an open trade at will: the lender 'recalls' securities it needs back, or the borrower 'returns' securities it no longer needs. The two sides then agree an actual closing value date (converting the trade from 'open' to a fixed date) and update their records accordingly."},{"step":7,"title":"Settlement of Closing Leg","detail":"On the agreed closing date, the security and the full current collateral balance exchange simultaneously (DvP) in the reverse direction from the opening leg — security back to the lender, collateral back to the borrower. Both sides reconcile and confirm the trade is settled, aside from outstanding fees."},{"step":8,"title":"Settlement of Fees & Rebates","detail":"Separately and after the trade has closed, the accrued daily rebate (on cash-collateralized loans) or lending fee (on securities-collateralized loans) is calculated for each calendar month the trade was live, invoiced by the borrower, checked by the lender, and paid by the 10th of the following month."}],"name":"The SL&B Trade Lifecycle"},"otc":{"source":"Chapters 24–44","steps":[{"step":1,"title":"Lifecycle overview","detail":"Introduces the five phases of the OTC derivative collateral lifecycle — Pre-Trading, Trading, Post-Trading, Throughout Lifetime of Trade, and Trade Termination — that the next 20 chapters walk through in order.","chapter":24},{"step":2,"title":"Pre-Trading: Legal Documentation","detail":"Confirms the legal framework (Master Agreement, Schedule, CSA) is signed and covers the specific product being traded before execution — and flags what happens (a long form confirmation, separate exposure tracking) when it doesn't.","chapter":25},{"step":3,"title":"Pre-Trading: Static Data","detail":"Ensures every piece of reference data (product, counterparty, CSA terms, SSIs, securities details) needed to process a trade automatically is set up before the first trade executes, not scrambled together afterward.","chapter":26},{"step":4,"title":"Trading: Trade Execution","detail":"The trader buys/sells (or lends/borrows) the product — the single point of highest human-error risk in the whole lifecycle, since OTC trades are negotiated bilaterally rather than matched by an exchange.","chapter":27},{"step":5,"title":"Post-Trading: Trade Capture","detail":"The trade's basic details are recorded into the firm's books & records immediately after execution — the one-off step that triggers confirmation, mark-to-market, and collateral processing downstream.","chapter":28},{"step":6,"title":"Post-Trading: Trade Confirmation/Affirmation","detail":"Both parties formally agree the trade's details after capture — the essential check that catches capture errors before they propagate into mismatched mark-to-market and exposure figures.","chapter":29},{"step":7,"title":"Post-Trading: Trade/Portfolio Netting","detail":"Offsetting trades with the same counterparty are collapsed into a single net position (netting) or legally terminated and replaced by one (compression), cutting the number of trades — and the capital and operational cost — carried forward.","chapter":30},{"step":8,"title":"Throughout Lifetime of Trade: Portfolio Reconciliation","detail":"Before calculating exposure, both parties confirm they agree on the full population of currently-open trades — a pre-emptive check that prevents margin call disputes from surfacing at the worst possible time, right at the deadline.","chapter":31},{"step":9,"title":"Throughout Lifetime of Trade: Marking-to-Market","detail":"Current market prices are applied to trades and any existing collateral — the essential input exposure calculation depends on, and a frequent source of disputes when price sources or timing diverge between counterparties.","chapter":32},{"step":10,"title":"Throughout Lifetime of Trade: Exposure Calculation","detail":"Mark-to-market values are combined with CSA-specific adjustments — independent amount, threshold, existing collateral, MTA, rounding, in that order — to produce a definitive exposure amount and direction, feeding directly into the next two chapters on margin calls.","chapter":33},{"step":11,"title":"Throughout Lifetime of Trade: Receiving Margin Calls","detail":"When the counterparty is exposed, the firm verifies the claimed amount, selects and values eligible collateral (favoring lower-rated bonds it can still legally post), and delivers it by the value date — with a formal dispute path for genuine disagreements.","chapter":34},{"step":12,"title":"Throughout Lifetime of Trade: Issuing Margin Calls","detail":"When the firm itself is exposed, it issues a margin call notification by the CSA deadline, then verifies whatever collateral the counterparty proposes in response before accepting it — the mirror image of the previous chapter, from the other side of the transaction.","chapter":35},{"step":13,"title":"Throughout Lifetime of Trade: Holding Collateral","detail":"How collateral must be held — and whether the taker may legally reuse or rehypothecate it — depends entirely on the CSA's legal basis (title transfer vs. security interest), with real consequences for both parties if the taker becomes insolvent.","chapter":36},{"step":14,"title":"Throughout Lifetime of Trade: Post-Trade Execution Events (Introduction)","detail":"Introduces the four ways a live trade can be altered or exited before its scheduled maturity — novation, unwind, offset, and credit events — each covered in its own following chapter.","chapter":37},{"step":15,"title":"Post-Trade Execution Events: Novation","detail":"One party exits a live trade and a third party steps in on identical terms — requires the remaining party's consent, and can silently change that party's collateral protection (threshold, eligible currency) even when credit risk is unaffected.","chapter":38},{"step":16,"title":"Post-Trade Execution Events: Unwind","detail":"Both parties mutually agree to close a trade via an exactly offsetting new trade with each other — the cleanest exit, leaving zero ongoing exposure, but only available if the original counterparty is willing.","chapter":39},{"step":17,"title":"Post-Trade Execution Events: Offset","detail":"When the original counterparty won't agree to unwind, the firm neutralizes its market risk by executing an opposite trade with a different counterparty instead — flat on risk, but now managing collateral on two relationships instead of zero.","chapter":40},{"step":18,"title":"Post-Trade Execution Events: Credit Events","detail":"A qualifying default by the reference entity (not either trading party) triggers automatic settlement and immediate termination of a CDS contract — settled once via an RDC-determined recovery percentage, ending all ongoing exposure between the two parties.","chapter":41},{"step":19,"title":"Throughout Lifetime of Trade: Collateral Substitution","detail":"The collateral giver swaps posted collateral for different eligible collateral — usually because it needs the original bond back for an unrelated transaction — without changing the exposure being covered; a time-sensitive process with real settlement-timing risk.","chapter":42},{"step":20,"title":"Throughout Lifetime of Trade: Income & Corporate Action Events","detail":"Coupon payments and corporate actions on posted bond collateral must flow back to the beneficial owner (the collateral giver) even though the CSD credits the legal owner (the collateral taker) — with the taker's own onward obligations depending on how it reused the bond.","chapter":43},{"step":21,"title":"Trade Termination","detail":"The trade reaches its scheduled maturity date (having survived to term without novation, unwind, offset, or a credit event) — all collateral is returned, exposure ceases, and the trade must be marked closed internally to avoid phantom future exposure calculations. The final stage of the 20-chapter lifecycle.","chapter":44}],"name":"The OTC Derivative Collateral Lifecycle"}};

function todayStamp(d=new Date()){ return d.toISOString().slice(0,10); }

function loadState(){
  let raw;
  try{ raw = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); }catch(e){ raw = null; }
  if(!raw) raw = {};
  if(!raw.cards) raw.cards = {};
  if(!raw.sessions) raw.sessions = [];
  if(!raw.days) raw.days = {};
  if(!raw.selectedCats) raw.selectedCats = Object.keys(CATS);
  if(!raw.streak) raw.streak = {count:0,last:null};
  if(!raw.readChapters) raw.readChapters = [];
  if(!raw.readFoundations) raw.readFoundations = [];
  if(!raw.quiz) raw.quiz = {sessions:[], correct:0, total:0};
  if(!raw.quiz.calib) raw.quiz.calib = {confRight:0, confWrong:0, unsureRight:0, unsureWrong:0};
  if(!raw.drills) raw.drills = {sessions:[], correct:0, total:0};
  if(!raw.theme) raw.theme = "system";
  return raw;
}

function cardState(id){
  let s = STATE.cards[id];
  if(!s){ s = {box:0, due: Date.now(), seen:0, correct:0, lastGrade:null}; STATE.cards[id]=s; }
  return s;
}

function isDue(id){
  const s = STATE.cards[id];
  if(!s) return true; // never seen = new/due
  return s.due <= Date.now();
}
function isNew(id){ const s = STATE.cards[id]; return !s || s.seen===0; }

function gradeCard(id, grade){
  const s = cardState(id);
  s.seen += 1;
  const correct = grade !== "again";
  if(correct) s.correct += 1;
  if(grade === "again") s.box = 0;
  else if(grade === "hard") s.box = Math.max(0, s.box - 1);
  else if(grade === "good") s.box = Math.min(BOXES-1, s.box + 1);
  else if(grade === "easy") s.box = Math.min(BOXES-1, s.box + 2);
  s.lastGrade = grade;
  s.due = Date.now() + INTERVAL_DAYS[s.box]*DAY + (grade==="again" ? 5*60000 : 0);
  const day = todayStamp();
  STATE.days[day] = (STATE.days[day]||0) + 1;
  bumpStreak(day);
  saveState();
}

function bumpStreak(day){
  const last = STATE.streak.last;
  if(last === day) return;
  const yesterday = todayStamp(new Date(Date.now()-DAY));
  if(last === yesterday || last === null){
    STATE.streak.count = (STATE.streak.count||0) + (last===null?1:1);
  } else {
    STATE.streak.count = 1;
  }
  STATE.streak.last = day;
}

function recordSession(correct, total){
  STATE.sessions.push({date:Date.now(), correct, total});
  if(STATE.sessions.length > 100) STATE.sessions.shift();
  saveState();
}

function isChapterRead(num){ return STATE.readChapters.includes(num); }
function toggleChapterRead(num){

  if(i>=0) STATE.readChapters.splice(i,1); else STATE.readChapters.push(num);
  saveState();
}
function readCountInGroup(g){ return chaptersInGroup(g).filter(c=>isChapterRead(c.num)).length; }

function recordQuizAnswer(correct, confidence){
  STATE.quiz.total += 1;
  if(correct) STATE.quiz.correct += 1;
  if(confidence !== undefined){
    const key = confidence ? (correct?"confRight":"confWrong") : (correct?"unsureRight":"unsureWrong");
    STATE.quiz.calib[key] += 1;
  }
  saveState();
}

  if(STATE.drills.sessions.length > 100) STATE.drills.sessions.shift();

}

}

function masteryStars(cardsInCat){
  const seen = cardsInCat.filter(c => STATE.cards[c.id] && STATE.cards[c.id].seen>0);
  if(seen.length===0) return 0;
  const avgBox = seen.reduce((a,c)=>a+STATE.cards[c.id].box,0)/seen.length;
  return Math.round((avgBox/(BOXES-1))*5);
}

function recentAccuracy(n){
  const s = STATE.sessions.slice(-n);
  if(s.length===0) return null;
  const c = s.reduce((a,x)=>a+x.correct,0), t = s.reduce((a,x)=>a+x.total,0);
  return t===0 ? null : c/t;
}

function cardsForCats(catKeys){ return CARDS.filter(c => catKeys.includes(c.cat)); }

function relatedTerms(card){
  const lowDef = card.def.toLowerCase();
  const found = [];
  for(const t of TERM_INDEX){
    if(t.id===card.id) continue;
    if(t.lower.length < 5) continue;
    if(lowDef.includes(t.lower)){
      found.push(t.term);
      if(found.length>=4) break;
    }
  }
  return found;
}

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function highlightRelated(defText, related){
  let html = escapeHtml(defText);
  const sorted = [...related].sort((a,b)=>b.length-a.length);
  for(const term of sorted){
    const esc = escapeHtml(term).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    html = html.replace(new RegExp("\\b"+esc+"\\b"), "<b>"+escapeHtml(term)+"</b>");
  }
  return html;
}

function shortTitle(full){
  const parts = full.split("–").map(s=>s.trim()).filter(Boolean);
  if(parts.length <= 1) return full;
  if(parts.length === 2) return parts[1];
  return parts.slice(-2).join(" – ");
}

function viewChapters(){

  const totalRead = STATE.readChapters.length;
  const fRead = STATE.readFoundations.length;
  const fPct = fRead / FOUNDATIONS.length;
  const fR = 15, fC = 2*Math.PI*fR;
  const fOff = fC*(1-fPct);
  const foundationsGroup = `
    <div class="part-item" data-part="f101">
      <button class="part-head" data-toggle-part="f101">
        <span style="flex:1;">
          <div class="part-title">🎓 Finance 101 — start here</div>

            <circle class="bg" cx="18" cy="18" r="${fR}"></circle>

          </svg>
        </span>
        <span class="part-chev">▸</span>

    </div>`;
  const groups = PART_GROUPS.map(g=>{

    const pct = chs.length ? read/chs.length : 0;

/* ---------- Lifecycle player ---------- */
function startLifecycle(key){
  LIFECYCLE = {key, idx:0, mode:"read", drill:null};
  nav("chapters");
  render();
}

function initLcDrill(){
  const steps = LIFECYCLES[LIFECYCLE.key].steps;
  const pool = steps.map((_,i)=>i);
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  LIFECYCLE.drill = {pool, picked:[], checked:false};
}

function renderLcDrill(){
  const steps = LIFECYCLES[LIFECYCLE.key].steps;
  const d = LIFECYCLE.drill;
  const poolHtml = d.pool.map(i=>`<button class="lc-pool-item" data-lc-pick="${i}">${escapeHtml(steps[i].title||steps[i].label)}</button>`).join("");
  const pickedHtml = d.picked.map((stepIdx,pos)=>{
    const cls = d.checked ? (stepIdx===pos ? "is-correct" : "is-wrong") : "";
    return `<div class="lc-picked-item ${cls}"><span class="num mono">${pos+1}</span>${escapeHtml(steps[stepIdx].title||steps[stepIdx].label)}</div>`;
  }).join("");
  const allPicked = d.picked.length === steps.length;

  let actionHtml = "";
  if(d.checked){
    const correctCount = d.picked.filter((s,i)=>s===i).length;
    actionHtml = `<div class="lc-drill-score">${correctCount} / ${steps.length} in the right order</div>
      <button class="hero-btn" id="lc-drill-retry">Shuffle & try again →</button>`;
  } else if(allPicked){
    actionHtml = `<button class="hero-btn" id="lc-drill-check">Check order →</button>`;
  }

  return `
  ${d.pool.length ? `<div class="lc-drill-label">Tap the steps in order</div><div class="lc-pool">${poolHtml}</div>` : ""}
  ${d.picked.length ? `<div class="lc-drill-label">Your order</div><div class="lc-picked">${pickedHtml}</div>` : ""}
  ${actionHtml}`;
}

function viewLifecyclePlayer(){
  const lc = LIFECYCLES[LIFECYCLE.key];
  const header = `
  <div class="lc-head">
    <div class="lc-name">${escapeHtml(lc.name)}</div>
    <button class="lc-close" id="lc-close">✕ Exit</button>
  </div>
  <div class="lc-tabs">
    <button class="lc-tab ${LIFECYCLE.mode==="read"?"is-active":""}" data-lc-mode="read">Read</button>
    <button class="lc-tab ${LIFECYCLE.mode==="drill"?"is-active":""}" data-lc-mode="drill">Practice order</button>
  </div>`;

  if(LIFECYCLE.mode === "drill"){
    if(!LIFECYCLE.drill) initLcDrill();
    return header + renderLcDrill();
  }

  const steps = lc.steps;
  const idx = LIFECYCLE.idx;
  const step = steps[idx];
  const dots = steps.map((s,i)=>`<span class="lc-dot ${i<idx?'done':(i===idx?'current':'')}"></span>`).join("");
  const chRef = step.chapter;
  const chBtn = chRef ? `<button class="lc-chapter-link" data-open-chapter="${chRef}">Chapter ${chRef} →</button>` : "";
  const title = step.title || step.label;
  return header + `
  <div class="progresstext" style="margin-bottom:8px;"><b>${idx+1}</b> / ${steps.length}</div>
  <div class="lc-track">${dots}</div>
  <div class="lc-card">

/* ---------- Quiz ---------- */
let QUIZ_SESSION = null;
let QUIZ_FILTER = PART_GROUPS.map(g=>g.key);

function quizPool(){
  const ranges = QUIZ_FILTER.map(k=>PART_GROUPS.find(g=>g.key===k).range);
  return QUIZ.filter(q => ranges.some(r => q.chapter_ref>=r[0] && q.chapter_ref<=r[1]));
}

function startQuiz(){
  let pool = quizPool().slice();
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const n = Math.min(8, pool.length);
  QUIZ_SESSION = {queue: pool.slice(0,n).map(q=>q.id), idx:0, revealed:false, answered:false, selected:null, correct:0, total:0};
  render();
}

let QUIZ_MODE = "quiz";
function viewQuiz(){
  const tabsHtml = `

  if(!QUIZ_SESSION || QUIZ_SESSION.idx >= (QUIZ_SESSION.queue?QUIZ_SESSION.queue.length:0)){
    if(QUIZ_SESSION && QUIZ_SESSION.total>0 && QUIZ_SESSION.idx>=QUIZ_SESSION.queue.length){

      QUIZ_SESSION = null;
      recordQuizSession(s.correct, s.total);
      return `

        <div class="eyebrow">Quiz complete</div>
