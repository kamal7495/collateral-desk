r counterparty were to fail — go bankrupt, run out of cash — at any point between Monday and Wednesday, you'd be exposed to not receiving what you're owed. This two-day gap is a small, everyday example of exactly the counterparty risk this entire app is about managing at a much larger scale."}],"key_terms":["Trade Execution","Central Counterparty","Central Securities Depository","Book Entry"]},{"num":11,"title":"Corporate Actions & Income","digest":["A Corporate Action is anything a company does that affects its securities or their holders — paying a dividend, splitting shares, being acquired, issuing new shares, and dozens of other events.","Corporate actions split into two types: Mandatory (happens to every holder automatically, no choice involved — like a cash dividend) and Optional (you must actively elect what you want — like choosing cash vs. new shares).","Bonds pay income too — it's called a Coupon rather than a dividend, but the operational challenge is identical: someone has to track exactly who owned the security on the relevant date and make sure the right payment reaches the right holder.","This matters enormously for collateral management specifically: if you're holding someone else's bond or shares as collateral, you generally owe them any income that arrives on it — you're compensated by holding the collateral itself, not by keeping income that isn't yours.","Missing or mishandling a corporate action isn't a small paperwork slip — it can mean paying the wrong party the wrong amount for a right that's often irreversible once acted on."],"examples":[{"title":"Who actually gets the dividend?","body":"A company declares a $2/share dividend, payable to whoever owns the shares on a specific record date. If you'd lent your shares out (via securities lending) over that date, your borrower — not you — is recorded as the legal owner, but the economic right to that $2 is still yours; the borrower owes you a \"manufactured dividend\" to put you back in the same position as if you'd never lent the shares at all."}],"key_terms":["Corporate Action","Mandatory Corporate Action","Optional Corporate Action","Coupon","Cash Dividend"]},{"num":12,"title":"Risk, Ratings & Regulation","digest":["Counterparty Risk is the risk that whoever is on the other side of your trade fails to do what they promised — pay you, deliver what they owe, or repay a loan. Every concept in the book this app covers exists to manage some version of this one risk.","A Credit Rating (from agencies like Moody's, S&P, Fitch) is an independent opinion on how likely an issuer is to fail to pay what it owes — higher-rated issuers pay lower interest, because lenders demand less compensation for lower perceived risk.","Default is what happens when an issuer or counterparty actually fails to pay — a company might miss a coupon payment, or fail to repay a loan when due. It's the single event that risk management, collateral, and credit ratings are all trying to anticipate and cushion against.","Systemic Risk is what happens when one firm's default doesn't stay contained — it cascades and threatens other, otherwise-healthy firms and the wider financial system. The 2008 financial crisis was, at its core, a systemic risk event that started as a series of individual defaults.","Post-2008, regulators worldwide rewrote large parts of the rulebook specifically to make counterparty risk more visible and better collateralized — mandatory central clearing, mandatory margin on OTC derivatives, and far more reporting all trace back to this one crisis, and it's a major recurring theme in this app's later chapters."],"examples":[{"title":"Why ratings change the price","body":"Two companies both want to borrow $100,000,000 for 5 years by issuing bonds. Company A is rated AA (very safe) and can borrow at 3%. Company B is rated BB (speculative) and has to offer 7% to attract the same lenders — the extra 4% is the market's price for Company B's higher chance of default."}],"key_terms":["Counterparty Risk","Credit Rating","Default","Systemic Risk"]},{"num":13,"title":"Why Collateral Exists","digest":["Step back and the whole picture connects: markets exist to connect lenders/owners with borrowers/companies; bonds and equities are the two basic ways that connection gets formalized; derivatives add a third way to gain exposure without owning anything; a cast of specialized firms makes all of it function; every trade runs through the same execution-to-settlement pipeline; income has to be tracked and passed through correctly; and underneath all of it sits one single risk — counterparty risk — that ratings, regulation and risk management exist to address.","Collateral is simply the most direct tool for managing that underlying counterparty risk: instead of just trusting your counterparty to pay what it owes, you hold an asset from them — cash or a bond — that you can sell if they don't perform.","The book this app is built from covers three specific situations where this becomes essential: Repo and Securities Lending (short-term, asset-for-cash exchanges where the risk is obvious and immediate), and OTC Derivatives (long-term contracts where the risk isn't even known upfront — it emerges and flips between both parties as markets move).","Everything from here on — haircuts, margin calls, the GMRA, the ISDA CSA, novation, portfolio reconciliation — is really just increasingly detailed machinery built on top of the ideas in this Foundations track. You now have the vocabulary to start Chapter 1 of the real book without stumbling."],"examples":[{"title":"Putting it all together","body":"A hedge fund enters into an interest rate swap with an investment bank. As rates move, the swap gains value for one side and loses it for the other — counterparty risk, now live. To protect itself, the exposed party asks for collateral — cash or bonds — delivered via the same settlement plumbing as any other trade. That single request is a margin call, and everything from Chapter 1 onward is about how it actually gets calculated, disputed, and settled correctly."}],"key_terms":["Repo","Securities Lending","OTC Derivative"]}];
const QUIZ = [{"id":"f1q1","question":"Firm B delivers bond collateral with a total market value (clean price + accrued interest) of USD 11,221,191.67 against a USD 10,000,000.00 cash loan, and the CSA/GMRA specifies a 10% haircut. What is the bond's collateral value, and is the exposure adequately covered?","type":"calc","options":[],"answer":"USD 10,099,072.50 — yes, still covers the USD 10,000,000 exposure","explanation":"Collateral value = market value × (1 − haircut) = 11,221,191.67 × 0.90 = USD 10,099,072.50, which exceeds the USD 10,000,000 exposure, so the position is adequately (in fact deliberately over-) collateralized.","chapter_ref":2},{"id":"f1q2","question":"A firm borrows GBP 27,500,000.00 via repo at 2.45% for a period of 70 actual days. Using the GBP divisor of 365, what repo interest is owed at close?","type":"calc","options":["GBP 129,212.33","GBP 118,750.00","GBP 47,250.00","GBP 1,883,750.00"],"answer":"GBP 129,212.33","explanation":"Repo interest = cash amount × rate / divisor × days = 27,500,000 × 2.45% / 365 × 70 = GBP 129,212.33.","chapter_ref":4},{"id":"f1q3","question":"On a given mark-to-market date, Firm A's gross exposure to its repo counterparty is USD 118,563.50, but the CSA-equivalent minimum transfer amount agreed for this GMRA relationship is USD 150,000.00. What happens?","type":"mc","options":["Firm A issues a margin call for the full 118,563.50","No margin call is made — the exposure stays uncollateralized until it exceeds the MTA on a later date","The counterparty automatically rounds the call up to 150,000.00","The trade is put into default"],"answer":"No margin call is made — the exposure stays uncollateralized until it exceeds the MTA on a later date","explanation":"A minimum transfer amount is a threshold below which no collateral movement occurs at all, purely to avoid the cost/effort of transferring trivial amounts — the exposure simply carries forward until a later mark-to-market pushes it above the MTA.","chapter_ref":5},{"id":"f1q4","question":"What is the key operational difference between a classic repo and an (undocumented) buy/sell-back, given that both can settle to the identical final cash amount?","type":"mc","options":["A classic repo is one two-legged trade with an ongoing link (daily mark-to-market, margin calls); a BSB is two legally independent trades with no such link","A BSB always uses a lower repo rate","A classic repo can only be used for government bonds","A BSB cannot involve haircuts"],"answer":"A classic repo is one two-legged trade with an ongoing link (daily mark-to-market, margin calls); a BSB is two legally independent trades with no such link","explanation":"The legs of a classic repo stay connected for the trade's life, which is exactly what triggers daily revaluation and margin calls; a BSB's two legs are priced and traded independently from the start, so there's no open position to revalue and no margin calls to make.","chapter_ref":7},{"id":"f1q5","question":"In a stock-based repo, why does the cash lender typically accept a LOWER repo rate than it would in a general-collateral repo?","type":"mc","options":["Because it actually wants the specific bond being offered as collateral (e.g. to cover a short sale), and is willing to pay for that access via a lower return on its cash","Because stock-based repos are always shorter in duration","Because stock-based repos carry no counterparty risk","Because the GMRA mandates a lower rate for stock-based trades"],"answer":"Because it actually wants the specific bond being offered as collateral (e.g. to cover a short sale), and is willing to pay for that access via a lower return on its cash","explanation":"In a stock-based repo the cash lender's true motivation is borrowing a specific security, not just earning secured interest — so it accepts less interest income in exchange for getting the bond it needs, the same 'special collateral' dynamic as Chapter 4.","chapter_ref":6},{"id":"f1q6","question":"Under the GMRA's title-transfer structure, once a repo's opening leg has settled, who has the legal right to sell, re-repo, or lend on the bond collateral?","type":"mc","options":["The collateral taker (cash lender) — full legal title has passed to them, though they must return equivalent securities at close","The collateral giver (cash borrower) — they retain legal title throughout","Neither party — the bonds are frozen at the CSD until the closing leg","Only the tri-party agent, if one is used"],"answer":"The collateral taker (cash lender) — full legal title has passed to them, though they must return equivalent securities at close","explanation":"Title transfer means the collateral taker becomes full legal owner for the trade's duration and may freely reuse the collateral; the collateral giver retains only beneficial ownership and is owed equivalent (not necessarily the identical certificate/ISIN position) securities back at the closing leg.","chapter_ref":4},{"id":"f2q1","question":"Institution C lends shares to Bank K for GBP cash collateral, agreeing a rebate rate of 45 bppa, while separately reinvesting that cash at 68 bppa. What is Institution C's actual securities lending fee, expressed in bppa?","type":"calc","options":["113 bppa","45 bppa","68 bppa","23 bppa"],"answer":"23 bppa","explanation":"The lender's fee is the spread between the reinvestment rate earned and the rebate rate paid back to the borrower: 68 bppa − 45 bppa = 23 bppa.","chapter_ref":11},{"id":"f2q2","question":"On a mark-to-market date, Institution C (the securities lender) is under-collateralized by GBP 171,513, but the GMSLA Schedule sets a two-way threshold of GBP 250,000. What happens?","type":"mc","options":["Institution C issues a margin call for GBP 171,513, which Bank K must settle","No margin call is valid — the exposure is below the threshold and simply carries forward","Bank K automatically posts GBP 250,000 regardless of the actual exposure","The trade must be terminated immediately"],"answer":"No margin call is valid — the exposure is below the threshold and simply carries forward","explanation":"A threshold is a deliberately uncollateralized band of exposure; a valid margin call can only be made once exposure exceeds the threshold amount — exactly the same mechanic as thresholds in an OTC derivative CSA.","chapter_ref":11},{"id":"f2q3","question":"Why does a securities lender typically prefer cash collateral, all else equal, when the securities borrower would rather post securities collateral?","type":"mc","options":["The lender earns a reinvestment spread on cash (rebate rate paid out is less than reinvestment earned), whereas non-cash collateral requires ongoing mark-to-market of a second asset and offers no reinvestment income","Cash collateral is always required by regulation","Securities collateral is illegal under the GMSLA","Cash collateral never requires a margin/haircut"],"answer":"The lender earns a reinvestment spread on cash (rebate rate paid out is less than reinvestment earned), whereas non-cash collateral requires ongoing mark-to-market of a second asset and offers no reinvestment income","explanation":"With cash collateral the lender's fee comes from the reinvestment-vs-rebate spread; with securities collateral there's no reinvestment opportunity, plus the collateral itself needs daily marking-to-market (and possibly accrued interest, substitution, and income handling) — more operational overhead for the lender, one reason securities collateral usually carries a bigger margin too.","chapter_ref":11},{"id":"f2q4","question":"A firm buys and immediately sells the same quantity of the same security on identical terms. On value date, the purchase fails to settle (the seller doesn't have the securities). What is this situation called, and what can the firm do?","type":"mc","options":["A technical short — the firm can borrow the securities to settle its own sale and receive proceeds without waiting for its purchase to settle","A naked short — the firm must cancel the sale","A special repo — the firm must renegotiate the repo rate","A credit event — the firm must issue a margin call"],"answer":"A technical short — the firm can borrow the securities to settle its own sale and receive proceeds without waiting for its purchase to settle","explanation":"This is a technical short: the firm has zero trading position risk (offsetting buy and sell at identical terms) but a timing problem caused by someone else's settlement failure. Borrowing the securities lets it settle its own sale on time rather than suffering a delayed receipt of sale proceeds or risking a buy-in.","chapter_ref":10},{"id":"f2q5","question":"Under an exclusive agency lending arrangement, what does the beneficial owner give up in exchange for guaranteed lending fee income?","type":"mc","options":["The upside of potentially higher fees from lending to multiple borrowers at fluctuating market rates, since one borrower gets sole access to the portfolio for the contract term","Beneficial ownership of the securities","The right to recall the securities at all","Any indemnity against borrower default"],"answer":"The upside of potentially higher fees from lending to multiple borrowers at fluctuating market rates, since one borrower gets sole access to the portfolio for the contract term","explanation":"Exclusive lending trades flexibility and upside for certainty: the winning borrower pays for sole access to the whole portfolio (whether or not they use all of it), guaranteeing the owner's fee income but foreclosing the chance of earning more via discretionary, per-loan market pricing.","chapter_ref":12},{"id":"f2q6","question":"Under the GMSLA's title-transfer structure, what must the securities borrower return to the lender at the close of an SL&B trade?","type":"mc","options":["Equivalent securities (not necessarily the identical certificates/position originally delivered)","The exact original share certificates only","Cash equal to the original market value only, never the securities themselves","Nothing, if the securities were reused in the meantime"],"answer":"Equivalent securities (not necessarily the identical certificates/position originally delivered)","explanation":"Just as under the GMRA, title transfer means the borrower/collateral taker has full legal ownership and reuse rights during the loan, but owes the lender EQUIVALENT securities back at close — not necessarily the identical position, since the borrower may have reused or on-delivered the originals.","chapter_ref":13},{"id":"f3q1","question":"Firm X enters a fixed-for-floating IRS: receive fixed 4.0%, pay 6-month EUR Libor, notional EUR 30,000,000. On the first payment date, the floating rate resets at 2.9764% over a 181-day period (divisor 360). What net amount does Firm X receive from Bank T on that date?","type":"calc","options":[],"answer":"EUR 154,393.00 (Firm X receives)","explanation":"Fixed leg: 30,000,000 × 4.0% / 360 × 181 = €603,333.33 (Bank T pays Firm X). Floating leg: 30,000,000 × 2.9764% / 360 × 181 = €448,940.33 (Firm X pays Bank T). Net: 603,333.33 − 448,940.33 = €154,393.00 in Firm X's favor.","chapter_ref":16},{"id":"f3q2","question":"A CDS has notional USD 10,000,000 and a premium of 132 bppa. Ignoring day-count adjustment, what is the approximate annual premium the protection buyer pays?","type":"calc","options":["USD 13,200","USD 132,000","USD 1,320,000","USD 132"],"answer":"USD 132,000","explanation":"132 bppa = 1.32%. 10,000,000 × 1.32% = USD 132,000 per year, paid roughly a quarter at a time adjusted for actual days in each quarter.","chapter_ref":17},{"id":"f3q3","question":"Under a CSA with Threshold USD 1,000,000 and MTA USD 500,000, a firm's exposure is USD 1,600,000. How much collateral must be delivered?","type":"calc","options":["USD 0","USD 500,000","USD 600,000","USD 1,600,000"],"answer":"USD 600,000","explanation":"Subtract threshold first: 1,600,000 − 1,000,000 = 600,000. Since 600,000 exceeds the 500,000 MTA, the full 600,000 (not just the excess over MTA) must be delivered — MTA is a trigger test, not a further deduction.","chapter_ref":22},{"id":"f3q4","question":"Why does an FX spot trade between GBP and USD create Herstatt Risk under traditional settlement, but not when settled via CLS Bank?","type":"mc","options":["Traditional settlement pays each currency leg independently through separate correspondents with no simultaneity, so one party can pay hours before knowing the other leg was received; CLS settles both legs simultaneously (PvP), removing that gap","CLS Bank charges lower fees than correspondent banks","Herstatt Risk only applies to currencies outside the G7","CLS Bank guarantees the exchange rate won't move"],"answer":"Traditional settlement pays each currency leg independently through separate correspondents with no simultaneity, so one party can pay hours before knowing the other leg was received; CLS settles both legs simultaneously (PvP), removing that gap","explanation":"Herstatt Risk is a settlement-timing risk, not a credit-quality-of-currency risk. CLS Bank's payment-versus-payment mechanism is the direct fix: both currency legs move at the same time, the same way DvP protects securities settlement.","chapter_ref":18},{"id":"f3q5","question":"Party A and Party B have 5 open OTC trades. Trades favor A by a total of USD 4,750,000 and favor B by a total of USD 7,425,000. B defaults. Under close-out netting, what does Party A pay Party B?","type":"calc","options":["USD 7,425,000","USD 4,750,000","USD 2,675,000","USD 12,175,000"],"answer":"USD 2,675,000","explanation":"Close-out netting collapses all trades to one net payment: 7,425,000 owed by A minus 4,750,000 owed by B = USD 2,675,000 payable by A to B, instead of A paying the full 7,425,000 gross while waiting on B's bankruptcy estate for its own 4,750,000.","chapter_ref":21},{"id":"f3q6","question":"Under a title-transfer CSA (e.g. English Law CSA), what happens to legal title of securities collateral once delivered to the collateral taker?","type":"mc","options":["Title stays with the collateral giver; the taker only gets a security interest, and any onward use is rehypothecation requiring permission","Full legal title passes to the collateral taker, who may freely reuse the securities without needing further permission","Title is jointly held by both parties until the trade matures","Title only transfers if the collateral is cash, never for securities"],"answer":"Full legal title passes to the collateral taker, who may freely reuse the securities without needing further permission","explanation":"Title transfer (English Law CSA) is the opposite structure from security interest (New York Law CSA / English Law Credit Support Deed). Under title transfer, the taker owns the securities outright and reuse is automatic; under security interest, the giver retains title and any use by the taker is rehypothecation, which needs separate permission.","chapter_ref":22},{"id":"f4q1","question":"Firm X and Firm P's CSA specifies: Independent Amount 6% of USD 100,000,000 notional in Firm P's favour, Threshold USD 1,000,000 bilateral, MTA USD 500,000, round up to nearest USD 50,000. Today's mark-to-market is USD 3,660,000 in Firm P's favour, and there is no existing collateral. What margin call amount results, and who pays whom?","type":"calc","options":[],"answer":"USD 8,700,000, Firm X pays Firm P","explanation":"Start with MTM (−3,660,000) plus independent amount (−6,000,000) = −9,660,000. Add back the threshold (+1,000,000) = −8,660,000. No existing collateral or collateral in transit. MTA doesn't affect it (exposure exceeds MTA). Rounding up to the nearest 50,000 adds 40,000, giving a final call of USD 8,700,000 owed by Firm X (the non-exposed party) to Firm P (the exposed party).","chapter_ref":33},{"id":"f4q2","question":"On a later valuation date, the pre-MTA, pre-rounding net exposure works out to USD 440,000 in Firm P's favour, and the CSA's minimum transfer amount is USD 500,000. What happens?","type":"mc","options":["Firm X pays Firm P the full USD 440,000","No margin call is made by either party — the amount is below the MTA and carries forward","Firm X pays USD 500,000 regardless of the actual exposure","The trade is automatically terminated"],"answer":"No margin call is made by either party — the amount is below the MTA and carries forward","explanation":"A minimum transfer amount is a trigger threshold, not a partial-payment rule: an exposure below the MTA results in zero movement that day, even though a real (if small) exposure exists — it simply carries forward to the next valuation date's calculation.","chapter_ref":33},{"id":"f4q3","question":"Party A (receive-fixed) has a legacy IRS where Firm B pays a final net settlement of USD 500,000 in one year. Libor is 2.5%, OIS is 1%. Why does the market discount this cashflow at the OIS rate rather than Libor when the trade is cash-collateralized?","type":"mc","options":["Because collateral can only be reinvested at OIS, so OIS-discounted collateral is the exact amount that (reinvested at OIS) grows back to the full USD 500,000 needed to offset a default — Libor discounting under-collateralizes the position by leaving a shortfall","Because Libor is always higher than OIS so it doesn't matter which is used","Because regulators mandate Libor discounting for uncollateralized trades only","Because OIS only applies to trades under 1 year"],"answer":"Because collateral can only be reinvested at OIS, so OIS-discounted collateral is the exact amount that (reinvested at OIS) grows back to the full USD 500,000 needed to offset a default — Libor discounting under-collateralizes the position by leaving a shortfall","explanation":"Libor-discounted collateral of USD 487,805 reinvested at the lower 1% OIS rate only grows to USD 492,683 — a 7,317 shortfall versus the 500,000 actually owed. OIS-discounted collateral of USD 495,050 reinvested at 1% grows to exactly USD 500,000, matching the true exposure — which is why OIS became the standard discount rate for cash-collateralized swaps after 2008.","chapter_ref":27},{"id":"f4q4","question":"Firm A buys CDS protection on EUR 30,000,000 notional from Firm M and separately sells protection to Firm M on EUR 10,000,000 notional (same reference entity and maturity). If these two trades are netted, what single net position results, and how does the GROSS combined notional (used for capital requirement purposes if NOT netted) compare?","type":"calc","options":[],"answer":"Net position: EUR 20,000,000 buy-protection. Gross (unNetted) combined notional: EUR 40,000,000.","explanation":"Netting nets the DIRECTION (30m buy − 10m sell = 20m net buy) but the un-netted gross notional for capital purposes is always the sum of the absolute values of both trades: 30m + 10m = 40m. Netting/compression is valuable precisely because it replaces that 40m gross figure with a 20m net one, directly reducing the capital charge.","chapter_ref":30},{"id":"f4q5","question":"A firm's trading system successfully captures a new IRS trade, but due to a missing static data setup, the trade never appears in the separate operations processing system. What is the most direct collateral-management consequence?","type":"mc","options":["The trade is invisible to the Collateral Department, so it can't be included in that counterparty's exposure calculation or portfolio reconciliation — understating true exposure until the gap is found","The trade is automatically cancelled","The trade's notional principal doubles","The counterparty is notified automatically and the trade is voided"],"answer":"The trade is invisible to the Collateral Department, so it can't be included in that counterparty's exposure calculation or portfolio reconciliation — understating true exposure until the gap is found","explanation":"A trade capture failure between trading and operations systems means downstream collateral processing simply never sees the trade — exposures are silently understated, and the gap is often only caught by the FO/BO reconciliation control or, worse, when the counterparty raises it during portfolio reconciliation.","chapter_ref":28},{"id":"f4q6","question":"Under the CSA in the Chapter 33 worked example, existing cash collateral held by a counterparty from a prior margin call is entered into the next day's exposure calculation. Why must this always be netted against the fresh exposure figure rather than starting the calculation from zero each day?","type":"mc","options":["Because collateral already posted continues to mitigate exposure — recalculating from zero would either double-call for exposure already covered, or fail to reflect collateral that needs to be returned as the trade moves back in the poster's favour","Because CSAs legally require exactly one margin call ever, on trade date only","Because collateral is returned automatically every night regardless of exposure","Because existing collateral only matters for securities, not cash"],"answer":"Because collateral already posted continues to mitigate exposure — recalculating from zero would either double-call for exposure already covered, or fail to reflect collateral that needs to be returned as the trade moves back in the poster's favour","explanation":"This is the same principle that appears throughout the book (repo, SL&B, OTC derivatives): every margin call is a NET adjustment against collateral already in hand, not a fresh full-value transfer — ignoring existing collateral would massively over- or under-collateralize positions within days.","chapter_ref":33},{"id":"f5q1","question":"A firm calculates its counterparty's exposure at USD 6,000,000, but receives a margin call notification for USD 8,000,000. What is standard market practice?","type":"mc","options":["Pay the full USD 8,000,000 immediately to avoid any dispute","Pay nothing until the full USD 2,000,000 difference is resolved","Pay the undisputed USD 6,000,000 immediately, then investigate the USD 2,000,000 difference separately","Reject the margin call entirely and demand a recalculation"],"answer":"Pay the undisputed USD 6,000,000 immediately, then investigate the USD 2,000,000 difference separately","explanation":"Standard practice separates the undisputed amount (settled immediately, so the counterparty's real exposure is mostly mitigated without delay) from the disputed residual (investigated afterward, potentially escalating to formal dispute resolution via a valuation agent if direct discussion doesn't resolve it).","chapter_ref":34},{"id":"f5q2","question":"USD 10,000,000 face value of a bond is marked at a clean price of 98.76%, with 282 days of accrued interest at a 4.15% coupon (360 divisor). What is the total market value before any haircut is applied?","type":"calc","options":[],"answer":"USD 10,201,083.33","explanation":"Clean market value: 10,000,000 × 98.76% = USD 9,876,000. Accrued interest: 10,000,000 × 4.15% / 360 × 282 = USD 325,083.33. Total market value = 9,876,000 + 325,083.33 = USD 10,201,083.33 (haircut would then be deducted from this figure to reach collateral value).","chapter_ref":34},{"id":"f5q3","question":"Under a New York Law CSA (security interest basis), what must happen before the collateral taker may reuse (rehypothecate) securities collateral it has received?","type":"mc","options":["The transferor (collateral giver) must specifically grant consent — rehypothecation is not automatic under a security interest arrangement","Nothing — reuse is automatic just as it would be under an English Law CSA","The collateral must first be converted to cash","The taker must wait until the trade's scheduled maturity date"],"answer":"The transferor (collateral giver) must specifically grant consent — rehypothecation is not automatic under a security interest arrangement","explanation":"Security interest arrangements (New York Law CSA and English Law Credit Support Deed) leave legal and beneficial ownership with the giver; the taker may only rehypothecate with the giver's explicit consent — unlike an English Law CSA's title-transfer basis, where reuse is the transferee's automatic right as full legal owner.","chapter_ref":36},{"id":"f5q4","question":"An insurance company wants to exit a USD 60,000,000 CDS position with Investment Bank D. Bank D refuses to unwind. The insurance company instead executes an equal and opposite trade with Investment Bank F. What is the resulting exposure situation, compared to what an unwind would have achieved?","type":"mc","options":["Zero exposure with anyone, identical to an unwind","Ongoing exposure with BOTH Bank D and Bank F — market risk is neutralized but two collateral relationships must now be managed, versus zero with an unwind","Exposure only with Bank F; Bank D is fully released","The position is automatically netted with any other CDS trades on the same reference entity"],"answer":"Ongoing exposure with BOTH Bank D and Bank F — market risk is neutralized but two collateral relationships must now be managed, versus zero with an unwind","explanation":"This is an offset, not an unwind — market risk is flat, but unlike an unwind (which fully closes out with the original counterparty), an offset leaves the firm with two live, independently collateralized relationships to manage indefinitely.","chapter_ref":40},{"id":"f5q5","question":"Party B (collateral taker under a title-transfer CSA) reuses bond collateral received from Party A by selling it outright to Party C, shortly before the bond's coupon record date. Who is entitled to keep the coupon paid by the CSD, and who does Party B still owe?","type":"mc","options":["Party C keeps the coupon (as the new legal owner); Party B must still pay the equivalent value to Party A out of its own funds — 'manufactured income'","Party A keeps the coupon directly from the CSD; Party B and Party C are uninvolved","Party B keeps the coupon and owes nothing further to anyone","Party C must remit the coupon to Party A directly"],"answer":"Party C keeps the coupon (as the new legal owner); Party B must still pay the equivalent value to Party A out of its own funds — 'manufactured income'","explanation":"Because Party B sold the bond outright, Party C is the legitimate new owner and keeps the coupon — Party B has no claim against Party C. But Party B's original obligation to Party A (the beneficial owner) doesn't disappear just because Party B reused the collateral; Party B must pay Party A out of pocket, which the book terms manufactured income.","chapter_ref":43},{"id":"f5q6","question":"An OTC derivative trade reaches its scheduled maturity date, but the firm's system fails to mark it as 'closed.' What is the most likely operational consequence?","type":"mc","options":["The system will continue treating the trade as live — generating phantom exposure calculations and potentially erroneous margin calls on a relationship that has actually ended","Nothing — matured trades are automatically excluded from all calculations regardless of status","The counterparty is automatically notified and the error self-corrects","The trade's collateral is automatically forfeited"],"answer":"The system will continue treating the trade as live — generating phantom exposure calculations and potentially erroneous margin calls on a relationship that has actually ended","explanation":"Trade termination's core operational risk is exactly this: a matured trade not marked closed keeps generating exposure and margin-call activity against a relationship that no longer exists — though for firms using triResolve, portfolio reconciliation should surface the mismatch against the counterparty's (correctly closed) records.","chapter_ref":44},{"id":"f6q1","question":"Four firms execute OTC derivative trades bilaterally: Firm T buys 40m from Firm U, buys 20m from Firm V, and buys 10m from Firm W. Once all trades are novated to a CCP and multilaterally netted, what is the CCP's own net position, and why?","type":"mc","options":["Zero — the CCP is the offsetting counterparty on every trade it clears and must remain market-risk-neutral at all times","+70m, matching Firm T's total purchases","−70m, matching the combined sales of U, V and W","The CCP's position depends on market prices that day"],"answer":"Zero — the CCP is the offsetting counterparty on every trade it clears and must remain market-risk-neutral at all times","explanation":"A CCP becomes buyer to every seller and seller to every buyer via novation. Every trade it clears has an exactly offsetting pair on its own book, so regardless of how many thousands of trades it processes, its own net position is always zero — this is the market-risk-neutral mandate all CCPs operate under.","chapter_ref":46},{"id":"f6q2","question":"A pension fund is exempt from the EMIR central clearing obligation. Does this also exempt it from posting initial margin and variation margin on its non-centrally cleared OTC derivative trades?","type":"mc","options":["No — the clearing exemption and the IM/VM posting requirements are separate; pension funds remain subject to IM/VM on non-centrally cleared trades","Yes — any exemption from clearing automatically exempts a firm from all collateral posting","Only VM is exempted, not IM","Only IM is exempted, not VM"],"answer":"No — the clearing exemption and the IM/VM posting requirements are separate; pension funds remain subject to IM/VM on non-centrally cleared trades","explanation":"The book explicitly flags this: pension funds' clearing exemption exists because they typically lack CCP-eligible collateral assets, but they are NOT exempt from the IM and VM regulations that apply to whatever non-centrally cleared trades they execute instead.","chapter_ref":48},{"id":"f6q3","question":"Firm A has an AANA of EUR 2.8 trillion (in scope for mandatory IM from September 2017). Firm B has an AANA of EUR 400 billion (in scope only from September 2020). When does mandatory IM exchange begin on new trades between Firm A and Firm B?","type":"calc","options":["September 2017","September 2020","February 2017","IM is never required between these two firms"],"answer":"September 2020","explanation":"Where two counterparties fall under different AANA-based deadlines, the mandatory exchange requirement between them begins on the LESS constraining (later) of the two dates — Firm A being captured earlier doesn't force an earlier start date for its trades with the not-yet-captured Firm B.","chapter_ref":48},{"id":"f6q4","question":"Under a bilateral (non-CCP) trade, VM given by the non-exposed party is typically held by the exposed party (subject to CSA terms on reuse). Under central clearing, what happens to variation margin collected by the CCP from a clearing member with negative exposure?","type":"mc","options":["It is passed straight through to the clearing member(s) with the offsetting positive exposure, rather than retained by the CCP","It is added permanently to the CCP's default fund","It is invested by the CCP for its own account","It is returned to the paying clearing member the same day"],"answer":"It is passed straight through to the clearing member(s) with the offsetting positive exposure, rather than retained by the CCP","explanation":"Unlike initial margin (which the CCP holds and does not reuse), variation margin is explicitly a pass-through mechanism: cash collected from CMs with negative exposure flows straight to the CMs with positive exposure on the offsetting side, reflecting the CCP's role as a risk-neutral intermediary rather than a holder of trade-related value.","chapter_ref":47},{"id":"f6q5","question":"A non-financial corporation's interest rate swap notional outstanding is EUR 1.2 billion against an EMIR clearing threshold of EUR 3 billion for interest rate products. What is its classification, and what regulatory consequence follows?","type":"calc","options":["NFC− (below threshold) — exempt from the central clearing obligation","NFC+ (above threshold) — subject to mandatory central clearing","FC (financial counterparty) — subject to the strictest requirements","Automatically exempt from all EMIR reporting"],"answer":"NFC− (below threshold) — exempt from the central clearing obligation","explanation":"Since EUR 1.2 billion is below the EUR 3 billion clearing threshold for interest rate derivatives, the firm is classified NFC− and exempt from the clearing obligation (though still required to report trades to a trade repository, and to reassess its status if its notional later crosses the threshold).","chapter_ref":48},{"id":"f6q6","question":"Under the Final RTS governing non-centrally cleared trades, is a collateral taker permitted to reuse or rehypothecate collateral received to satisfy an IM or VM call?","type":"mc","options":["No — reuse and rehypothecation of collateral received is explicitly not permitted, though reinvestment of cash collateral is allowed","Yes, freely, exactly as under a title-transfer CSA","Only with the collateral giver's written consent","Only for cash collateral, never securities"],"answer":"No — reuse and rehypothecation of collateral received is explicitly not permitted, though reinvestment of cash collateral is allowed","explanation":"Article 20.1 of the Final RTS bans reuse/rehypothecation of collateral posted for non-centrally cleared trades outright — a notably stricter position than the legacy bilateral CSA world (where title-transfer arrangements permit automatic reuse), reflecting post-crisis regulatory caution about collateral being passed through long chains.","chapter_ref":48},{"id":"gap1","question":"Why is collateral overwhelmingly posted as cash or bonds rather than equity, according to the book?","type":"mc","options":["Equity is illegal to use as collateral under most master agreements","Equity's price volatility works against the goal of a stable, liquid, quickly-saleable asset","Equity pays no income, making it economically unattractive to hold as collateral","Regulators cap equity collateral at a small percentage of total exposure"],"answer":"Equity's price volatility works against the goal of a stable, liquid, quickly-saleable asset","explanation":"The whole point of collateral is that its value stays predictable and it can be sold quickly if needed — equity's price swings undermine both, which is why the book notes collateral is overwhelmingly cash or bonds.","chapter_ref":1},{"id":"gap2","question":"Firm A delivers bond collateral to Firm B in exchange for cash, agreeing to reverse the exchange (plus interest) later. From Firm B's side — the one providing the cash — what is this same trade called?","type":"mc","options":["Repo","Reverse repo","Securities loan","Collateral substitution"],"answer":"Reverse repo","explanation":"Repo and reverse repo are the same trade viewed from opposite sides: the cash borrower (Firm A) does a repo, the cash lender (Firm B) does a reverse repo — there's no such thing as one without the other on a single trade.","chapter_ref":3},{"id":"gap3","question":"Under the GMRA, if a counterparty defaults while several repo trades are open between the two firms, what happens to those trades?","type":"mc","options":["Each trade is settled and disputed individually, on its own timeline","All open trades are terminated and settled as a single net cash figure (close-out netting)","The defaulting party's collateral is immediately forfeited without any calculation","Only the trades maturing that same week are affected"],"answer":"All open trades are terminated and settled as a single net cash figure (close-out netting)","explanation":"The GMRA's core protective mechanism is close-out netting: on an Event of Default, all open repo trades under the agreement are terminated and settled as one net figure rather than gross trade-by-trade — the same logic the ISDA Master Agreement applies to OTC derivatives.","chapter_ref":8},{"id":"gap4","question":"In securities lending & borrowing, which loan structure is far more common in practice: one with a fixed closing date, or one that either side can recall/return at any time?","type":"mc","options":["Open loan (recallable/returnable anytime)","Term loan (fixed closing date)","Both are equally common in practice","Neither — SL&B loans have no defined structure at all"],"answer":"Open loan (recallable/returnable anytime)","explanation":"Open loans dominate because flexibility matters more to both lender and borrower than the small extra certainty a fixed term buys — either side can recall or return the securities whenever it needs to.","chapter_ref":9},{"id":"gap5","question":"Investor B buys a call option on 2,000 shares of Company Z, strike EUR 15.00, for a premium of EUR 1.20/share. At expiry the share price is EUR 19.50. What is B's profit, net of the premium paid?","type":"calc","options":[],"answer":"EUR 6,600","explanation":"Intrinsic value = 2,000 × (19.50 − 15.00) = EUR 9,000. Net of the EUR 2,400 premium paid (2,000 × 1.20), B's profit is EUR 9,000 − 2,400 = EUR 6,600.","chapter_ref":14},{"id":"gap6","question":"An interest rate swap has a notional of USD 80,000,000 at a fixed rate of 2.75%. How much of the USD 80,000,000 notional actually changes hands each year, and how much cash is actually paid?","type":"calc","options":[],"answer":"USD 0 of notional moves; USD 2,200,000 of interest is paid","explanation":"The notional principal is never paid — it's a theoretical reference quantity used only to size the real cashflow. Only USD 2,200,000 (80,000,000 × 2.75%) of actual interest changes hands each year.","chapter_ref":15},{"id":"gap7","question":"Company M (Japan) borrows JPY 3,000,000,000 domestically at 1% and passes it to Company N. Company N (Brazil) borrows BRL 20,000,000 domestically at 6% and passes it to Company M. Under their cross-currency swap, how much does Company M pay Company N each year, and how much does it receive?","type":"calc","options":[],"answer":"M pays BRL 1,200,000/yr and receives JPY 30,000,000/yr","explanation":"Each firm pays interest in the currency and rate of the OTHER firm's domestic loan, so it can pass that interest back to cover it: Company M pays Company N BRL 1,200,000 (20,000,000 × 6%, covering N's own BRL loan) and receives JPY 30,000,000 from Company N (3,000,000,000 × 1%, covering M's own JPY loan).","chapter_ref":19},{"id":"gap8","question":"A firm's custodian account details change, and it forgets to notify a counterparty in time. What static-data element does this break, and what's the real consequence?","type":"mc","options":["Standing Settlement Instructions (SSIs) — payments risk going to the wrong account","The CSA threshold — margin calls stop being issued entirely","The ISIN code — the bond becomes untradeable","The netting agreement — trades can no longer be netted"],"answer":"Standing Settlement Instructions (SSIs) — payments risk going to the wrong account","explanation":"SSIs are private, bilaterally-exchanged account details that must be kept perfectly in sync — a firm that changes its nostro or custodian account and fails to notify counterparties in time risks payments going to the wrong place, at real cost.","chapter_ref":23},{"id":"gap9","question":"A firm's CSA with a counterparty lists only interest rate swaps and credit default swaps. The firm then executes a new cross-currency swap with that same counterparty. What confirmation type is required, and what happens to this trade's exposure?","type":"mc","options":["Short form confirmation; folded straight into the normal daily CSA exposure calculation","Long form confirmation; tracked and margined separately until the CSA is amended to include it","No confirmation is needed, since a CSA is already signed with this counterparty","The trade is automatically rejected until the CSA is amended"],"answer":"Long form confirmation; tracked and margined separately until the CSA is amended to include it","explanation":"Legal documentation covers only the product types explicitly named in it. A product outside the CSA needs a long form confirmation and must be managed and margined separately, under bespoke terms, until (if ever) the CSA is amended to include it.","chapter_ref":25},{"id":"gap10","question":"A sell-side firm services a buy-side client on a trade. What is the term for the buy-side firm's process of checking and accepting the sell-side's trade details, and how does it differ from 'confirmation'?","type":"mc","options":["Affirmation — a passive check-and-accept, reflecting a service-provider relationship rather than a peer negotiation","Affirmation — an active renegotiation of the trade's economic terms","Confirmation — buy-side and sell-side firms always use the identical term","Netting — it's actually a netting process, not a matching one"],"answer":"Affirmation — a passive check-and-accept, reflecting a service-provider relationship rather than a peer negotiation","explanation":"'Confirmation' is used between two equal sell-side firms; 'affirmation' is used when a sell-side firm services a buy-side client, who passively checks and affirms what the sell-side sends rather than negotiating as a peer.","chapter_ref":29},{"id":"gap11","question":"Firm A's books show 150 open trades with Counterparty B; a portfolio reconciliation run shows only 148 on B's side. What's the right response, and by when should it happen?","type":"mc","options":["Assume fraud and escalate to legal immediately","Investigate — the gap is likely mundane (an unreflected novation, a misbooking) — and resolve it before the next margin call deadline","Ignore it, since a 2-trade gap out of 150 is immaterial","Wait until a margin call is actually disputed before investigating"],"answer":"Investigate — the gap is likely mundane (an unreflected novation, a misbooking) — and resolve it before the next margin call deadline","explanation":"Portfolio reconciliation is a pre-emptive control: it exists to catch population discrepancies — usually caused by mundane things like unreflected novations or legal-entity misbookings — before the margin call deadline, not after a dispute has already started.","chapter_ref":31},{"id":"gap12","question":"A portfolio is marked at USD 1,800,000 in Firm A's favour yesterday, backed by USD 1,800,000 of bond collateral. Overnight, the mark rises to USD 1,950,000, and the bond collateral's own price falls, revaluing it to USD 1,770,000. What total amount must Firm A call for?","type":"calc","options":[],"answer":"USD 180,000","explanation":"Two effects move against Firm A on the same day: the exposure grows by USD 150,000 (1,950,000 − 1,800,000), and the collateral itself loses USD 30,000 of value (1,800,000 − 1,770,000). Firm A must call for the combined USD 180,000 shortfall.","chapter_ref":32},{"id":"gap13","question":"A counterparty proposes GBP 4,000,000 of Issuer QRS 3.60% bonds as collateral. Clean price is 99.40% (GBP 3,976,000), accrued interest adds GBP 23,600, and the CSA specifies an 8% haircut. What collateral value should the exposed party independently calculate?","type":"calc","options":[],"answer":"GBP 3,679,632","explanation":"Total market value = clean price + accrued interest = 3,976,000 + 23,600 = GBP 3,999,600. Applying the 8% haircut: 3,999,600 × 0.92 = GBP 3,679,632 — the exposed party must reproduce this exact calculation independently before accepting the proposal.","chapter_ref":35},{"id":"gap14","question":"A trade between Firm P and Firm Q is novated: Firm Q steps out, and Firm R steps in as Firm P's new counterparty. Whose consent is legally required, and what happens to Firm Q's obligation once that consent is given?","type":"mc","options":["Only Firm P (the remaining party) must consent; Firm Q is fully released once P agrees","Only Firm Q and Firm R need to agree between themselves — Firm P has no say","No consent is needed from anyone; novation happens automatically once documented","All three firms must unanimously agree, but Firm Q remains partially liable regardless"],"answer":"Only Firm P (the remaining party) must consent; Firm Q is fully released once P agrees","explanation":"Novation legally requires the remaining party's consent, not just agreement between the transferor and transferee — a firm can't be handed a new counterparty without its sign-off, which is exactly the protection that makes novation safe for the party not initiating it.","chapter_ref":38},{"id":"gap15","question":"A firm wants to exit an OTC derivative with the least residual complexity, and its counterparty agrees to cancel the trade via a mutually agreed, economically opposite trade. What post-trade event is this, and how does it differ from an offset?","type":"mc","options":["Unwind — it removes the position and counterparty relationship entirely, unlike an offset, which leaves two separate counterparty relationships","Novation — a new counterparty steps into the original trade","Unwind — but ongoing exposure to the original counterparty still remains afterward","Offset — the two events are functionally identical in effect"],"answer":"Unwind — it removes the position and counterparty relationship entirely, unlike an offset, which leaves two separate counterparty relationships","explanation":"An unwind is the cleanest exit: a mutually agreed opposite trade with the SAME counterparty leaves precisely zero ongoing exposure or trade population with anyone — unlike an offset, which nets exposure but still leaves two separate counterparty relationships in place.","chapter_ref":39},{"id":"gap16","question":"A USD 25,000,000 notional CDS references a corporate borrower that defaults — a qualifying credit event. An ISDA auction sets the recovery rate at 42 cents on the dollar. How much does the protection seller pay the protection buyer, and what happens to the contract?","type":"calc","options":[],"answer":"USD 14,500,000; the contract terminates immediately","explanation":"Payout = notional × (1 − recovery) = 25,000,000 × (1 − 0.42) = USD 14,500,000. The CDS contract terminates immediately upon payment, with zero ongoing exposure to either side.","chapter_ref":41},{"id":"gap17","question":"Party A must substitute collateral it previously posted to Party B, because Party A's trading desk just sold that exact bond in an unrelated transaction. Under a simple free-of-payment (FoP) substitution, what risk exists, and what does Delivery-versus-Delivery (DvD) fix?","type":"mc","options":["Whichever party's incoming delivery settles second is temporarily exposed if the other leg fails; DvD links both legs so neither settles unless both can","There is no settlement risk in a substitution, since both bonds are equally CSA-eligible","DvD removes Party B's obligation to ever verify the replacement bond's eligibility","FoP settlement risk only exists for cash collateral, never for securities substitutions"],"answer":"Whichever party's incoming delivery settles second is temporarily exposed if the other leg fails; DvD links both legs so neither settles unless both can","explanation":"Two independent, non-simultaneous free-of-payment deliveries create real settlement-timing risk — whichever party's incoming delivery lands second is temporarily exposed if the other leg fails. Delivery-versus-Delivery (e.g. via T2S's Effective DvD) links both legs so neither settles unless both can settle simultaneously.","chapter_ref":42},{"id":"gap18","question":"Why does an OTC derivative trade need a durable, signed legal framework in place BEFORE the first trade, in a way a simple securities trade does not?","type":"mc","options":["OTC derivatives settle immediately, so paperwork must be arranged in advance","An OTC derivative can run for decades with two-sided counterparty risk the whole time, unlike a securities trade that settles within days","Regulators only require pre-signed paperwork for OTC products, never for securities","OTC derivatives are always exchange-traded, requiring exchange membership paperwork first"],"answer":"An OTC derivative can run for decades with two-sided counterparty risk the whole time, unlike a securities trade that settles within days","explanation":"Securities trades settle in days, so counterparty risk is fleeting. An OTC derivative can run 50 years, so both parties need a durable rulebook covering what happens if the other side doesn't perform — and that framework must be signed before the first trade, not after.","chapter_ref":20},{"id":"gap19","question":"According to the book, what is the relationship between trade processing and collateral processing across an OTC derivative's life?","type":"mc","options":["Collateral processing only begins once trade processing has fully finished","They run as two parallel, independent streams from execution until termination, sharing the same underlying trade","Collateral processing is just a subset of trade processing, not a separate stream","Trade processing only applies to securities trades, not OTC derivatives"],"answer":"They run as two parallel, independent streams from execution until termination, sharing the same underlying trade","explanation":"A trade generates two obligations at once: settling its own periodic cashflows (trade processing) and managing counterparty exposure on it (collateral processing). These run as parallel streams sharing the same trade, not sequentially.","chapter_ref":24},{"id":"gap20","question":"A counterparty's CSA static data is entered incorrectly. Which four things does the book say this can break simultaneously?","type":"mc","options":["Mark-to-market frequency, exposure identification, margin call issuance, and eligible collateral identification","Only the trade confirmation process","Just the choice of settlement currency","Only internal risk reporting, with no effect on the counterparty relationship"],"answer":"Mark-to-market frequency, exposure identification, margin call issuance, and eligible collateral identification","explanation":"CSA-related static data is the operational encoding of everything legally negotiated in the CSA — get it wrong and mark-to-market frequency, exposure identification, margin call issuance, and eligible collateral identification all break together, not just one of them.","chapter_ref":26},{"id":"gap21","question":"Which four events does the book group under the umbrella term 'post-trade execution events'?","type":"mc","options":["Novation, unwind, offset, and (for CDS specifically) credit events","Trade capture, confirmation, netting, and reconciliation","Margin call, collateral substitution, income event, and termination","Execution, clearing, settlement, and custody"],"answer":"Novation, unwind, offset, and (for CDS specifically) credit events","explanation":"'Post-trade execution events' covers anything that can happen to a live trade before its scheduled maturity date — novation, unwind, offset, and (for CDS) credit events — each impacting trade processing and collateral processing simultaneously.","chapter_ref":37},{"id":"gap22","question":"Chapter 45 ('Legal Documentation') is deliberately short. What is its actual function in the book's structure?","type":"mc","options":["It introduces a fourth legal document not covered anywhere else in the book","It's a hinge — pointing back to the ISDA Master Agreement, Schedule and CSA already covered, and handing off into the book's regulatory-change chapters","It replaces the Credit Support Annex with a newer legal standard","It applies only to centrally-cleared trades, unlike the earlier legal chapters"],"answer":"It's a hinge — pointing back to the ISDA Master Agreement, Schedule and CSA already covered, and handing off into the book's regulatory-change chapters","explanation":"Its entire content points back to the three legal documents already covered in depth (Master Agreement, Schedule, CSA). Structurally it closes out the bilateral-trading section and hands off directly into the chapters on post-2008 regulatory change.","chapter_ref":45},{"id":"exp1q1","question":"A firm borrows GBP 27,500,000 via repo at 2.45% for exactly 70 actual days. Which day-count divisor applies, and why does that matter versus a USD loan at the identical rate and days?","type":"calc","options":[],"answer":"365 for GBP (vs. 360 for USD/EUR) — the GBP loan produces a smaller cash interest amount for the same rate and days","explanation":"Repo interest = principal × rate / divisor × days. GBP uses a 365-day divisor while USD/EUR use 360, so an identical rate and day count produce a smaller interest amount in GBP than the same numbers would in USD: 27,500,000 × 2.45% / 365 × 70 = GBP 129,212.33.","chapter_ref":4},{"id":"exp1q2","question":"Under the ECB's haircut framework, which single bond feature most increases the haircut going from investment-grade to sub-investment-grade credit, holding maturity and category constant?","type":"mc","options":["Moving from the AAA-to-A− band to the BBB+-to-BBB− band roughly doubles or more the haircut at the same maturity/category","Credit quality has almost no effect on haircut once category and maturity are fixed","Zero coupon bonds always carry a LOWER haircut than fixed coupon bonds of the same rating","Haircuts are identical across all five liquidity categories at a given credit rating"],"answer":"Moving from the AAA-to-A− band to the BBB+-to-BBB− band roughly doubles or more the haircut at the same maturity/category","explanation":"Comparing the ECB grid at the same category and maturity bucket, e.g. Category IV fixed-coupon 5-7 years: upper band (AAA-A−) is 12.5%, lower band (BBB+ to BBB−) is 28%, over double — credit quality drives the haircut sharply once you're outside the top rating band.","chapter_ref":4},{"id":"exp1q3","question":"A firm is over 2 days from a repo's opening value date and its confirmation doesn't match the counterparty's. Since October 2014, why is this now more urgent in Europe than it used to be?","type":"mc","options":["The GMRA no longer permits unmatched trades to settle at all","The repo settlement cycle moved from T+2 to T+1, compressing the time available to spot, investigate and fix a discrepancy before the trade is due to settle","Trade confirmations are no longer required for repo trades","Interest rates became negative, making settlement timing irrelevant"],"answer":"The repo settlement cycle moved from T+2 to T+1, compressing the time available to spot, investigate and fix a discrepancy before the trade is due to settle","explanation":"Europe's October 2014 harmonisation (ahead of Target2-Securities) pushed the 'cash' securities market to T+2 and, as a knock-on effect, repo to T+1 — checking of trade details between the two firms now effectively has to happen on trade date itself if the trade is to settle on time.","chapter_ref":4},{"id":"exp1q4","question":"Firm A has a running repo with Party G. On Day 1 Firm A paid Party G a USD 182,778.83 cash margin call. On Day 5, before comparing to the bond's current collateral value, what must Firm A do to its cash-side figure that a naive 'principal plus interest to date' calculation would miss?","type":"calc","options":[],"answer":"Subtract the USD 182,778.83 already paid on Day 1 from the running current cash value","explanation":"The current value of cash lent/borrowed must net OUT any margin calls already settled in cash, not just add repo interest to the original principal — skipping this step overstates the cash side and produces a materially wrong exposure figure on every subsequent day.","chapter_ref":5},{"id":"exp2q1","question":"A securities loan is collateralized with cash. On a given mark-to-market day, the required collateral value falls BELOW the existing cash collateral balance. Who is exposed, and what happens?","type":"mc","options":["The securities lender is exposed and issues a margin call for the shortfall","The securities borrower is exposed (over-collateralized) and can call for the excess to be returned","No one is exposed since cash collateral never needs revaluing","The trade must be terminated immediately"],"answer":"The securities borrower is exposed (over-collateralized) and can call for the excess to be returned","explanation":"When the lent security's marked value (plus margin) falls below the existing collateral, the borrower is now over-collateralized — it is the borrower, not the lender, who is exposed to excess collateral sitting with the counterparty, and it is the borrower who issues the margin call to get the excess back.","chapter_ref":10},{"id":"exp2q2","question":"Under the GMSLA, a securities lender receives securities collateral and later sells it outright to a third party in the open market. At the close of the SL&B trade, what is the lender's obligation?","type":"mc","options":["No obligation — title transfer means the collateral is now the lender's to keep","The lender must return the exact original certificates it received","The lender must source and deliver equivalent securities (same ISIN and quantity) back to the borrower","The lender must convert the obligation into a cash payment at the original market value"],"answer":"The lender must source and deliver equivalent securities (same ISIN and quantity) back to the borrower","explanation":"Title transfer gives the collateral taker full legal right to reuse (sell, repo, lend) the collateral — but at the close of the trade it remains obliged to return 'equivalent collateral': the same ISIN and quantity, sourced from wherever necessary if it has been sold on.","chapter_ref":10},{"id":"exp2q3","question":"A securities loan carries a GBP 250,000 Threshold and a GBP 50,000 MTA. On a mark-to-market day, the exposure calculated is GBP 171,513, in Institution C's favour. What happens?","type":"calc","options":[],"answer":"No margin call is made","explanation":"GBP 171,513 falls inside the GBP 250,000 threshold, so no collateral movement is required at all — the exposure genuinely exists but is simply absorbed by the threshold, exactly as the agreed contract terms intend.","chapter_ref":11},{"id":"exp2q4","question":"A firm lends securities via an ICSD's auto-lending/borrowing programme rather than directly to a known counterparty. What is fundamentally different about this arrangement compared to a direct bilateral loan?","type":"mc","options":["The lender legally lends to the ICSD itself, not to the ultimate borrower — both sides remain anonymous to each other throughout the loan","It works identically to a bilateral loan, just processed through extra paperwork","The lender takes on direct credit risk to whichever specific firm ends up borrowing","Only cash collateral is accepted under this programme"],"answer":"The lender legally lends to the ICSD itself, not to the ultimate borrower — both sides remain anonymous to each other throughout the loan","explanation":"Under ICSD auto-lending, the lender's legal exposure is to the ICSD, not to the anonymous end-borrower matched behind the scenes — this is precisely why identities never need to be disclosed on either side, and why the ICSD (not either original party) provides the credit guarantee on the loan.","chapter_ref":12},{"id":"exp3q1","question":"A CSA states an Independent Amount of USD 3,000,000 in a firm's favour. The firm's current exposure on its open trades is USD 6,000,000. How much collateral is the firm owed in total?","type":"calc","options":[],"answer":"USD 9,000,000","explanation":"Independent Amount is a protective buffer added ON TOP of pure exposure, not instead of it — total collateral owed = exposure (6,000,000) + independent amount (3,000,000) = USD 9,000,000.","chapter_ref":22},{"id":"exp3q2","question":"A CSA has a EUR base currency but lists USD, EUR and GBP as eligible currencies. What does this actually mean?","type":"mc","options":["Exposure must be calculated in EUR, but collateral can be posted in USD, EUR or GBP cash","Exposure can be calculated in any of the three currencies, but collateral must always be EUR","The CSA is invalid, since base currency and eligible currency must always match","Collateral must be split evenly across all three eligible currencies"],"answer":"Exposure must be calculated in EUR, but collateral can be posted in USD, EUR or GBP cash","explanation":"Base Currency governs only the currency the EXPOSURE figure is calculated in; Eligible Currency separately lists which currencies cash collateral may actually be delivered in — the two fields serve different purposes and don't need to match.","chapter_ref":22},{"id":"exp3q3","question":"Firm A receives a margin call notification for USD 4,500,000 but calculates the correct figure as USD 3,800,000. Under standard CSA dispute procedure, what should Firm A do?","type":"mc","options":["Withhold all payment until the dispute is fully resolved","Pay the undisputed USD 3,800,000 immediately and formally dispute only the USD 700,000 difference","Pay the full USD 4,500,000 to avoid being in breach, then seek a refund later","Ignore the call since Firm A disagrees with the calculation"],"answer":"Pay the undisputed USD 3,800,000 immediately and formally dispute only the USD 700,000 difference","explanation":"CSA dispute resolution requires the undisputed portion to be settled immediately, regardless of the dispute — only the genuinely contested remainder is escalated to the valuation agent and market-maker averaging process.","chapter_ref":22},{"id":"exp3q4","question":"An IRS has a fixed rate of 4.0% and a floating rate that resets at 3.8% for a given 184-day period, on a notional of GBP 50,000,000 (actual/365 basis). Which party pays, and how much?","type":"calc","options":[],"answer":"GBP 50,410.96","explanation":"Net rate = 4.0% − 3.8% = 0.2%, in favour of the floating payer. Net payment = 50,000,000 × 0.2% / 365 × 184 = GBP 50,410.96, paid by the party paying the higher (fixed) rate to the party paying the lower (floating) rate.","chapter_ref":16},{"id":"exp3q5","question":"A protection buyer holds a USD 20,000,000 First-to-Default basket CDS across 4 reference entities. Reference Entity #2 defaults. What happens to the contract?","type":"mc","options":["The protection seller pays out the full USD 20,000,000 and the entire contract terminates","The protection seller pays out USD 5,000,000 (one quarter) and the contract continues on the remaining 3 entities","No payout occurs since only 1 of 4 entities defaulted","The contract is renegotiated to remove Entity #2 and continues at a reduced notional"],"answer":"The protection seller pays out the full USD 20,000,000 and the entire contract terminates","explanation":"A First-to-Default basket CDS pays out in full on whichever reference entity defaults FIRST, and the entire contract terminates at that point — the remaining, undefaulted entities in the basket become irrelevant once the first default has been paid.","chapter_ref":17},{"id":"exp3q6","question":"Company A borrows domestically at a favourable rate and passes the proceeds to Company B under a cross-currency swap; Company B does the same in its own currency for Company A. Why is this arrangement more attractive to both firms than each borrowing directly in the foreign currency it actually needs?","type":"mc","options":["Foreign banks are typically far less willing to lend to an international corporation than a firm's own domestic bank, so borrowing directly overseas usually means a worse rate than borrowing at home","Cross-currency swaps are risk-free and eliminate all FX exposure entirely","It allows both companies to avoid paying any interest at all for the life of the swap","Regulators require all foreign currency borrowing to be done via a cross-currency swap"],"answer":"Foreign banks are typically far less willing to lend to an international corporation than a firm's own domestic bank, so borrowing directly overseas usually means a worse rate than borrowing at home","explanation":"This is the comparative advantage principle behind CCS: each firm borrows where it already has the strongest banking relationship and best rate (its own domestic market), then swaps the proceeds — accessing the foreign currency it actually needs without ever facing a foreign bank's worse terms directly.","chapter_ref":19},{"id":"exp4q1","question":"A firm's CSA-collateralised interest rate swap has historically been discounted at Libor. Post-2008, why did the market shift to discounting cash-collateralised swaps at OIS instead?","type":"mc","options":["OIS is always higher than Libor, giving more conservative valuations","Libor rose meaningfully above OIS post-2008, and collateral only ever earns the OIS rate — discounting at Libor understates the collateral actually needed to cover the exposure","Regulators banned the use of Libor in all valuations after 2008","OIS is simpler to calculate since it doesn't require a panel-bank submission process"],"answer":"Libor rose meaningfully above OIS post-2008, and collateral only ever earns the OIS rate — discounting at Libor understates the collateral actually needed to cover the exposure","explanation":"Cash collateral earns interest at the OIS rate, not Libor. When Libor and OIS were close together this mismatch didn't matter, but once Libor moved meaningfully above OIS after 2008, discounting at Libor left firms with too little collateral to cover a default, since the collateral itself could only be reinvested at the lower OIS rate.","chapter_ref":27},{"id":"exp4q2","question":"A legacy 1-year IRS leaves Party A due a net USD 800,000 receipt in one year. 1-year Libor fixes at 3%, but the OIS rate is 1%. Using OIS discounting (the correct method for a cash-collateralised trade), how much collateral should Party A take today?","type":"calc","options":[],"answer":"USD 792,079","explanation":"Discount the USD 800,000 at the OIS rate: 800,000 / 1.01 = USD 792,079 (rounded). Reinvested at the same 1% OIS rate for a year, this grows back to exactly USD 800,000 — precisely covering the exposure if the counterparty defaults right before maturity.","chapter_ref":27},{"id":"exp4q3","question":"Firm A executes two CDS trades with Firm M on the same reference entity and maturity: buys protection on EUR 45,000,000 notional, and separately buys protection on EUR 25,000,000 notional (both buys, not offsetting). What is the netted position, and what is the gross notional used for capital purposes before netting?","type":"calc","options":[],"answer":"Net: EUR 70,000,000 buy position; Gross: EUR 70,000,000","explanation":"Since both trades are buys (same direction), netting simply adds them together: 45,000,000 + 25,000,000 = EUR 70,000,000 net buy-protection position. Because both trades are the same direction, gross and net notional happen to be identical here — gross notional only diverges from net when trades are in opposing directions (e.g. a buy offsetting a sell).","chapter_ref":30},{"id":"exp4q4","question":"What is the precise legal difference between 'netting' and 'compression' of OTC derivative trades?","type":"mc","options":["Netting only applies to interest rate swaps; compression applies to all other product types","Netting leaves the original trades legally intact (offset only for calculation purposes); compression legally terminates the originals and replaces them with a new net trade","Compression is always bilateral; netting is always multilateral","There is no real difference — the terms are used interchangeably in the book"],"answer":"Netting leaves the original trades legally intact (offset only for calculation purposes); compression legally terminates the originals and replaces them with a new net trade","explanation":"Netting is a calculation-level offset that leaves the underlying trades legally alive. Compression is the stronger version: it actually terminates the original trades and replaces them with a single new net trade, cross-referenced back to the originals for audit purposes.","chapter_ref":30},{"id":"exp4q5","question":"A firm's exposure calculation on Day N shows a pre-MTA sub-total of USD 420,000 owed to the firm, with an MTA of USD 500,000. What margin call is made, and what happens to the USD 420,000?","type":"mc","options":["A call for USD 420,000 is made, rounded to the nearest increment","No call is made; the USD 420,000 exposure carries forward unresolved into the next calculation","The USD 420,000 is automatically waived and removed from all future calculations","A call for USD 500,000 (the MTA itself) is made instead"],"answer":"No call is made; the USD 420,000 exposure carries forward unresolved into the next calculation","explanation":"Because USD 420,000 is below the USD 500,000 minimum transfer amount, no collateral movement occurs at all on this day — the exposure isn't rounded down to zero or waived, it simply carries forward and gets re-evaluated (netted against whatever the next day's fresh mark-to-market produces) at the next calculation.","chapter_ref":33},{"id":"exp5q1","question":"A firm receives an MCN claiming a counterparty's exposure is USD 5,500,000, but the firm's own calculation shows USD 5,300,000. What does standard market practice say the firm should do?","type":"mc","options":["Pay the full USD 5,500,000 claimed, then investigate the USD 200,000 gap","Pay the undisputed USD 5,300,000 immediately, then investigate the USD 200,000 difference separately","Refuse to pay anything until the discrepancy is fully resolved","Automatically escalate to the CSA's dispute resolution procedure without first discussing it with the counterparty"],"answer":"Pay the undisputed USD 5,300,000 immediately, then investigate the USD 200,000 difference separately","explanation":"Standard practice is to settle the undisputed amount right away — mitigating most of the exposure without delay — and investigate only the residual disputed difference, escalating to the CSA's formal dispute resolution procedure only if direct discussion fails to resolve it.","chapter_ref":34},{"id":"exp5q2","question":"A bond is Category III (corporate), rated A-, fixed coupon, with a residual maturity of over 10 years. Compared to a Category I (central government), AAA-rated, fixed coupon bond with under 1 year to maturity, what is true of its haircut?","type":"mc","options":["It will be lower, since fixed coupon bonds always carry lower haircuts regardless of rating or category","It will be substantially higher — lower liquidity category, lower credit rating, and longer residual maturity all independently push the haircut up","It will be identical, since haircuts only depend on coupon structure","It will be zero, since both bonds are investment grade"],"answer":"It will be substantially higher — lower liquidity category, lower credit rating, and longer residual maturity all independently push the haircut up","explanation":"Haircut schedules like the ECB's stack three variables at once: liquidity category, credit rating band, and residual maturity. A Category III/A-/10yr+ bond sits in a materially riskier bracket on all three dimensions than a Category I/AAA/under-1yr bond, so its haircut is far higher — not lower or equal.","chapter_ref":34},{"id":"exp5q3","question":"A firm's exposed counterparty proposes bond collateral. The firm's verification reveals the bond IS CSA-eligible, but the proposed quantity is inadequate to cover the exposure. What must the exposed party do?","type":"mc","options":["Accept the proposal anyway, since the bond itself is eligible","Say nothing, since silence is neutral and doesn't imply acceptance","Communicate the shortfall to the counterparty immediately, preferably in writing, so a revised proposal (more of the same bond, a different bond, or cash) can be submitted","Automatically invoke the CSA's dispute resolution procedure"],"answer":"Communicate the shortfall to the counterparty immediately, preferably in writing, so a revised proposal (more of the same bond, a different bond, or cash) can be submitted","explanation":"Silence from the exposed party is read by the non-ex
