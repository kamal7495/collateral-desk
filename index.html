<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Collateral Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#eef1ee; --paper-raised:#ffffff; --paper-sunken:#e3e8e2;
  --ink:#16241f; --ink-soft:#4c5b55; --ink-faint:#8b9c93;
  --line:rgba(22,36,31,.14); --line-strong:rgba(22,36,31,.26);
  --accent:#a9761f; --accent-ink:#6f4c14; --accent-soft:#f2e6cb; --accent-contrast:#fffaf0;
  --teal:#2f6f62; --teal-soft:#dfeeea;
  --danger:#a1462c; --danger-soft:#f3e2dc;
  --cat-core:#a9761f; --cat-repo:#2f6f62; --cat-slb:#3b4f8a; --cat-otc:#a1462c; --cat-legal:#6b3f6b; --cat-reg:#4b5b6e;
  --cat-core-soft:#f2e6cb; --cat-repo-soft:#dfeeea; --cat-slb-soft:#e1e5f2; --cat-otc-soft:#f3e2dc; --cat-legal-soft:#ece0ec; --cat-reg-soft:#e2e6ea;
  --shadow-card:0 12px 28px -16px rgba(22,36,31,.38);
  --shadow-pop:0 20px 48px -18px rgba(22,36,31,.45);
  --radius-lg:20px; --radius-md:13px; --radius-sm:8px; --radius-pill:999px;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --app-w:460px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141f1a; --paper-raised:#1c2a24; --paper-sunken:#0f1814;
    --ink:#eef1ee; --ink-soft:#b7c3bc; --ink-faint:#71827a;
    --line:rgba(238,241,238,.12); --line-strong:rgba(238,241,238,.22);
    --accent:#dcac4c; --accent-ink:#2a1d08; --accent-soft:rgba(220,172,76,.16); --accent-contrast:#211705;
    --teal:#5fb6a2; --teal-soft:rgba(95,182,162,.16);
    --danger:#dd8468; --danger-soft:rgba(221,132,104,.16);
    --cat-core:#dcac4c; --cat-repo:#5fb6a2; --cat-slb:#8b9de0; --cat-otc:#dd8468; --cat-legal:#c093c0; --cat-reg:#9db0bd;
    --cat-core-soft:rgba(220,172,76,.16); --cat-repo-soft:rgba(95,182,162,.16); --cat-slb-soft:rgba(139,157,224,.16); --cat-otc-soft:rgba(221,132,104,.16); --cat-legal-soft:rgba(192,147,192,.16); --cat-reg-soft:rgba(157,176,189,.16);
    --shadow-card:0 12px 28px -14px rgba(0,0,0,.5);
    --shadow-pop:0 20px 48px -16px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#141f1a; --paper-raised:#1c2a24; --paper-sunken:#0f1814;
  --ink:#eef1ee; --ink-soft:#b7c3bc; --ink-faint:#71827a;
  --line:rgba(238,241,238,.12); --line-strong:rgba(238,241,238,.22);
  --accent:#dcac4c; --accent-ink:#2a1d08; --accent-soft:rgba(220,172,76,.16); --accent-contrast:#211705;
  --teal:#5fb6a2; --teal-soft:rgba(95,182,162,.16);
  --danger:#dd8468; --danger-soft:rgba(221,132,104,.16);
  --cat-core:#dcac4c; --cat-repo:#5fb6a2; --cat-slb:#8b9de0; --cat-otc:#dd8468; --cat-legal:#c093c0; --cat-reg:#9db0bd;
  --cat-core-soft:rgba(220,172,76,.16); --cat-repo-soft:rgba(95,182,162,.16); --cat-slb-soft:rgba(139,157,224,.16); --cat-otc-soft:rgba(221,132,104,.16); --cat-legal-soft:rgba(192,147,192,.16); --cat-reg-soft:rgba(157,176,189,.16);
  --shadow-card:0 12px 28px -14px rgba(0,0,0,.5);
  --shadow-pop:0 20px 48px -16px rgba(0,0,0,.6);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:600;letter-spacing:-.01em;text-wrap:balance;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
a{color:inherit;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.muted{color:var(--ink-soft);}
.faint{color:var(--ink-faint);}

.frame{max-width:var(--app-w);margin:0 auto;min-height:100vh;background:var(--paper);position:relative;box-shadow:0 0 0 1px var(--line);}
.top{position:sticky;top:0;z-index:30;background:var(--paper);padding:18px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);}
.brand{font-family:var(--font-display);font-size:21px;font-weight:600;letter-spacing:-.02em;}
.brand em{font-style:italic;color:var(--accent);}
.brand-sub{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px;}
.top-chip{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);background:var(--paper-raised);border:1px solid var(--line);padding:5px 10px;border-radius:var(--radius-pill);white-space:nowrap;}
.top-right{display:flex;align-items:center;gap:8px;flex:none;}
.theme-toggle{width:32px;height:32px;flex:none;border-radius:50%;background:var(--paper-raised);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:transform .12s;}
.theme-toggle:active{transform:scale(.92);}
.theme-toggle svg{width:16px;height:16px;}

main{padding:18px 20px 110px;min-height:70vh;}
.stack{display:grid;gap:14px;}
.eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:500;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px;}
.section-head:first-child{margin-top:0;}
.section-title{font-size:19px;}
.section-link{font-family:var(--font-mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;}

/* ledger card */
.card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px 20px;position:relative;}
.card::before{content:"";position:absolute;left:20px;right:20px;top:0;height:2px;background:var(--accent);border-radius:0 0 2px 2px;opacity:0;}
.card.stamped::before{opacity:1;}
.card+.card{margin-top:0;}

/* dashboard hero */
.hero{background:linear-gradient(155deg,var(--ink) 0%,#233a31 100%);color:#f4f6f3;border-radius:var(--radius-lg);padding:22px 22px 20px;box-shadow:var(--shadow-card);position:relative;overflow:hidden;}
:root[data-theme="dark"] .hero,:root:not([data-theme="light"]) .hero{background:linear-gradient(155deg,#0c1512 0%,#1c2b24 100%);}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 90% -10%, rgba(220,172,76,.22), transparent 55%);pointer-events:none;}
.hero-row{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.hero-eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:rgba(238,241,238,.6);}
.hero-num{font-family:var(--font-display);font-size:44px;font-weight:600;line-height:1;letter-spacing:-.02em;margin-top:6px;}
.hero-sub{font-size:13px;color:rgba(238,241,238,.68);margin-top:4px;}
.hero-stat{text-align:right;}
.hero-stat b{display:block;font-family:var(--font-mono);font-size:20px;font-weight:600;}
.hero-stat span{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:rgba(238,241,238,.55);}
.hero-btn{position:relative;margin-top:18px;display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-contrast);font-weight:600;font-size:14.5px;padding:12px 20px;border-radius:var(--radius-pill);width:100%;justify-content:center;transition:transform .12s;}
.hero-btn:active{transform:scale(.98);}

/* desk picker chips */
.deskrow{display:flex;gap:8px;flex-wrap:wrap;}
.deskchip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px 8px 10px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:600;background:var(--paper-raised);border:1px solid var(--line);color:var(--ink-soft);transition:background .12s,color .12s,border-color .12s;}
.deskchip .dot{width:8px;height:8px;border-radius:50%;flex:none;}
.deskchip.is-active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
:root[data-theme="dark"] .deskchip.is-active,:root:not([data-theme="light"]) .deskchip.is-active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}

/* quick stats */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.stattile{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-md);padding:13px 12px;}
.stattile b{display:block;font-family:var(--font-mono);font-size:21px;font-weight:600;letter-spacing:-.01em;}
.stattile span{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);}

/* rowlist */
.rowlist{display:grid;}
.row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer;}
.row:last-child{border-bottom:none;}
.row-main{flex:1;min-width:0;}
.row-term{font-weight:600;font-size:14.5px;}
.row-sub{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);margin-top:2px;text-transform:uppercase;letter-spacing:.03em;}
.row-chev{color:var(--ink-faint);font-size:13px;}

/* stamp badge (category) */
.stamp{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:var(--radius-pill);}
.stamp .dot{width:6px;height:6px;border-radius:50%;}

/* accordion (desks) */
.acc{display:grid;gap:10px;}
.acc-item{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;}
.acc-head{width:100%;display:flex;align-items:center;gap:12px;padding:15px 16px;text-align:left;}
.acc-stampbar{width:4px;align-self:stretch;border-radius:3px;flex:none;}
.acc-title{font-weight:600;font-size:15.5px;flex:1;}
.acc-count{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);}
.acc-chev{color:var(--ink-faint);font-size:12px;transition:transform .16s;}
.acc-item.is-open .acc-chev{transform:rotate(90deg);color:var(--accent);}
.acc-mastery{margin-top:2px;display:block;}
.acc-panel{display:none;border-top:1px solid var(--line);padding:6px 8px 10px;}
.acc-item.is-open .acc-panel{display:block;}

/* mastery stars */
.stars{letter-spacing:2px;font-size:13px;}
.stars i{font-style:normal;color:var(--line-strong);}
.stars i.on{color:var(--accent);}

/* search */
.searchbar{display:flex;align-items:center;gap:8px;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-pill);padding:11px 15px;}
.searchbar input{border:none;background:none;outline:none;font-family:var(--font-body);font-size:14.5px;color:var(--ink);width:100%;}
.searchbar input::placeholder{color:var(--ink-faint);}
.searchmeta{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);margin:12px 2px 4px;text-transform:uppercase;letter-spacing:.05em;}

/* study / flashcard */
.progressline{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.progresstext{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-soft);}
.progresstext b{color:var(--ink);}
.dots{display:flex;gap:5px;}
.pdot{width:6px;height:6px;border-radius:50%;background:var(--line-strong);}
.pdot.done{background:var(--accent);}
.pdot.current{background:var(--ink);}

.flash{position:relative;border-radius:var(--radius-lg);min-height:340px;box-shadow:var(--shadow-card);background:var(--paper-raised);border:1px solid var(--line);padding:26px 24px;display:flex;flex-direction:column;}
.flash-head{display:flex;justify-content:space-between;align-items:center;}
.flash-body{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px;padding:10px 0;}
.flash-term{font-family:var(--font-display);font-size:29px;font-weight:600;letter-spacing:-.015em;line-height:1.15;text-wrap:balance;}
.flash-hint{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;}
.flash-def{font-size:15px;line-height:1.55;color:var(--ink-soft);text-align:left;}
.flash-def b{color:var(--ink);font-weight:600;}
.flash-related{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-strong);text-align:left;}
.flash-related-label{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-bottom:6px;}
.reveal-btn{margin-top:8px;display:inline-flex;align-self:center;align-items:center;gap:8px;background:var(--ink);color:var(--paper);font-weight:600;font-size:14px;padding:12px 26px;border-radius:var(--radius-pill);}
:root[data-theme="dark"] .reveal-btn,:root:not([data-theme="light"]) .reveal-btn{background:var(--accent);color:var(--accent-ink);}
.reveal-btn:active{transform:scale(.98);}

.gradebar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;}
.gradebtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:var(--radius-md);border:1px solid var(--line);background:var(--paper-raised);font-weight:600;font-size:12.5px;transition:transform .1s;}
.gradebtn:active{transform:scale(.96);}
.gradebtn .k{font-family:var(--font-mono);font-size:9px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
.gradebtn.again{color:var(--danger);}
.gradebtn.hard{color:var(--ink-soft);}
.gradebtn.good{color:var(--teal);}
.gradebtn.easy{color:var(--accent);}

.session-summary{text-align:center;padding:20px 4px;}
.summary-num{font-family:var(--font-display);font-size:52px;font-weight:600;}
.summary-sub{margin-top:6px;}

.emptybox{text-align:center;padding:40px 14px;color:var(--ink-soft);}
.emptybox .glyph{font-size:32px;margin-bottom:10px;display:block;}

/* stats */
.bigmetric{font-family:var(--font-display);font-size:46px;font-weight:600;letter-spacing:-.02em;line-height:1;}
.masteryrow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);}
.masteryrow:last-child{border-bottom:none;}
.masteryrow .lbl{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px;}
.pillrow{display:flex;flex-wrap:wrap;gap:7px;}
.pill{display:inline-flex;align-items:center;padding:6px 12px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;background:var(--paper-sunken);color:var(--ink-soft);}
.activitystrip{display:flex;gap:5px;align-items:flex-end;height:44px;}
.activitybar{flex:1;background:var(--paper-sunken);border-radius:3px 3px 0 0;position:relative;min-height:4px;}
.activitybar b{position:absolute;inset:auto 0 0 0;background:var(--accent);border-radius:3px 3px 0 0;display:block;}
.activitylabels{display:flex;gap:5px;margin-top:5px;}
.activitylabels span{flex:1;text-align:center;font-family:var(--font-mono);font-size:9px;color:var(--ink-faint);}

/* nav */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(var(--app-w),100%);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:var(--paper);background:color-mix(in srgb, var(--paper) 88%, transparent);backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--line);z-index:50;}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink-faint);padding:5px 12px;min-height:44px;justify-content:center;border-radius:10px;}
.tab svg{width:21px;height:21px;}
.tab.is-active{color:var(--accent);}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,18,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s;}
.modal-overlay.open{opacity:1;pointer-events:auto;}
.modal-sheet{width:100%;max-width:var(--app-w);max-height:82vh;overflow-y:auto;background:var(--paper-raised);border-radius:22px 22px 0 0;padding:22px 22px calc(28px + env(safe-area-inset-bottom));transform:translateY(16px);transition:transform .18s;box-shadow:var(--shadow-pop);}
.modal-overlay.open .modal-sheet{transform:translateY(0);}
.modal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--paper-sunken);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex:none;}
.modal-term{font-family:var(--font-display);font-size:25px;font-weight:600;letter-spacing:-.015em;margin-top:6px;}
.modal-def{font-size:15px;line-height:1.6;color:var(--ink-soft);margin-top:14px;}
.modal-def b{color:var(--ink);font-weight:600;}
.modal-foot{display:flex;gap:10px;margin-top:18px;}
.modal-foot button{flex:1;padding:12px;border-radius:var(--radius-pill);font-weight:600;font-size:13.5px;background:var(--paper-sunken);}
.modal-foot button.primary{background:var(--ink);color:var(--paper);}
:root[data-theme="dark"] .modal-foot button.primary,:root:not([data-theme="light"]) .modal-foot button.primary{background:var(--accent);color:var(--accent-ink);}

@media(max-width:380px){.hero-num{font-size:36px;}.flash-term{font-size:24px;}}

/* ---- Chapters / Book Map ---- */
.part-item{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;}
.part-head{width:100%;display:flex;align-items:center;gap:12px;padding:15px 16px;text-align:left;}
.part-title{font-weight:600;font-size:15px;flex:1;}
.part-sub{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);margin-top:2px;text-transform:uppercase;letter-spacing:.03em;}
.part-progress{width:36px;height:36px;flex:none;position:relative;}
.part-progress svg{transform:rotate(-90deg);}
.part-progress circle{fill:none;stroke-width:3;}
.part-progress .bg{stroke:var(--line-strong);}
.part-progress .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .3s;}
.part-chev{color:var(--ink-faint);font-size:12px;transition:transform .16s;}
.part-item.is-open .part-chev{transform:rotate(90deg);color:var(--accent);}
.part-panel{display:none;border-top:1px solid var(--line);}
.part-item.is-open .part-panel{display:block;}
.lifecycle-cta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 16px 14px;padding:11px 14px;background:var(--accent-soft);border-radius:var(--radius-md);}
.lifecycle-cta span{font-size:12.5px;font-weight:600;color:var(--accent);}
.lifecycle-cta button{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
.chrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;}
.chrow:first-child{border-top:none;}
.chnum{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);width:20px;flex:none;}
.chrow-main{flex:1;min-width:0;}
.chrow-title{font-size:13.5px;font-weight:600;line-height:1.3;}
.chrow-pages{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);margin-top:2px;}
.chread{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-strong);flex:none;display:flex;align-items:center;justify-content:center;}
.chread.is-read{background:var(--teal);border-color:var(--teal);color:#fff;font-size:11px;}

.ch-modal .modal-sheet{max-height:88vh;}
.ch-eyebrow-row{display:flex;align-items:center;gap:8px;}
.digest-list{display:grid;gap:10px;margin-top:6px;}
.digest-item{display:flex;gap:9px;font-size:14px;line-height:1.5;color:var(--ink-soft);}
.digest-item::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none;margin-top:8px;}
.example-box{background:var(--paper-sunken);border-radius:var(--radius-md);padding:13px 15px;margin-top:10px;}
.example-title{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700;margin-bottom:6px;}
.example-body{font-size:13.5px;line-height:1.55;color:var(--ink-soft);}
.ch-note{font-size:12px;font-style:italic;color:var(--ink-faint);margin-top:10px;border-top:1px dashed var(--line-strong);padding-top:10px;}

/* ---- Lifecycle player ---- */
.lc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.lc-close{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
.lc-name{font-family:var(--font-display);font-size:19px;font-weight:600;margin:2px 0 14px;}
.lc-track{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;}
.lc-dot{flex:1;min-width:6px;height:5px;border-radius:3px;background:var(--line-strong);}
.lc-dot.done{background:var(--accent);}
.lc-dot.current{background:var(--ink);}
.lc-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-lg);padding:26px 22px;min-height:280px;display:flex;flex-direction:column;box-shadow:var(--shadow-card);}
.lc-step-label{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;}
.lc-step-title{font-family:var(--font-display);font-size:22px;font-weight:600;margin:8px 0 12px;line-height:1.2;}
.lc-step-detail{font-size:14.5px;line-height:1.6;color:var(--ink-soft);flex:1;}
.lc-chapter-link{align-self:flex-start;margin-top:14px;font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.03em;}
.lc-nav{display:flex;gap:10px;margin-top:14px;}
.lc-nav button{flex:1;padding:13px;border-radius:var(--radius-pill);font-weight:600;font-size:14px;background:var(--paper-sunken);color:var(--ink);}
.lc-nav button.primary{background:var(--ink);color:var(--paper);}
:root[data-theme="dark"] .lc-nav button.primary,:root:not([data-theme="light"]) .lc-nav button.primary{background:var(--accent);color:var(--accent-ink);}
.lc-nav button[disabled]{opacity:.35;}

.lc-tabs{display:flex;gap:8px;margin-bottom:16px;}
.lc-tab{flex:1;text-align:center;padding:10px;border-radius:var(--radius-pill);font-weight:600;font-size:13px;background:var(--paper-sunken);color:var(--ink-soft);}
.lc-tab.is-active{background:var(--ink);color:var(--paper);}
:root[data-theme="dark"] .lc-tab.is-active,:root:not([data-theme="light"]) .lc-tab.is-active{background:var(--accent);color:var(--accent-ink);}
.lc-drill-label{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px;}
.lc-drill-label:first-child{margin-top:0;}
.lc-pool{display:grid;gap:8px;}
.lc-pool-item{text-align:left;padding:12px 14px;border-radius:var(--radius-md);border:1.5px solid var(--line);background:var(--paper-raised);font-size:13.5px;font-weight:600;}
.lc-picked{display:grid;gap:6px;}
.lc-picked-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-md);background:var(--paper-sunken);font-size:13px;font-weight:600;}
.lc-picked-item .num{font-size:11px;color:var(--ink-faint);width:16px;flex:none;}
.lc-picked-item.is-correct{background:var(--teal-soft);color:var(--teal);}
.lc-picked-item.is-wrong{background:var(--danger-soft);color:var(--danger);}
.lc-drill-score{text-align:center;font-family:var(--font-mono);font-size:13px;color:var(--ink-soft);margin:14px 0 10px;}

/* ---- Quiz ---- */
.quiz-q{font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.35;margin:10px 0 16px;text-wrap:balance;}
.quiz-opts{display:grid;gap:9px;}
.quiz-opt{text-align:left;padding:13px 15px;border-radius:var(--radius-md);border:1.5px solid var(--line);background:var(--paper-raised);font-size:14px;font-weight:600;line-height:1.4;}
.quiz-opt.is-correct{border-color:var(--teal);background:var(--teal-soft);color:var(--teal);}
.quiz-opt.is-wrong{border-color:var(--danger);background:var(--danger-soft);color:var(--danger);}
.quiz-opt[disabled]{cursor:default;}
.quiz-answer-box{background:var(--paper-sunken);border-radius:var(--radius-md);padding:14px 16px;margin-top:4px;}
.quiz-answer-label{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:5px;}
.quiz-answer-val{font-family:var(--font-mono);font-weight:700;font-size:15px;color:var(--ink);}
.quiz-explain{font-size:13.5px;line-height:1.55;color:var(--ink-soft);margin-top:12px;}
.quiz-selfgrade{display:flex;gap:10px;margin-top:16px;}
.quiz-selfgrade button{flex:1;padding:12px;border-radius:var(--radius-pill);font-weight:600;font-size:13.5px;}
.quiz-selfgrade .yes{background:var(--teal-soft);color:var(--teal);}
.quiz-selfgrade .no{background:var(--danger-soft);color:var(--danger);}
.quiz-next{margin-top:16px;}
.drill-input-row{display:flex;align-items:center;gap:10px;margin-top:6px;background:var(--paper-sunken);border-radius:var(--radius-md);padding:4px 4px 4px 16px;}
.drill-input-prefix{font-size:14px;color:var(--ink-faint);font-weight:600;}
.drill-input-row input{flex:1;min-height:44px;border:none;background:none;outline:none;font-family:var(--font-mono);font-size:17px;font-weight:600;color:var(--ink);padding:0 12px 0 0;}
.drill-input-row input::placeholder{color:var(--ink-faint);}
</style>

<script>
const CARDS = [{"id":"t0","term":"Accrued Days","def":"The number of days that have elapsed since the most recent Coupon Payment Date.","cat":"core","diff":1,"chapters":[34,4,5,7,2]},{"id":"t1","term":"Accrued Interest","def":"On Interest-Bearing Bonds, the accumulated interest since the most recent Coupon Payment Date and payable at the next coupon payment date. When a bond is used as Collateral, it’s full market value must include the current value of accrued interest.","cat":"core","diff":3,"chapters":[2,34,4,10,5,35]},{"id":"t2","term":"Agency Capacity","def":"A method of trading in which a firm acts as an intermediary between two parties, typically charging Commission for its services. Also known as a Broker.","cat":"core","diff":2,"chapters":[3]},{"id":"t3","term":"Agency Lending","def":"See Lending Agent.","cat":"slb","diff":1,"chapters":[12]},{"id":"t4","term":"AIFMD","def":"Acronym for Alternative Investment Fund Managers Directive","cat":"core","diff":1,"chapters":[47]},{"id":"t5","term":"Alternative Investment Fund","def":"In general terms, a collective investment scheme that invests in non-traditional asset types (e.g. Derivatives), and/or employs non- traditional investment strategies.","cat":"otc","diff":2,"chapters":[47]},{"id":"t6","term":"Alternative Investment Fund Managers Directive","def":"European regulatory framework governing the activities of managers of Alternative Investment Funds. Commonly known as AIFMD.","cat":"reg","diff":1,"chapters":[47]},{"id":"t7","term":"American Depository Receipt","def":"Documents that represent shares held in overseas companies and which enable US investors to invest in such securities in a tax efficient manner. ADRs are traded in their own right at a US Dollar price. See Global Depository Receipts.","cat":"core","diff":3,"chapters":[10]},{"id":"t8","term":"Amortising Swap","def":"A form of Interest Rate Swap in which the Notional Principal (on which all cashflows are based) reduces over time.","cat":"otc","diff":1,"chapters":[31]},{"id":"t9","term":"Annual General Meeting","def":"A 12-monthly assembly of a company’s board of directors and Shareholders, at which its future plans and performance are discussed, and voting opportunities arise.","cat":"core","diff":2,"chapters":[10]},{"id":"t10","term":"Anti-Money Laundering","def":"Legal procedures and controls designed to identify and report attempts to generate revenue illegally. See Money Laundering.","cat":"core","diff":1,"chapters":[]},{"id":"t11","term":"Asset-Backed Security","def":"Generic term for a Security whose value is derived from a collection of Underlying assets. See Mortgage-Backed Security.","cat":"core","diff":1,"chapters":[]},{"id":"t12","term":"Asset Manager","def":"An individual or organisation that manages the assets (normally Securities and cash) owned by its clients, with the general objective of maximising the return on the assets on behalf of the clients.","cat":"core","diff":2,"chapters":[21]},{"id":"t13","term":"ASX Code","def":"A 3-character number to uniquely identify individual Equity securities traded over the Australian Stock Exchange.","cat":"core","diff":1,"chapters":[]},{"id":"t14","term":"Asymmetrical Threshold","def":"An amount of Uncollateralised Exposure applicable to one party only, where threshold is applicable to Margin Calls made by the weaker- rated party, but not to the stronger-rated party.","cat":"otc","diff":2,"chapters":[22]},{"id":"t15","term":"Back-to-Back Trading","def":"Trade Execution in which a firm does not take a position, therefore any purchases are immediately sold, and vice versa. See Market Risk Neutral.","cat":"core","diff":2,"chapters":[27]},{"id":"t16","term":"Backloading","def":"1. The movement of Legacy Trades from the original (Bilateral) Counterparty to a Central Counterparty. 2.The reporting of existing trades to a Trade Repository.","cat":"reg","diff":2,"chapters":[47]},{"id":"t17","term":"BackUp Clearing Member","def":"Where a Non Clearing Member (NCM) utilises the services of a Clearing Member (CM) at a Central Counterparty, a BackUp Clearing Member (BUCM) is appointed to transfer the NCM’s positions to the BUCM in the event of default by the CM. See Porting.","cat":"reg","diff":3,"chapters":[47]},{"id":"t18","term":"Bank for International Settlements","def":"A Switzerland-based institution which supports numerous central banks and encourages international financial cooperation and stability.","cat":"reg","diff":2,"chapters":[48]},{"id":"t19","term":"Bank Interest","def":"Cash interest which is payable or receivable on cash loans/deposits and Repo trades. The day count is actual (calendar) days, and the divisor is dependent upon the currency involved, either 360 (EUR/USD) or 365 (GBP).","cat":"repo","diff":2,"chapters":[4]},{"id":"t20","term":"Bankruptcy","def":"The insolvency of a bond issuer in a Credit Default Swap. The occurrence of issuer bankruptcy will cause payout by the Protection Seller to the Protection Buyer. One type of Credit Event.","cat":"otc","diff":2,"chapters":[41,22,36,21,46]},{"id":"t21","term":"Base Currency","def":"1. I n a Foreign Exchange trade, a firm’s existing currency that they wish to sell, resulting in the purchase of the Quote Currency at the agreed exchange rate. 2. I n a Credit Support Annex, the currency into which Exposures and Collateral are converted.","cat":"legal","diff":3,"chapters":[22,18,19,23,11,13]},{"id":"t22","term":"Basel Committee on Banking Supervision","def":"A worldwide organisation that sets standards for regulation and working practices of banks globally.","cat":"reg","diff":1,"chapters":[48]},{"id":"t23","term":"Basis Points Per Annum","def":"A means of expressing a price or rate, where 1 basis point is 1/100th of 1%, therefore 0.01% (171 bppa = 1.71%).","cat":"core","diff":1,"chapters":[16,17,33,22,9,10]},{"id":"t24","term":"Basket Default Swap","def":"A Credit Default Swap in which multiple Reference Entities are applicable (as opposed to a single issuer as is the case in a Single Name Credit Default Swap).","cat":"otc","diff":2,"chapters":[17]},{"id":"t25","term":"BCBS","def":"Acronym for Basel Committee on Banking Supervision.","cat":"reg","diff":1,"chapters":[48]},{"id":"t26","term":"Bearer Security","def":"A Security issued in the form of physical paper Certificates which has no facility for the Issuer to record the owner of the security, and where proof of ownership is physical possession of the security certificate; historically, mainly Bonds rather than Equity were issued in bearer form. See Bond Denominational Values. For comparison, see Registered Security.","cat":"core","diff":4,"chapters":[]},{"id":"t27","term":"Beneficial Owner and Beneficial Ownership","def":"In Collateral -related transactions executed under the GMRA, the GMSLA and the English Law CSA, the beneficial owner of securities collateral is the Collateral Giver. This means that all benefits that accrue on the Securities (e.g. Coupon, Dividends and other Corporate Actions) are owed by the Collateral Taker (the Legal Owner) to the collateral giver.","cat":"legal","diff":4,"chapters":[9,10,13]},{"id":"t28","term":"Big Bang Protocol","def":"Relating to Credit Default Swaps, the introduction of a number of structural changes to standardise certain aspects of CDS trades, such as Fixed Coupons.","cat":"otc","diff":2,"chapters":[46]},{"id":"t29","term":"Bilateral","def":"A term which indicates a financial transaction is executed directly between two firms, such as a Buy-Side firm trading with a Sell- Side firm. The term is not applicable to a trade in which a Central Counterparty is involved.","cat":"reg","diff":2,"chapters":[18,20,14,15,48,7,8,13]},{"id":"t30","term":"Bilateral CSA","def":"A Credit Support Annex in which the stated terms are applicable to both parties. See One-Way CSA.","cat":"otc","diff":1,"chapters":[22]},{"id":"t31","term":"BIS","def":"Acronym for Bank for International Settlements.","cat":"core","diff":1,"chapters":[]},{"id":"t32","term":"Block Trade","def":"A financial transaction in which a Fund Manager executes a trade with a Sell-Side firm as Counterparty, but where the decision as to which of the fund manager’s underlying funds the trade will be allocated is yet to be made. Once the decision is made, the ‘block’ trade will be replaced by the ‘allocations’ to the various underlying funds.","cat":"core","diff":4,"chapters":[29,38]},{"id":"t33","term":"Bond","def":"A type of Security that represents a loan of cash by an investor to a government, government agency, supranational organisation or company, for which the investor usually receives a fixed rate of interest periodically during the term of the loan, and receives repayment of capital at maturity of the bond, usually years later.","cat":"core","diff":4,"chapters":[4,2,34,36,42]},{"id":"t34","term":"Bond Collateral","def":"In Collateral -related transactions (Repo, Securities Lending & Borrowing, OTC Derivatives) the use of one or more bonds to mitigate the risk of the Exposed Party.","cat":"otc","diff":2,"chapters":[4,36,5,35,34,42]},{"id":"t36","term":"Bond Denominational Value","def":"Bonds are normally issued in one (or more) denomination or quantity. For example, a bond issued to raise a total of EUR 1,000,000,000 may be issued in a single denomination of EUR 10,000, meaning that deliveries of that bond must be made in multiples of that denomination. (It is not possible to deliver a bond quantity that is not a multiple of the bond’s smallest denomination.)","cat":"core","diff":4,"chapters":[1,4,2,34,36,42,32,35]},{"id":"t37","term":"Bond Exchange Offer","def":"An offer made by a Bond Issuer to the Bondholders, in which the existing bond may/will be exchanged for another bond or other asset. One form of Corporate Action.","cat":"core","diff":2,"chapters":[36]},{"id":"t38","term":"Bond Repurchase Offer","def":"An offer made by a bond issuer to the bondholders, in which the issuer offers to repurchase (buy) the bond at a defined price. One form of Corporate Action.","cat":"repo","diff":2,"chapters":[2]},{"id":"t39","term":"Bondholder","def":"The owner of Bonds.","cat":"core","diff":1,"chapters":[2,22,10]},{"id":"t40","term":"Bond Issue","def":"An individual Bond.","cat":"core","diff":1,"chapters":[36,2,4,22,34]},{"id":"t41","term":"Bond Issue Downgrade","def":"The reduction in a Rating Agency’s opinion (expressed as a lower rating) as to whether a Bond Issuer will make interest (Coupon) payments and Capital Repayment, when falling due; such revised ratings reflect the perceived risk of Issuer Default. For Collateral management purposes, such downgrades may cause the bond to be no longer classified as Eligible Collateral.","cat":"core","diff":4,"chapters":[22,42]},{"id":"t42","term":"Bond Issuer","def":"The entity that has issued a Bond and has received capital in exchange, from Bondholders.","cat":"core","diff":1,"chapters":[41,17,4,36,34]},{"id":"t43","term":"Bonus Issue","def":"The grant of additional Shares by an Issuer to its Shareholders, free of cost to the shareholders, typically at a fixed ratio of additional shares to original shares. One type of Corporate Action.","cat":"core","diff":2,"chapters":[22,10]},{"id":"t44","term":"Book Entry","def":"A method by which Settlement of trades is effected, whereby the exchange of Securities and cash involves no physical movement of securities, as both the seller and buyer use the same Custodian; under such circumstances, settlement results in a transfer of securities and cash between seller and buyer, within the custodian’s books.","cat":"core","diff":4,"chapters":[34,35,2]},{"id":"t45","term":"Books & Records","def":"The internal record of an organisation’s trading activity, positions in various financial instruments (e.g. Securities, Derivatives) and cash positions.","cat":"otc","diff":2,"chapters":[4,34,11,5,42]},{"id":"t46","term":"Books Closing Date","def":"The date at which a company’s Share Register is temporarily closed for the purpose of identifying, for example, the Shareholders to whom Corporate Action benefits, such as Dividends or Bonus Issues, will be paid. Also known as Record Date.","cat":"core","diff":3,"chapters":[4,5,10]},{"id":"t47","term":"Borrower","def":"An entity that issues Bonds as a means of raising cash is said to be the borrower of cash. Also known as the Issuer.","cat":"slb","diff":1,"chapters":[10,4,12,11,7,13,41]},{"id":"t48","term":"BPPA","def":"Acronym for Basis Points Per Annum.","cat":"core","diff":1,"chapters":[22,11,10,17,9]},{"id":"t49","term":"Broker","def":"An organisation that executes trades on behalf of its clients (rather than on its own behalf), by finding buyers where clients wish to sell and finding sellers where clients wish to buy financial instruments. True brokers intend to not take Trading Positions, and therefore this form of trading is regarded as low risk. Such firms are said to act in an Agency Capacity. For comparison, see Proprietary Trading.","cat":"core","diff":5,"chapters":[3,10,47,27]},{"id":"t50","term":"Buy-In","def":"A formal procedure for a buyer to force the seller to deliver Securities owing, with associated costs payable by the seller; such procedures must be conducted under the rules of the Stock Exchange or market authority over which the trade has been Executed. For comparison, see Sell-Out.","cat":"slb","diff":3,"chapters":[9,10,11,6]},{"id":"t51","term":"Buy/Sell Back","def":"A form of Repo transaction in which the Opening Leg and the Closing Leg are treated as two independent trades, whereas the two legs in a Classic Repo trade are linked to each other.","cat":"repo","diff":2,"chapters":[7]},{"id":"t52","term":"Buy-Side","def":"Generic term to describe the Institutional Investor community that purchases financial instruments (e.g. Equity, Bonds, OTC Derivatives) from Sell-Side firms (Investment Banks or Brokers). Note that institutional investors also sell such financial instruments.","cat":"otc","diff":3,"chapters":[3,47,10,29,22,9]},{"id":"t53","term":"Call Option","def":"A Derivative transaction in which the Option holder has the right (but not the obligation) to buy the Underlying product at a pre-agreed price (known as the Exercise Price or Strike Price), no later than the option’s expiry date. See Put Option.","cat":"otc","diff":3,"chapters":[14,36,2]},{"id":"t54","term":"Callable Bonds","def":"Debt instruments which have a feature permitting Redemption (by the Issuer) prior to the bond’s Maturity Date. For comparison, see Puttable Bonds.","cat":"core","diff":2,"chapters":[2,36]},{"id":"t55","term":"Capital Adequacy","def":"Regulatory requirement for Investment Banks and other financial institutions to have sufficient capital (funds) available to meet their contractual obligations.","cat":"reg","diff":2,"chapters":[]},{"id":"t56","term":"Capital Markets","def":"Generic term for the financial marketplace in which Equity and Bond Securities are firstly brought to the marketplace (in the Primary Market) and then traded in the Secondary Market.","cat":"core","diff":2,"chapters":[]},{"id":"t57","term":"Capital Repayment","def":"The return of capital by a Bond Issuer to Bondholders, scheduled to occur on the bond’s Maturity Date but which can occur sooner in bonds that are redeemable earlier. See Callable Bonds and Puttable Bonds.","cat":"legal","diff":2,"chapters":[2]},{"id":"t58","term":"Capital Requirement","def":"The value of assets a firm needs to set aside and avoid using, in recognition of the firm’s risk. A regulatory prerequisite; also known as regulatory capital.","cat":"reg","diff":2,"chapters":[30]},{"id":"t59","term":"Cash-Based Repo","def":"A Repo trade in which the primary motivation is for one party to borrow cash, requiring the cash borrower to provide collateral (normally in the form of Bonds) to mitigate the cash lender’s risk of their cash failing to be returned. See Stock-Based Repo.","cat":"repo","diff":3,"chapters":[6,32,4,34,3]},{"id":"t60","term":"Cash Collateral","def":"Collateral given or taken in the form of currency for the following transaction types: 1. Securities Lending may be collateralised by the Securities Borrower in the form of c urrency. 2. OTC Derivative exposures may be mitigated by the Non-Exposed Party providing currency.","cat":"otc","diff":3,"chapters":[11,10,22,48,12,27,32,35]},{"id":"t61","term":"Cash Collateral Reinvestment","def":"Where an Exposed Party receives Collateral in the form of cash, the loan of such cash into the Money Market, with the aim of earning a superior interest rate to the rate agreed to be paid to the Non-Exposed Party (i.e. the Rebate Rate) at the close of the trade.","cat":"slb","diff":3,"chapters":[11]},{"id":"t62","term":"Cash Correspondent","def":"The bank a firm uses to make outgoing cash payments, and to receive incoming cash payments. Some firms have a cash correspondent per currency, whereas other firms may utilise one cash correspondent (a single point of contact) that itself has a network of underlying banks per currency. Also known as Nostro, particularly in the world of securities operations.","cat":"core","diff":4,"chapters":[5,18,4,11,23]},{"id":"t63","term":"Cash Dividend","def":"The payment to Shareholders by an Issuer, of Income in the form of cash; whilst such payments are not guaranteed, many large companies pay cash dividends at regular intervals.","cat":"core","diff":2,"chapters":[10]},{"id":"t64","term":"Cash Payment Risk","def":"When paying cash by the traditional payment method (i.e. issuing a Settlement Instruction to a Cash Correspondent), the risk that payment is made to the incorrect recipient, due to there being no method of matching settlement instructions prior to payment being made. Risk is reduced if payment is made via CLS Bank.","cat":"core","diff":4,"chapters":[10]},{"id":"t65","term":"Cash Settlement","def":"In a Credit Default Swap and following a Credit Event, a settlement method whereby the Protection Seller pays a cash amount to the Protection Buyer in full and final settlement. For comparison, see Physical Settlement.","cat":"otc","diff":2,"chapters":[17,5,23,2,7]},{"id":"t66","term":"CCP","def":"Acronym for Central Counterparty.","cat":"reg","diff":1,"chapters":[47,46,7,48,10]},{"id":"t67","term":"CCP-Eligible Assets","def":"Financial assets used as Collateral (normally cash in specified currencies and highly rated Bonds) that are acceptable to Central Counterparties, as defined under EMIR. See Non-CCP-Eligible Assets.","cat":"reg","diff":2,"chapters":[47]},{"id":"t68","term":"CDS","def":"Common abbreviation for Credit Default Swap.","cat":"otc","diff":1,"chapters":[17,41,46,22,47]},{"id":"t69","term":"Central Bank","def":"A national institution that regulates banks and executes Monetary Policy, with the aim of controlling inflation and stability of the nation’s currency.","cat":"reg","diff":2,"chapters":[3,4,34,46,47,48]},{"id":"t70","term":"Central Bank Money","def":"Coins and notes of a particular currency that have been introduced by a Central Bank (as opposed to commercial bank money). Additionally, the holding and movement of such cash only within the books of the central bank.","cat":"reg","diff":2,"chapters":[10]},{"id":"t71","term":"Central Clearing","def":"The act of a Central Counterparty becoming Counterparty to both the original buyer and the original seller, then performing Trade Processing and Collateral Processing with the original buyer and original seller throughout the lifetime of the trade. The benefit to both the original buyer and the original seller is that Counterparty Risk is reduced due to the strength and risk mitigation techniques of the central counterparty.","cat":"reg","diff":5,"chapters":[46,47,7,48,32]},{"id":"t72","term":"Central Counterparty","def":"An organisation that places itself between the original parties to a trade, becoming the Counterparty to both seller and buyer; the resultant contractual obligation is between seller and central counterparty, and buyer and central counterparty. Due to various risk mitigation measures utilised by central counterparties, as a firm’s counterparty they are considered to be low risk. Such organisations practice Multilateral Netting.","cat":"otc","diff":5,"chapters":[46,7,47,48,14]},{"id":"t73","term":"Central Securities Depository","def":"The ultimate storage location of Securities within a financial centre, in which the record of ownership is typically maintained electronically (by Book Entry). Settlement (delivery of securities and payment of cash) of trades and Collateral movements occur following the CSD’s receipt of Settlement Instructions from the account holders. A type of Custodian organisation.","cat":"core","diff":4,"chapters":[2,23,43,42,10,7]},{"id":"t74","term":"Centrally Cleared Trade","def":"For OTC Derivatives under E MIR, trades which comply with the regulatory requirement to be Novated to a Central Counterparty. The requirement relates to 1) standardised trades, and 2) both original parties must be subject to the Clearing Obligation. See Non-Centrally Cleared Trades.","cat":"reg","diff":3,"chapters":[48]},{"id":"t75","term":"Certificate","def":"Document of ownership in a Security; certificates have historically been issued in Registered or Bearer form. In many financial centres today, certificates are not issued and proof of ownership is held electronically within Book-Entry systems at Central Securities Depositories.","cat":"core","diff":3,"chapters":[2]},{"id":"t76","term":"CET","def":"Acronym for Central European Time.","cat":"core","diff":1,"chapters":[4]},{"id":"t77","term":"Cheapest to Deliver","def":"Where assets are owed by one party to another, but where no specific asset is stated, the delivering party may choose which specific asset to deliver in settlement. Such situations allow the delivering party to acquire and then deliver the asset that is least expensive.","cat":"core","diff":3,"chapters":[27]},{"id":"t78","term":"CHESS","def":"Clearing House Electronic Subregister System; the normal place of Settlement for Equity traded in Australia. CHESS effects settlement for its account holders on a Book- Entry basis.","cat":"reg","diff":2,"chapters":[2]},{"id":"t79","term":"Classic Repo","def":"A popular form of Repo transaction in which the Opening Leg and the Closing Leg are treated as one transaction (with two connected legs). See Buy/Sell Back.","cat":"repo","diff":2,"chapters":[4,7,5,6,22]},{"id":"t80","term":"Clean Price","def":"The price of a Bond, excluding Accrued Interest; the total Market Value and Collateral Value of a bond includes its current value of accrued interest, therefore accrued interest must be added to the clean price. The alternative is Dirty Price.","cat":"core","diff":3,"chapters":[33,34,4,5,7,35]},{"id":"t81","term":"Clearing House","def":"An alternative name for a Central Counterparty.","cat":"reg","diff":1,"chapters":[14,2,10]},{"id":"t82","term":"Clearing Member","def":"A firm that holds one or more accounts directly at a Central Counterparty. Such account holders are typically Sell-Side firms, which may offer Client Clearing services.","cat":"reg","diff":2,"chapters":[47,46]},{"id":"t83","term":"Clearing Obligation","def":"Under EMIR, any OTC Derivative trade executed from the effective date must be cleared by a Central Counterparty, providing the involved parties are either a Financial Counterparty or a Non-Financial Counterparty whose trading activity surpasses the defined Clearing Threshold. See NFC + and NFC−.","cat":"otc","diff":3,"chapters":[47,48,46]},{"id":"t84","term":"Clearing Threshold","def":"Under EMIR, a level of trading activity in OTC Derivatives above which a Non-Financial Counterparty (NFC) is obliged to clear their trades via a Central Counterparty, and below which an NFC is exempt. See NFC + and NFC−.","cat":"otc","diff":2,"chapters":[48,47]},{"id":"t85","term":"Clearstream International","def":"Located in Luxembourg, one of the two International Central Securities Depositories (ICSDs) offering custody and Settlement services to its participants; the other ICSD is Euroclear.","cat":"core","diff":2,"chapters":[36,43,2,10]},{"id":"t86","term":"Client Clearing","def":"A service offered by some Clearing Members (CM) of a Central Counterparty, whereby the CM holds trades and positions for and on behalf of Non-Clearing Members in one or more accounts that are segregated from the CM’s own trades and positions.","cat":"reg","diff":3,"chapters":[47,46]},{"id":"t87","term":"Close Out Netting","def":"Should a firm’s Counterparty experience an Event of Default, the current Market Value of all Open Trades is determined, following which the positive and negative trade values are Set Off(netted) into a cash amount payable by either the firm or its counterparty.","cat":"otc","diff":3,"chapters":[21,22]},{"id":"t88","term":"Closing Leg and Closing Value Date","def":"In a two-sided transaction (e.g. Repo and Securities Lending & Borrowing), the date at which the re-exchange of assets is intended to occur.","cat":"slb","diff":2,"chapters":[4,5,7,11]},{"id":"t89","term":"CLS Bank","def":"A cash Settlement system which facilitates the payment and receipt of cash in multiple currencies for its members, avoiding the traditional risk associated with non-matching of payment instructions. Settlement of Foreign Exchange trades is achieved on a simultaneous exchange basis, whilst one-way currency payments are also catered for. See Herstatt Risk.","cat":"core","diff":4,"chapters":[18,19]},{"id":"t90","term":"Collateral","def":"Where a transaction (e.g. Repo, Securities Lending & Borrowing, OTC Derivative) is executed between two firms, and where Exposure arises for either firm, assets which must be provided by the Non-Exposed Party to the Exposed Party in order to mitigate the exposed party’s risk, in accordance with a signed legal agreement. Collateral assets are typically cash or Bonds.","cat":"otc","diff":4,"chapters":[1,2,3,7,10,22]},{"id":"t91","term":"Collateral Basket","def":"Predefined categories or groupings of Collateral for delivery in order to satisfy an Exposure. See DBV Basket.","cat":"repo","diff":1,"chapters":[7]},{"id":"t92","term":"Collateral Call","def":"A communication issued by an Exposed Party to the Non-Exposed Party, to claim Collateral assets. More commonly known as a Margin Call.","cat":"otc","diff":1,"chapters":[32]},{"id":"t93","term":"Collateral Giver","def":"The party (the Non-Exposed Party) that has given Collateral to the Exposed Party in order to mitigate the exposed party’s risk. Also known as Transferor. See Collateral Taker.","cat":"core","diff":2,"chapters":[8,1,3,42,22,34,43]},{"id":"t94","term":"Collateral In Transit","def":"Assets given as Collateral by a Non-Exposed Party, but which have not yet been received by the Exposed Party.","cat":"core","diff":1,"chapters":[33,34]},{"id":"t95","term":"Collateral Management","def":"Identification of Exposure in certain types of financial transaction, and utilisation of financial instruments in order to mitigate such exposures. Exposures arise for lenders of assets, such as the cash lender in a Repo, and the securities lender in a Securities Lending & Borrowing trade. Exposures also arise for parties to OTC Derivative trades, due to changes in the current Market Value of a trade.","cat":"slb","diff":4,"chapters":[10,47,22,4,48,21,28]},{"id":"t96","term":"Collateral Processing","def":"For OTC Derivatives, a generic term given to the area (within Buy-Side and Sell-Side firms) responsible for the management of trade Exposures through the giving and receipt of Collateral. The alternative is Trade Processing. Each trade creates the need for both collateral processing and trade processing.","cat":"otc","diff":3,"chapters":[30,27,15,29,24]},{"id":"t97","term":"Collateral Substitution","def":"In a Collateral -related transaction (Repo, Securities Lending & Borrowing, OTC Derivative), the exchange of an asset that is currently being used as collateral for a different asset.","cat":"otc","diff":2,"chapters":[48,42,22,10,4,7,43]},{"id":"t98","term":"Collateral Taker","def":"The party (the Exposed Party) that has received Collateral from the Non- Exposed Party in order to mitigate the exposed party’s risk. Also known as Transferee. See Collateral Giver.","cat":"core","diff":2,"chapters":[8,1,3,43,42,34,13,36]},{"id":"t99","term":"Collateral Transformation","def":"The act of temporarily exchanging Non CCP Eligible Assets to CCP- Eligible Assets, in order to satisfy Margin Calls received from a Central Counterparty.","cat":"reg","diff":2,"chapters":[47]},{"id":"t100","term":"Collateral Value","def":"The value of a financial asset given/taken in order to mitigate an Exposure; such value is derived by taking the Current Market Value of the asset, then deducting any applicable Haircut.","cat":"core","diff":2,"chapters":[4,34,10,22,2,32,35]},{"id":"t101","term":"Collateralised Cash Borrowing","def":"The borrowing of cash against the delivery of another financial asset in order to mitigate the cash lender’s risk and therefore to minimise borrowing costs. The alternative is Unsecured Cash Borrowing.","cat":"slb","diff":2,"chapters":[3]},{"id":"t102","term":"Commingle","def":"Generically speaking, to blend or to amalgamate. From a Collateral Taker’s perspective, to hold Securities Collateral received in the same CSD or Custodian account as the taker’s own securities.","cat":"legal","diff":2,"chapters":[10]},{"id":"t103","term":"Commission","def":"Amount charged by a Broker to its client, for execution of a purchase or sale of securities on the client’s behalf.","cat":"core","diff":1,"chapters":[46,48,27,47,3]},{"id":"t104","term":"Common Stock","def":"The standard description of Shares issued by companies in the United States. See Ordinary Shares.","cat":"core","diff":1,"chapters":[10,22]},{"id":"t105","term":"Comparative Advantage","def":"The benefit that one party can gain (e.g. when borrowing cash) in comparison with another party, due to the type of firm involved or their geographic location.","cat":"slb","diff":2,"chapters":[19]},{"id":"t106","term":"Competitive Blind Auction","def":"A bidding process in which the bidders make their bids based upon their own valuation of the product on offer, and without being aware of the details of bids made by other bidders.","cat":"slb","diff":2,"chapters":[12]},{"id":"t107","term":"Concentration Limit","def":"A restriction placed on the type of assets receivable as Collateral from a Counterparty in order to mitigate an Exposure. For example, no more than 50% of the total exposure amount can be mitigated by collateral issued by a single Bond Issuer.","cat":"core","diff":3,"chapters":[4,47]},{"id":"t108","term":"Contract Specification","def":"In an Exchange-Traded Derivative (including Futures and Options), definition of the derivative product’s trading terms (i.e. features and characteristics) as defined by the exchange, and tradable under such terms by the exchange members.","cat":"otc","diff":3,"chapters":[]},{"id":"t109","term":"Contractual Obligations","def":"Actions and responsibilities that are documented within legal agreements. A party that fails to comply with such responsibilities is said to be in Default.","cat":"core","diff":2,"chapters":[34,2,9,35,21]},{"id":"t110","term":"Contractual Settlement","def":"The crediting or debiting of Securities and/or cash to reflect settlement on Value Date, regardless when the exchange of securities and cash actually occurs.","cat":"core","diff":2,"chapters":[9]},{"id":"t111","term":"Contractual Settlement Date","def":"The intended date of exchange of Securities and cash between buyer and seller. Another term for Value Date.","cat":"core","diff":1,"chapters":[9]},{"id":"t112","term":"Convertible Bond","def":"A Bond issued by a company that pays a fixed Coupon and gives the Bondholder the right to convert the bond into another of the Issuer’s assets, (usually) a fixed quantity of the issuer’s Equity.","cat":"core","diff":2,"chapters":[2]},{"id":"t113","term":"Corporate Action","def":"The distribution (by an Issuer), of benefits to existing Shareholders or Bondholders, or a change to the structure of an existing security.","cat":"core","diff":2,"chapters":[10,43,36,4,2]},{"id":"t114","term":"Corporate Action Data Vendor","def":"An organisation that supplies information to subscribers regarding the detail of Corporate Actions as and when announced, typically on an electronic basis.","cat":"core","diff":2,"chapters":[36]},{"id":"t115","term":"Counterparty","def":"The opposing entity with which a firm executes a financial transaction.","cat":"core","diff":1,"chapters":[22,34,4,48,47]},{"id":"t116","term":"Counterparty Credit","def":"See Counterparty Risk.","cat":"core","diff":1,"chapters":[7,48,22,30,27]},{"id":"t117","term":"Counterparty Onboarding","def":"The multi-faceted and regulatory procedure by which a firm assesses the potential counterparty’s suitability as a true counterparty with which the firm is prepared to enter into transactions.","cat":"reg","diff":2,"chapters":[25]},{"id":"t118","term":"Counterparty Risk","def":"The risk that the Counterparty to a trade will fail to honour its Contractual Obligations (e.g. to pay cash or deliver Securities), as and when such obligations fall due.","cat":"core","diff":2,"chapters":[22,30,7,20,47,36]},{"id":"t119","term":"Coupon","def":"On Interest-Bearing Bonds, historically Bond Certificates were issued with paper coupons attached; each coupon represents interest due on one specified Coupon Payment Date. Although today bonds are usually issued in electronic form, the nickname of ‘coupon’ continues to be used to describe interest payments on bonds.","cat":"core","diff":4,"chapters":[2,4,43,34,36,42]},{"id":"t120","term":"Coupon Claim","def":"A communication issued by one party to its Counterparty, requesting remittance of the value of a Coupon Payment.","cat":"core","diff":1,"chapters":[43,36]},{"id":"t121","term":"Coupon Paying Agent","def":"An organisation appointed by an Issuer to collect Coupons from Bondholders, verify the validity of the coupons and to make coupon payments to the bondholders on behalf of the issuer.","cat":"core","diff":2,"chapters":[]},{"id":"t122","term":"Coupon Payment","def":"The payment of interest by a Bond Issuer to Bondholders in accordance with the Issue terms, whether a Fixed Rate Bond, a Floating Rate Note or a Convertible Bond.","cat":"core","diff":2,"chapters":[43,4,2,36,34]},{"id":"t123","term":"Coupon Payment Date","def":"The scheduled date of a Coupon Payment.","cat":"legal","diff":1,"chapters":[34,43,2,36,23]},{"id":"t124","term":"Coupon Period","def":"The period of time between each payment of interest on a Bond.","cat":"core","diff":1,"chapters":[43,2,4]},{"id":"t125","term":"Coupon Rate","def":"The rate of interest payable by the Bond Issuer to the Bondholders.","cat":"core","diff":1,"chapters":[2,43,36,34,23]},{"id":"t126","term":"Covered Short","def":"A sale of Securities which are not owned by the seller (a Short Sale), for which the relevant securities have been borrowed thereby facilitating settlement of the sale. The alternative is a Naked Short.","cat":"slb","diff":2,"chapters":[10]},{"id":"t127","term":"Credit Default Swap","def":"A type of OTC Derivative trade in which one party (Protection Buyer) pays a regular Premium to its Counterparty (Protection Seller) who provides financial protection in the event of bond Issuer Default. Should the issuer default during the lifetime of the CDS trade, the protection seller must pay the protection buyer. Credit Default Swaps can also be applied to cash loans.","cat":"otc","diff":4,"chapters":[17,14,23,30,22,40]},{"id":"t128","term":"Credit Derivative","def":"An umbrella term covering a family of Derivative products, all of which are designed to transfer the risk of cash borrower default from a cash lender to another party (except the cash borrower). Credit Derivatives include Credit Default Swaps and Index CDS.","cat":"otc","diff":3,"chapters":[17,1]},{"id":"t129","term":"Credit Event","def":"The term given to an Event of Default by a Reference Entity in a Credit Default Swap; this triggers payout by the Protection Seller to the Protection Buyer.","cat":"otc","diff":2,"chapters":[41,17,44,28,37]},{"id":"t130","term":"Credit Interest Rate Environment","def":"The general conditions in the Money Market in which loans of cash result in the cash lender receiving interest on the cash amount lent. Conversely, in a debit/negative rate environment, the cash lender pays interest to the cash borrower.","cat":"slb","diff":3,"chapters":[47]},{"id":"t131","term":"Credit Line","def":"An overdraft limit provided by a bank to its customer.","cat":"core","diff":1,"chapters":[4,5,11]},{"id":"t132","term":"Credit Rating","def":"See Bond Issue Downgrade.","cat":"core","diff":1,"chapters":[34,4,22,42,35,48]},{"id":"t133","term":"Credit Risk","def":"The possibility that a party that is borrowing an asset will Default on its contractual obligation to return such asset on the due date.","cat":"slb","diff":2,"chapters":[22,7,46,48,30]},{"id":"t134","term":"Credit Support Annex","def":"A legal document that defines the Collateral arrangements between two parties, relating to OTC Derivatives. Commonly known as C SA.","cat":"otc","diff":1,"chapters":[22,36,23,33,34,21,45]},{"id":"t135","term":"Creditworthiness","def":"An assessment of an entity’s ability to repay cash borrowed, and therefore the likelihood of Default. See Ratings Agencies.","cat":"core","diff":1,"chapters":[47,17,22,34,2,38]},{"id":"t136","term":"CREST","def":"The system name of the Central Securities Depository for the UK and Ireland, operated by Euroclear UK and Ireland. The normal place of Settlement for Equity traded in those countries.","cat":"core","diff":2,"chapters":[7,36]},{"id":"t137","term":"Cross-Currency Swap","def":"A type of OTC Derivative trade in which two parties exchange principal amounts in different currencies at the start of the trade, with the reverse exchange occurring at the close of the trade, and with the exchange of interest payments in different currencies periodically. For comparison, see Foreign Exchange Swap.","cat":"otc","diff":4,"chapters":[19,14]},{"id":"t138","term":"CSA","def":"Acronym for Credit Support Annex.","cat":"otc","diff":1,"chapters":[22,33,36,48,23]},{"id":"t139","term":"CSD","def":"Acronym for Central Securities Depository.","cat":"legal","diff":1,"chapters":[2,5,10,4,11]},{"id":"t140","term":"Currency Derivative","def":"A collective term for a range of financial Derivative products which have Foreign Exchange rates or foreign currency cashflows as their Underlying asset. Can be traded as an Exchange-Traded Derivative or as an OTC Derivative.","cat":"otc","diff":2,"chapters":[18,19]},{"id":"t141","term":"Currency Option Dividend","def":"A type of Dividend on Equity, in which the Issuer provides Shareholders with payment in one currency, unless the shareholder elects to receive payment in a specified alternative currency.","cat":"core","diff":2,"chapters":[10]},{"id":"t142","term":"Current Collateral Value","def":"The up-to-date cash worth of a financial instrument used as Collateral (usually a Bond or Equity security) in the open marketplace.","cat":"core","diff":1,"chapters":[5,10,4,22,35]},{"id":"t143","term":"Current Market Price","def":"The up-to-date price of a financial instrument in the open marketplace.","cat":"core","diff":1,"chapters":[22,4,34,11,14]},{"id":"t144","term":"Current Market Value","def":"The up-to-date cash worth of a trade or position in a financial instrument in the open marketplace.","cat":"core","diff":1,"chapters":[10,33,4,5,22,38,39]},{"id":"t145","term":"CUSIP","def":"Committee on Uniform Securities Identification Procedures; an organisation that provides standardised and unique reference numbers (CUSIP numbers) for individual Securities traded in the United States and Canada, enabling unambiguous identification of the Issue being traded and delivered. See ISIN.","cat":"core","diff":3,"chapters":[23,35,2]},{"id":"t146","term":"Custodian","def":"An organisation that specialises in holding Securities and cash and effecting m ovements of securities and cash on behalf of its account holders. Custodians are normally members of their country’s Central Securities Depository.","cat":"core","diff":3,"chapters":[2,23,4,34,36,10]},{"id":"t147","term":"Custody Fees","def":"Periodic charges made by a CSD or Custodian for the safekeeping of Bond and/or Equity Securities, charged to the account holder.","cat":"legal","diff":1,"chapters":[36]},{"id":"t148","term":"Data Scrubbing","def":"The process of comparing and cleansing data (e.g. Securities or Corporate Actions data) received from two or more sources.","cat":"core","diff":1,"chapters":[]},{"id":"t149","term":"Data Vendors","def":"Firms that specialise in the collection of information regarding Securities, and Current Market Prices of securities, and (in some cases) Corporate Actions relating to securities.","cat":"core","diff":2,"chapters":[32,23,10,34,36]},{"id":"t150","term":"Day Count (Convention)","def":"With the overall aim of determining an interest amount payable or receivable in a specific trade, the particular method used to determine the number of days in the period. Such conventions include ‘actual’ (calendar) days, and 30-day months. See Divisor.","cat":"core","diff":3,"chapters":[34,4,23,22]},{"id":"t151","term":"Daylight Exposure","def":"Incurring a risk due to an intraday timing difference between the giving of one asset and the receipt of a contra asset from a Counterparty.","cat":"core","diff":2,"chapters":[10]},{"id":"t152","term":"DBV","def":"Acronym for Delivery By Value.","cat":"repo","diff":1,"chapters":[7]},{"id":"t153","term":"DBV Basket","def":"Predefined categories or groupings of Collateral for delivery against the borrowing of cash within CREST. See Delivery By Value.","cat":"repo","diff":1,"chapters":[7]},{"id":"t154","term":"Debt","def":"The issuance of Bonds signifies that the Issuer is in debt to the investors; a ‘debt issue’ is synonymous with the term ‘bond issue’.","cat":"core","diff":1,"chapters":[4,34,22,43,36,41]},{"id":"t155","term":"Default","def":"Failure by a bond Issuer to make payments of interest and/ or repayments of capital at the scheduled time, or failure by a Counterparty to comply with its Contractual Obligations.","cat":"legal","diff":2,"chapters":[17,47,21,22,41,8,13,25]},{"id":"t156","term":"Default Funds","def":"An up-front contribution by each Clearing Member of a Central Counterparty, for the purpose of sharing any loss incurred if the default of any clearing member should arise. See Mutualisation.","cat":"reg","diff":2,"chapters":[47]},{"id":"t157","term":"Defaulting Party","def":"In a financial transaction between two parties, the party that fails to honour its contractual obligations.","cat":"core","diff":1,"chapters":[21,22,9]},{"id":"t158","term":"Delivery By Value","def":"A collateralised cash borrowing. The input of matching DBV Settlement Instructions within the CREST system results in the transfer of the cash amount and the delivery of one or many pieces of pre- agreed securities Collateral in order to mitigate the cash lender’s risk.","cat":"slb","diff":3,"chapters":[7,4]},{"id":"t159","term":"Delivery versus delivery","def":"The delivery of a Bond or Equity security against the simultaneous receipt of another security; such settlement can occur only if both securities are available to be delivered. From a Collateral management perspective, as DvD mitigates delivery risk, it is valuable in Collateral Substitution and in Securities Lending & Borrowing where securities are given as collateral. Commonly known as DvD. See Effective DvD.","cat":"slb","diff":5,"chapters":[42,10]},{"id":"t160","term":"Delivery versus payment","def":"The simultaneous, irrevocable and risk-free exchange of securities and cash between seller and buyer (or their custodians). The normal method utilised for settling the opening leg and closing leg of a Repo trade. Commonly known as DvP.","cat":"repo","diff":3,"chapters":[2,11,42,10,4,7]},{"id":"t161","term":"Denominational Value","def":"See Bond Denominational Value.","cat":"core","diff":1,"chapters":[34,33,2]},{"id":"t162","term":"Depot","def":"An organisation that holds Securities and effects Settlement of trades on behalf of its account holder; also known as Custodian.","cat":"core","diff":1,"chapters":[11,35,34,10,5]},{"id":"t163","term":"Depot Account","def":"The specific account held by a Depot or Custodian in which Securities are held.","cat":"core","diff":1,"chapters":[11]},{"id":"t164","term":"Depot Reconciliation","def":"Within Buy-Side and Sell-Side firms, the internal process of comparing its Books & Records of securities holdings at CSDs and Custodians versus securities holdings stated on the CSD’s or custodian’s statement, known as a Depot Statement.","cat":"core","diff":3,"chapters":[11,5,34,35,42]},{"id":"t165","term":"Depot Statement","def":"A formal list of Bond and Equity securities held within a specific account at a CSD or Custodian. Such statements are normally available at the close of each business day, and list the quantity of securities and the ISIN code (or a national securities identifier such as a SEDOL or CUSIP code).","cat":"legal","diff":3,"chapters":[10,35]},{"id":"t166","term":"Derivative","def":"A range of financial products, the value of each being derived from an associated (Underlying) asset. A derivative trade is a contract containing specific terms between a firm and its Counterparty, involving either no upfront payment or a relatively low percentage of the underlying asset’s value.","cat":"otc","diff":3,"chapters":[14,47,48,22,46,15,13,25]},{"id":"t167","term":"Dirty Price","def":"The price of a bond, inclusive of Accrued Interest. The alternative is Clean Price, which requires the addition of accrued interest to derive the bond’s total Market Value and Collateral Value.","cat":"core","diff":2,"chapters":[33,34,4,10]},{"id":"t168","term":"Discount Factor","def":"Taking a known cash amount that is payable or receivable on a known future date, the rate used to determine ‘today’s’ value of that same cash amount, through the process of discounting. See Present Value and Time Value of Money.","cat":"core","diff":3,"chapters":[22]},{"id":"t169","term":"Dispute Resolution","def":"Where the issuance of a Margin Call Notification is disagreed by the receiving party, if attempts at resolving the disagreement fail, dispute resolution is a documented procedure designed to overcome such disagreements, by the involvement of a neutral third party.","cat":"otc","diff":3,"chapters":[34,22,48]},{"id":"t170","term":"Disputed Amount","def":"Following receipt of a Margin Call Notification, the disagreement of part of its value. The remainder is known as the Undisputed Amount.","cat":"otc","diff":2,"chapters":[22,35]},{"id":"t171","term":"Dividend","def":"The distribution of earnings by a company to its Shareholders, whether in the form of cash or Securities.","cat":"core","diff":1,"chapters":[10,22,42,1]},{"id":"t172","term":"Dividend Payment","def":"Following a decision by an Equity Issuer’s board of directors, the payment of cash to Shareholders as a reward for investment. Such payments usually relate to profits made in a defined trading period.","cat":"core","diff":2,"chapters":[1,10]},{"id":"t173","term":"Divisor (Convention)","def":"With the overall aim of determining an interest amount payable or receivable in a specific trade, the particular method used to determine the amount of interest per day, prior to multiplying by the number of days of interest. Such conventions include ‘360’ and ‘365’. See Day Count (Convention).","cat":"core","diff":3,"chapters":[4,34,23,22,19]},{"id":"t174","term":"Dodd-Frank Act","def":"Following the Global Financial Crisis in 2008, the legislation passed in the United States in 2010, designed to reduce risk in the financial marketplace. Amongst other aspects, the legislation requires OTC Derivatives to be Centrally Cleared. The equivalent in Europe is EMIR.","cat":"reg","diff":3,"chapters":[31,27,46,47,10]},{"id":"t175","term":"Double-Entry Bookkeeping","def":"A basic accounting principle whereby each accounting entry is offset by a contra (debit or credit) entry.","cat":"otc","diff":1,"chapters":[]},{"id":"t176","term":"Double Taxation Agreement","def":"An arrangement between two countries, whereby residents of one country that invest in Securities issued by Issuers within the other country will have Withholding Tax deducted at a lower rate than the statutory (standard) rate payable by investors. Also known as a Treaty.","cat":"core","diff":3,"chapters":[10]},{"id":"t177","term":"DTC","def":"Depository Trust Company; the normal place of Settlement of Equity, corporate and municipal bonds traded in the United States. DTC effects settlement for its account holders on an Electronic Book-Entry basis.","cat":"core","diff":2,"chapters":[2]},{"id":"t178","term":"DTCC Trade Information Warehouse","def":"An organisation that provides a range of services relating to Credit Derivatives, including holding the current version of trades, plus post- trade processing, plus associated payment services.","cat":"otc","diff":2,"chapters":[]},{"id":"t179","term":"DvD","def":"Acronym for Delivery versus delivery.","cat":"core","diff":1,"chapters":[42,4,10,11]},{"id":"t180","term":"DvP","def":"Acronym for Delivery versus payment.","cat":"core","diff":1,"chapters":[2,5,10,4,11]},{"id":"t181","term":"Early Termination","def":"In an OTC Derivative trade, the closure of the trade prior to its Scheduled Maturity Date; this can be caused by a Default event documented under an ISDA Master Agreement.","cat":"otc","diff":2,"chapters":[21,44,48,39]},{"id":"t182","term":"Effective DvD","def":"Within Target2 Securities, the simultaneous exchange (delivery) of one Security versus a different security, achieved by the linking of one matched Settlement Instruction with another matched settlement instruction with the same Counterparty. Following such linking, the delivery of one security will occur only if the opposing security is also available for delivery. See Delivery versus delivery.","cat":"core","diff":4,"chapters":[42,4,10,11]},{"id":"t183","term":"Electronic Book Entry","def":"The normal method by which Securities and cash are transferred between participant accounts at a Central Securities Depository. When assets are moved to effect Settlement at the CSD, no physical movement usually occurs and the result of settlement is updated electronically within the CSD’s Books & Records by debiting one party and crediting the other.","cat":"core","diff":4,"chapters":[34,2]},{"id":"t184","term":"Electronic Trade Confirmation","def":"The process of comparing a seller’s and a buyer’s trade details electronically, shortly after Trade Execution, where one of the parties is an Institutional Investor. A method of achieving Trade Agreement.","cat":"core","diff":2,"chapters":[29]},{"id":"t185","term":"Electronic Trading Platform","def":"A generic term describing software systems that facilitate Trade Execution, involving the matching of buyers with sellers.","cat":"core","diff":1,"chapters":[3,46]},{"id":"t186","term":"Eligible Collateral","def":"Financial assets that are agreed by the involved parties to be acceptable as Collateral for the purpose of Mitigating risk. Such assets typically include cash in one or more major currency and highly rated government Bonds; blue chip Equity may also be included.","cat":"core","diff":3,"chapters":[22,4,23,34,48,8,13,38]},{"id":"t187","term":"Eligible Currency","def":"One or more currency that is agreed by the involved parties to be acceptable as collateral for the purpose of mitigating risk. See Eligible Collateral.","cat":"core","diff":2,"chapters":[22,47,2]},{"id":"t188","term":"EMIR","def":"Acronym for European Market Infrastructure Regulation.","cat":"reg","diff":1,"chapters":[47,48,46,10,31]},{"id":"t189","term":"Encryption","def":"A secret coding system designed to prevent unauthorised access to important and/or sensitive data.","cat":"core","diff":1,"chapters":[2]},{"id":"t190","term":"English Law CSA","def":"The Credit Support Annex written under English Law. Of the many features contained therein, one of the most important is that the collateral transfer method is Title Transfer. For comparison, see New York Law CSA.","cat":"legal","diff":2,"chapters":[36,22,13]},{"id":"t191","term":"Entitlement","def":"The right of ownership relating to certain types of Corporate Action.","cat":"core","diff":1,"chapters":[43,47]},{"id":"t192","term":"Entitlement Date","def":"A generic term to describe the date used to determine whether seller or buyer is entitled to a Corporate Action. See Ex-Dividend Date.","cat":"core","diff":2,"chapters":[]},{"id":"t193","term":"EONIA","def":"Euro OverNight Index Average. A Floating Benchmark interest rate which is the average rate quoted by a number of banks for a duration of 1 day, for EUR. See Euribor and Libor.","cat":"core","diff":2,"chapters":[22,27]},{"id":"t194","term":"Equity and Equity Collateral","def":"An alternative description for the term Shares; an ‘equity issue’ is synonymous with the term ‘share issue’. Of limited popularity when used as Collateral due to their historic volatility, particularly when compared with Cash Collateral and Bond Collateral.","cat":"core","diff":3,"chapters":[2,9,10,15,22]},{"id":"t195","term":"Equity Issuer","def":"The entity that has issued Equity and has received capital in exchange, from Shareholders.","cat":"core","diff":1,"chapters":[10]},{"id":"t196","term":"Equivalent Collateral","def":"For trades in Securities Lending & Borrowing and in OTC Derivatives, where Securities Collateral has been delivered to the Collateral Taker, that party is obliged to return to t
