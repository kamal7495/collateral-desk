he Collateral Giver the same ISIN or (if the original ISIN has been replaced due to a Corporate Action), the replacement ISIN.","cat":"otc","diff":3,"chapters":[36,4,10,9,22,13]},{"id":"t197","term":"Equivalent Security","def":"In a Repo trade, the cash lender is obliged to return to the cash borrower the same ISIN or (if the original ISIN has been replaced due to a Corporate Action), the replacement ISIN. In a Securities Lending & Borrowing trade, where securities have been lent to a Securities Borrower, that party is obliged to return to the Securities Lender the same ISIN or (if the original ISIN has been replaced due to a Corporate Action), the replacement ISIN.","cat":"slb","diff":5,"chapters":[10]},{"id":"t198","term":"ESMA","def":"Acronym for European Securities and Markets Authority.","cat":"core","diff":1,"chapters":[47,48,46]},{"id":"t199","term":"Eurex","def":"A financial markets exchange offering electronic trading services in a variety of products, including Derivatives.","cat":"otc","diff":1,"chapters":[7,14,10]},{"id":"t200","term":"Eurex Clearing","def":"Incorporated in Germany, a Central Counterparty for multiple asset classes, including Repo and OTC Derivatives.","cat":"otc","diff":1,"chapters":[7,14,10]},{"id":"t201","term":"Eurex Repo","def":"An electronic trading venue for Repo.","cat":"repo","diff":1,"chapters":[7]},{"id":"t202","term":"Euribor","def":"Acronym for ‘Euro Interbank Offered Rate’. A Floating Benchmark interest rate which is the average rate quoted by a number of banks, for EUR. See EONIA and Libor.","cat":"core","diff":2,"chapters":[19,27]},{"id":"t203","term":"Eurobond","def":"A type of Bond that is usually sold to investors outside the country relating to the currency of issue. No Withholding Tax on income is payable by investors.","cat":"core","diff":2,"chapters":[15]},{"id":"t204","term":"Euroclear Bank","def":"Located in Brussels, one of the two International Central Securities Depositories (ICSDs) offering Safe Custody, Settlement and Collateral Management services to its participants; the other ICSD is Clearstream International.","cat":"core","diff":2,"chapters":[2,36,43,10,7]},{"id":"t205","term":"European Market Infrastructure Regulation","def":"The primary suite of regulatory measures introduced in Europe relating to OTC Derivatives, following the Global Financial Crisis in 2008. The foremost measures include stringent risk management of trades, including the mandatory use of Central Counterparties for standardised trades, and reporting of trades to Trade Repositories. Commonly known as EMIR.","cat":"reg","diff":4,"chapters":[46,27,10]},{"id":"t206","term":"European Securities and Markets Authority","def":"An EU authority whose focus is the preservation of the strength of the financial system in the European Union, achieved by improving investor protection and promoting well organised financial markets. Commonly known as ESMA.","cat":"core","diff":2,"chapters":[47,46]},{"id":"t207","term":"Event of Default","def":"A predefined and legally documented set of circumstances (e.g. Bankruptcy) which, if they occur during the lifetime of a trade, enable a Collateral Taker to legally cover its Exposure by selling the Collateral.","cat":"legal","diff":2,"chapters":[21,47,17,12,22,8,13]},{"id":"t208","term":"Ex-Dividend Date","def":"The date used to determine whether seller or buyer has Entitlement to certain types of Corporate Action on (primarily) Equity Securities.","cat":"core","diff":2,"chapters":[]},{"id":"t209","term":"Exchange Rate Risk","def":"Where an investor holds cash in a foreign currency, or holds Securities denominated in a foreign currency, the risk that adverse exchange rate movements will result in a loss.","cat":"core","diff":2,"chapters":[19,18]},{"id":"t210","term":"Exchange-Traded Derivative","def":"Derivative products that are available for trading on formal derivative exchanges, where only exchange members are permitted to execute trades directly. Futures and Options products are usually tradable, on standardised terms. For comparison, see OTC (Over-the-counter) Derivative.","cat":"otc","diff":3,"chapters":[14]},{"id":"t211","term":"Exchange-Traded Funds","def":"A collective investment scheme (similar to a Mutual Fund) that invests in Equity and Bonds but which is tradable on Stock Exchanges.","cat":"core","diff":1,"chapters":[10]},{"id":"t212","term":"Executing Broker","def":"From the perspective of a Buy-Side firm that has executed a trade in a financial asset, the Counterparty to the trade.","cat":"core","diff":1,"chapters":[47]},{"id":"t213","term":"Execution","def":"The agreement to trade between two parties, whether buying or selling, lending or borrowing, etc. See Trade Execution.","cat":"slb","diff":1,"chapters":[27,11,46,10,4,21,28,31]},{"id":"t214","term":"Exercise","def":"The process of converting a Security to an associated (or Underlying) security.","cat":"core","diff":1,"chapters":[30,14]},{"id":"t215","term":"Exercise Price","def":"The price at which an Option holder is entitled to buy (Call Option) or sell (Put Option) the underlying asset. Also known as Strike Price.","cat":"core","diff":2,"chapters":[14]},{"id":"t216","term":"Exposed Party","def":"The party to a financial transaction that has an Exposure during the lifetime of the trade, due to changes in the current Market Value of the assets involved. Such parties will issue a Margin Call to their Counterparty, following which the Exposed Party will receive Collateral in order to mitigate that risk. See Non-Exposed Party.","cat":"otc","diff":4,"chapters":[35,4,22,11,5,42]},{"id":"t217","term":"Exposure","def":"The extent to which a firm has risk relating to executed transactions. In a Repo, the difference in value between the cash lent and the current Market Value of the Collateral received. In Securities Lending & Borrowing, the difference in value between the current market value of Securities lent versus the current market value of the collateral received. In OTC Derivatives, the difference in value between the original terms of the trade and the Replacement Cost, taking account of any existing collateral.","cat":"otc","diff":5,"chapters":[33,22,14,15,5,4]},{"id":"t218","term":"Failed Status","def":"As advised by a CSD or Custodian, the current condition of a Settlement Instruction which reflects the fact that Settlement has not occurred on Value Date. In addition, a reason for the settlement delay is provided.","cat":"legal","diff":2,"chapters":[34]},{"id":"t219","term":"Failed Settlement","def":"See Settlement Failure.","cat":"core","diff":1,"chapters":[4]},{"id":"t220","term":"Failure to Pay","def":"A term given to a specific Event of Default in a Credit Default Swap. Specifically, if a Bond Issuer does not pay Coupon or maturity proceeds to the Bondholders when falling due (normally taking account of a grace period), such non-payment is regarded as a Failure to Pay, therefore an Event of Default has occurred which will trigger payout by the Protection Seller to the Protection Buyer. One type of Credit Event.","cat":"otc","diff":5,"chapters":[22,34,35,21,41]},{"id":"t221","term":"FC","def":"Acronym for Financial Counterparty.","cat":"core","diff":1,"chapters":[47,48]},{"id":"t222","term":"Federal Funds Rate","def":"In the United States, the Floating Benchmark interest rate at which institutions lend USD cash to one another on an overnight basis.","cat":"core","diff":1,"chapters":[22,27]},{"id":"t223","term":"Fedwire","def":"In the United States, an electronic real-time USD payment and securities transfer system operated by the Federal Reserve.","cat":"core","diff":1,"chapters":[4,36]},{"id":"t224","term":"Financial Counterparty","def":"Under EMIR, financial counterparties are banks, insurance companies, assurance companies, reinsurance companies, alternative investment funds, investment firms, credit institutions, pension funds, UCITS funds, sovereign wealth funds. In order to be classified as an FC under EMIR, firms must be authorised under the appropriate regulation. See Non-Financial Counterparty.","cat":"reg","diff":4,"chapters":[48]},{"id":"t225","term":"Fixed Coupon","def":"In a Credit Default Swap, the standardised premium amounts introduced after the Global Financial Crisis to facilitate firms benefitting from Portfolio Compression.","cat":"otc","diff":2,"chapters":[4]},{"id":"t226","term":"Fixed-for-Floating Interest Rate Swap","def":"A type of OTC Derivative trade designed to mitigate the risk of adverse movements in interest rates. One party pays an agreed fixed rate of interest at an agreed frequency (e.g. every 6 months) whilst the counterparty pays a floating rate of interest based upon a Floating Benchmark rate (e.g. Libor) over the same time period. Whilst the fixed rate remains constant throughout the lifetime of the trade, the floating rate will almost certainly differ on each occasion. Settlement occurs on a net basis (the difference in rates between the fixed rate and the floating rate).","cat":"otc","diff":5,"chapters":[]},{"id":"t227","term":"Fixed Rate Bond","def":"A Bond which pays the same fixed rate of interest at regular and predefined intervals (e.g. every 12 months or 6 months) on predefined Coupon Payment Dates.","cat":"core","diff":2,"chapters":[2]},{"id":"t228","term":"Fixing Date","def":"A generic term that describes the date on which the interest rate of a Floating Benchmark rate (e.g. Euribor, Libor, EONIA) is reset, as occurs in a Floating Rate Note and in an Interest Rate Swap.","cat":"otc","diff":2,"chapters":[]},{"id":"t229","term":"Floating Benchmark","def":"A generic term for interest rates that are not fixed, but instead fluctuate in accordance with current Money Market rates, examples of which are EONIA, Euribor, Federal Funds Rate and Libor.","cat":"core","diff":2,"chapters":[]},{"id":"t230","term":"Floating Rate Note","def":"A form of Bond that pays variable rates of interest, as opposed to the majority of bonds that have a fixed rate of interest throughout their lives.","cat":"core","diff":2,"chapters":[2]},{"id":"t231","term":"FoP","def":"Acronym for Free of payment.","cat":"core","diff":1,"chapters":[10,34,42,4,2]},{"id":"t232","term":"Foreign Exchange","def":"The part of the financial services industry which deals with the buying and selling of currencies.","cat":"core","diff":1,"chapters":[18,19,22,48,1]},{"id":"t233","term":"Foreign Exchange Risk","def":"A potential Exposure for a firm where a financial transaction has been executed in a currency which differs from a firm’s base currency, where exchange rate fluctuation could negatively impact the firm.","cat":"core","diff":2,"chapters":[18,14]},{"id":"t234","term":"Foreign Exchange Swap","def":"A type of OTC Derivative trade in which two parties exchange principal amounts in different currencies at the start of the trade (at one exchange rate), with the reverse exchange occurring at the close of the trade (at a different exchange rate). For comparison, see Cross- Currency Swap.","cat":"otc","diff":3,"chapters":[18,19,14,31]},{"id":"t235","term":"Forward Exchange Rate","def":"In a Foreign Exchange trade, the rate at which a trade is executed for Settlement on an agreed future Value Date. For comparison, see Spot Exchange Rate.","cat":"core","diff":2,"chapters":[18,19]},{"id":"t236","term":"Four Eyes Principle","def":"The practice of having work verified by a second person prior to acceptance into a system or acting on the information.","cat":"core","diff":1,"chapters":[23,34]},{"id":"t237","term":"Free of payment","def":"The separate (non-simultaneous) exchange of Securities and cash between seller and buyer (or their Custodians). In Collateral Management, settlement of Margin Calls using Bonds is normally actioned free of payment. Commonly known as FoP.","cat":"otc","diff":3,"chapters":[2,42,34,4,10,35]},{"id":"t238","term":"FRN","def":"Acronym for Floating Rate Note.","cat":"core","diff":1,"chapters":[2,43]},{"id":"t239","term":"Front Office","def":"A general term within Buy-Side and Sell-Side firms, which refers to the department in which Traders reside. Within sell-side firms, can also encompass Relationship Managers.","cat":"core","diff":2,"chapters":[28,31]},{"id":"t240","term":"Fund Manager","def":"A type of Buy-Side organisation that usually operates a range of funds in which end investors place their cash; the fund manager decides how to invest the cash in order to maximise the return on investment or to maximise regular income, in accordance with the objective of each fund operated by the fund manager. Also known as Mutual Fund.","cat":"core","diff":4,"chapters":[38]},{"id":"t241","term":"Funding","def":"The act of minimising the cost of borrowing cash, and maximising the benefit of lending cash. This usually involves borrowing and lending cash in a number of currencies on a Secured (Collateralised) and Unsecured basis, over varying periods of time.","cat":"slb","diff":3,"chapters":[36,27,47]},{"id":"t242","term":"Funds Pre-Advice","def":"A communication issued by a firm to a Cash Correspondent(or Nostro), formally advising that a specific incoming cash amount is expected to be received on a specified Value Date. Failure to issue such a communication is likely to result in delayed crediting of cash.","cat":"core","diff":3,"chapters":[35]},{"id":"t243","term":"Fungible and Fungibility","def":"Assets (e.g. a currency or a Security) which are equivalent to, interchangeable with and substitutable by assets of the same type.","cat":"core","diff":1,"chapters":[22,36]},{"id":"t244","term":"Fungible Securities","def":"Two securities (issued by the same Issuer) that have become equal in all respects, where at the time of issue each security carried different rights. For example, the holders of the first security may have been entitled to a dividend, whereas the holders of the second security were not entitled to that particular dividend.","cat":"core","diff":4,"chapters":[36]},{"id":"t245","term":"Futures","def":"An Exchange-Traded Derivative product; the investor buys or sells an Underlying asset for delivery and payment on a specific date. The exchange provides a range of futures products which contain standardised terms relating to quantity, quality and Value Date.","cat":"otc","diff":3,"chapters":[14,46,4,7]},{"id":"t246","term":"G-7and G-10","def":"Both the G-7 and G-10 are unofficial groups of industrialised nations that meet periodically to debate monetary and other issues.","cat":"core","diff":1,"chapters":[]},{"id":"t247","term":"GC Pooling","def":"An electronic, anonymous and multicurrency Repo trading platform utilising standardised baskets of General Collateral. Trades are cleared via Eurex Clearing.","cat":"repo","diff":2,"chapters":[7,3,4]},{"id":"t248","term":"General Collateral","def":"In a Cash-Based Repo, although the Collateral provided by the cash borrower must be of a minimum quality, no specific security (ISIN) is required by the cash lender. Such collateral is therefore interchangeable (able to be substituted) during the lifetime of the trade. Commonly known as ‘GC’. See Collateral Substitution.","cat":"slb","diff":4,"chapters":[4,6,7]},{"id":"t249","term":"General Creditor","def":"A cash lender that has not secured the loan by taking any assets as Collateral from the cash borrower.","cat":"slb","diff":1,"chapters":[21]},{"id":"t250","term":"Gilt","def":"Commonly used term for Bonds issued by the UK government. Historically, when certificates in such bonds were issued, the certificates had a gilt (gold) edging and such bonds became known as ‘gilt-edged’ securities, or ‘gilts’ for short.","cat":"core","diff":3,"chapters":[7,20]},{"id":"t251","term":"Global Custodian","def":"An organisation that offers a broad range of services to its clients, including the holding of Securities and other financial instruments, the holding of cash in various currencies, the Settlement of trades and the collection of Corporate Actions. Global custodians typically operate a network of sub-custodians (located in a variety of the world’s financial centres) that hold such assets on its behalf. For comparison, see Local Custodian.","cat":"core","diff":5,"chapters":[10]},{"id":"t252","term":"Global Depository Receipts","def":"Documents that represent Shares held in overseas companies and which enable investors located in a different country to invest in such Securities. See American Depository Receipts.","cat":"core","diff":2,"chapters":[10]},{"id":"t253","term":"Global Equity","def":"Equity issued in various countries around the globe, and which is generally available to investors.","cat":"core","diff":1,"chapters":[10]},{"id":"t254","term":"Global Financial Crisis","def":"A common term for the highly negative and worldwide impact of a series of events (e.g. homeowners defaulting on residential mortgages, the bailout of American International Group, and the bankruptcy of Investment Bank Lehman Brothers) which culminated during September 2008. This crisis resulted in a loss of trust between firms in financial markets, and a dramatic increase in the importance of Collateral as a primary mechanism for mitigation of Counterparty Risk.","cat":"core","diff":5,"chapters":[47,48,46,31,30]},{"id":"t255","term":"Global Master Repurchase Agreement","def":"The standard legal document used in Europe which states the contractual terms and conditions applicable to the parties to Repo trades; produced by ICMA and SIFMA. Once signed, all subsequent repo trades between the parties fall under the GMRA’s terms and conditions.","cat":"repo","diff":3,"chapters":[8]},{"id":"t256","term":"Global Master Securities Lending Agreement","def":"The standard legal document which states the contractual terms and conditions applicable to the parties to Securities Lending & Borrowing trades; produced by ISLA. Once signed, all subsequent securities lending & borrowing trades between the parties fall under the GMSLA’s terms and conditions.","cat":"slb","diff":3,"chapters":[13,9,11]},{"id":"t257","term":"Global Note","def":"A legal document which represents the entirety of a Bond issue. For comparison, see Bearer Security.","cat":"core","diff":1,"chapters":[2]},{"id":"t258","term":"GMRA","def":"Acronym for Global Master Repurchase Agreement.","cat":"legal","diff":1,"chapters":[3,4,6,7,8,5,13]},{"id":"t259","term":"GMSLA","def":"Acronym for Global Master Securities Lending Agreement.","cat":"legal","diff":1,"chapters":[9,11,13,10,6]},{"id":"t260","term":"Good Value","def":"At a Cash Correspondent(or Nostro), the crediting of funds due to a firm on Value Date, without delay. See Funds Pre-Advice.","cat":"core","diff":1,"chapters":[35,4,18,11,5]},{"id":"t261","term":"Grey Market Trading","def":"Buying and selling Securities that are in course of being brought to the marketplace, when it is still possible that the Issue may be withdrawn and not come to fruition. See Primary Market.","cat":"core","diff":2,"chapters":[]},{"id":"t262","term":"Gross Exposure","def":"In a Repo, the differential between the current value of Securities Collateral and the current value of the cash lent/borrowed, prior to taking account of any Minimum Transfer Amount or Threshold.","cat":"otc","diff":2,"chapters":[5,35,4,21]},{"id":"t263","term":"Haircut","def":"A percentage reduction from the Market Value of an asset (e.g. a Bond), in order to derive the asset’s Collateral Value. Haircut is the perceived risk of loss resulting from the asset’s fall in value; the haircut’s size reflects the perceived risk and Liquidity of the asset.","cat":"core","diff":3,"chapters":[2,34,4,48,22,5,35]},{"id":"t264","term":"Hedge Fund","def":"An organisation that invests its clients’ funds, but which is subject to fewer restrictions than other funds (such as Mutual Funds); typically, hedge funds indulge in speculative investments, including but not limited to Securities. Such speculation may earn hedge fund investors large profits, at the risk of large losses.","cat":"core","diff":4,"chapters":[10]},{"id":"t265","term":"Hedging","def":"Investing in Securities (or other financial instruments) as a safeguard against loss in the event of adverse price movements in other investments.","cat":"core","diff":2,"chapters":[41,47,14,40]},{"id":"t266","term":"Herstatt Risk","def":"Relates to foreign exchange trades in which one currency is sold whilst a different currency is bought, for settlement on the same Value Date. The risk of loss exists for a firm where the currency sold is paid to the Counterparty without receiving the currency bought. Named after Bank Herstatt which (in 1974) received payments in Deutsche Marks prior to entering into Bankruptcy and prior to making payments to its counterparties in USD.","cat":"core","diff":5,"chapters":[18,19]},{"id":"t267","term":"High Quality Liquid Assets","def":"Financial assets that are issued by highly rated Issuers and which are easily and immediately converted into cash.","cat":"core","diff":1,"chapters":[10]},{"id":"t268","term":"HQLA","def":"Acronym for High Quality Liquid Assets.","cat":"core","diff":1,"chapters":[10]},{"id":"t269","term":"ICMA","def":"Acronym for International Capital Market Association.","cat":"core","diff":1,"chapters":[48,4,8]},{"id":"t270","term":"ICSD","def":"Acronym for International Central Securities Depository.","cat":"core","diff":1,"chapters":[12]},{"id":"t271","term":"ICSD Auto-Lending/ Borrowing","def":"Service provided by ICSDs in which participants can automatically lend their securities to the ICSD, who in turn lend the same securities to those participants that are automatic borrowers. See Securities Lending and Securities Borrowing.","cat":"slb","diff":3,"chapters":[12]},{"id":"t272","term":"Illegality","def":"The condition of being outside the laws of a particular authority or jurisdiction.","cat":"core","diff":1,"chapters":[21]},{"id":"t273","term":"IM","def":"Acronym for Initial Margin.","cat":"otc","diff":1,"chapters":[47,48]},{"id":"t274","term":"Income","def":"Within the world of Securities, Dividend Payments on Equity and Coupon Payments on Bonds.","cat":"core","diff":1,"chapters":[10,43,22,36,4]},{"id":"t275","term":"Independent Amount","def":"In OTC Derivatives, a cash amount or percentage of Notional Principal given by a firm to its higher rated Counterparty.","cat":"otc","diff":1,"chapters":[33,22,48]},{"id":"t276","term":"Index CDS","def":"A Credit Derivative product which enables investors to take a position in a number of Reference Entities (as opposed to one entity as occurs in a Single Name Credit Default Swap).","cat":"otc","diff":2,"chapters":[47]},{"id":"t277","term":"Index Tracking Fund","def":"A form of Mutual Fund whose investment objectives are to mirror the companies which comprise a specified market index.","cat":"core","diff":1,"chapters":[10]},{"id":"t278","term":"Individual Segregated Account","def":"An account owned by a Clearing Member (CM) at a Central Counterparty, in which trades and positions that are owned by one specific client of the CM (Non-Clearing Members) are held, as part of the CM’s Client Clearing service. See Omnibus Account.","cat":"reg","diff":3,"chapters":[47]},{"id":"t279","term":"Initial Margin","def":"In Repo, a percentage reduction from the Market Value of an asset (e.g. a Bond), in order to derive the asset’s Collateral Value. An amount of additional collateral given by the cash borrower to the cash lender. Similar to Haircut, although the calculation method differs. In OTC Derivatives under EMIR, a form of Margin Call made by a Central Counterparty which reflects potential future exposure.","cat":"otc","diff":4,"chapters":[48,4,47,5,7]},{"id":"t280","term":"Initial Public Offering","def":"A method of bringing a new Equity Issue to the Securities marketplace, whereby the general public is given the opportunity to apply for shares in the issue. A term used in the United States; the equivalent of an Offer for Sale in the UK.","cat":"core","diff":3,"chapters":[]},{"id":"t281","term":"Institutional Investors","def":"A generic term given to end-investors that are organisations, as opposed to individuals; such investors include Fund Managers, Hedge Funds, Insurance Companies and Pension Funds. Also known as the ‘ Buy-Side ’.","cat":"core","diff":2,"chapters":[3,2,46,10]},{"id":"t282","term":"Insurance Companies","def":"A type of Buy-Side organisation that invest the insurance premiums (received from policyholders) in the stock market. A type of Institutional Investor.","cat":"core","diff":2,"chapters":[9,21,47,48,3]},{"id":"t283","term":"Inter-Dealer Broker","def":"In the Capital Market, a firm that executes trades as middleman between Investment Banks, earning commission for providing such a service.","cat":"core","diff":2,"chapters":[27]},{"id":"t284","term":"Interest-Bearing Bond","def":"A Bond which pays interest (Coupon), including Fixed Rate Bonds, Floating Rate Notes and Convertible Bonds, but excluding Zero Coupon Bonds.","cat":"core","diff":2,"chapters":[34,2]},{"id":"t285","term":"Interest Claim","def":"A claim for missing cash interest resulting from a delay in receipt of such cash. For Securities, a request by a seller to the buyer for reimbursement of missing cash interest, where the seller was able to deliver securities (on or after the Value Date) but the buyer was unable to pay.","cat":"core","diff":3,"chapters":[4]},{"id":"t286","term":"Interest Rate Derivative","def":"An umbrella term covering a family of financial products whose value changes according to fluctuations in interest rates, an example of which is a Fixed-for- Floating Interest Rate Swap.","cat":"otc","diff":2,"chapters":[1]},{"id":"t287","term":"Interest Rate Swap","def":"See Fixed-for-Floating Interest Rate Swap.","cat":"otc","diff":1,"chapters":[16,14,23,27,28,29]},{"id":"t288","term":"International Capital Market Association","def":"An organisation that represents its members, particularly in the fields of market practices relating to the international Bond and Repo markets. Its members are located in over 60 countries, including both Buy-Side and Sell-Side firms. Commonly abbreviated to ICMA.","cat":"repo","diff":3,"chapters":[4,8]},{"id":"t289","term":"International Central Securities Depository","def":"A Central Securities Depository that holds overseas Securities and which usually facilitates Settlement of trades in numerous currencies. Euroclear (Brussels) and Clearstream International (Luxembourg) are two recognised ICSDs.","cat":"core","diff":3,"chapters":[12]},{"id":"t290","term":"International Organization","def":"An institution that develops and promotes international standards relating to Securities regulation.","cat":"reg","diff":1,"chapters":[48]},{"id":"t291","term":"International Securities Lending Association","def":"An independent organisation that represents the Securities Lending & Borrowing marketplace, whose aim is to promote a competitive, efficient and orderly securities lending & borrowing environment. Commonly abbreviated to ISLA.","cat":"slb","diff":3,"chapters":[13]},{"id":"t292","term":"International Swaps and Derivatives Association","def":"An industry body that is focused on the safety and efficiency of the global derivatives market, through encouraging wide-ranging risk management practices, amongst other activities. Both Buy-Side and Sell-Side firms comprise over 850 members. Commonly abbreviated to ISDA.","cat":"otc","diff":3,"chapters":[20,38]},{"id":"t293","term":"Investment Bank","def":"A type of Sell-Side firm which provides a wide range of financial services to its Buy-Sideclients, including trading in Bonds, Equity, Foreign Exchange, Derivatives, plus corporate finance expertise including capital raising activities plus mergers & acquisitions services. Investment banks also trade with other sell-side firms. An organisation that practices Proprietary Trading, involving the buying, selling and holding of financial instruments for its own account. Typically known as Broker by buy-side firms.","cat":"otc","diff":5,"chapters":[3,27,17,40,39,22]},{"id":"t294","term":"Investor","def":"An individual or institution that has purchased and owns Securities, or has invested in Derivatives. See Institutional Investors.","cat":"otc","diff":1,"chapters":[14,10,17,27,2]},{"id":"t295","term":"IOSCO","def":"Acronym for International Organization of Securities Commissions.","cat":"core","diff":1,"chapters":[48]},{"id":"t296","term":"IPO","def":"Acronym for Initial Public Offering.","cat":"core","diff":1,"chapters":[]},{"id":"t297","term":"IRS","def":"Acronym for Interest Rate Swap","cat":"otc","diff":1,"chapters":[16,31,30,27,23]},{"id":"t298","term":"ISDA","def":"Acronym for International Swaps and Derivatives Association","cat":"otc","diff":1,"chapters":[45,20,21,22,48,8,13,41]},{"id":"t299","term":"ISDA Master Agreement","def":"A commonly used global standard for documenting the legal arrangements between two parties that intend trading with one another in a variety of OTC Derivative product types, such as Interest Rate Swaps and Credit Default Swaps. Produced by ISDA.","cat":"otc","diff":3,"chapters":[20,21,22,34,45,8,13]},{"id":"t300","term":"ISDA Novation Protocol II","def":"An ISDA standard procedure designed to ensure that the three parties involved in a Novation of an OTC Derivative trade, follow the documented procedure so as to achieve a legally binding novation.","cat":"otc","diff":2,"chapters":[38]},{"id":"t301","term":"ISDA Protocol","def":"A standard document (representing for example, a change to a particular procedure or existing legal document) issued by the International Swaps and Derivatives Association which facilitates ISDA members agreeing to abide by the terms stated within that document. Firms are required to sign an adherence letter to formally signify their agreement to the protocol.","cat":"otc","diff":4,"chapters":[41]},{"id":"t302","term":"ISDA Regional Determination Committee","def":"Where a party to a Credit Default Swap trade believes that a Credit Event may have occurred, ISDA instructs the appropriate determination committee to investigate and to pronounce whether a credit event has occurred. Their decision is binding.","cat":"otc","diff":3,"chapters":[]},{"id":"t303","term":"ISIN","def":"Acronym for International Securities Identification Number; a uniform global standard providing unique reference numbers (ISIN numbers) for individual securities, enabling unambiguous identification of the issue being traded and delivered. See CUSIP, SEDOL Code, WKN Code.","cat":"core","diff":3,"chapters":[2,23,4,5,10]},{"id":"t304","term":"ISLA","def":"Acronym for the International Securities Lending Association.","cat":"slb","diff":1,"chapters":[13]},{"id":"t305","term":"ISO Currency Codes","def":"A set of internationally recognised three-digit codes representing each of the world’s currencies.","cat":"core","diff":1,"chapters":[23]},{"id":"t306","term":"Issue","def":"An individual Security.","cat":"core","diff":1,"chapters":[2,4,36,22,34,35,42]},{"id":"t307","term":"Issuer","def":"The originating entity that supplies Securities to the marketplace in order to raise cash; such entities include companies, sovereign entities, governments, government agencies and Supranational Organisations.","cat":"core","diff":2,"chapters":[10,4,2,34,17,35]},{"id":"t308","term":"Issuer Default","def":"The failure of a Bond Issuer to make interest (Coupon) payments and Capital Repayment when falling due.","cat":"core","diff":1,"chapters":[17,47,4]},{"id":"t309","term":"Know Your Customer","def":"An internal process within financial institutions designed to properly identify new clients and Counterparties, with the aim of preventing Money Laundering. The process requires firms to comply with strict regulation.","cat":"reg","diff":2,"chapters":[25]},{"id":"t310","term":"KYC","def":"Acronym for Know Your Customer.","cat":"core","diff":1,"chapters":[]},{"id":"t311","term":"Legacy Trades and Legacy Bilateral","def":"Relevant to OTC Derivatives, trades executed on a Bilateral basis prior to the mandatory Central Clearing of trades under EMIR.","cat":"otc","diff":1,"chapters":[47]},{"id":"t312","term":"Legal Entity Identifier","def":"A coding system to uniquely identify individual entities involved in financial transactions. Commonly known as LEI.","cat":"core","diff":1,"chapters":[]},{"id":"t313","term":"Legal Owner and Legal Ownership","def":"In Collateral -related transactions executed under the GMRA, the GMSLA and the English Law CSA, the legal owner of securities collateral is the Collateral Taker whilst the collateral is in that party’s possession. The Collateral Giver retains Beneficial Ownership.","cat":"legal","diff":3,"chapters":[9,13]},{"id":"t314","term":"Legal Title","def":"Ownership of an asset which is able to be proven through legal enforceability. See Title Transfer.","cat":"legal","diff":1,"chapters":[36,22,10,13]},{"id":"t315","term":"LEI","def":"Acronym for Legal Entity Identifier.","cat":"core","diff":1,"chapters":[47]},{"id":"t316","term":"Lending Agent","def":"A firm that acts as an intermediary between Securities Lenders and Securities Borrowers.","cat":"slb","diff":1,"chapters":[12,10]},{"id":"t317","term":"Libor","def":"Acronym for ‘London Interbank Offered Rate’. A Floating Benchmark interest rate which is the average rate quoted by a number of banks, for a range of currencies for a variety of time periods. Used in the calculation of Coupon on Floating Rate Notes and in OTC Derivative trades such as Fixed-for-Floating Interest Rate Swaps. See Euribor and EONIA.","cat":"otc","diff":4,"chapters":[16,19,27,2,23]},{"id":"t318","term":"Liquid, Liquid Assets","def":"Financial assets which are quickly and easily convertible into cash.","cat":"core","diff":1,"chapters":[4,10,34]},{"id":"t319","term":"Liquidation","def":"From a Collateral Management perspective, the process of converting an asset into cash.","cat":"core","diff":1,"chapters":[22,21]},{"id":"t320","term":"Local Custodian","def":"An organisation that specialises in holding Securities and cash and effecting movements of securities and cash on behalf of its account holders, and which is typically a member of the Central Securities Depository in the financial centre in which it is located. For comparison, see Global Custodian.","cat":"core","diff":3,"chapters":[10]},{"id":"t321","term":"Long First Coupon","def":"A term given to the first payment of interest after a Bond has been issued, specifically where the elapsed time between issuance of the bond and the first Coupon Payment Date is greater than the normal Coupon Period for that bond. See Short First Coupon.","cat":"core","diff":3,"chapters":[]},{"id":"t322","term":"Long Form Confirmation","def":"Relating to an OTC Derivative trade where no ISDA Master Agreement is in place between the two parties, a legal document issued by a firm to its Counterparty that specifies the full terms of an individual trade. See Short Form Confirmation.","cat":"otc","diff":3,"chapters":[25]},{"id":"t323","term":"Mandatory Central Clearing","def":"The requirement (as stated under EMIR) that all trades in standardised OTC Derivatives must be cleared via a Central Counterparty, providing that both the original trade parties are subject to the Clearing Obligation.","cat":"otc","diff":2,"chapters":[32,47,48,10]},{"id":"t324","term":"Mandatory Corporate Action","def":"An event in the lifetime of an Equity or Bond security which is normally triggered by the Issuer, where a benefit (e.g. additional cash or securities) is available to holders, or the security is reorganised (e.g. Stock Split). The compulsory nature of such events means that no choice of outcome is available to holders. See Optional Corporate Action and Voluntary Corporate Action.","cat":"core","diff":4,"chapters":[36]},{"id":"t325","term":"Manufactured Coupon, Manufactured Dividend and Manufactured Income","def":"Where a firm owes an Income amount to its Counterparty, and where such funds are not receivable from any other party, the payment by the firm from its own funds. For example, where Securities have been lent, the Securities Borrower must remit (to the Securities Lender) income that falls due on the borrowed securities; typically the borrower will not be in possession of the borrowed securities and will therefore not receive the income from the Issuer.","cat":"slb","diff":5,"chapters":[10]},{"id":"t326","term":"Margin Call","def":"Additional Collateral requested by a firm (from its Counterparty) to avoid being under-collateralised. In the event that collateral (used to secure the borrowing of cash or securities, or to mitigate exposures in OTC Derivative trades) loses its value due to a reduction in its market price, additional collateral may need to be given to the Exposed Party. Margin calls can also be made by the Collateral Giver (where the market price of the collateral increases), in order to avoid over- collateralising.","cat":"otc","diff":5,"chapters":[1,5,22,34,33,35,28,29]},{"id":"t327","term":"Margin Call Notification","def":"A communication issued by an Exposed Party to the Non-Exposed Party which, if agreed, will result in the non-exposed party providing Collateral in settlement of the margin call thereby mitigating the exposed party’s risk.","cat":"otc","diff":2,"chapters":[34,35,31]},{"id":"t328","term":"MarginSphere","def":"A mechanism for the electronic communication of Margin Calls and Collateral Substitution between market participants including Buy-Side and Sell-Side firms.","cat":"otc","diff":2,"chapters":[34,35]},{"id":"t329","term":"Mark-to-Market","def":"Revaluation of a trade or position in a financial instrument (e.g. Equity, Bond, Derivative) to the Current Market Price; used when determining Exposures, including the current value of Collateral. Also known as ‘MTM’ or ‘M2M’.","cat":"otc","diff":3,"chapters":[16,32,5,22,33,48,27,28]},{"id":"t330","term":"Mark-to-Model","def":"Revaluation of a trade or position in a financial instrument based upon prices calculated using a financial model. For comparison, see Mark-to- Market.","cat":"core","diff":2,"chapters":[48]},{"id":"t331","term":"Market","def":"An environment within which trades in financial instruments (e.g. currency, Equity, Bonds, Derivatives, commodities) are Executed, for example the US Treasury bond market, the Foreign Exchange market, the OTC Derivative market.","cat":"otc","diff":3,"chapters":[10,4,34,48,47]},{"id":"t332","term":"Market Maker","def":"An Investment Bank (or Broker) that publishes the price at which it is prepared to buy and sell specific Securities, and which is obliged to trade at the publicised price. Firms wishing to act in this capacity are required to operate to strict rules laid down by the relevant Stock Exchange or market authority.","cat":"core","diff":3,"chapters":[10]},{"id":"t333","term":"Market Price","def":"The price of a financial instrument in the open marketplace.","cat":"core","diff":1,"chapters":[34,14,11,22,4,32]},{"id":"t334","term":"Market Risk","def":"The risk of loss due to adverse movements in the Market Price of a financial instrument.","cat":"core","diff":1,"chapters":[47,30,46,40,3,27]},{"id":"t335","term":"Market Risk Neutral","def":"A trading strategy involving an organisation intentionally avoiding taking a position in a financial instrument. Where a firm buys (temporarily taking a position), they will immediately sell (thereby reducing the position to zero). Position taking exposes the firm to potential losses resulting from adverse price movements (Market Risk). Central Counterparties employ such a strategy.","cat":"core","diff":4,"chapters":[46,47,30,7]},{"id":"t336","term":"Market Value","def":"The current cash value of a financial asset (which is subject to fluctuation in value) in the open marketplace, including Bonds, Equity and OTC Derivatives. (Cash is not subject to fluctuation as it retains 100% of its value.)","cat":"otc","diff":3,"chapters":[10,4,34,33,2,35,38,39]},{"id":"t337","term":"Matched Settlement Instruction","def":"See Settlement Instruction. Following receipt of a settlement instruction, the CSD compares the details with the Counterparty’s settlement instruction details and if they agree, are reported as ‘matched’. Normally, Settlement cannot occur at the CSD without settlement instructions being matched.","cat":"otc","diff":3,"chapters":[2,4,5,34]},{"id":"t338","term":"Maturity Date (Bond)","def":"The date at which capital invested by Bondholders is scheduled to be repaid by the Bond Issuer. Beyond this date, the bond is no longer live and valid.","cat":"legal","diff":2,"chapters":[2,30,44,19,17]},{"id":"t339","term":"Mid-Market Quotation","def":"The average of the current buy price and the current sale price, as quoted by Market Makers.","cat":"core","diff":1,"chapters":[]},{"id":"t340","term":"Mid Price","def":"The average of the bid (to buy) and offer (to sell) prices.","cat":"core","diff":1,"chapters":[22]},{"id":"t341","term":"Middle Office","def":"A section (or department) of people within some Buy-Side and Sell- Side firms, that are typically responsible for supporting the trading department (e.g. profit & loss calculation, risk management) and for communication between the trading department and the Operations Department.","cat":"reg","diff":3,"chapters":[28,31]},{"id":"t342","term":"Minimum Transfer Amount","def":"An amount agreed between two trading firms, below which no Margin Call will be made. Commonly abbreviated to MTA.","cat":"otc","diff":1,"chapters":[33,5,11,48,22,4]},{"id":"t343","term":"Mitigate","def":"To reduce or to lessen an Exposure.","cat":"core","diff":1,"chapters":[22,10,18,46,2]},{"id":"t344","term":"Monetary Policy","def":"The mechanism used by Central Banks to influence various aspects of a country’s economy, including inflation and interest rates.","cat":"reg","diff":1,"chapters":[3,4]},{"id":"t345","term":"Money Laundering","def":"A criminal activity involving disguising the true origin of funds obtained through illegal means. See Know Your Customer.","cat":"core","diff":1,"chapters":[]},{"id":"t346","term":"Money Market","def":"The environment in which cash is lent and borrowed, typically with a maximum duration of 12 months. Floating Rate Notes are regarded as money market Instruments as their interest rates track current money market interest rates. Repo trades are also classified as money market instruments, as the primary motivation for such trades is the lending and borrowing of cash.","cat":"repo","diff":4,"chapters":[11,10,2,4,12]},{"id":"t347","term":"Money Market Divisor","def":"The denominator used to determine a currency interest amount per day. Specifically, 360 for EUR and USD, 365 for GBP. Used for Money Market trades, including Repo.","cat":"core","diff":2,"chapters":[10]},{"id":"t348","term":"Moody’s Investors Service","def":"An issuer Ratings Agency that publishes its view of an Issuer’s ability to repay Debt.","cat":"core","diff":1,"chapters":[2]},{"id":"t349","term":"Mortgage-Backed Security","def":"A financial instrument that represents loans of cash, for example residential mortgages. Loans with similar characteristics are pooled then Securitised into a Security which is available for purchasing by investors.","cat":"core","diff":2,"chapters":[]},{"id":"t350","term":"MTA","def":"Acronym for Minimum Transfer Amount.","cat":"otc","diff":1,"chapters":[22,48,33,4]},{"id":"t351","term":"Multilateral Development Banks","def":"Organisations focused on achieving economic equality and reducing severe poverty. International financial institutions supported by at least two countries for the purpose of promoting financial growth in specific regions. Also known as Supranational Organisations.","cat":"core","diff":3,"chapters":[48,47]},{"id":"t352","term":"Multilateral Netting","def":"Generically speaking, a number of parties involved in an arrangement whereby each party agrees to reduce their gross trades to a net position (which is representative of the gross trades). More specifically, for Standardised OTC Derivatives under EMIR, the Central Counterparty operates such netting with all of its Clearing Members. Counterparty Risk is reduced as a result.","cat":"otc","diff":4,"chapters":[46,47,7,48]},{"id":"t353","term":"Mutual Fund","def":"See Fund Manager.","cat":"core","diff":1,"chapters":[17,47,29,22,9]},{"id":"t354","term":"Mutualisation","def":"Within a Central Counterparty, the sharing of Counterparty Risk amongst its Clearing Members.","cat":"reg","diff":1,"chapters":[47]},{"id":"t355","term":"Naked Short","def":"A sale of Securities which are not owned by the seller (a Short Sale), for which the relevant securities have not been borrowed; under these circumstances the sale will remain unsettled. The alternative is a Covered Short.","cat":"slb","diff":2,"chapters":[10]},{"id":"t356","term":"National CSD","def":"A Central Securities Depository that holds domestic Securities and which typically facilitates Settlement of trades in the domestic currency on an Electronic Book Entry basis.","cat":"legal","diff":2,"chapters":[2]},{"id":"t357","term":"National Competent Authority","def":"An organisation having been granted the legal power to perform a particular function.","cat":"core","diff":1,"chapters":[48]},{"id":"t358","term":"NAV","def":"Acronym for Net Asset Value.","cat":"core","diff":1,"chapters":[34]},{"id":"t359","term":"NCA","def":"Acronym for National Competent Authority.","cat":"core","diff":1,"chapters":[48]},{"id":"t360","term":"Nearest Integer","def":"The nearest whole number. A rounding rule which defines whether a figure less than a whole number should be rounded up or rounded down. The general rule is: 1) if the number is less than ‘5’, then round down, and 2) if the number is ‘5’ or above, then round up.","cat":"core","diff":3,"chapters":[22]},{"id":"t361","term":"Negative Exposure","def":"This term has the same meaning as Negative Mark-to-Market.","cat":"otc","diff":1,"chapters":[47,22,39]},{"id":"t362","term":"Negative Interest Rate","def":"An interest rate in which the cash lender pays interest to the cash borrower. See Positive Interest Rate.","cat":"slb","diff":1,"chapters":[22]},{"id":"t363","term":"Negative Mark-to- Market","def":"Resulting from the (normally daily) revaluation process, the Current Market Value of an asset having moved against one of the parties to a trade. In Collateral - related trades, this results in a Margin Call being received by that party from its Counterparty. See Positive Mark-to- Market.","cat":"otc","diff":3,"chapters":[]},{"id":"t364","term":"Negative Trading Position","def":"A firm’s trade-dated balance in a financial instrument where a greater quantity of sales (compared with purchases) have been Executed. The resultant impact of Short Selling on a firm’s Trading Position.","cat":"core","diff":2,"chapters":[10,27]},{"id":"t365","term":"Net Asset Value","def":"Relevant to Exchange-Traded Funds and Mutual Funds, the value of the fund’s assets after deduction of the value of its liabilities.","cat":"core","diff":1,"chapters":[34]},{"id":"t366","term":"Net Exposure","def":"In a Repo, the differential between the current value of Securities Collateral and the current value of the cash lent/borrowed, after taking account of any Minimum Transfer Amount or Threshold.","cat":"otc","diff":2,"chapters":[5,22,35,4,30]},{"id":"t367","term":"New Bilateral Trades","def":"Relevant to OTC Derivatives, trades executed on a Bilateral basis following the mandatory Central Clearing of trades under EMIR. Specifically, trades which cannot be centrally cleared. Also known as Regulatory Bilateral Trades. For comparison, see Legacy Bilateral Trades.","cat":"reg","diff":3,"chapters":[48]},{"id":"t368","term":"New York Law CSA","def":"The Credit Support Annex written under New York Law. Of the many features contained therein, one of the most important is that the collateral transfer method is Security Interest. For comparison, see English Law CSA.","cat":"legal","diff":2,"chapters":[36,22]},{"id":"t369","term":"NFC +","def":"Under EMIR, a Non-Financial Counterparty whose OTC Derivative activity is above a regulatory-defined level known as the Clearing Threshold. Such firms are obliged to clear their trades via a Central Counterparty.","cat":"otc","diff":2,"chapters":[47,48]},{"id":"t370","term":"NFC −","def":"Under EMIR, a Non-Financial Counterparty whose O TC Derivative trading activity is below a regulatory-defined level known as the Clearing Threshold. Such firms are exempt from the requirement to clear their trades via a Central Counterparty.","cat":"reg","diff":3,"chapters":[47,48]},{"id":"t371","term":"Non-Cash Collateral","def":"Assets given or taken as Collateral in a form other than Cash Collateral. Theoretically, this can include assets such as precious metals (e.g. gold) or valuable oil paintings. Under normal circumstances, such collateral is in the form of Securities (Bonds or Equity).","cat":"core","diff":3,"chapters":[11,48,12,4]},{"id":"t372","term":"Non-CCP-Eligible Assets","def":"Financial assets used as Collateral that are not acceptable to Central Counterparties, as defined under EMIR. See CCP-Eligible Assets.","cat":"reg","diff":1,"chapters":[47]},{"id":"t373","term":"Non-Centrally Cleared Trade","def":"For OTC Derivatives under EMIR, trades which do not comply with the requirement to be Novated to a Central Counterparty. If the trade has non-standard features, or if one (or both) parties is not subject to the Clearing Obligation, the trade must be non-centrally cleared. See Centrally Cleared Trades.","cat":"reg","diff":3,"chapters":[48]},{"id":"t374","term":"Non-Clearing Member","def":"A firm which has chosen not be become a Clearing Member at a Central Counterparty, and instead utilises the services provided by a Clearing Member that offers Client Clearing services.","cat":"reg","diff":2,"chapters":[47,46]},{"id":"t375","term":"Non-Exposed Party","def":"A firm that is a party to a financial transaction has no risk (currently), but its Counterparty is at risk due to changes in the Current Market Value of the assets involved. The counterparty (the Exposed Party) will issue a Margin Call Notification, following which the firm is obliged to give Collateral in order to mitigate the counterparty’s risk.","cat":"otc","diff":4,"chapters":[35,22,4,11,2]},{"id":"t376","term":"Non-Financial Counterparty","def":"Under EMIR, all firms that execute OTC Derivative trades but which are not classified as a Financial Counterparty are automatically classified as an NFC. Dependent upon whether an NFC’s trading activity is above or below a defined Clearing Threshold will determine whether the NFC is exempt or not from the requirement to clear their trades via a Central Counterparty. See N FCC + and NFC−.","cat":"otc","diff":4,"chapters":[48]},{"id":"t377","term":"Nostro","def":"See Cash Correspondent.","cat":"core","diff":1,"chapters":[35,2,11,23,4]},{"id":"t378","term":"Nostro Account","def":"The specific account held by a Nostro in which cash is held on behalf of the account holder.","cat":"core","diff":1,"chapters":[35,4]},{"id":"t379","term":"Nostro Reconciliation","def":"Within Buy-Side and Sell-Side firms, the internal process of comparing its Books & Records of cash balances held at Cash Correspondents, CSDs and Custodians versus cash balances stated on the statements received from cash correspondents, CSDs and custodians, known as a Nostro Statement.","cat":"core","diff":3,"chapters":[11,5,34]},{"id":"t380","term":"Nostro Statement","def":"A formal list of individual cash movements and cash balances within a specific account at a Cash Correspondent, CSD or Custodian. Such statements are normally available at the close of each business day.","cat":"legal","diff":2,"chapters":[35]},{"id":"t381","term":"Notional Principal","def":"Relevant specifically to OTC Derivatives, the quantity or value on which all trade calculations are based. Note that true derivative trades do not involve the up-front payment or receipt of the notional principal: it can therefore be described as a theoretical Underlying quantity.","cat":"otc","diff":3,"chapters":[16,15,30,17,31]},{"id":"t382","term":"Novation","def":"1. On an individual trade, the replacement of an individual Counterparty with a Central Counterparty. 2. On an individual O TC Derivative trade, the reassignment of the contract from the (original) Bilateral counterparty to a replacement bilateral counterparty.","cat":"otc","diff":3,"chapters":[46,31,38,15,47,39,37,41]},{"id":"t383","term":"Novation Transferee","def":"In an OTC Derivative trade where Novation has occurred, the party that has ‘stepped in’ to the trade. See Novation Transferor.","cat":"otc","diff":1,"chapters":[38]},{"id":"t384","term":"Novation Transferor","def":"In an OTC Derivative trade where Novation has occurred, the party that has ‘stepped out’ of the trade. See Novation Transferee.","cat":"otc","diff":1,"chapters":[38]},{"id":"t385","term":"Obligor","def":"An entity that is contractually required to make payment; for example a Bond Issuer who is required to pay Coupon and to make Capital Repayment.","cat":"core","diff":2,"chapters":[41]},{"id":"t386","term":"Offset","def":"The execution of an opposing trade to an existing O TC Derivative trade in order to negate the position, and carried out with a Counterparty other than the original counterparty. For comparison, see Unwind.","cat":"otc","diff":2,"chapters":[40,39,31,47,48,27,30,37]},{"id":"t387","term":"Omgeo’s CTM (Central Trade Manager)","def":"A system that facilitates the critically important post-Trade Execution step (known as Trade Confirmation) of comparing trade details between Buy-Side and Sell-Side firms to ensure accuracy, prior to settlement. Covering trades in Equity and Bonds, plus the transaction type of Repo.","cat":"core","diff":3,"chapters":[]},{"id":"t388","term":"Omnibus Account","def":"An account owned by a Clearing Member (CM) at a Central Counterparty, in which trades and positions that are owned by multiple clients of the CM (Non Clearing Members) are held, as part of the CM’s Client Clearing service. See Individual Segregated Account.","cat":"reg","diff":3,"chapters":[47]},{"id":"t389","term":"One-Way CSA","def":"A Credit Support Annex in which the stated terms (particularly exposure management) are in favour of one of the parties. See Bilateral CSA.","cat":"otc","diff":2,"chapters":[22]},{"id":"t390","term":"Open Market Operations","def":"Repo and/or Securities Lending & Borrowing activity undertaken by a Central Bank, in which the central bank lends cash to an entity that provides an asset (typically Bonds) as Collateral. A means by which Monetary Policy is implemented by central banks.","cat":"slb","diff":3,"chapters":[3]},{"id":"t391","term":"Open Trade","def":"1. A Securities trade for which Settlement has not yet occurred, whether Value Date is in the future or in the past. 2. A Securities Lending & Borrowing trade executed without (yet) specifying the Closing Value Date. 3. An OTC Derivative trade which has not yet reached its Scheduled Maturity Date.","cat":"otc","diff":3,"chapters":[31]},{"id":"t392","term":"Opening Leg and Opening Value Date","def":"In a two-sided transaction (e.g. Repo and Securities Lending & Borrowing), the date at which the initial exchange of assets is intended to occur.","cat":"slb","diff":2,"chapters":[4,5,7,11]},{"id":"t393","term":"Operations Department","def":"A department or division within a Buy-Side or Sell-Side firm that is responsible for the timely processing of trades Executed by the firm’s Traders. Trades can be of one type only or of a range of types, such as Equity, Bond, Foreign Exchange, Exchange-Traded Derivatives, OTC Derivatives and commodities. Such processing tasks typically include issuance and receipt of Trade Confirmations to Counterparties, issuance of cash- related and Securities -related Settlement Instructions, Settlement of trades, processing of Corporate Actions, the updating of Books & Records and multiple types of Reconciliation. The Collateral Department is normally part of the Operations Department.","cat":"otc","diff":5,"chapters":[28,22,35,31,44]},{"id":"t394","term":"Optional Corporate Action","def":"An event in the lifetime of an Equity or Bond security which is normally triggered by the Issuer, where a benefit (e.g. additional cash or securities) is available to holders. The optional nature of such events means that a choice of outcome is available to holders (e.g. cash dividend with an option to take Securities rather than cash). See Mandatory Corporate Action and Voluntary Corporate Action.","cat":"core","diff":4,"chapters":[10]},{"id":"t395","term":"Options","def":"An Exchange-Traded Derivative product; giving the investor the right (but not the obligation) to buy or to sell the Underlying asset at a fixed price (Exercise Price or Strike Price), for exercise no later than the option’s expiry date. See Call Option and Put Option.","cat":"otc","diff":3,"chapters":[14,22,36,7,46]},{"id":"t396","term":"Order","def":"1. A request issued by a member of a Stock Exchange or Derivative Exchange to execute a trade. 2. A request (issued by an investor to an Investment Bank or Broker) to buy or to sell Securities, typically at a specified price or at the Current Market Price.","cat":"otc","diff":3,"chapters":[10,4,34,22,2,27]},{"id":"t397","term":"Ordinary Shares","def":"The standard description of Shares issued by companies in various parts of the globe, including Australia, India and the UK. See Common Stock.","cat":"core","diff":2,"chapters":[22]},{"id":"t398","term":"OTC","def":"Acronym for Over-the-counter.","cat":"otc","diff":1,"chapters":[47,48,22,46,15]},{"id":"t399","term":"OTC Derivative","def":"Shortened form of Over-the-counter Derivative.","cat":"otc","diff":1,"chapters":[47,48,22,15,46,13,25,27]},{"id":"t400","term":"Over- Collateralisation","def":"The effect of Haircut. A Collateral Giver is required to cover its Counterparty’s exposure by providing Collateral with a Collateral Value that is no less than the Exposure amount, meaning that over- collateralisation has occurred by the value of the haircut. Also, the effect of a Non-Exposed Party undervaluing collateral given to the Exposed Party, resulting in a greater value of collateral being given than is necessary to cover the Exposure.","cat":"core","diff":5,"chapters":[2,4,10]},{"id":"t401","term":"Over-the-counter","def":"A generic term which describes a method of Trade Execution, in which trades are executed Bilaterally and directly between two parties (and not via an exchange, such as a Stock Exchange or derivative exchange). Financial products traded in this way include Bonds, Foreign Exchange and OTC Derivatives.","cat":"otc","diff":3,"chapters":[46,14,4,10]},{"id":"t402","term":"Over-the-counter Derivative","def":"A Derivative trade in which the two involved parties executed the trade directly with one another, on a Bilateral basis. Synonymous with the term Swap. Commonly abbreviated to OTC Derivative.","cat":"otc","diff":2,"chapters":[46]},{"id":"t403","term":"Overnight Index Swap","def":"Similar to an Interest Rate Swap, a type of O TC Derivative involving a fixed rate of interest versus an overnight rate index.","cat":"otc","diff":1,"chapters":[27]},{"id":"t404","term":"Par","def":"A Bond price of 100%.","cat":"core","diff":1,"chapters":[2,46,35,4,22]},{"id":"t405","term":"Par Value","def":"The face value of an Equity Security. Also known as ‘nominal value’.","cat":"core","diff":1,"chapters":[4,10,22]},{"id":"t406","term":"Partial Settlement","def":"The exchange of a quantity of Securities and a pro-rata amount of cash that are less than the full quantity and cash value of the trade.","cat":"core","diff":2,"chapters":[]},{"id":"t407","term":"Partial Unwind","def":"The execution of an opposing trade to an existing OTC Derivative trade in order to reduce (not remove) the position, and carried out with the original Counterparty. For comparison, see Unwind.","cat":"otc","diff":2,"chapters":[31]},{"id":"t408","term":"Pass Through Securities","def":"A type of security (e.g. a Mortgage-Backed Security) in which the periodic (e.g. monthly) flow of cash received from the mortgagees, representing the repayment of capital and interest and any Prepayments, is forwarded (i.e. passed through) to the investors.","cat":"core","diff":3,"chapters":[2]},{"id":"t409","term":"Payment Instruction","def":"An alternative name for a cash-only Settlement Instruction.","cat":"core","diff":1,"chapters":[34,48]},{"id":"t410","term":"Payment versus Payment","def":"The simultaneous exchange of two currencies, as practised within CLS Bank.","cat":"core","diff":1,"chapters":[18]},{"id":"t411","term":"Pension Funds","def":"Organisations that typically invest pension contributions in Securities and Derivatives, in order to maximise future pension payments. A type of Institutional Investor.","cat":"otc","diff":2,"chapters":[48,47,10,9,21]},{"id":"t412","term":"Physical Settlement","def":"In a Credit Default Swap and following a Credit Event, a Settlement method whereby the Protection Buyer delivers Bonds to the Protection Seller in order to receive payout in full and final settlement. For comparison, see Cash Settlement.","cat":"otc","diff":3,"chapters":[17]},{"id":"t413","term":"Pledge","def":"One method of securing (collateralising) a loan. Where an asset has been lent, the lender takes possession of Collateral but does not have legal ownership of the collateral unless the borrower Defaults. Should borrower default occur, the lender has the legal right to sell the collateral to recover the value of the lent asset.","cat":"slb","diff":4,"chapters":[22]},{"id":"t414","term":"Pool Factor","def":"Relevant to Mortgage-Backed Securities, a number representing the amount by which the initial capital amount must be adjusted in order to determine the current capital amount outstanding, following capital repayment and Prepayment by the mortgagees.","cat":"core","diff":3,"chapters":[2]},{"id":"t415","term":"Portfolio","def":"A list of Securities, or of ‘live’ Derivative trades.","cat":"otc","diff":1,"chapters":[12,31,48,30,5,32,44]},{"id":"t416","term":"Portfolio Compression","def":"The process of offsetting trades that contain the same details as an existing position in the same OTC Derivative product, and updating that existing position to a new net position, whilst terminating (cancelling) the original trades. See triReduce.","cat":"otc","diff":3,"chapters":[44,30,48,46,47,31]},{"id":"t417","term":"Portfolio Reconciliation","def":"For collateral management purposes, the comparison of a firm’s list of trades with a Bilateral Counterparty, in an attempt to ensure that the trade population is the same to increase the likelihood of Exposure amounts and Margin Calls being agreed between the two parties. See triResolve.","cat":"otc","diff":3,"chapters":[5,31,48,30,40,44]},{"id":"t418","term":"Porting","def":"Where a firm holds its OTC Derivative assets at a Clearing Member (of a Central Counterparty), and that clearing member Defaults, the firm’s assets are ported (transferred) to a specific non-defaulting clearing member, generically known as a BackUp Clearing Member.","cat":"reg","diff":3,"chapters":[46,47,48]},{"id":"t419","term":"Positive Exposure","def":"This term has the same meaning as Positive Mark-to-Market.","cat":"otc","diff":1,"chapters":[22,47,34,35,38]},{"id":"t420","term":"Positive Interest Rate","def":"An interest rate in which the cash borrower pays interest to the cash lender. See Negative Interest Rate.","cat":"slb","diff":1,"chapters":[11,9,3,36,42]},{"id":"t421","term":"Positive Mark-to- Market","def":"Resulting from the (normally daily) revaluation process, the Current Market Value of an asset having moved in favour of one of the parties to a trade. In Collateral -related trades, this results in a Margin Call issued by that party to its Counterparty. See Negative Mark-to-Market.","cat":"otc","diff":3,"chapters":[22]},{"id":"t422","term":"Positive Trading Position","def":"A firm’s trade-dated balance in a financial instrument where a greater quantity of purchases (compared with sales) have been executed. See Negative Trading Position.","cat":"core","diff":2,"chapters":[36]},{"id":"t423","term":"Post-‘Trade- Execution’ Event","def":"An ‘umbrella’ term that refers to any event that affects OTC Derivative trades following Trade Execution and prior to the trade’s Scheduled Maturity Date, including Novation, Unwind, Offset and Credit Events.","cat":"otc","diff":2,"chapters":[]},{"id":"t424","term":"Power of Attorney","def":"Authority given by the owner of Securities and cash to an individual or company to remove those assets from their place of safekeeping, on behalf of the owner of the assets.","cat":"core","diff":2,"chapters":[]},{"id":"t425","term":"Pre-Collateralise","def":"The provision of Collateral by a Collateral Giver (e.g. a Securities Borrower), in advance of receiving the Collateral Taker’s opposing asset.","cat":"slb","diff":2,"chapters":[12]},{"id":"t426","term":"Pre-Funding","def":"Inserting funds into a cash account in anticipation of such an account being debited, as (for example) can occur at a Central Counterparty when a Clearing Member is required to pay Variation Margin.","cat":"reg","diff":2,"chapters":[47]},{"id":"t427","term":"Premium","def":"The cost of insurance; the regular payment of an agreed amount by an insured party to the insurer. Applicable in Credit Default Swaps.","cat":"otc","diff":1,"chapters":[17,15,14,41,23]},{"id":"t428","term":"Prepayment","def":"Generically, payment of an obligation prior to its official repayment date. Specifically relating to Mortgage-Backed Securities, the unscheduled repayment of capital by mortgagees, which can typically be made at any time and which impacts the amount of capital outstanding on the security. See Pool Factor.","cat":"legal","diff":3,"chapters":[2]},{"id":"t429","term":"Present Value and Present Valuing","def":"‘Today’s’ value of a cash amount that is payable or receivable on a known future date, achieved by applying a Discount Factor. See Time Value of Money.","cat":"core","diff":2,"chapters":[22,27]},{"id":"t430","term":"Primary Market","def":"A generic term to describe the issuance of and trading in Securities that are in course of being brought to the marketplace. See Secondary Market.","cat":"core","diff":2,"chapters":[2]},{"id":"t431","term":"Prime Broker","def":"A division within an Investment Bank that provides a broad range of services to its Hedge Funddclients.","cat":"core","diff":1,"chapters":[10]},{"id":"t432","term":"Privately Negotiated","def":"An alternative term used to describe financial transactions which are traded Bilaterally (on an Over-the-counter basis).","cat":"core","diff":1,"chapters":[27,46,1]},{"id":"t433","term":"Proprietary Positions","def":"A position in a financial instrument which is owned by the firm, typically an Investment Bank. See Positive Trading Position and Negative Trading Position.","cat":"core","diff":2,"chapters":[]},{"id":"t434","term":"Proprietary Trading","def":"A method of trading in financial instruments where a firm (e.g. Investment Bank) executes trades for its own account, which can result in the firm having a Positive Trading Position or Negative Trading Position; such position taking means that the firm is Exposed to fluctuations in value of the financial instrument, and is therefore considered to be a high risk activity. Note: the Volcker Rule (US) prevents certain types of firm from indulging in proprietary trading. For comparison, see Broker.","cat":"core","diff":5,"chapters":[36]},{"id":"t435","term":"Prospectus","def":"A document issued by (or on behalf of) a Securities issuer, that details the terms and conditions applicable to the individual security.","cat":"core","diff":2,"chapters":[23,34,4,33,43]},{"id":"t436","term":"Protection Buyer","def":"In a Credit Default Swap trade, the party that seeks cover against the Default of the Reference Entity; the payer of Premium to the Protection Seller.","cat":"otc","diff":2,"chapters":[17,41,22,39,23]},{"id":"t437","term":"Protection Seller","def":"In a Credit Default Swap trade, the party that provides cover against the Default of the Reference Entity, to the Protection Buyer; the receiver of Premium.","cat":"otc","diff":2,"chapters":[17,41,22,23,33]},{"id":"t438","term":"Purchase Date","def":"Alternative term for the Opening Value Date in a Repo trade.","cat":"repo","diff":1,"chapters":[4,5]},{"id":"t439","term":"Put Option","def":"A Derivative transaction in which the Option holder has the right (but not the obligation) to sell the Underlying product at a pre-agreed price (known as the Exercise Price or Strike Price), no later than the option’s expiry date. See Call Option.","cat":"otc","diff":3,"chapters":[14,36,2]},{"id":"t440","term":"Puttable Bonds","def":"Debt instruments which have a feature permitting Redemption (by the Bondholder, and in some cases by the Issuer) prior to the bond’s Maturity Date. For comparison, see Callable Bonds.","cat":"core","diff":2,"chapters":[36,2]},{"id":"t441","term":"Quick Code","def":"A 4-character number to uniquely identify individual securities traded in Japan.","cat":"core","diff":1,"chapters":[]},{"id":"t442","term":"Quote Currency","def":"In a Foreign Exchange trade, the currency a firm purchases by the sale of an existing currency at the agreed exchange rate. See Base Currency.","cat":"core","diff":2,"chapters":[18,19]},{"id":"t443","term":"Ratings Agencies","def":"Organisations that publish their view of an Issuer’s ability to repay Debt. Such views (typically expressed as an alphabetical rating) are used in the assessment of risk associated with buying and selling Bonds, and in the use of bonds as Collateral. See Moody’s Investors Service and Standard & Poor’s.","cat":"core","diff":3,"chapters":[34]},{"id":"t444","term":"Ratings Downgrades","def":"The reduction, by a Ratings Agency, of the perceived creditworthiness of an entity (whether a corporation, government or government agency).","cat":"core","diff":2,"chapters":[2]},{"id":"t445","term":"Ratings Upgrades","def":"The increase, by a Ratings Agency, of the perceived creditworthiness of an entity (whether a corporation, government or government agency).","cat":"core","diff":2,"chapters":[2]},{"id":"t446","term":"Realised Profit & Loss","def":"Actual profit or loss following sales and purchases of Securities. See Unrealised Profit & Loss.","cat":"core","diff":1,"chapters":[]},{"id":"t447","term":"Rebate Rate","def":"Where a Non-Exposed Party gives Collateral in the form of cash to the Exposed Party, the agreed rate of interest that the exposed party will pay to the non-exposed party at the close of the trade, to enable the non-exposed party to earn some return on the cash collateral given. See Cash Collateral Reinvestment and Reinvestment Rate.","cat":"slb","diff":4,"chapters":[10,11,5,9,12]},{"id":"t448","term":"Recall (Securities Lending)","def":"In a Securities Lending & Borrowing trade that is executed on an Open basis, the request by the Securities Lender to the Securities Borrower to return the lent securities, usually because the securities lender has a delivery commitment relating to a separate transaction. See Return (Securities Borrowing).","cat":"slb","diff":3,"chapters":[11,10,12,9]},{"id":"t449","term":"Reconciliation","def":"A primary and critically important control for all financial services firms; the comparison of internal Books & Records (of trade details or Trading Positions or Settled Positions or Open Trades, and cash balances) versus statements from external entities.","cat":"core","diff":3,"chapters":[31,48,11,5,34,28,30,44]},{"id":"t450","term":"Record Date","def":"Equity: the date at which a company’s Share Register is temporarily closed for the purpose of identifying the shareholders to whom Corporate Action benefits, such as Dividends or Bonus Issues, will be paid. Also known as Books Closing Date. Bonds: the date at which a custodian identifies its account holders to whom Coupon Payments will be made. Note that for equity and bonds, the recipient of a payment is not necessarily entitled to the benefit (due to settlement failure). See Entitlement, Entitlement Date and Ex-Dividend Date.","cat":"core","diff":5,"chapters":[10,43,2,22,4,42]},{"id":"t451","term":"Redemption","def":"The repayment of capital by an issuer to Bondholders.","cat":"core","diff":1,"chapters":[2]},{"id":"t452","term":"Reference Entity","def":"The formal title of the Bond Issuer in a Credit Default Swap.","cat":"otc","diff":1,"chapters":[17,41,33,23,30,22,29,40]},{"id":"t453","term":"Reference Entity Database","def":"For Credit Default Swaps, a coding system that uniquely identifies Bond Issuers (Reference Entities) and their Bonds (Reference Obligations).","cat":"otc","diff":2,"chapters":[23]},{"id":"t454","term":"Reference Obligation","def":"A formal term given to an individual Bond Issue, within a Credit Default Swap.","cat":"otc","diff":1,"chapters":[17,23]},{"id":"t455","term":"Register","def":"The list of holders of a Registered Security, maintained by a Registrar acting on the Issuer’s behalf; this allows direct communication (for example, payments of income) by the issuer with the registered owners of the security.","cat":"core","diff":3,"chapters":[23,31]},{"id":"t456","term":"Registered Security","def":"A Security where a Registrar (acting on the Issuer’s behalf) maintains a record of owners of the security; this requires that when securities are sold, the seller’s name is replaced by the buyer’s name on the register. Typically, Equity rather than Bonds are issued in registered form. See Bearer Security.","cat":"core","diff":3,"chapters":[]},{"id":"t457","term":"Registered Shareholder","def":"For Equity, the individual or organisation in whose name shares are held on the Register of shareholders maintained by a Registrar on behalf of the Issuer.","cat":"core","diff":2,"chapters":[]},{"id":"t458","term":"Registrar","def":"An organisation appointed by an Issuer of a Registered Security to maintain the Register of holders of that security. Also known as transfer agent in the US.","cat":"core","diff":2,"chapters":[]},{"id":"t459","term":"Registration","def":"The act of updating the Issuer’s register of owners (of a Registered Security) in order to reflect transfer of ownership.","cat":"core","diff":1,"chapters":[47,46]},{"id":"t460","term":"Regulator","def":"An entity that is responsible for the monitoring and controlling of activities within a financial marketplace, to ensure compliance with rules and regulations.","cat":"reg","diff":2,"chapters":[48]},{"id":"t461","term":"Regulatory Bilateral","def":"An alternative label for New Bilateral Trades.","cat":"reg","diff":1,"chapters":[48]},{"id":"t462","term":"Regulatory Reporting","def":"The provision of information (to a Regulator) by Buy-Side and Sell- Sidefirms regarding trading activity and Securities and Derivative positions.","cat":"reg","diff":2,"chapters":[23,47]},{"id":"t463","term":"Rehypothecation","def":"Under a Security Interest arrangement (as is the case for the New York Law CSA), the Collateral Taker has no automatic right to reuse Securities Collateral. However, the Collateral Giver may choose to grant the collateral taker the right to rehypothecate. The term ‘rehypothecation’ under security interest has a similar (but not the same) meaning as the term ‘reuse’ under Title Transfer. For comparison, see Reuse of Securities Collateral.","cat":"legal","diff":5,"chapters":[48,36,22]},{"id":"t464","term":"Reinvestment","def":"1. Instead of a Securities investor choosing to receive Dividends or Coupon in the form of cash, the cash receivable is used to purchase more securities (providing the Issuer allows that choice). 2. Where cash Collateral is received, the loan of that cash into the Money Market in order to earn a positive return.","cat":"core","diff":3,"chapters":[10,11,48,12,9]},{"id":"t465","term":"Reinvestment Rate","def":"Where Cash Collateral has been received and that cash has been reinvested (loaned) into the Money Market, the interest rate applicable to such reinvested cash. For comparison, see Rebate Rate.","cat":"slb","diff":2,"chapters":[10,11,9,12]},{"id":"t466","term":"Reinvestment Risk","def":"Where Cash Collateral has been received, the risk that the interest rate earned (by the Collateral Taker) on such cash is less than the Rebate Rate that must be paid to the Collateral Giver.","cat":"slb","diff":2,"chapters":[12]},{"id":"t467","term":"Relationship Manager","def":"An individual (for example, within an Investment Bank) that is the primary point of contact for clients. Responsible for maintaining relationships with existing clients, and for nurturing relationships with new clients. Also known as a salesperson.","cat":"core","diff":3,"chapters":[27]},{"id":"t468","term":"Remaining Party","def":"In an OTC Derivative trade where Novation has occurred, the party that continues to be involved in the trade, albeit with a new Counterparty. See Novation Transferee and Novation Transferor.","cat":"otc","diff":2,"chapters":[38,31]},{"id":"t469","term":"Reorganisation","def":"A term normally applied to the restructuring of a company’s issued Share Capital, for example via a form of Corporate Action known as a Stock Split or Reverse Split.","cat":"core","diff":2,"chapters":[]},{"id":"t470","term":"Replacement Collateral","def":"As part of the Collateral Substitution process, the (new) collateral that replaces the original collateral.","cat":"core","diff":1,"chapters":[4,42,10,22,34]},{"id":"t471","term":"Replacement Cost","def":"With reference to an existing and live OTC Derivative trade, the cost of replacing the trade at the Current Market Price (in the event that the Counterparty Defaults).","cat":"otc","diff":2,"chapters":[33,22,15,21]},{"id":"t472","term":"Replacement Trade","def":"In Portfolio Compression, an alternative approach to the notional change method resulting in the same outcome in terms of net position. Where two trades have been executed, 1) a Notional Principal of USD 100m and 2) a notional principal of USD 60m in the opposing direction, instead of adjusting the notional principal to USD 40m, both trades would be fully compressed and a new (replacement) trade for a notional principal of USD 40m would be created between the original parties. Also known as ‘replacement swap’.","cat":"otc","diff":5,"chapters":[22,30]},{"id":"t473","term":"Repo","def":"A financial transaction in which one party borrows cash against delivery of Securities (usually Bonds) as Collateral. The collateral is intended as a guarantee to the cash lender that the full value of the cash lent is recoverable in the event of Default by the cash borrower. Common abbreviation for Sale & Repurchase Trade. See Reverse Repo, Classic Repo and Buy/Sell Back.","cat":"repo","diff":4,"chapters":[1,3,5,4,7,6,8,13]},{"id":"t474","term":"RepoClear","def":"An organisation that provides Central Clearing of European Bonds, including normal buy and sell trades and Repo trades.","cat":"repo","diff":1,"chapters":[7,4]},{"id":"t475","term":"Repo Interest","def":"The amount of cash interest payable or receivable in a Repo trade.","cat":"repo","diff":1,"chapters":[4,5,7,3,6]},{"id":"t476","term":"Repo Rate","def":"The negotiated percentage interest rate payable by the cash borrower in a Positive Interest Rate environment, or by the cash lender in a Negative Interest Rate environment.","cat":"repo","diff":2,"chapters":[4,6,7,3,5]},{"id":"t477","term":"Repurchase Date","def":"Alternative term for the Closing Value Date in a Repo trade.","cat":"repo","diff":1,"chapters":[4,5]},{"id":"t478","term":"Required Collateral Value","def":"The minimum mo
