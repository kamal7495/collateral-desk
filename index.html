ust change ownership or disappear from a books-&-records perspective, its entire exposure/margin-call relationship changes or ends at the same moment.","The common thread across all four event types is urgency of books-&-records updates: any delay in reflecting the event internally risks continuing to calculate exposure, issue margin calls, or hold collateral against a relationship that no longer exists (or exists differently) in reality."],"examples":[],"key_terms":["Novation","Unwind","Offset","Credit Event"],"stage":{"label":"Throughout Lifetime of Trade: Post-Trade Execution Events (Introduction)","detail":"Introduces the four ways a live trade can be altered or exited before its scheduled maturity — novation, unwind, offset, and credit events — each covered in its own following chapter."}},{"num":38,"title":"OTC Derivatives and Collateral – The Collateral Lifecycle – Throughout Lifetime of Trade – Post-Trade Execution Events – Novation","pages":"533–540","digest":["Novation replaces one party to a trade with a third party — the 'remaining party' keeps an economically identical contract (same notional, same maturity) but with a brand new counterparty, while the 'stepping-out' party (the novation transferor) is fully released from the original obligation and the stepping-in party (the novation transferee) takes its place.","Novation legally requires the REMAINING party's consent, not just agreement between the transferor and transferee — you can't be handed a new counterparty without your sign-off, which is exactly the protection that makes novation safe for the party not initiating it.","The financial settlement of the novation itself (current market value, novation fee) happens directly between the stepping-out party and the stepping-in party — the remaining party is not involved in and doesn't care about that negotiation, only about who its counterparty now is.","Real reasons parties choose novation go well beyond a simple change of mind: a trading limit with the original counterparty being reached, a desire to cut exposure to a specific product, an underlying credit default swap's protection buyer having sold the reference bond, or a counterparty being acquired and becoming credit-unacceptable post-takeover — some parties step INTO a novation purely for financial reasons, believing the trade will become more profitable or wanting more exposure to that product.","Novation can be PARTIAL, not just total — a classic case is a fund manager's block trade already allocated across several underlying funds, where just one fund (say, out of Fund A/B/C/D each holding a slice of a USD 100,000,000 notional) chooses to novate its own slice out, while the other three funds' allocations remain untouched.","Novation can silently change a firm's risk profile through no action of its own: if the new counterparty's CSA has a higher threshold or different eligible collateral currency than the original counterparty's CSA, the remaining party's exposure protection can get meaningfully worse (or better) purely as a side effect of consenting to the novation — the book shows this can cut either way depending on whether the new CSA's terms are more or less favorable than the old one.","A cross-currency novation risk is easy to miss: a pension fund novated from a US bank to that bank's Frankfurt subsidiary might switch from receiving USD collateral to EUR collateral, introducing a currency mismatch (and associated interest-rate-differential risk) that didn't exist under the original counterparty relationship.","Because of this threshold/currency risk, the book explicitly recommends traders factor in the collateral-management impact — not just credit quality — before consenting to a novation request, since a credit-acceptable new counterparty can still come with materially worse collateral terms."],"examples":[{"title":"A novation silently degrades collateral protection","body":"Under the original counterparty's CSA, the remaining party has a zero threshold, meaning it can margin-call for any exposure amount (fully protected, aside from the MTA). The trade is novated to a new counterparty whose CSA carries a USD 1,000,000 threshold. Post-novation, the remaining party can no longer call for exposure below that USD 1,000,000 band — a real degradation in protection that has nothing to do with the new counterparty's creditworthiness and everything to do with a legal term the remaining party may not have scrutinized before consenting."},{"title":"Partial novation of a fund manager's block trade","body":"A fund manager executes a USD 100,000,000 notional block trade, later allocated USD 15,000,000 to Fund A, USD 30,000,000 to Fund B, USD 20,000,000 to Fund C, and USD 35,000,000 to Fund D. If Fund A later decides to exit, only its USD 15,000,000 slice novates out to a new counterparty — Funds B, C and D's allocations continue entirely unaffected, each still facing the original counterparty on their own portion."},{"title":"The gym-membership analogy for novation","body":"Your gym is bought by a different company. From tomorrow, your membership contract is with the NEW gym company — the old one is completely off the hook, and you never again deal with them for this membership. But crucially, this could only happen with your consent as the member: you can't be forced to accept a new counterparty without agreeing to it first. Novation works exactly this way for a trade: the 'remaining party' (you, the gym member) must consent before the 'stepping-out party' (the old gym company) can hand its side of the trade to a new counterparty."}],"key_terms":["Novation","Current Market Value","Eligible Collateral","Creditworthiness","Remaining Party","Market Value","Transferee","Settlement","Threshold","Fund Manager","Block Trade"],"stage":{"label":"Post-Trade Execution Events: Novation","detail":"One party exits a live trade and a third party steps in on identical terms — requires the remaining party's consent, and can silently change that party's collateral protection (threshold, eligible currency) even when credit risk is unaffected."}},{"num":39,"title":"OTC Derivatives and Collateral – The Collateral Lifecycle – Throughout Lifetime of Trade – Post-Trade Execution Events – Unwind","pages":"541–546","digest":["An unwind is a mutually agreed, economically opposite trade executed with the SAME counterparty specifically to cancel out the original trade — also known as a 'mutual early termination' or 'tear-up' trade — the cleanest possible exit, since it leaves precisely zero ongoing exposure or trade population with anyone.","The new trade must be explicitly flagged internally as an unwind, cross-referenced to the original — treating it as an unrelated new trade risks non-front-office staff failing to recognize that the original exposure should now be fully closed out.","Unwind is the preferred exit method precisely because it's total: unlike novation (new counterparty, same exposure) or offset (exposure with two counterparties instead of one), an unwind genuinely removes the position and the counterparty relationship entirely — but it only works if the original counterparty agrees to it.","Parties choose to unwind for many of the same underlying reasons as novation or offset (reduced need for the hedge, trading limits reached, a counterparty takeover changing credit acceptability) — but unwind is also specifically used to simply cut losses when a trade's mark-to-market has moved heavily against the firm and it wants out entirely rather than manage it further.","When a counterparty won't agree to unwind (perhaps because it doesn't want to give up the trade, or pricing the closeout is unattractive to them), the firm's only remaining exit routes are novation or offset — both of which leave more residual complexity than a clean unwind would have.","Settlement of the unwind trade is straightforward compared to novation or offset: the current market value of the position is calculated once, and the party with the negative exposure simply pays the other party in final settlement — after which neither party has any ongoing mark-to-market, margin call, or collateral obligation on that position at all."],"examples":[{"title":"Unwinding a CDS position","body":"An insurance company bought CDS protection from Investment Bank D 3.5 years ago (USD 60,000,000 notional, maturing 2028) and has been receiving/posting margin on it ever since. No longer needing the hedge, it asks Bank D to unwind. Bank D agrees, and the insurance company books an offsetting protection-SELLING trade with the same notional, same maturity, same counterparty — the current market value differential is settled once between the two parties, and from that point forward there is no further mark-to-market, no further margin calls, and no ongoing exposure on this position at all."},{"title":"When unwind isn't available","body":"The same insurance company wants to exit its CDS with Investment Bank D, but this time Bank D declines to unwind — perhaps because closing out at current pricing is unattractive to Bank D specifically. With unwind off the table, the insurance company's only remaining options are novation (finding a third party to step into the trade, which still requires Bank D's consent as the remaining party) or offset (executing an opposite trade with a completely different counterparty instead) — both leave more moving pieces than a clean unwind would have."}],"key_terms":["Unwind","Current Market Value","Investment Bank","Mark-to-Market","Market Value","Novation","Offset"],"stage":{"label":"Post-Trade Execution Events: Unwind","detail":"Both parties mutually agree to close a trade via an exactly offsetting new trade with each other — the cleanest exit, leaving zero ongoing exposure, but only available if the original counterparty is willing."}},{"num":40,"title":"OTC Derivatives and Collateral – The Collateral Lifecycle – Throughout Lifetime of Trade – Post-Trade Execution Events – Offset","pages":"547–552","digest":["An offset is what happens when an unwind fails — the firm executes an economically opposite trade with a DIFFERENT counterparty instead, neutralizing its net market risk but leaving it with ongoing operational exposure to TWO counterparties rather than zero.","Offset is strictly worse than unwind from a collateral-management workload perspective: instead of one relationship closing, the firm now must mark-to-market, calculate exposure, and manage margin calls on both the original AND the new trade indefinitely — both trades stay fully 'live' in books & records rather than one disappearing.","Offsets can be partial — hedging less than 100% of the original notional with the new counterparty (e.g. buying protection on EUR 60,000,000 originally, then selling protection on only EUR 50,000,000 with the new counterparty) — deliberately leaving some residual open exposure when a full hedge isn't available or desirable.","Investment banks structure their own trading books around never carrying open-ended offset-style risk themselves: a trader selling protection will typically already have (or immediately arrange) an offsetting protection purchase elsewhere, rather than sit on unhedged exposure — offset is fundamentally a risk-neutralizing tool for market risk, even though it doesn't neutralize operational/counterparty-count complexity.","Firms internally flag an offset trade with a cross-reference back to the original trade it's offsetting — useful institutional memory even though, unlike novation or unwind, the original trade is NOT closed and continues generating its own independent margin call cycle.","From a market-risk standpoint offset achieves the same neutral position as an unwind (net market exposure is zero), but from a counterparty-risk and operational standpoint it's fundamentally different — two live legal relationships, two sets of collateral movements, two counterparties whose creditworthiness the firm must keep monitoring, indefinitely."],"examples":[{"title":"Offset after a failed unwind attempt","body":"The same insurance company wants to exit its USD 60,000,000 CDS protection with Investment Bank D, but Bank D declines to unwind. The insurance company instead executes an offsetting protection-selling trade with a different bank, Investment Bank F, for the same USD 60,000,000 notional. Its net market risk is now neutralized — but unlike an unwind, the insurance company still has two live trades: the original with Bank D and the new one with Bank F, each independently requiring its own mark-to-market, exposure calculation, and margin calls going forward."},{"title":"A deliberately partial offset","body":"A firm originally bought CDS protection for a EUR 60,000,000 notional. Unable to find a counterparty willing to take the full amount at an acceptable price, it instead sells protection for only EUR 50,000,000 with a new counterparty — reducing, but not fully neutralizing, its market risk. The firm is left deliberately carrying EUR 10,000,000 of residual open exposure on the original position."}],"key_terms":["Offset","Reference Entity","Investment Bank","Mark-to-Market","Market Risk","Hedging","Trader","Unwind"],"stage":{"label":"Post-Trade Execution Events: Offset","detail":"When the original counterparty won't agree to unwind, the firm neutralizes its market risk by executing an opposite trade with a different counterparty instead — flat on risk, but now managing collateral on two relationships instead of zero."}},{"num":41,"title":"OTC Derivatives and Collateral – The Collateral Lifecycle – Throughout Lifetime of Trade – Post-Trade Execution Events – Credit Events","pages":"553–558","digest":["A credit event is fundamentally different from novation/unwind/offset — it's triggered by the REFERENCE ENTITY's own default (bankruptcy, failure to pay, debt restructuring), not by either trading party's choice to exit; ISDA restricts contracts to a limited, predefined set of qualifying credit events agreed at trade inception, and the premium a protection buyer pays reflects the market's perceived likelihood of one of them actually happening.","Once a credit event is confirmed, settlement is close to automatic and final: the protection seller pays the protection buyer notional-minus-recovery, and the CDS contract terminates immediately with zero ongoing exposure to either side — there's no partial-quantity version of this, since a credit event by definition impacts all outstanding CDS contracts on that same reference entity simultaneously.","The recovery percentage that determines the payout isn't set by either trading party — it's set via a market-wide AUCTION process, reflecting what investors believe a physical holder of a senior unsecured bond would actually recover once the issuer's bankruptcy process plays out.","Determining WHETHER a qualifying credit event actually occurred used to be a frequent source of dispute between protection buyer and seller — ISDA's 2009 protocol establishing Regional Determination Committees (RDCs) fixed this by giving a binding, centralized ruling that all protocol adherents must accept, removing the case-by-case argument that used to follow every borderline default.","A protection seller is not necessarily a naked risk-taker just because a credit event could cost them the full notional — many sellers immediately hedge by buying offsetting protection from a different counterparty, meaning their own real credit-event exposure may already be neutralized elsewhere; you don't need to actually own the underlying bond to be a party to a CDS at all, on either side.","The chain of causation matters operationally: novation/unwind/offset all originate from a TRADING PARTY's own choice to exit, while a credit event originates entirely from the reference entity's behavior — meaning a firm can suddenly find a CDS contract terminated with no warning or negotiation on its part at all, purely because the underlying borrower defaulted."],"examples":[{"title":"A default triggers automatic settlement","body":"A $10m notional CDS references a corporate borrower that files for bankruptcy — a qualifying credit event. ISDA's Credit Determinations Committee confirms the event, and a subsequent auction sets the recovery rate at 35 cents on the dollar. The protection seller pays the protection buyer notional × (1 − recovery) = $10m × 0.65 = $6.5m. The contract terminates immediately upon payment; there is no partial or ongoing exposure left on either side."},{"title":"A protection seller who isn't actually exposed","body":"Party B sells CDS protection to Party A on a corporate reference entity. Rather than carrying that risk unhedged, Party B immediately buys offsetting protection from Party C on the same reference entity. If the reference entity later suffers a genuine credit event, Party B pays out to Party A — but simultaneously collects an equivalent payout from Party C, meaning Party B's real economic exposure to the default was already neutralized well before it happened."}],"key_terms":["Credit Event","Protection Buyer","Protection Seller","Reference Entity","Failure to Pay","Bankruptcy","Settlement","Novation","Borrower","Default","Offset","Unwind","Debt","ISDA"],"stage":{"label":"Post-Trade Execution Events: Credit Events","detail":"A qualifying default by the reference entity (not either trading party) triggers automatic settlement and immediate termination of a CDS contract — settled once via an RDC-determined recovery percentage, ending all ongoing exposure between the two parties."}},{"num":42,"title":"OTC Derivatives and Collateral – The Collateral Lifecycle – Throughout Lifetime of Trade – Collateral Substitution","pages":"559–566","digest":["Collateral substitution swaps out posted collateral for different eligible collateral WITHOUT changing the underlying exposure being covered — the classic trigger is the collateral giver needing that specific bond back for an unrelated sale, repo, or securities loan they've since executed, since delivery failure on THAT unrelated transaction causes its own separate monetary loss.","Substitution isn't only bond-for-bond — the CSA can permit bond-for-bond, bond-for-cash, cash-for-bond, or currency-for-currency substitution, and replacement collateral can even be split across several different bonds as long as their combined value covers the exposure.","Beyond needing a specific bond back, firms substitute to dodge the administrative complexity of holding bond collateral over a coupon record date (and the withholding-tax entanglements that come with it) — swapping the bond out just before the record date avoids the whole coupon-claim process entirely; substitution can also flow the OTHER direction, replacing cash collateral with securities when interest-rate differentials make that advantageous, or being FORCED by a credit rating downgrade that makes the currently-held bond suddenly ineligible under the CSA.","The formal process is genuinely multi-step: the giver identifies and proposes replacement collateral, the taker verifies its CSA-eligibility, both parties issue matching FoP settlement instructions to the CSD for BOTH legs (return of original, delivery of replacement), the CSD matches and settles both, and both firms update books & records and reconcile — typically within a T+1 timeframe from the substitution request.","The historic settlement method (two independent, non-simultaneous free-of-payment deliveries — original bond back, replacement bond out) creates a real settlement-timing risk: whichever party's incoming delivery lands second is temporarily exposed if the other leg fails — this is the exact problem Delivery versus Payment solves for cash-vs-securities but doesn't solve for securities-vs-securities.","Delivery-versus-delivery (DvD) — enabled by systems like T2S's 'Effective DvD' — is the industry's attempted fix: linking both legs so neither settles unless both can settle simultaneously, closing the gap that pure two-way FoP leaves open; true DvD (as opposed to merely 'effective' DvD) would require a single settlement instruction referencing both ISINs and both directions at once.","The collateral TAKER is legally obliged to accept a substitution request as long as the proposed replacement is CSA-eligible, even though it may require real, uncompensated administrative effort (setting up static data for an unfamiliar bond, sourcing a missing SSI) — but must never release the original collateral before receiving the replacement, or it becomes unexpectedly (and avoidably) exposed.","Because a substitution's underlying trigger is usually itself time-sensitive (an unrelated sale needing to settle, a downgrade needing to be resolved), substitution is treated as an URGENT task by both sides — and one substitution can even cascade into a chain of further substitutions across other market participants who are, in turn, relying on getting their own bonds back on time."],"examples":[{"title":"A substitution triggered by an unrelated bond sale","body":"Party A posted USD 10,000,000 of IBRD 5.25% bonds as OTC derivative collateral to Party B a week ago. Today, Party A's trading desk sells that exact bond position (unconnected to the collateral relationship) for T+2 settlement. Party A's Collateral Department must now urgently request substitution — selecting a different eligible bond (USD 10,000,000 of Inter-American Development Bank 4.75% bonds) to give Party B in exchange for the original IBRD bonds, so the sale can settle on time. Both parties issue matching FoP settlement instructions, and Party B (the exposed party) must ensure it doesn't release the IBRD bonds until it has actually received the replacement."},{"title":"Multi-piece replacement collateral","body":"Instead of substituting one bond for another single bond, a collateral giver replaces GBP 5,000,000 of UK Government bonds with three separate pieces: GBP 2,000,000 of Issuer X, GBP 2,200,000 of Issuer Y, and GBP 1,000,000 of Issuer Z — as long as all three are individually CSA-eligible and their combined collateral value still covers the exposure, splitting the replacement across multiple ISINs is entirely permitted."},{"title":"A downgrade forces substitution the other way","body":"A bond currently held as collateral is downgraded below the CSA's minimum eligible rating. Unlike most substitution scenarios (which benefit the giver), this one is urgent for the TAKER — its exposure is no longer properly mitigated by an ineligible bond, so the faster it insists on substitution for a still-eligible replacement, the faster its own risk is brought back under control."}],"key_terms":["Collateral Substitution","Free of payment","Delivery versus payment","Eligible Collateral","Collateral Giver","Collateral Taker","Bond Collateral","OTC Derivative","Exposed Party","Effective DvD","Record Date","Securities","Derivative","Underlying","Settlement","Coupon","Issue","Repo","Bond","DvD","Target2 Securities","T2S","Standing Settlement Instruction"],"stage":{"label":"Throughout Lifetime of Trade: Collateral Substitution","detail":"The collateral giver swaps posted collateral for different eligible collateral — usually because it needs the original bond back for an unrelated transaction — without changing the exposure being covered; a time-sensitive process with real settlement-timing risk."}},{"num":43,"title":"OTC Derivatives and Collateral – The Collateral Lifecycle – Throughout Lifetime of Trade – Income & Corporate Action Events","pages":"567–574","digest":["Who actually gets a coupon payment from the CSD and who's legally ENTITLED to it can be different people — the collateral TAKER (as legal owner at record date) is credited by the CSD, but if the CSA is a title-transfer arrangement, the collateral GIVER (as beneficial owner) is the one actually owed the value, so the taker must remit it onward.","This split hinges on a books-&-records distinction that's easy to get operationally wrong: a firm's holdings of a given bond must clearly separate WHY it holds each portion — outright trading position vs. collateral given vs. collateral taken vs. repo'd vs. lent — since only the trading-position portion actually entitles the firm to keep a coupon paid on it.","When the collateral taker has reused or rehypothecated the bond (rather than just holding it), whether IT can reclaim the coupon from whoever it passed the bond to depends entirely on what transaction type it used: a SALE means the new owner keeps the coupon outright and the original taker must pay the giver out of its own pocket (this is exactly what 'manufactured income' means); a REPO or securities loan means the taker CAN claim the coupon back from the party it's currently with, since that party only has temporary possession, not ownership.","Regardless of what happens further down the chain of reuse, the original collateral giver is always owed the coupon value by the original collateral taker — the taker's own downstream arrangements (who it reused the bond with, and whether that party pays up) are entirely the taker's problem to sort out, never the giver's concern.","Coupon timing mechanics differ by bond type: fixed rate bonds and convertible bonds have fully predictable coupon dates and rates set at issuance, while floating rate notes only have their rate for the NEXT period confirmed shortly before it starts (based on a benchmark like Libor) — meaning FRN static data needs periodic updating in a way fixed rate bond data doesn't.","Voluntary corporate actions (like a bond tender offer) on collateral put the INVESTMENT DECISION in the collateral giver's hands as beneficial owner, not the taker's — the giver either gets the bonds back before the decision deadline, or formally instructs the taker (in writing, to avoid errors) how to act on its behalf; this contrasts with mandatory events like ordinary coupon payments, which require no decision from anyone.","Avoiding this whole administrative tangle is exactly why collateral substitution ahead of a record date (Chapter 42) is such a common practice — many firms would rather swap the bond out entirely than deal with coupon-claim chasing and withholding-tax complications, especially since the Collateral Department and Corporate Actions Department often sit in different parts of the organization, making the coordination itself an operational hurdle."],"examples":[{"title":"Manufactured income after collateral is sold onward","body":"Party A gives a bond to Party B as OTC derivative collateral. Party B (under a title-transfer CSA) reuses it by selling it outright to Party C. On the coupon record date, Party C — now the true owner — is entitled to keep the coupon. Party B gets nothing from Party C, but Party B still owes Party A the value of that coupon regardless, paying it out of its own funds. This out-of-pocket payment, made purely to keep the collateral giver whole despite the bond having moved on, is what the book calls 'manufactured income.'"},{"title":"The same reuse, but via repo instead of sale","body":"Same starting point — Party A gives a bond to Party B, who reuses it, but this time by repo'ing it to Party C rather than selling it outright. Because a repo only temporarily transfers the bond (Party C must return it at the repo's close), Party C is NOT entitled to keep the coupon — Party B can and should claim it back from Party C, then pass that same value on to Party A. Unlike the sale scenario, Party B isn't out of pocket here; it's simply a pass-through of the same cash."},{"title":"A tender offer decision that belongs to the giver, not the taker","body":"A bond issuer launches a voluntary tender offer on bonds currently held as OTC derivative collateral by Party B. Even though Party B legally holds the bonds, the decision whether to accept the offer belongs to Party A (the beneficial owner). Party A either requests the bonds back before the decision deadline so it can instruct its own CSD directly, or sends Party B written instructions on how to act on its behalf — leaving nothing to informal interpretation."}],"key_terms":["Coupon Claim","Record Date","Voluntary Corporate Action","Withholding Tax","Collateral Substitution","Collateral Giver","Collateral Taker","Coupon Payment","OTC Derivative","Securities","Derivative","Coupon","Income","Repo","Bond","Swap","Manufactured Coupon, Manufactured Dividend and Manufactured Income","Floating Rate Note","Bond Exchange Offer"],"stage":{"label":"Throughout Lifetime of Trade: Income & Corporate Action Events","detail":"Coupon payments and corporate actions on posted bond collateral must flow back to the beneficial owner (the collateral giver) even though the CSD credits the legal owner (the collateral taker) — with the taker's own onward obligations depending on how it reused the bond."}},{"num":44,"title":"OTC Derivatives and Collateral – The Collateral Lifecycle – Trade Termination","pages":"575–578","digest":["Trade termination is the default, uneventful end state — a trade simply reaching its scheduled maturity date with none of novation/unwind/offset/credit-event having intervened first — at which point all associated collateral must be returned and exposure ceases (unless other trades with that same counterparty remain open, in which case the matured trade is simply removed from the portfolio and exposure recalculated on what remains).","The critical operational risk here is purely a systems/status one: a matured trade that isn't marked 'closed' internally will keep being treated as live, generating phantom exposure calculations and (potentially) erroneous margin calls on a relationship that has actually ended.","Portfolio reconciliation (Chapter 31) acts as a safety net here too — for firms using triResolve, a trade a counterparty has already closed but the firm hasn't will surface as a population mismatch, catching the termination-status error before it causes a real dispute.","For some product types (e.g. variance swaps) settlement can occur slightly AFTER the scheduled maturity date — an in-the-money firm may deliberately hold onto collateral until that final settlement actually completes, rather than releasing it exactly on the maturity date itself.","Firms close matured trades either manually (the responsibility of traders, Middle Office or Operations, depending on the firm) or automatically (the system itself flags and closes the trade once its scheduled termination date passes) — the trend is toward automation specifically because manual closure is exactly the kind of easily-forgotten administrative step that creates phantom exposure risk.","This chapter is literally the last stop of the 20-chapter OTC Derivative Collateral Lifecycle (Chapters 25-44) — everything from legal documentation through margin calls, holding collateral, and post-trade events funnels down to this single closing step: return collateral, close the trade, stop calculating exposure."],"examples":[{"title":"A clean maturity","body":"A $30m notional swap reaches its scheduled maturity date of 15 June. Exposure drops to zero and the $1.2m of collateral held against it is returned within one business day. Operations marks the trade 'closed' in the collateral system the same day."},{"title":"A maturity nobody closed out","body":"Same $30m swap matures on 15 June, but the operations team forgets to mark it 'closed' in the collateral system. Three days later the system, still treating the trade as live, issues an erroneous $45,000 margin call against a relationship that no longer has any exposure — caught only when the counterparty pushes back, at which point the call has to be manually reversed and apologised for."},{"title":"A variance swap that outlives its own maturity date","body":"A variance swap reaches its scheduled maturity date, but the product's actual cash settlement isn't due to complete until several days later. The in-the-money party, rather than releasing its held collateral exactly on the maturity date, deliberately keeps it in place until final settlement is actually confirmed — treating 'matured' and 'fully settled' as two genuinely different milestones rather than the same event."}],"key_terms":["Portfolio Compression","Portfolio Reconciliation","Scheduled Maturity Date","OTC Derivative","Reconciliation","Margin Call","Derivative","triResolve","Settlement","Portfolio","Novation","Default","Offset","Unwind","Swap"],"stage":{"label":"Trade Termination","detail":"The trade reaches its scheduled maturity date (having survived to term without novation, unwind, offset, or a credit event) — all collateral is returned, exposure ceases, and the trade must be marked closed internally to avoid phantom future exposure calculations. The final stage of the 20-chapter lifecycle."}},{"num":45,"title":"OTC Derivatives and Collateral – Legal Documentation","pages":"579–582","digest":["This is a deliberately short wrap-up chapter — its entire content is a pointer back to the three legal documents already covered in depth in Chapters 20-22: the ISDA Master Agreement, the Schedule, and the Credit Support Annex.","Its real function in the book's structure is as a hinge: it closes out Part 4a/4b (bilateral trading and its legal documentation) and hands off directly into Part 4c, the three chapters on regulatory change — everything from here forward is about how the post-2008 rules reshape the bilateral world just described.","All three documents are ISDA's own published standards, obtainable directly from isda.org — a practical detail worth knowing since it means the actual legal templates aren't proprietary to any one firm.","The chapter's brevity is itself informative: by this point in the book, the legal framework is assumed fully learned — nothing here is new content, which is precisely why the author collapses it to a single reference page rather than repeating three chapters' worth of material."],"examples":[],"key_terms":["ISDA Master Agreement","Credit Support Annex","Bilateral"],"stage":null},{"num":46,"title":"OTC Derivatives and Collateral – Regulatory Change and the Future of Collateral – Introduction","pages":"583–596","digest":["The 2008 Global Financial Crisis is the direct trigger for everything in this chapter: in 2009 the G20 agreed a coordinated global push for more OTC derivative transparency and structure, spearheaded in Europe by EMIR and in the US by Title VII of Dodd-Frank, with parallel regimes rolled out in Australia, China, Hong Kong, Japan, Korea and Singapore.","The regulatory blueprint for a 'standardised' OTC derivative trade has three headline requirements: trade on an exchange or electronic trading platform, be centrally cleared via a CCP, and be reported to a trade repository. Trades that don't meet the standardisation criteria stay bilateral, but face rigorous collateral and capital requirements instead — Chapter 47 covers the first path, Chapter 48 the second.","Before these reforms, exchange-traded derivatives (futures, options) already had a standardised, exchange-matched structure; OTC derivatives didn't, because they were historically tailored bilaterally to each pair of counterparties. The book generalises every flavour of electronic OTC trading platform under one label — Trade Execution Venue (TEV) — to keep terminology consistent despite the many different commercial names in the market (one such name being 'swap execution facility').","The Big Bang Protocol (2009) was the concrete standardisation event for single-name CDS: introducing fixed coupons meant CDS trades could be portfolio-compressed (multiple gross trades collapsed into an equivalent net position), which is what actually makes multilateral netting achievable — you can only net trades that share identical fixed terms.","Central clearing works through novation in four steps: (1) two firms execute a trade via a TEV, (2) the TEV forwards the trade details to the relevant CCP, (3) the CCP checks the trade against its clearing limits and (if accepted) proceeds, (4) novation splits the single trade into two new ones — CCP-versus-Firm-A and CCP-versus-Firm-B. From that moment, each firm's live counterparty is the CCP, not the other original firm.","Multilateral netting is the single biggest structural payoff of central clearing: a firm that executes several trades in the same product with several different bilateral counterparties can't net them against each other (netting only works between the same two parties) — but once all of those trades are novated to the same CCP, they collapse into ONE net position with that CCP.","For CDS specifically, netting eligibility is strict: two trades only net against each other if they share the same trading entity, the same reference entity, the same scheduled maturity date, AND the same fixed coupon — any one mismatch keeps them as separate gross positions.","A Trade Repository (TR) is an electronic warehouse of trade and position details that regulators can access for oversight. For centrally cleared trades, the CCP can report on the firm's behalf (though the firm remains ultimately responsible for the data reaching the TR); for non-centrally cleared trades, both original parties are independently responsible for reporting, though one can delegate the task to the other (typically buy-side delegating to its sell-side counterparty).","The chapter carries an explicit author's disclaimer worth remembering throughout Chapters 46-48: EMIR's actual regulatory text is vast and technical, so these three chapters are a deliberately condensed, plain-English selection aimed at operations/collateral staff — not a substitute for the full European Commission regulations."],"examples":[{"title":"Novation, traced through the 4 steps","body":"Firm A and Firm B execute an interest rate swap via a TEV. Step 1: the trade is agreed. Step 2: the TEV forwards the full trade details to CCP1. Step 3: CCP1 checks the trade fits its accepted product parameters and clearing limits, and accepts it. Step 4: novation occurs — the single A/B trade becomes two trades: CCP1-versus-Firm-A and CCP1-versus-Firm-B. From this point, Firm A's exposure is to CCP1, not to Firm B, and vice versa."},{"title":"Multilateral netting collapsing three relationships into one","body":"Firm T, in the same interest rate swap product, buys USD 50,000,000 notional from Firm U, buys USD 30,000,000 from Firm V, and sells USD 20,000,000 to Firm W — three separate bilateral counterparty relationships, each needing its own margin and collateral management. Once all three trades are novated to the same CCP, Firm T's position collapses to a single net relationship with the CCP: +50m + 30m − 20m = +60m net — one exposure to manage instead of three."}],"key_terms":["Central Counterparty","Novation","Central Clearing","Trade Execution Venue","Big Bang Protocol","Portfolio Compression","Multilateral Netting"],"stage":null},{"num":47,"title":"OTC Derivatives and Collateral – Regulatory Change and the Future of Collateral – Centrally Cleared Trades","pages":"597–628","digest":["A CCP must remain 'market risk neutral' at all times — meaning it never takes a directional position for its own account. When a trade is novated, the CCP becomes seller to the original buyer and buyer to the original seller, leaving itself with a perfectly offsetting, zero net position on that trade regardless of how many thousands of trades it processes.","Comparing bilateral to central clearing directly: a firm with hundreds of live OTC trades across many counterparties previously had to manage exposure, mark-to-market and margin separately with each one; under central clearing (assuming standardised trades), all of that consolidates to managing exposure with just one CCP.","CCPs provide four core services: standardised product/collateral processing, clearing (novation plus identifying each party's financial obligations), trade netting (multilateral netting to a single net obligation wherever possible), and risk mitigation (initial margin against potential future exposure, variation margin against current exposure, and a mutualised default fund that absorbs losses if a clearing member defaults).","Advantages of central clearing: a firm only needs to assess ONE counterparty's creditworthiness (the CCP) instead of every bilateral counterparty; multilateral netting reduces gross trades to net positions; and regulatory transparency improves market integrity. Disadvantages: initial margin is now payable where it often wasn't under legacy bilateral trades, the margin settlement window is shorter, and (unlike bilateral relationships) a margin call generally cannot simply be disputed and withheld — it must be settled. The CCP's own potential failure also remains a real, if rare, systemic risk.","Firms split into Clearing Members (CMs, who clear their own trades directly at the CCP — mostly sell-side) and Non-Clearing Members (NCMs, mostly buy-side and smaller sell-side firms, who must appoint a CM to clear on their behalf — 'client clearing'). Critically, the CCP has NO direct legal relationship with an NCM: the legal chain is strictly CCP↔CM and, separately, CM↔NCM — an NCM can never clear directly at the CCP.","A CM holds a 'house' account for its own trades and separate 'client' account(s) for client-clearing business. The CCP communicates only with the CM — never directly with the CM's underlying clients — for any activity on a client account.","Clearing members face three margin-related obligations: default fund contributions (mandatory, mutualised across all CMs, scaled to the CM's own risk profile and trading volume, and re-assessed periodically), initial margin (IM, a one-off up-front amount sized to potential future exposure, though it can be topped up later — payable in cash or highly liquid securities like AAA government bonds, haircut per the bond's type/issuer/residual maturity, and CCPs are never permitted to reuse or rehypothecate IM securities they receive), and variation margin (VM, calculated from daily — sometimes intraday — mark-to-market, and unlike IM it is NOT retained by the CCP but passed straight through to whichever CM is in the money).","On a CM default, the CCP first tries to close out that CM's positions via an auction among the remaining non-defaulting members; if the defaulting CM's own IM isn't enough to cover the resulting loss, the CCP dips into the mutualised default fund next — the fund exists precisely so one member's failure doesn't need to be absorbed entirely by the CCP alone or spill onto unrelated members beyond their pooled contribution.","Whether central clearing is a burden depends heavily on a firm's trading style: non-directional firms (many investment banks, who tend to buy what they sell) net down toward a flat position at the CCP and may face little or no trade-related margin; directional firms (many buy-side funds, who hold what they buy) don't benefit from netting and face the full weight of IM and VM. This asymmetry is exactly why 'collateral transformation' services exist — sell-side CMs help buy-side clients convert non-CCP-eligible assets (e.g. corporate bonds) into CCP-eligible ones, often using securities lending & borrowing under the hood.","CMs offering client clearing give clients a structural choice: an omnibus client segregated account (commingled with other clients who picked the same option — and the ONLY account type where the CCP is permitted to net client positions against each other) or an individual client segregated account (fully separate from every other client). The CCP never nets across account types or against the CM's own house account.","If a CM defaults, its clients' positions and assets are 'ported' to a backup clearing member (BUCM) — but only if the client had pre-appointed one. An individual-segregated client chooses its own BUCM unilaterally; omnibus-segregated clients must collectively agree, and the receiving BUCM can accept or reject the ENTIRE omnibus pool, not cherry-pick within it. If porting isn't completed by the CCP's deadline, the CCP instead terminates the trades and pays out their termination value directly to the client.","The EMIR 'clearing obligation' applies to Financial Counterparties (banks, insurers, reinsurers, AIFs, investment firms, credit institutions, pension funds, UCITS funds, sovereign wealth funds) and to Non-Financial Counterparties whose derivative activity surpasses a defined threshold (NFC+): EUR 3bn gross notional for interest rate, FX, or commodity/other products; EUR 1bn for credit or equity products. Genuine commercial/treasury hedging trades don't even count toward that threshold calculation.","Two categories are exempt from the clearing obligation itself: pension funds (originally a temporary 2-year exemption, repeatedly extended due to the practical difficulty of holding CCP-eligible assets without hurting pensioner returns) and multilateral development banks / supranationals (permanently exempt). NFC− firms (below the threshold) are exempt too. None of these exemptions extend to skipping the separate IM/VM posting requirements on whatever non-centrally-cleared trades they still execute (see Chapter 48).","There's no mandatory requirement to novate pre-existing ('legacy') trades to a CCP once the clearing obligation takes effect — but firms can voluntarily 'backload' legacy trades to a CCP anyway, gaining portfolio compression and multilateral netting benefits plus a lower-risk CCP counterparty in place of the original bilateral one.","Interoperability lets a firm keep all its cleared business at its own preferred CCP even when its counterparty uses a different one: the two CCPs enter a mirror-image 'balancing trade' between themselves so each stays market risk neutral, without forcing either firm to open accounts at multiple CCPs."],"examples":[{"title":"Clearing member vs. client (non-clearing member) account structure","body":"Firm A is a clearing member of CCP1 — its trades sit in its own house account, and its legal counterparty for every trade is CCP1 directly. Firm C is not a CM; it clears through Firm M, a clearing member. Firm C's trades sit in Firm M's client account at CCP1, and Firm C's own legal counterparty is Firm M — not CCP1. If CCP1 needs to communicate about that trade, it talks only to Firm M; Firm M is then responsible for passing margin calls through to Firm C."},{"title":"Default fund waterfall in practice","body":"Clearing Member X defaults while holding a losing OTC derivative position. The CCP first closes out X's positions via an auction among the remaining clearing members. If X's own posted initial margin isn't enough to cover the resulting loss, the CCP draws next on the mutualised default fund — the pooled contributions from all clearing members — before any loss could threaten the CCP's own capital or cascade onto unrelated, non-defaulting members beyond their existing fund contribution."},{"title":"Porting after a CM default: individual vs. omnibus","body":"Clearing Member Y is declared in default. Client P had set up an individual client segregated account and pre-appointed its own BUCM — P's positions port to that BUCM on P's own decision, unaffected by any other client. Clients Q, R and S all used Y's omnibus client segregated account; because omnibus positions are commingled, all three must agree collectively on a single BUCM, and that BUCM can accept the entire pooled group or reject it outright — it cannot take Q and R while rejecting S."},{"title":"NFC clearing threshold in practice","body":"A corporate treasury desk uses interest rate swaps only to hedge its own borrowing costs, with EUR 1.2 billion of gross notional outstanding — under the EUR 3 billion interest rate threshold, and its hedging activity doesn't even count toward that calculation. It stays classified NFC− and exempt from the clearing obligation. If its notional in interest rate products alone grew past EUR 3 billion, it would flip to NFC+ and become subject to mandatory central clearing — a status change it is legally required to report to ESMA and to every counterparty."}],"key_terms":["Central Counterparty","Market Risk Neutral","Clearing Member","Client Clearing","Initial Margin","Variation Margin","Central Clearing","Multilateral Netting","Novation","Backloading","NFC +","NFC −","Alternative Investment Fund","AIFMD","Collateral Transformation"],"stage":null},{"num":48,"title":"OTC Derivatives and Collateral – Regulatory Change and the Future of Collateral – Non-Centrally Cleared Trades","pages":"629–656","digest":["Non-centrally-cleared trades come in two distinct flavours the book carefully separates: 'legacy bilateral trades' (executed before the margin regulations took effect, carrying little or no mandated risk management) and 'new bilateral trades' (executed after, and subject to significant, specific regulatory requirements) — both stay bilaterally cleared throughout their life, but the new regime is a genuinely different regulatory animal from the old one.","Non-central clearing persists because not every risk can be adequately hedged with a standardised product. Forcing a mismatched standardised trade onto a bespoke risk just to gain clearing benefits can create a growing mismatch between the real risk and its (poorly-fitting) hedge over time — so firms with genuinely custom exposures keep trading bilaterally rather than accept that drift.","Firms executing non-centrally-cleared trades are typically buy-side (mutual funds, pension funds, insurers, corporates) transacting directly with a sell-side counterparty. There's no requirement to use a trade execution venue for these trades — but 100% of OTC derivative activity, centrally cleared or not, must still be reported to a trade repository.","A critical and easy-to-miss distinction: exemption from the CLEARING obligation (pension funds, NFC−, multilateral development banks) does NOT carry over to exemption from the separate MARGIN (IM/VM) obligations on non-centrally-cleared trades. Pension funds specifically remain fully on the hook for posting IM and VM even while temporarily exempt from having to centrally clear at all.","Initial margin on non-centrally-cleared trades must be posted by BOTH parties, without offsetting the two amounts against each other (unlike VM, where only the net-exposed party calls). IM is explicitly NOT required on three product types: physically-settled FX forwards, physically-settled FX swaps, and the principal-exchange leg of cross-currency swaps — a specific carve-out worth remembering.","IM calculation must use either a standardised (schedule-based) approach or a bilaterally-agreed/third-party model (each party can choose independently — they don't have to match), and must be recalculated no later than the business day following a new trade, a trade reaching maturity, a non-collateral payment/delivery, or simply after 10 business days with no recalculation at all.","IM haircuts follow clear rules: cash in the same currency as the exposure — 0%; cash in a different currency — 8%; non-cash collateral — dependent on the instrument's own characteristics, PLUS an extra 8% if it's in a different currency from the exposure. IM reuse or rehypothecation is explicitly NOT permitted, and IM received must be held in a segregated, insolvency-remote account — a materially stricter regime than many legacy bilateral CSAs allowed.","The IM phase-in (AANA = Aggregate Average Notional Amount) rolled out gradually to avoid a liquidity shock: EUR 3 trillion+ from February 2017, EUR 2.25 trillion from September 2017, EUR 1.5 trillion from September 2018, EUR 0.75 trillion from September 2019, and EUR 8 billion from September 2020 — by which point virtually every remaining relevant firm was captured. Where two counterparties fall under different deadlines, the LATER (less constraining) deadline governs their trades with each other.","Variation margin, by contrast, is comparatively simple: only ONE party validly calls per occasion (based on net mark-to-market plus or minus existing collateral already held), must be calculated at least daily using mark-to-market (falling back to mark-to-model only if market conditions genuinely prevent MTM), and — unlike IM — cash collateral gets a 0% haircut regardless of currency, and reuse/rehypothecation is left 'unspecified' rather than banned outright. VM's own rollout was far simpler than IM's: essentially universal from 1 March 2017, with only the very largest (EUR 3tn+ AANA) firms starting slightly earlier on 4 February 2017.","Because IM must be segregated while VM need not be, ISDA created two SEPARATE CSA templates (the IM CSA and the VM CSA) rather than one combined document — operationally simpler than forcing both margin types through identical segregation mechanics. Firms then choose between running their legacy CSA in parallel with a new VM CSA (legacy CSA for old trades, VM CSA for new ones) or migrating everything — old and new trades alike — onto the VM CSA in one all-or-nothing move, which the ISDA 2016 Variation Margin Protocol was built specifically to streamline.","Beyond margin, IOSCO-driven risk mitigation regulations cover five more areas for non-centrally-cleared trades: trade confirmation (material trade details must reach the counterparty as soon as practicable — deadlines of T+1 for Financial Counterparties/NFC+ and T+2 for NFC−, with unconfirmed trades beyond 5 business days requiring regulatory reporting), portfolio reconciliation (frequency scales directly with trade count: 500+ live trades with a given counterparty means daily reconciliation, 51-499 means weekly, 50 or fewer means quarterly for FCs/NFC+; NFC− gets a lighter quarterly/annual schedule), trade valuation, portfolio compression, and dispute resolution — all aimed at the same goal: surface disagreements before they become disputed margin calls."],"examples":[{"title":"IM vs. VM haircut on identical cross-currency cash","body":"A firm posts USD 5,000,000 cash as collateral against a EUR-denominated exposure — a cross-currency cash position. If this is posted as Initial Margin, an 8% haircut applies, so it's valued at USD 4,600,000 for IM purposes. If the identical USD 5,000,000 cash is instead posted as Variation Margin, it gets a 0% haircut regardless of the currency mismatch — full USD 5,000,000 value. Same asset, same currency mismatch, two completely different regulatory treatments depending only on which margin type it's satisfying."},{"title":"AANA phase-in determines when IM starts","body":"Firm A's group-level AANA is EUR 2.8 trillion, captured from the September 2017 (EUR 2.25 trillion) threshold onward. Firm B's AANA is EUR 400 billion, only captured from the September 2020 (EUR 8 billion) threshold. Even though Firm A individually crossed its own threshold back in 2017, mandatory IM exchange between A and B doesn't begin until BOTH are in scope — so their trades only become subject to mandatory IM from September 2020, the later of the two dates."},{"title":"Portfolio reconciliation frequency depends on trade count, per relationship","body":"Firm X (a Financial Counterparty) has 640 live OTC trades with Counterparty B — over the 500-trade threshold, so that relationship must be reconciled every business day. The same Firm X has only 38 live trades with Counterparty C — under 50, so that relationship only needs reconciling once per quarter. The obligation is assessed separately for each bilateral relationship, not for the firm's whole book at once."},{"title":"A carve-out from IM: physically-settled FX","body":"Two firms execute a physically-settled FX forward and, separately, a cross-currency swap with a principal exchange. Even though both are non-centrally-cleared OTC derivatives that would otherwise require IM under the Final RTS, the FX forward and the CCS principal-exchange leg are both explicitly excluded from the IM requirement — a specific carve-out for exactly these transaction types, while VM requirements still apply as normal."}],"key_terms":["Initial Margin","Variation Margin","Threshold","Minimum Transfer Amount","Haircut","Rehypothecation","Portfolio Reconciliation","Trade Confirmation","Foreign Exchange Swap","Cross-Currency Swap","Credit Support Annex","Bank for International Settlements"],"stage":null}];
const FOUNDATIONS = [{"num":1,"title":"What Is a Financial Market?","digest":["A financial market is just a place — physical or electronic — where people trade claims on money or ownership. Two archetypes recur everywhere in finance: LENDING (give cash or an asset now, get it back later, usually with interest) and OWNERSHIP (buy a stake in something, and your return depends on how it performs).","\"Buying\" a financial product essentially never means physically handling anything anymore — it means your name (or your custodian's) gets updated in an electronic register. That's called Book Entry, and it's how virtually all modern securities trading actually settles.","\"Security\" is finance's blanket word for any tradeable financial instrument representing ownership (a share) or debt (a bond) — you'll see it used constantly as the generic word for \"the thing being traded,\" regardless of which specific product it actually is.","Markets exist because they're far more efficient than everyone individually hunting for a counterparty — a Stock Exchange (or, for many products, direct bilateral trading) exists purely to connect buyers and sellers reliably and cheaply.","Every concept in the book this app is built from — repo, securities lending, derivatives, collateral — is built from just these two foundational ideas, lending and ownership, combined and recombined in different ways. Once those two click, the rest is mostly vocabulary."],"examples":[{"title":"Lending vs. ownership, side by side","body":"You lend a friend $1,000 for a year at 5% interest — you know exactly what you'll get back ($1,050), regardless of how their year goes. Instead, you buy $1,000 of shares in your friend's business — your return depends entirely on how well the business does: you could end up with $1,200, or $600. Bonds are the formalized, tradeable version of the first case; equities (shares) are the formalized version of the second."}],"key_terms":["Book Entry","Security","Stock Exchange"]},{"num":2,"title":"Bonds — Lending Made Tradeable","digest":["A bond is a loan, formalized so it can be traded. Buy a bond and you're lending cash to the Issuer — a government, a company, or an organization — for a fixed period.","In exchange you get two things: periodic interest payments (the Coupon), and the original amount back in full (the face or par value) on a set end date (the maturity date).","The price quoted for a bond — the Clean Price — always EXCLUDES interest that's quietly accrued since the last coupon payment. Add that back and you get the Dirty Price, which is what you actually pay to buy it.","Not all bonds carry equal risk: government bonds from stable countries are generally considered safest; corporate bonds pay more interest specifically because a company can go bankrupt in a way a government (usually) can't.","A Bondholder can sell a bond to someone else long before maturity, and its market price moves opposite to interest rates — rates up, existing bond prices down. That single inverse relationship is the most important intuition to build about bonds early."],"examples":[{"title":"A simple bond, start to finish","body":"A company issues a 5-year bond with $1,000 face value and a 4% annual coupon. Over 5 years you collect $40/year in coupons ($200 total), then get your original $1,000 back at maturity — a total return of $1,200 on a $1,000 investment, assuming the company doesn't default."},{"title":"Clean price vs. dirty price, isolated","body":"A bond has a $1,000 face value and a 6% annual coupon ($60/year), and its last coupon was paid 60 days ago. The market quotes its clean price at 101% of face value = $1,010 — a price that ignores timing entirely. But the seller has earned $60 × (60/365) ≈ $9.86 of interest since that last payment which hasn't been paid out yet, and they're owed for it. The dirty price — what you actually pay today — is $1,010 + $9.86 = $1,019.86. One day later, even if the clean price hasn't moved at all, the dirty price ticks up again (one more day of accrued interest) — that small daily creep, independent of the market, is exactly what accrued interest tracks."},{"title":"Why rates and bond prices move opposite","body":"You hold a $1,000 bond paying a fixed 4% coupon ($40/year). Market interest rates then rise, and brand-new bonds start offering 6% ($60/year) for the same $1,000. Nobody will pay you $1,000 for your bond anymore, since a new buyer could get $60/year elsewhere for that money instead of your $40/year — so your bond's price has to drop (say, to roughly $930) until its fixed $40/year becomes attractive enough, relative to that lower purchase price, to compete with the new 6% bonds. Rates up, existing bond prices down — always in the opposite direction, because a bond's coupon is fixed but the market's going rate for lending money isn't."}],"key_terms":["Bond","Bondholder","Coupon","Clean Price","Issuer","Default"]},{"title":"Fixed Income — The Asset Class Behind Bonds","digest":["\"Fixed Income\" is the umbrella asset class bonds belong to: anything that pays a scheduled, pre-defined stream of payments rather than a variable, performance-dependent return like a stock. Bonds are the flagship example, but the category also covers shorter-term Money Market instruments and structured pools of loans.","The name is the whole concept: you know the income schedule going in — or, for a Floating Rate Note, at least the FORMULA for that schedule. That predictability is exactly why fixed income is the natural counterweight to equities in a portfolio: equities for growth, fixed income for predictable income and capital preservation.","Fixed income isn't automatically \"safe\" — it's \"predictable.\" A government bond from a stable country is both; a bond from a near-bankrupt company is predictable in STRUCTURE (same coupon schedule) but far from safe in substance, which is exactly what a Credit Rating exists to distinguish.","Within fixed income, maturity length matters as much as issuer quality: short-dated instruments (money market, under a year) barely move in price when interest rates change; long-dated bonds (20-30 years) can swing significantly, since more future cashflows are affected by any given change in rates.","This asset class dominates collateral management specifically because of its predictability: a bond's future cashflows and structure are known in advance, making it straightforward to value, price a haircut against, and hold as collateral — none of which is true of an equity."],"examples":[{"title":"Fixed income vs. equity, same company","body":"The same company can issue BOTH a bond (fixed income: you're a lender, promised $1,040 back on $1,000 over a year at 4%, regardless of how the company's stock performs) AND shares (equity: no promise at all — your $1,000 could become $2,000 or $200 depending entirely on the business). Same issuer, two completely different risk/return deals — the fixed income deal caps your upside in exchange for a predictable floor."}],"key_terms":["Bond","Floating Rate Note","Money Market","Credit Rating"],"num":3},{"title":"Bond & Security Variants","digest":["Bonds come in structural flavors beyond the plain \"pays a fixed coupon\" version. A Zero Coupon Bond pays no interest at all — it's sold at a deep discount and redeemed at full face value, with the \"interest\" entirely baked into that discount.","Some bonds shift WHO controls early redemption: Callable Bonds let the issuer repay early (usually to refinance if rates fall); Puttable Bonds flip that power to the bondholder instead, who can force early repayment if it suits them.","A Convertible Bond is a genuine hybrid: it pays a fixed coupon like any bond, but also gives the holder the right to convert it into a fixed quantity of the issuer's shares — fixed income with an equity upside built in.","Not all bonds rank equally if the issuer goes bankrupt. A Senior Unsecured Bond gets repaid before other unsecured debt, but \"senior\" doesn't mean risk-free — it just describes its place in the repayment queue, not its overall safety.","How ownership itself gets recorded varies too: a Registered Security has the issuer's registrar tracking exactly who owns it (the norm for equity today); a Bearer Security has no such registry at all — historically, physical possession of the paper certificate WAS the proof of ownership.","Some securities aren't a direct claim on a single company at all: an Asset-Backed Security pools many similar loans together and sells claims on that pool (a Mortgage-Backed Security, built from a pool of mortgages, is the most common example); an American Depository Receipt lets US investors hold a foreign company's shares without trading directly on a foreign exchange."],"examples":[{"title":"Same coupon-and-conversion mechanic, different outcomes","body":"A company issues a $1,000 Convertible Bond paying a 3% coupon, convertible into 20 shares. If the shares later trade above $50 each (20 × $50 = $1,000), the holder converts and captures the upside like an equity investor. If the shares stay below $50, the holder simply keeps collecting the 3% coupon and gets the $1,000 back at maturity like an ordinary bondholder — the conversion right only gets used when it's worth more than the bond itself."}],"key_terms":["Zero Coupon Bond","Callable Bonds","Puttable Bonds","Convertible Bond","Senior Unsecured Bond","Registered Security","Bearer Security","Asset-Backed Security","Mortgage-Backed Security","American Depository Receipt"],"num":4},{"num":5,"title":"Equities — Owning a Piece of the Company","digest":["An equity (share, or stock) is a slice of ownership in a company, not a loan. Buy one share of a company with 1,000,000 shares outstanding and you own one-millionth of it.","Unlike a bond, equity has no maturity date and no promised repayment — your return is entirely tied to how the company performs, which is why equities are riskier than bonds, but also carry higher long-run return potential.","Companies sometimes pay part of their profit back to shareholders as a Cash Dividend — but unlike a bond's coupon, this is never guaranteed; a company can cut or skip it entirely, for any reason, at any time.","Ordinary Shares (also called Common Stock) are the standard type — they carry voting rights but sit behind bondholders and other creditors if the company goes bankrupt, with no promised payout at all if things go wrong.","Because equity has no fixed value or fixed end date, its price swings far more than a bond's. That volatility is exactly why collateral is overwhelmingly posted as bonds or cash, and only rarely as equity."],"examples":[{"title":"Same $1,000, two very different outcomes","body":"You buy $1,000 of a company's shares instead of its bonds. If the company doubles in value, your shares could be worth $2,000 — no bond ever pays that. If the company goes bankrupt, your shares could be worth $0 — while even a defaulting bond's holders usually recover something, since bondholders are paid before shareholders in a liquidation."}],"key_terms":["Common Stock","Ordinary Shares","Cash Dividend","Shareholder"]},{"title":"Equity Variants & Pooled Funds","digest":["A company's Share Capital is simply the par value of all its issued shares — a fixed, largely symbolic accounting figure that's separate from the company's actual market value, which moves constantly as the share price moves.","Companies can change their share structure without changing anyone's actual stake: a Stock Split replaces each share with several lower-priced ones (say, one $100 share becomes two $50 shares) purely to make the share price more accessible to smaller investors — nobody's real ownership percentage changes.","Dividends don't have to be cash. A Stock Dividend pays shareholders in additional shares instead of cash — economically similar to a stock split, but structured and often taxed differently.","A company can also return cash to shareholders by buying its own shares back on the market (a Share Buy-Back) rather than paying a dividend — this reduces the number of shares outstanding, which increases each remaining share's claim on future profits.","Most people don't buy individual shares directly — they buy into a Mutual Fund (or, more specifically, an Index Tracking Fund, which simply mirrors a market index rather than trying to beat it), run by a Fund Manager who pools many investors' cash and decides what to buy on their behalf.","An Alternative Investment Fund is the broader, looser category covering funds that stray from that traditional buy-and-hold model — using derivatives, leverage, or unconventional strategies. Hedge funds, from Lesson 5, are one type of alternative investment fund."],"examples":[{"title":"A stock split changes nothing real","body":"You own 10 shares of a company trading at $100 each ($1,000 total). The company announces a 2-for-1 stock split. The next day you own 20 shares trading at $50 each — still $1,000 total, and still exactly the same percentage of the company. A stock split is pure repackaging, not a change in what you actually own."}],"key_terms":["Share Capital","Stock Split","Stock Dividend","Share Buy-Back","Mutual Fund","Index Tracking Fund","Fund Manager","Alternative Investment Fund"],"num":6},{"num":7,"title":"Derivatives — Contracts About the Future","digest":["A derivative isn't ownership of anything and isn't a loan — it's a CONTRACT between two parties whose value is derived from (hence the name) the future price of something else: a stock, a bond, an interest rate, a currency, even another company's creditworthiness.","Because you're agreeing to a contract rather than buying an asset outright, derivatives let you gain exposure to a large price move while only ever putting up a small fraction of the underlying's value. That's Leverage, and it cuts both ways — bigger gains, bigger losses.","Exchange-Traded Derivatives (standard futures and options) are standardized contracts where your real counterparty is the exchange's clearing house, not the other trader — this is what makes them liquid and comparatively low counterparty risk.","OTC (over-the-counter) derivatives are the opposite: privately negotiated directly between two firms, with no exchange in the middle. Each side carries real, ongoing counterparty risk to the other for as long as the contract lasts — sometimes decades.","That single distinction — exchange-traded vs. OTC — is the reason collateral management exists as a discipline at all: OTC derivatives create long-lived, two-sided counterparty exposure that has to be actively managed for the entire life of the contract."],"examples":[{"title":"Notional isn't real money","body":"Two firms agree to a $10,000,000 \"notional\" interest rate swap. That $10,000,000 never actually changes hands — it's purely a reference number used to size the real cashflow (say, 3% of it, $300,000/year). This is the most confusing thing about derivatives for newcomers: the big number you hear quoted is almost never the amount of money actually at risk or actually paid."},{"title":"Leverage, with numbers","body":"You want exposure to 10,000 shares of a $50 stock (a $500,000 position). Buying the shares outright costs the full $500,000. Instead, you buy a futures contract controlling the same 10,000 shares, putting up only $25,000 of margin (5%) as a performance bond. If the shares rise 10% to $55, your futures position gains $50,000 — a 200% return on your $25,000 margin, versus just a 10% return if you'd bought the shares outright. Fall 10% instead, and you lose that same $50,000 against your $25,000 margin — losing double your outlay. Same underlying price move, wildly different result, purely because of how much you actually put up."}],"key_terms":["Derivative","OTC Derivative","Futures","Options","Trading Position","Call Option","Put Option"]},{"title":"Exchange-Traded Derivatives & Clearing","digest":["An Exchange-Traded Derivative (a standard future or option) is a standardized contract — fixed sizes, fixed expiry dates — that trades on a public exchange, in direct contrast to a privately negotiated OTC derivative.","The moment an ETD trade is agreed, a Clearing House legally steps in and splits it into two contracts: it becomes the buyer to the original seller, and the seller to the original buyer. This is called Novation, and it means neither original party ever has to worry about the other's credit quality again — each only faces the clearing house.","A Central Counterparty is the institution performing this role — for both ETDs and, increasingly, standardized OTC trades pushed into Central Clearing since the 2008 financial crisis specifically to make that market's counterparty risk safer and more visible.","The clearing house protects itself — and everyone using it — with two main tools: Initial Margin, a buffer collected upfront from every Clearing Member before it's even needed, and daily Variation Margin, collected or paid out as prices move so no member's loss quietly builds up unnoticed.","If a member still defaults despite all that margin, a shared default fund contributed by every clearing member absorbs the loss before it could ever cascade to other, unrelated members — the entire design goal is that one firm's failure never becomes everyone else's problem."],"examples":[{"title":"Novation, in one sentence","body":"You buy a futures contract from Trader A on an exchange. A second later, you have no contract with Trader A at all — you have a contract with the clearing house, and so does Trader A, and neither of you will ever need to know or care who was actually on the other side of the original trade."},{"title":"Initial margin vs. variation margin, side by side","body":"Two firms trade a cleared derivative through a CCP. Before the trade even starts, each posts $2,000,000 of Initial Margin — a static buffer sized to cover the worst plausible price move before the position could be closed out, sitting untouched as long as nothing goes wrong. Then, every day, the CCP marks the trade to market: today it moves $150,000 in Firm A's favor, so Firm B pays $150,000 of Variation Margin — a live settlement of the day's actual gain or loss. Initial Margin is a buffer sized for a bad day that HASN'T happened yet; Variation Margin settles the day that already did."}],"key_terms":["Exchange-Traded Derivative","Novation","Central Counterparty","Central Clearing","Initial Margin","Variation Margin","Clearing Member","Clearing House"],"num":8},{"num":9,"title":"Who's Who: The Market's Cast of Characters","digest":["Buy-Side firms are the ultimate investors — asset managers, hedge funds, pension funds, insurance companies — who buy and hold financial products to generate returns for their own clients or beneficiaries.","Sell-Side firms (mainly Investment Banks) exist to serve the buy-side: executing trades, providing research, lending securities, and taking the other side of trades buy-side clients want to do.","A Broker sits in between as a pure intermediary, executing trades on behalf of clients without ever taking a position of its own — genuinely low-risk by design, since it never bets its own money on price direction.","A Custodian is the institution that actually holds a firm's securities safely and processes settlement, corporate actions and income on their behalf — the industrial-strength, professional version of a bank vault, and a completely different job from a broker or asset manager.","Two more names worth knowing early: a Hedge Fund is a buy-side firm using more flexible, often higher-risk strategies (able to bet prices will fall, not just rise); a Prime Broker is the specific division of an investment bank that bundles financing, securities lending and custody into one relationship for hedge fund clients."],"examples":[{"title":"Following one trade through the cast","body":"A hedge fund (buy-side) wants to buy shares. It calls its broker, who executes the trade on an exchange against a counterparty found via a market maker (a firm continuously quoting buy/sell prices to keep the market liquid). Once executed, the shares settle into an account at the hedge fund's custodian — likely arranged through its prime broker, who also lends it cash and securities against those same holdings."}],"key_terms":["Buy-Side","Sell-Side","Investment Bank","Broker","Custodian","Hedge Fund","Prime Broker","Market Maker","Asset Manager"]},{"num":10,"title":"How a Trade Actually Happens","digest":["Every trade — regardless of what's being traded — passes through the same basic stages: execution (the deal is agreed), confirmation (both sides check they agree on every detail), clearing (in some markets, a Central Counterparty steps in between buyer and seller), and settlement (securities and cash actually change hands).","\"Settlement\" for almost all modern securities doesn't mean physical delivery — it means Book Entry: an electronic update of who owns what within a Central Securities Depository or custodian's records.","The gap between execution and settlement — often T+1 or T+2, trade date plus one or two business days — is exactly why counterparty risk exists at all: for that window, each side is exposed to the other failing to deliver.","Getting any single stage wrong compounds downstream — a mistake in a trade's basic Trade Execution details is still wrong at confirmation, still wrong at settlement, and eventually surfaces as a mismatched exposure or a failed payment, just later and harder to trace.","A Central Counterparty (CCP) is a special institution that inserts itself between the original buyer and seller, becoming the counterparty to both — this dramatically reduces the risk that either original party has to worry about the other one defaulting."],"examples":[{"title":"T+2 in practice","body":"You buy shares on Monday (trade date). Under a T+2 convention, the actual exchange of shares for cash doesn't happen until Wednesday. If you
