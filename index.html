netary value of Collateral that a Counterparty must provide, after deduction of any applicable Haircut from the collateral’s Market Value.","cat":"core","diff":2,"chapters":[10,11]},{"id":"t479","term":"Reset Date","def":"In an Interest Rate Swap, the date at which the floating interest rate for an upcoming period becomes effective, and therefore the date from which calculations should commence for that new rate.","cat":"otc","diff":2,"chapters":[16]},{"id":"t480","term":"Residual Maturity","def":"For Collateral Management purposes (specifically for determination of Haircut), the period of time from ‘today’ until the maturity date of a Bond, usually expressed in years.","cat":"core","diff":2,"chapters":[34,4,22,2,47]},{"id":"t481","term":"Restructuring Event","def":"A change in the terms of a Bond issue during the bond’s lifetime, triggered by the Issuer. One or many existing bond issues may be replaced by one or more replacement securities. One form of Corporate Action. May be included as a qualifying Credit Event in a Credit Default Swap.","cat":"otc","diff":3,"chapters":[22,36]},{"id":"t482","term":"Return (Securities Borrowing)","def":"In a Securities Lending & Borrowing trade that is executed on an Open basis, the return delivery of securities from the Securities Borrower to the Securities Lender, where the lender requires the return of the lent securities or the borrower no longer has the requirement to borrow. See Recall (Securities Lending).","cat":"slb","diff":4,"chapters":[10,4,22,36,11]},{"id":"t483","term":"Reuse of Securities Collateral","def":"Under a Title Transfer arrangement (as is the case for the English Law CSA, the GMRA and the GMSLA), the Collateral Taker has the legal right to reuse securities collateral in any way of their choosing. For comparison, see Rehypothecation.","cat":"legal","diff":3,"chapters":[10,36]},{"id":"t484","term":"Reverse Repo","def":"A Repo transaction viewed from the perspective of the cash lender. Securities are initially received from the Counterparty (against payment of cash), and will require to be returned to the counterparty on the Closing Value Date of the trade.","cat":"repo","diff":3,"chapters":[3,4]},{"id":"t485","term":"Reverse Split","def":"With the Issuer’s intention of increasing the Current Market Price of a share, the replacement of an Equity issue having a particular Par Value (e.g. USD 1.00), with an equivalent quantity of a higher par value security (e.g. USD 2.00), at an effective date. One type of Corporate Action. See Stock Split.","cat":"core","diff":3,"chapters":[22]},{"id":"t486","term":"Rights Issue","def":"An offer by an Issuer (that wishes to raise further capital) to the existing Shareholders to purchase additional Shares in proportion to their existing shareholding; in order to entice the shareholders to take up the offer, the price of the rights is typically offered at a discount to the Current Market Price of the existing shares. Care: the issuer imposes a deadline for the receipt of cash from shareholders wishing to subscribe. One type of Corporate Action.","cat":"core","diff":5,"chapters":[22,10]},{"id":"t487","term":"Rounding","def":"The process of increasing (rounding up) or decreasing (rounding down) a number or cash value, in accordance with an agreed method. This is common practice when issuing Margin Calls.","cat":"otc","diff":2,"chapters":[33,22,34,23,35]},{"id":"t488","term":"Safe Custody","def":"The holding of Securities in safekeeping on behalf of the owner of the assets, and the provision of associated services, such as the collection of income payable to the owner.","cat":"core","diff":2,"chapters":[9,10]},{"id":"t489","term":"Sale & Repurchase Trade","def":"A form of Securities Financing transaction. Commonly abbreviated to Repo.","cat":"repo","diff":1,"chapters":[4,5,8]},{"id":"t490","term":"Salesman","def":"An employee of an Investment Bank that is the liaison point with Institutional Investors and the investment bank’s traders.","cat":"core","diff":1,"chapters":[]},{"id":"t491","term":"Scheduled Maturity Date","def":"The final day that an OTC Derivative trade is live and valid. Once this day has passed, as no Exposure exists for the parties to the trade, all Collateral must be returned to the original owner.","cat":"otc","diff":2,"chapters":[44,30,48,19,28]},{"id":"t492","term":"Secondary Market","def":"A generic term to describe the marketplace where existing Securities are traded (as opposed to those securities that are in course of being brought to the marketplace, within the Primary Market).","cat":"core","diff":2,"chapters":[2,36,17]},{"id":"t493","term":"Secure File Transfer","def":"A method of accessing and transferring data in a secure manner.","cat":"core","diff":1,"chapters":[31]},{"id":"t494","term":"Secured Cash Borrowing","def":"The borrowing of cash against the delivery of Collateral, in order to mitigate the cash lender’s risk (of not having the cash returned). Also known as Collateralised Cash Borrowing. The alternative is Unsecured Cash Borrowing.","cat":"slb","diff":3,"chapters":[3]},{"id":"t495","term":"Securities","def":"Financial instruments that may be purchased and sold, repo’d and reverse repo’d, lent and borrowed, and used as Collateral. The most common forms of securities are Equities and Bonds.","cat":"repo","diff":2,"chapters":[10,12,11,9,22,8,13,32]},{"id":"t496","term":"Securities Borrowing","def":"In the event that Securities sold cannot (yet) be delivered to the buyer, the practice of borrowing securities from a Shareholder or Bondholder at a cost, in order to settle the sale, thereby enabling the seller to receive the sale proceeds at the earliest opportunity. See Securities Lending.","cat":"slb","diff":3,"chapters":[10,9,11,12,6]},{"id":"t497","term":"Securities Data Vendors","def":"Organisations that supply detailed information concerning individual Securities, usually electronically, to those that subscribe to the service.","cat":"core","diff":2,"chapters":[35]},{"id":"t498","term":"Securities Delivery Risk","def":"Where Securities are due to be delivered against receipt of an asset of equivalent value, the risk that the asset given by the deliverer is delivered on a non-simultaneous basis, where the possibility exists that the deliverer will have possession of neither asset. See Delivery versus payment and Free of payment.","cat":"core","diff":3,"chapters":[10]},{"id":"t499","term":"Securities Industry and Financial Markets Association","def":"An organisation which promotes effective and efficient operation of Capital Markets, and which represents Investment Banks, Broker- Dealers and Asset Managers in the United States. Commonly abbreviated to SIFMA.","cat":"core","diff":2,"chapters":[10]},{"id":"t500","term":"Securities Financing","def":"An ‘umbrella’ term for any transaction type in which Securities (i.e. Equity and/or Bonds) are used to borrow cash, and where cash is used to borrow securities, and where securities are used to borrow other securities. Applicable to Repo, Buy/Sell Back and Securities Lending & Borrowing.","cat":"slb","diff":3,"chapters":[]},{"id":"t501","term":"Securities Lending","def":"The practice of a Shareholder or Bondholder loaning its securities to a borrower for a fee, in order to enhance the lender’s return on its investment. See Securities Borrowing.","cat":"slb","diff":2,"chapters":[9,11,13,10,12]},{"id":"t502","term":"Securities Lending & Borrowing","def":"Generic name for the practice in which securities are temporarily delivered (by lenders) to parties needing temporary use (borrowers) of such securities. Collateral is provided by borrowers to mitigate the lender’s risk of their asset failing to be returned by the borrower.","cat":"slb","diff":3,"chapters":[10,11,13,12,9]},{"id":"t503","term":"Securities Safekeeping Fees","def":"Charges made by Central Securities Depositories and Custodians to Shareholders and Bondholders for holding Securities safely and securely. Equity-related fees are typically based on Market Value of the securities held, whereas Bond -related fees are typically based on the bond quantity held.","cat":"core","diff":3,"chapters":[10,11,12]},{"id":"t504","term":"Securitised and Securitisation","def":"The process of transforming one or more financial assets (e.g. a collection of loans) into a tradable Security. See Mortgage-Backed Security.","cat":"core","diff":2,"chapters":[4]},{"id":"t505","term":"Security","def":"A negotiable financial instrument (specifically Equity and Bonds) which is tradable between investors, and whose price fluctuates according to the laws of supply and demand. Securities are brought to the marketplace within the Primary Market, and are subsequently tradable within the Secondary Market. Each security is uniquely identifiable via its ISIN.","cat":"core","diff":4,"chapters":[10,22,11,36,12,32]},{"id":"t506","term":"Security Interest","def":"The legal method of transfer of Collateral under the New York Law CSA. The Collateral Giver retains Legal Ownership, although this is subject to surrender in case of Default by that party. Rehypothecation is not permitted automatically. For comparison, see Title Transfer.","cat":"legal","diff":3,"chapters":[36,22]},{"id":"t507","term":"SEDOL Code","def":"Acronym for ‘Stock Exchange Daily Official List’. A coding regime that identifies UK and Irish securities.","cat":"core","diff":1,"chapters":[23]},{"id":"t508","term":"Self-Clearing Sell-Out","def":"The administration of a firm’s Operations and Settlement activity by the firm that has executed the trade. (The alternative being to outsource such activity.) A formal procedure for a seller to force the buyer to pay for Securities it is owed, with associated costs payable by the buyer; such procedures must be conducted under the rules of the Stock Exchange or market authority over which the trade has been Executed. For comparison, see Buy-In.","cat":"slb","diff":5,"chapters":[]},{"id":"t509","term":"Sell-Side","def":"Generic term which describes the community of Investment Banks and Brokers that execute trades (in financial instruments of various types) for and with Buy-Side firms. Note that the sell-side also buys such financial instruments.","cat":"core","diff":3,"chapters":[3,29,46,47,14,22]},{"id":"t510","term":"Senior Unsecured Bond","def":"A Debt security issued by a corporation which, in the event of the Issuer’s bankruptcy, will repay such Bondholders prior to repaying other forms of debt.","cat":"core","diff":2,"chapters":[41]},{"id":"t511","term":"Service Level Agreement","def":"Generically speaking, a formal contract between a service provider and its client, which is designed to clearly document the agreed level of service. In a financial services environment, one use of such agreement is between a Central Securities Depository or Custodian and its account holder.","cat":"core","diff":3,"chapters":[2,7]},{"id":"t512","term":"Set-Off","def":"The legally documented netting of Repo or OTC Derivative trades, resulting from an Event of Default by a firm or its Counterparty.","cat":"otc","diff":1,"chapters":[4,10]},{"id":"t513","term":"Settled Position and Settled Securities Position","def":"The quantity of Securities held in the account of an account holder, at a CSD or Custodian; differences in the settled position and Trading Position are usually due to one or many Open Trades.","cat":"legal","diff":2,"chapters":[]},{"id":"t514","term":"Settlement","def":"1. Securities: the act of buyer and seller (or their agents) exchanging securities and cash in order to fulfill their contractual obligations. 2. Derivatives: payment (or receipt) of monies falling due periodically throughout the lifetime of a trade; e.g. quarterly Premium in a Credit Default Swap. 3. Collateral: payment of cash or delivery of Securities to satisfy a Margin Call.","cat":"otc","diff":4,"chapters":[11,5,4,34,2,29,38,41]},{"id":"t515","term":"Settlement Cycle","def":"The standard or default period of time between Trade Date and Value Date of Securities trades, within a marketplace. (At the time of writing, the settlement cycle in Europe and the USA is T+2 (trade date plus 2 business days).) Also applicable in Spot Foreign Exchange trades.","cat":"core","diff":3,"chapters":[4,18,20,9,15]},{"id":"t516","term":"Settlement Date","def":"The date the actual exchange of Securities and cash has been effected; this date is known only after Settlement has occurred. For comparison, see Value Date.","cat":"core","diff":2,"chapters":[34,11,5,9,2]},{"id":"t517","term":"Settlement Failure","def":"Trades where Securities and cash have not been exchanged on Value Date (the Contractual Settlement Date); Settlement is therefore delayed.","cat":"core","diff":2,"chapters":[9,10,12,34,2,20]},{"id":"t518","term":"Settlement Instruction","def":"A message issued by an account holder to its CSD or custodian (or Nostro in the case of cash) that requests the delivery or receipt of Securities and/or payment or receipt of cash, on a specified date (the Value Date of the trade).","cat":"legal","diff":3,"chapters":[5,11,35,2,42,29]},{"id":"t519","term":"Settlement Netting","def":"Instead of settling each Open Trade independently, the Settlement of two or more trades may be effected by the single delivery (or receipt) of the remaining quantity of Securities and the single receipt (or payment) of the remaining amount of cash.","cat":"otc","diff":3,"chapters":[7]},{"id":"t520","term":"Settlement Status","def":"The condition of a Securities Settlement Instruction reported by a CSD or Custodian to its account holder; typical statuses are unmatched with counterparty, matched with counterparty, settled, and failed.","cat":"legal","diff":2,"chapters":[34]},{"id":"t521","term":"Settlement Tolerance","def":"A predefined cash limit (set by a CSD or Custodian), within which differing cash amounts on seller’s and buyer’s Settlement Instructions are deemed to match; such tolerances avoid small cash differences from preventing Settlement occurring.","cat":"legal","diff":3,"chapters":[]},{"id":"t522","term":"Settlement Write-Off","def":"Internally within a Buy-Side or Sell-Side firm, the clearance of an open cash balance of an individual trade, where the open cash amount is transferred to an internal account leaving no cash amount to be paid to or received from the Counterparty.","cat":"core","diff":3,"chapters":[]},{"id":"t523","term":"Share","def":"That which represents Equity ownership in a company.","cat":"core","diff":1,"chapters":[14,22,10,9,15]},{"id":"t524","term":"Share Buy-Back","def":"The offer by an Equity Issuer to purchase the Shareholders’ shares at a specified price per share. One type of Voluntary Corporate Action.","cat":"core","diff":2,"chapters":[10]},{"id":"t525","term":"Share Capital","def":"The total Par Value of issued Shares in a company.","cat":"core","diff":1,"chapters":[22]},{"id":"t526","term":"Share Register","def":"The list of Registered Holders of Equity, maintained by a Registrar on behalf of the Issuer.","cat":"core","diff":1,"chapters":[]},{"id":"t527","term":"Shareholder","def":"The owner of Shares in a company.","cat":"core","diff":1,"chapters":[10]},{"id":"t528","term":"Short First Coupon","def":"A term given to the first payment of interest after a Bond has been issued, specifically where the elapsed time between issue of the bond and the first Coupon Payment Date is less than the normal Coupon Period for that bond. See Long First Coupon.","cat":"core","diff":3,"chapters":[]},{"id":"t529","term":"Short Form Confirmation","def":"Relating to an OTC Derivative trade where an ISDA Master Agreement is in place between the two parties, a legal document issued by a firm to its Counterparty that specifies the basic terms of the trade. See Long Form Confirmation.","cat":"otc","diff":3,"chapters":[25]},{"id":"t530","term":"Short Sale and Short Selling","def":"A sale of securities which are not owned by the seller. See Covered Short and Naked Short.","cat":"core","diff":1,"chapters":[10]},{"id":"t531","term":"SIFMA","def":"Acronym for Securities Industry and Financial Markets Association.","cat":"core","diff":1,"chapters":[8]},{"id":"t532","term":"Single-Name Credit Default Swap","def":"A Credit Default Swap in which the Reference Entity is a single issuer (as opposed to multiple issuers as is the case in a Basket Default Swap).","cat":"otc","diff":2,"chapters":[17,23,46]},{"id":"t533","term":"SONIA","def":"Acronym for ‘Sterling OverNight Index Average’. A Floating Benchmark interest rate which is the average rate quoted by a number of banks for a duration of 1 day, for GBP. See Euribor and Libor.","cat":"core","diff":2,"chapters":[22,27]},{"id":"t534","term":"Special Collateral","def":"A Security which is in extraordinarily high demand, particularly when compared with the demand for other securities. See Special Repo.","cat":"repo","diff":1,"chapters":[4,6]},{"id":"t535","term":"Special Repo","def":"A type of Repo transaction (a Stock-Based Repo), in which the motivation for the trade is that one party wishes to borrow the Security. In return, the securities borrower (Collateral Taker) provides cash to the Collateral Giver, for which either 1) a low rate of credit interest may be payable by the collateral giver, or 2) the collateral taker is required to pay debit (i.e. negative) interest.","cat":"repo","diff":4,"chapters":[6]},{"id":"t536","term":"Spot Exchange Rate","def":"In a Foreign Exchange trade, the rate at which a trade is executed for immediate Settlement on the ‘spot’ Value Date, which (for most currency combinations) is Trade Date + 2 business days. For comparison, see Forward Exchange Rate.","cat":"core","diff":3,"chapters":[18]},{"id":"t537","term":"Square-Off","def":"In an existing OTC Derivative trade, the closure of that trade by the execution of an equal and opposite trade with the same Counterparty, resulting in no outstanding trade and no ongoing exposure. The effect of an Unwind.","cat":"otc","diff":2,"chapters":[39]},{"id":"t538","term":"SSI","def":"Acronym for Standing Settlement Instruction.","cat":"core","diff":1,"chapters":[2,23,34,35,5]},{"id":"t539","term":"Standard & Poor’s","def":"An Issuer Ratings Agency that publishes its view of an issuer’s ability to repay Debt.","cat":"core","diff":1,"chapters":[]},{"id":"t540","term":"Standardised OTC Derivative","def":"Under EMIR, an OTC Derivative trade which is deemed to have only normal (standard) characteristics; only trades such as this are eligible for clearing via a Central Counterparty. Trades with abnormal or additional characteristics are not permitted to be cleared via a central counterparty, and are classified as Non-Centrally Cleared Trades.","cat":"reg","diff":4,"chapters":[47,46,48]},{"id":"t541","term":"Standing Settlement Instruction","def":"A firm’s and its Counterparties’ account numbers (at CSDs and Cash Correspondents) held within the firm’s Static Data Repository, so as to facilitate Straight Through Processing of trades. Commonly abbreviated to SSI.","cat":"core","diff":2,"chapters":[35,5,18,22,23,2]},{"id":"t542","term":"Static Data and Static Data Repository","def":"An internal store of information pertaining to trading companies, Counterparties, Securities and currencies which is used repeatedly in the processing of Trades, position management and Corporate Actions.","cat":"core","diff":2,"chapters":[23,5,15,26]},{"id":"t543","term":"Static Data Defaulting","def":"The automatic process of 1) locating (from a Static Data Repository) of relevant account numbers and cash values, and 2) attachment of the same to basic trade details, according to predefined set of rules.","cat":"core","diff":2,"chapters":[23,26]},{"id":"t544","term":"Stock-Based Repo","def":"A Repo trade in which the primary motivation is for one of the parties to borrow securities; the alternative is Cash-Based Repo.","cat":"repo","diff":1,"chapters":[6,4,3]},{"id":"t545","term":"Stock Dividend","def":"A Dividend paid by an Issuer to its Shareholders in the form of Securities; also known as ‘Scrip Dividend’.","cat":"core","diff":1,"chapters":[10]},{"id":"t546","term":"Stock Exchange","def":"Historically, a physical meeting point for buyers and sellers, where Equity securities were traded. Today, some financial centres continue to operate in such a manner whilst others operate on an electronic basis.","cat":"core","diff":2,"chapters":[2,7]},{"id":"t547","term":"Stock Split","def":"With the Issuer’s intention of reducing the Current Market Price of a share, the replacement of an Equity issue having a particular Par Value (e.g. USD 1.00), with an equivalent quantity of a lower par value security (e.g. USD 0.50), at an effective date. Also known as a ‘Forward Split’. One type of Corporate Action. See Reverse Split.","cat":"core","diff":4,"chapters":[10,22]},{"id":"t548","term":"STP","def":"Acronym for Straight Through Processing.","cat":"core","diff":1,"chapters":[23]},{"id":"t549","term":"Straight Through Processing","def":"An objective of Buy-Side and Sell-Side firms, suppliers of communications software, C SDs, Custodians, etc., to manage the entire Trade Lifecycle in an automated and seamless manner, without the need for review or repair. The intended benefit of straight through processing is reduced costs and the ability to process high volumes of trades in a secure and risk-free manner. Commonly abbreviated to STP.","cat":"core","diff":4,"chapters":[24,23]},{"id":"t550","term":"Stressed Market","def":"A financial market which is undergoing increased or extreme volatility, typically caused by unusual external events.","cat":"core","diff":1,"chapters":[22]},{"id":"t551","term":"Strike Price","def":"See Exercise Price.","cat":"core","diff":1,"chapters":[14]},{"id":"t552","term":"Structured Trade","def":"A transaction that has been created to meet an investor’s particular needs, by the amalgamation of a number of features over and above those of standardised financial products.","cat":"core","diff":2,"chapters":[31]},{"id":"t553","term":"Supranational Organisations","def":"Entities that issue Bonds but which are not associated with a specific country; such entities include the International Bank for Reconstruction & Development (World Bank), the Inter-American Development Bank (IADB), and the European Coal & Steel Community (ECSC). See Multilateral Development Banks.","cat":"core","diff":3,"chapters":[3,22,21,47,48]},{"id":"t554","term":"Swap","def":"A Derivative trade in which the two involved parties Execute the trade directly with one another, on a Bilateral basis. The word ‘swap’ refers to the exchange of cashflows which occurs in such trades. Synonymous with the term OTC (Over-the-counter) Derivative.","cat":"otc","diff":3,"chapters":[19,18,30,27,23,25,28,43]},{"id":"t555","term":"Swap Execution Facility","def":"An electronic trading platform via which those parties that wish to execute OTC Derivative trades can be matched with one another.","cat":"otc","diff":1,"chapters":[46]},{"id":"t556","term":"S.W.I.F.T.","def":"Acronym for ‘Society for Worldwide Interbank Financial Telecommunications’. A worldwide organisation providing secure message transmission between subscribing parties. Message types include Trade Confirmation, Settlement Instructions, Securities and cash statements and Corporate Actions.","cat":"core","diff":3,"chapters":[10,34]},{"id":"t557","term":"Systemic Risk","def":"The threat of complete failure of a financial marketplace or of the global financial system.","cat":"core","diff":1,"chapters":[30]},{"id":"t558","term":"T2S","def":"Acronym for Target2 Securities.","cat":"core","diff":1,"chapters":[4,10,42,11]},{"id":"t559","term":"Target2 Securities","def":"The European Commission’s pan-European Settlement platform, designed to harmonise cross-border securities settlement. Clients of participating CSDs in Europe can utilise their CSD as a single point of contact for settlement of movements in European securities, utilising Central Bank Money. Commonly abbreviated to T2S.","cat":"legal","diff":4,"chapters":[10,42]},{"id":"t560","term":"Tax Avoidance","def":"Legal strategies designed to minimise the amount of tax owed to tax authorities. See Tax Evasion.","cat":"core","diff":1,"chapters":[]},{"id":"t561","term":"Tax Evasion","def":"Unlawful practices designed to avoid taxes payable to tax authorities. See Tax Avoidance.","cat":"core","diff":1,"chapters":[]},{"id":"t562","term":"Tax Event","def":"Relating to OTC Derivatives, an event that results in termination of a trade. Specifically, a change in tax law causing either party to pay a tax amount or additional tax amount.","cat":"otc","diff":2,"chapters":[21]},{"id":"t563","term":"Threshold","def":"An amount of Uncollateralised Exposure which two parties may agree and document. Where a firm has an Exposure and a threshold is applicable, that firm’s Margin Call on its Counterparty must exclude the threshold amount.","cat":"otc","diff":2,"chapters":[48,33,11,22,38,47]},{"id":"t564","term":"Time Value of Money","def":"The concept that a cash amount received today is worth more than that same cash amount receivable in future, assuming that credit interest can be earned on that cash. See Discount Factor and Present Value.","cat":"core","diff":2,"chapters":[22]},{"id":"t565","term":"Time Zone Difference","def":"The difference in the time of day between one time zone and a different time zone.","cat":"core","diff":1,"chapters":[18]},{"id":"t566","term":"Title Transfer","def":"The legal method of transfer of Collateral under the English Law CSA. Full legal title to Securities collateral passes from the Collateral Giver to the Collateral Taker whilst the collateral is in the taker’s possession, consequently Reuse of Securities Collateral is permitted automatically. For comparison, see Security Interest.","cat":"legal","diff":4,"chapters":[8,4,22,36,10,43]},{"id":"t567","term":"Trade","def":"An agreement to exchange financial products on a permanent or temporary basis, between two parties, whether buying or selling, lending or borrowing, etc. This term is applicable to Equity, Bonds, currencies, Derivatives and commodities.","cat":"otc","diff":3,"chapters":[48,4,10,47,28]},{"id":"t568","term":"Trade Affirmation","def":"A communication of the details of a trade from a Sell-Side firm to its Buy-Side client, following which the latter responds to the former to affirm (agree to) the details presented. This is a sequential process. A means of achieving Trade Agreement.","cat":"core","diff":3,"chapters":[29]},{"id":"t569","term":"Trade Agreement","def":"Following Trade Execution, the act of one party gaining agreement to the details of a Trade with its Counterparty, whether by electronic or manual means.","cat":"core","diff":2,"chapters":[29,4]},{"id":"t570","term":"Trade Capture","def":"The act of recording the components of a trade internally, following Trade Execution.","cat":"core","diff":1,"chapters":[28,29,5,7,27]},{"id":"t571","term":"Trade Confirmation","def":"A communication of the details of a Trade from one party to its Counterparty; various media are used for the communication method, including S.W.I.F.T. A means of achieving Trade Agreement.","cat":"core","diff":2,"chapters":[29,5,37,36,34,35,21]},{"id":"t572","term":"Trade Date","def":"The date the parties to a Trade agree to trade; the date of Trade Execution.","cat":"core","diff":1,"chapters":[18,48,4,22,5,19]},{"id":"t573","term":"Trade Execution","def":"The agreement to Trade between the Traders of two parties (e.g. a Buy- Side firm and a Sell-Side firm). Applicable to buying or selling, Repo and Reverse Repo, Securities Lending and Securities Borrowing, OTC Derivatives, etc.","cat":"otc","diff":3,"chapters":[27,11,46,10,47]},{"id":"t574","term":"Trade Execution Venue","def":"For OTC Derivatives under EMIR, an ‘umbrella’ and generic term representing systems that facilitate Trade Execution.","cat":"otc","diff":1,"chapters":[46,47,48]},{"id":"t575","term":"Trade Lifecycle","def":"A series of sequential steps through which a financial transaction passes, beginning with Trade Execution and finishing with the updating of Books & Records, following Settlement. Applicable to all product types (e.g. Equity, Bonds, currency, OTC Derivatives) and all transaction types including buy/sell, Repo / Reverse Repo, Securities Lending/ Securities Borrowing).","cat":"otc","diff":4,"chapters":[11,5,24,46,28]},{"id":"t576","term":"Trade Matching","def":"The process of comparing a seller’s and a buyer’s Trade details electronically, shortly after Trade Execution. A means of achieving Trade Agreement.","cat":"core","diff":2,"chapters":[26,29,4]},{"id":"t577","term":"Trade Processing","def":"For OTC Derivatives, a generic term given to the area (within Buy- Side and Sell-Side firms) responsible for the Settlement of trades (e.g. periodic payment or receipt of premium in a CDS). The alternative is Collateral Processing. Each trade creates the need for both trade processing and collateral processing.","cat":"otc","diff":3,"chapters":[15,30,27,47,48]},{"id":"t578","term":"Trade Repository","def":"For OTC Derivatives under E MIR, an electronic ‘warehouse’ for the storage and safekeeping of the terms of individual trades and positions. Regulators will access such trade information in order to carry out their regulatory oversight responsibilities.","cat":"otc","diff":3,"chapters":[46,47,48]},{"id":"t579","term":"Trade Time","def":"The hour and minute (within a Trade Date) that Trade Execution occurred.","cat":"core","diff":1,"chapters":[4,5,11,28,48]},{"id":"t580","term":"Trader","def":"An individual responsible for Trade Execution within a Buy-Side firm or a Sell-Side firm. This term is applicable to trading in Equities, Bonds, currencies, Derivatives and commodities.","cat":"otc","diff":2,"chapters":[28,10,23,4,27,40]},{"id":"t581","term":"Trading Book","def":"A subdivision of a trading department within an Investment Bank in which trading in a specific grouping of Securities (for example) is conducted and kept separate from the business of other trading books.","cat":"core","diff":2,"chapters":[4,34,36]},{"id":"t582","term":"Trading Position","def":"A positive or negative trade-dated balance (((holding) in a particular financial instrument. For comparison, see Settled Position.","cat":"core","diff":1,"chapters":[36,27,10,22]},{"id":"t583","term":"Transaction Reporting","def":"The regulatory requirement for firms to report each individual trade they execute to a Regulator. In the case of OTC Derivatives under EMIR, trades must be reported to a Trade Repository.","cat":"reg","diff":2,"chapters":[48,14]},{"id":"t584","term":"Transferee","def":"The receiver of Collateral. Also known as Collateral Taker. See Transferor.","cat":"core","diff":1,"chapters":[36,22,38,1]},{"id":"t585","term":"Transferor","def":"The payer (cash) or deliverer (Bonds or Equity) of Collateral. Also known as Collateral Giver. See Transferee.","cat":"core","diff":1,"chapters":[36,22,38]},{"id":"t586","term":"Treaty","def":"A common abbreviation for Double Taxation Agreement.","cat":"core","diff":1,"chapters":[10]},{"id":"t587","term":"Tri-Party Agent","def":"An organisation (such as an ICSD), that provides trade lifecycle administration services for Collateral -related transactions.","cat":"core","diff":1,"chapters":[12,7]},{"id":"t588","term":"Tri-Party Repo","def":"A Repo trade in which the two trading parties utilise the services of a Tri-Party Agent to administer the trade throughout its lifetime.","cat":"repo","diff":2,"chapters":[7,4]},{"id":"t589","term":"triReduce","def":"A Portfolio Compression service for firms wishing to net their trades with a particular Counterparty. Submitted trades are assessed for full or partial compression and the results are presented as compression proposals.","cat":"otc","diff":2,"chapters":[30]},{"id":"t590","term":"triResolve","def":"A Portfolio Reconciliation system that (for Collateral Management purposes) compares OTC Derivative trades executed under legal agreements between two parties, and provides matching results.","cat":"otc","diff":2,"chapters":[31,5,44,4,10]},{"id":"t591","term":"UCITS","def":"Acronym for ‘Undertakings for Collective Investment in Transferable Securities’. A type of Mutual Fund which is listed in Europe and which permits investors within and outside of Europe to invest in a diversified manner.","cat":"core","diff":2,"chapters":[47,48]},{"id":"t592","term":"Uncollateralised Exposure","def":"An Exposure amount for which no Collateral is given or taken. For example, an amount of exposure which the Exposed Party is not permitted to include within a Margin Calllissued to the Counterparty, in accordance with the Credit Support Annex in place between the two parties. See Threshold.","cat":"otc","diff":3,"chapters":[22]},{"id":"t593","term":"Underlying","def":"The financial (or other) asset which is associated with a trade in a Derivative product. For example, a stock Option is a derivative product, the associated asset being (for example) IBM Corporation shares. The price of the derivative product relates directly to the price of the underlying asset.","cat":"otc","diff":3,"chapters":[14,22,17,1,38,29,32,42]},{"id":"t594","term":"Undisputed Amount","def":"Following receipt of a Margin Call Notification, the agreement (by the recipient party) of part of its value. The remainder is known as the Disputed Amount.","cat":"otc","diff":2,"chapters":[22,48,34,35]},{"id":"t595","term":"Unique Trade Identifier","def":"A coding mechanism designed to uniquely identify individual OTC Derivative trades, for transaction reporting to Trade Repositories. Commonly abbreviated to UTI.","cat":"otc","diff":2,"chapters":[]},{"id":"t596","term":"Unmatched Settlement Instruction","def":"A Settlement Instruction issued to a CSD or Custodian to deliver or to receive Securities (typically versus payment or receipt of cash) that has no direct equivalent issued by the Counterparty to the trade. For comparison, see Matched Settlement Instruction.","cat":"legal","diff":3,"chapters":[2,4,34,35]},{"id":"t597","term":"Unrealised Profit & Loss","def":"Theoretical profit or loss on a positive or negative securities Trading Position following revaluation of the position. For comparison, see Realised Profit & Loss.","cat":"core","diff":2,"chapters":[]},{"id":"t598","term":"Unsecured Cash Borrowing","def":"The borrowing of cash without supplying Collateral to the cash lender; the rate of interest payable by the borrower is usually higher than for Secured Borrowing, to reflect the lender’s risk.","cat":"slb","diff":2,"chapters":[]},{"id":"t599","term":"Unsecured Cash Lending","def":"The loan of cash without the lender having the security of the borrower’s Collateral.","cat":"slb","diff":1,"chapters":[]},{"id":"t600","term":"Unsecured Creditor","def":"A cash lender that has not secured the loan by taking any assets as Collateral from the cash borrower.","cat":"slb","diff":1,"chapters":[22,36]},{"id":"t601","term":"Unwind","def":"The execution of an opposing trade to an existing OTC Derivative trade in order to negate the position, and carried out with the original Counterparty. For comparison, see Offset.","cat":"otc","diff":2,"chapters":[39,40,31,37,35,41,44]},{"id":"t602","term":"UTI","def":"Acronym for Unique Trade Identifier.","cat":"core","diff":1,"chapters":[47,48,26,43,4]},{"id":"t603","term":"Valuation Agent","def":"Within the Credit Support Annex, the party (or parties) responsible for carrying out valuation of Open Trades in relevant OTC Derivative products and any previously delivered Collateral.","cat":"otc","diff":2,"chapters":[34,22]},{"id":"t604","term":"Value Date","def":"The intended date of exchange of Securities and cash between buyer and seller. Also known as Contractual Settlement Date.","cat":"core","diff":1,"chapters":[4,10,34,5,9,35]},{"id":"t605","term":"Variance Swap","def":"A type of OTC Derivative which provides an investor with direct Exposure to changes in the future volatility of an Underlying asset such as a stock or an index. Returns are based on difference between expected volatility level and actual volatility level.","cat":"otc","diff":3,"chapters":[25]},{"id":"t606","term":"Variation Margin","def":"For OTC Derivative trades and positions held at a Central Counterparty, the giving and taking of Collateral resulting from the Mark-to-Market process.","cat":"otc","diff":2,"chapters":[48,47]},{"id":"t607","term":"VM","def":"Acronym for Variation Margin.","cat":"otc","diff":1,"chapters":[47,48]},{"id":"t608","term":"Voluntary Corporate Action","def":"An event in the lifetime of an Equity or Bond security which is normally triggered by the Issuer, in which a financial opportunity is presented to holders. For example, whether to convert a Convertible Bond, or to subscribe in a Rights Issue. The voluntary nature of such events means that no action will be taken unless the holder elects to take action. See Mandatory Corporate Action and Optional Corporate Action.","cat":"core","diff":5,"chapters":[43,36,10]},{"id":"t609","term":"Withholding Tax","def":"Tax deducted in the issuer’s country of residence, on income paid by Issuers to investors, whether on Equities or Bonds. Investors resident in certain countries may be subject to a lower rate of withholding tax, if the issuer’s country and the investor’s country have a Double Taxation Agreement(or Treaty) in place.","cat":"core","diff":4,"chapters":[10,43,22,42,4,2]},{"id":"t610","term":"WKN Code","def":"A coding regime that identifies German securities.","cat":"core","diff":1,"chapters":[23]},{"id":"t611","term":"Zero Coupon Bond","def":"Debt Securities that do not pay interest, but which are issued at a deep discount and are typically redeemed at their full face value on the bond’s Maturity Date.","cat":"core","diff":2,"chapters":[33,2,4]}];

const CHAPTERS = [{"num":1,"title":"Fundamental Collateral Concepts","pages":"3–6","digest":["Collateral is just security for a promise: an asset the collateral giver hands to the collateral taker so that, if the giver fails to perform, the taker can sell it and make itself whole — the same logic as a mortgage, just applied to trading relationships.","Two completely different transaction families create the need for collateral, and they behave oppositely in time: asset-loaning transactions (repo, securities lending) are short-term (days/weeks) where the LENDER of the asset is at risk and takes collateral upfront; value-accumulating transactions (OTC derivatives) are long-term (years/decades, up to 50) where risk isn't known upfront — it emerges and flips between the two parties as market rates move.","For asset-loaning transactions the book is explicit about WHY the lender is at risk: the lender has an immediate risk of not having the lent asset returned, so collateral is given by the borrower specifically to mitigate that one risk.","For value-accumulating transactions (OTC derivatives), every trade starts at equal value to both parties on day one — it's only as time passes that one side gains an advantage and the disadvantaged (non-exposed) party must post collateral, precisely because if it went out of business the advantaged party would need to replace the trade at worse current market rates.","OTC derivatives have historically been executed bilaterally (privately negotiated directly between two firms) rather than via a derivative exchange — this bilateral, uncleared structure is exactly why they need their own collateral machinery, unlike exchange-traded derivatives.","Collateral is overwhelmingly cash or bonds, rarely equity — because the whole point is a stable, liquid, quickly-saleable asset, and equity's price volatility works against that; a cash collateral giver normally earns an agreed interest rate on that cash from the taker (in a positive-rate environment).","Both bonds and equity are securities and are usually subject to a haircut once given as collateral — the haircut percentage is deducted from current market value to derive collateral value; major currencies given as cash collateral usually have no haircut and retain 100% of value.","A margin call is simply the mechanism that keeps collateral value in line with exposure as prices move — either side can be owed one, depending on which way the mismatch runs on a given day; a firm must therefore monitor collateral values at an adequate frequency purely to know whether it currently has an exposure.","Collateral substitution exists because collateral givers often need their specific securities back for other purposes (like settling a sale) — the taker must never release original collateral without simultaneous receipt of replacement, or it becomes exposed itself.","Whoever holds securities collateral generally owes the coupon/dividend income on it back to the giver when it falls due — the taker is compensated by having the collateral, not by keeping income that isn't theirs.","Duration is the tell for which family a transaction belongs to: repo and SL&B are typically days-to-weeks; OTC derivatives are typically multi-year — which is why the book frames the whole discipline as two core duties: 1) identify exposures, and 2) mitigate exposures, at whatever frequency the transaction type demands."],"examples":[{"title":"The bookie analogy for a margin call","body":"Think of a sports bet with a bookmaker where the odds move sharply against you before the game even finishes — a good bookie doesn't wait until the final whistle to find out you can't pay; they ask you to top up your stake NOW, while the bet is still live, so their exposure to you never grows unchecked. A margin call is exactly this, formalized: as a trade or loan moves against one side, that side is asked to top up collateral immediately, before the gap between what's owed and what's secured has any chance to become a real loss."}],"key_terms":["Collateral Giver","Collateral Taker","Margin Call","Repo","Bond"],"stage":null},{"num":2,"title":"The Nature and Characteristics of Collateral Types","pages":"7–28","digest":["Cash collateral in the SAME currency as the exposure carries zero haircut and zero FX risk — it's the cleanest form of collateral there is; cash in a DIFFERENT currency than the exposure reintroduces FX risk for whichever side is unlucky when rates move, and either the giver or the taker could end up exposed by the movement.","Eligible collateral (which currencies, which bond types) must be specified in signed legal documentation before the first trade — if a firm tries to deliver a currency or bond type outside that list, the taking firm is legally entitled to refuse it outright.","Cash settlement runs through a cash correspondent (nostro): a firm issues settlement instructions to its own nostro by that nostro's deadline, and cash payments require NO pre-matching between payer and payee before money moves — which is exactly why a payer's own internal error-catching controls matter so much (a mistyped EUR 10,000,000 instead of EUR 1,000,000 will simply go through if the account has the balance).","Standing Settlement Instructions (SSIs) — 'our SSI' and 'their SSI' held in static data — exist purely so a firm doesn't have to contact a counterparty every single time it needs to pay them; S.W.I.F.T. is the secure global standard for actually transmitting the instructions.","A funds preadvice tells your OWN nostro to expect an incoming payment. Skip it (where your nostro requires one) and even a payment received exactly on time gets credited at 'next day' value — a real, quantifiable interest cost (a minimum of 1 night, 3 nights if the due date is a Friday) even though the paying counterparty technically did nothing wrong.","Bonds and equity are both securities; bonds specifically raise temporary capital for an issuer (governments, government agencies, supranationals, corporations) in exchange for a fixed coupon and a promised capital repayment at maturity (typically up to 30 years) — the price is issued at (or close to) 100% and normally repaid at (or close to) 100%.","Beyond plain fixed rate bonds, the chapter catalogs real bond variants each with a different risk/cashflow shape: Floating Rate Notes (coupon resets to a benchmark like Libor plus a fixed margin/spread, refixed and usually paid whenever the rate changes); Zero Coupon Bonds (issued at a deep discount, pay no interest, price drifts up toward par as maturity approaches); Convertible Bonds and Exchangeable Bonds (fixed coupon plus a conversion right into the issuer's own equity, or into an *associated* entity's equity for exchangeables); Mortgage-Backed / pass-through Securities (cashflows mirror a pool of mortgage repayments, with a 'pool factor' adjusting for unscheduled prepayment); plus callable bonds (issuer can redeem early), puttable bonds (holder can force early redemption), and graduated/step-up coupon bonds.","Bonds are globally identified by ISIN (International Securities Identification Number), with a national code (CUSIP in the US/Canada, Sedol in the UK, WKN in Germany, Valor in Switzerland) embedded as part of it — get the code wrong and you deliver the wrong security entirely, since near-identical bonds from the same issuer can differ only by currency or a minor feature.","Bond denominational values are a hard settlement constraint, not a suggestion — a bond with a EUR 20,000 minimum denomination simply cannot settle a EUR 8,500 delivery; static data must encode this or the CSD/custodian will reject the settlement instruction outright as an undeliverable quantity.","Bond market value moves on ordinary supply/demand (money-market rates vs. the bond's own coupon rate — pay more than you can earn elsewhere and the bond trades at a premium above par, and vice versa) AND on the issuer's actual or perceived creditworthiness; buying at issuance is the primary market, buying/selling afterward is the secondary market, where secondary trades of interest-bearing bonds attract accrued interest since the last coupon date.","Bond collateral value isn't just clean market price × quantity — it's that PLUS accrued interest, MINUS the haircut; skipping accrued interest under-values the collateral and silently under-collateralizes the exposed party (on a EUR 100,000,000 bond paying 5% annually, accrued interest alone can approach EUR 5,000,000 near coupon date).","Securities today are held electronically at Central Securities Depositories (CSDs) rather than as physical certificates — National CSDs (one per country, e.g. DTC in the US, CHESS in Australia, Clearstream Frankfurt in Germany) versus the two International CSDs (Euroclear Bank in Brussels, Clearstream International in Luxembourg) which mainly service eurobonds and, uniquely among CSDs, permit overnight cash balances in over 50 currencies. Settlement itself happens by electronic book entry — a simple debit/credit to each side's securities balance — and CSDs publish deadlines for receiving settlement instructions that get progressively earlier the further you sit from the CSD (direct member vs. via a custodian).","Haircut size is driven by issuer type, credit rating (per agencies like Moody's/S&P/Fitch — AAA down to CCC), asset type, and residual maturity — longer time to maturity means more can go wrong before repayment, so haircuts step up accordingly (this exact logic reappears identically in the CSA chapter later in the book); getting the haircut wrong doesn't just miscalculate a number, it causes real over- or under-collateralization.","DvP (Delivery versus Payment) is the securities-market version of PvP for FX — cash and securities move simultaneously so neither party is ever on-risk waiting for the other side, and DvP requires the buyer's and seller's settlement instructions to be MATCHED before anything moves; FoP (Free of Payment) breaks that simultaneity (one party moves first and goes on-risk) and is used specifically where only one side of value is moving — e.g. delivering securities collateral against no cash, which is exactly the mechanism used for margin calls settled in securities.","Margin call settlement is always directional (non-exposed party → exposed party), never a two-way exchange like a normal securities trade: settling in cash needs no instruction-matching at all (just a payment), while settling in securities needs an FoP instruction from the non-exposed party that must MATCH an equivalent instruction from the exposed party before the CSD will move anything.","Who gets paid a bond's coupon depends on who holds the position at the CSD's record date, not who 'really' owns it economically — if collateral moves across a record date, the CSD simply pays whoever is registered as holder on that date, and the legal documentation (not the CSD) determines who owes that coupon onward to whom; this is exactly why firms often prefer to substitute collateral out ahead of a record date rather than deal with claiming/passing on coupon payments and any withholding-tax wrinkles."],"examples":[{"title":"Haircut turning a bond's market value into its collateral value","body":"Firm B delivers USD 11,000,000 face value of World Bank 4.15% bonds to cover Firm A's USD 10,000,000 cash loan. Clean price 98.76% → USD 10,863,600; plus 282 days of accrued interest → +USD 357,591.67; total market value USD 11,221,191.67. Apply a 10% haircut (−USD 1,122,119.17) → collateral value USD 10,099,072.50 — still comfortably covering the USD 10,000,000 exposure, which is the entire point of over-collateralizing via the haircut."},{"title":"A record date collision changes who gets paid","body":"A CSD holds USD 106,000,000 of a World Bank 4.5% bond across six holders; Holder A (a custodian, USD 5,000,000) is entitled to a USD 225,000 coupon if it still holds the position at record date close. If instead Holder A's client had delivered USD 2,000,000 of those bonds into a repo as collateral on the record-date value date, the CSD would credit only USD 3,000,000-worth of coupon to Holder A and the other USD 2,000,000's coupon (USD 90,000) to the new holder (Firm E) — regardless of who 'really' owns the bonds economically. Whether Firm E must pass that USD 90,000 back to the original owner depends entirely on the signed legal documentation, not on the CSD's mechanical record-date process."},{"title":"The mortgage-deposit analogy for a haircut","body":"A bank won't lend you 100% of a house's appraised value — it holds back a margin (say, lending only 80%) specifically because house prices can fall, and the bank needs room to sell the house and still get its money back even if the price has dropped by the time it needs to. A haircut is the identical idea applied to bond collateral: a lender won't count a $1,000,000 bond as $1,000,000 of protection — only, say, $970,000 (a 3% haircut) — because the bond's price could fall before the lender ever needs to sell it."}],"key_terms":["Haircut","Fixed Rate Bond","Floating Rate Note","Zero Coupon Bond","Convertible Bond","Callable Bonds","Puttable Bonds","ISIN","Central Securities Depository","International Central Securities Depository","Custodian","Accrued Interest","Coupon","Delivery versus payment","Free of payment","DvP","Bond Denominational Value","Mortgage-Backed Security","Standing Settlement Instruction","Funds Pre-Advice","Credit Rating"],"stage":null},{"num":3,"title":"Sale & Repurchase (Repo) Trades and Collateral – Introduction to Repo","pages":"29–32","digest":["A repo is economically a secured cash loan: the borrower delivers bond collateral to the lender in exchange for cash, then reverses both flows (cash + interest back one way, collateral back the other) at close — but legally it's structured as a sale-and-repurchase of the securities, which is why it's called 'repo.'","'Repo' and 'reverse repo' are simply the same trade described from opposite sides — the cash borrower does a repo, the cash lender does a reverse repo — there's no such thing as one without the other on a single trade; some practitioners frame repo as a collateralised cash loan, others frame it as a securities transaction, and the book notes both views coexist.","Repo exists because it's cheaper than unsecured borrowing: pledging quality bond collateral lowers the lender's risk, which lowers the rate the borrower pays versus borrowing the same cash with nothing behind it — the repo rate itself is influenced by the perceived creditworthiness of the bond issuer, not just the two trading parties.","The marketplace has two distinct motivations layered on the same mechanics: cash-based repo (I need cash, any quality collateral will do) versus stock-based repo (I need THIS specific bond, and I'm willing to lend cash cheaply to get it) — this distinction becomes the general-collateral-vs-special-collateral split covered later; repos are classified as money-market transactions given their typically short-term nature.","The cast of repo participants is specific and each has a distinct role: institutional investors (mutual/hedge/pension funds, insurance companies, even non-financial corporates managing treasury cash) are the buy-side, usually cash lenders receiving collateral valued at up to 105% of cash lent; supranational organisations are typically cash-long lenders too; central banks use repo specifically as their primary monetary-policy tool via open market operations, controlling short-term rates with a transaction type regarded as carrying little credit risk; investment banks are the sell-side, borrowing to fund inventory and often running a 'matched book' (borrowing cheap from one counterparty, lending slightly dearer to another, pocketing the spread); brokers are pure intermediaries who never take a position of their own, earning commission by acting in an agency capacity.","Electronic trading platforms (GC Pooling, MTS Repo, Brokertec) have grown alongside the traditional telephone-based execution method, letting firms input currency, amount, rate, duration and required collateral for automated price comparison and execution."],"examples":[{"title":"The pawnbroker analogy for repo","body":"You pawn your watch: the pawnbroker gives you cash today, and you agree to buy the watch back in a month for a bit more cash than you received — the difference is effectively interest. Legally, you've SOLD your watch and will buy it back later; economically, you've simply borrowed cash and left your watch as security. A repo is the exact same structure, just with bonds instead of a watch: sell the bond today, agree to repurchase it later at a slightly higher price, and that price difference is the repo rate — the 'interest' on what is, in substance, a secured cash loan."}],"key_terms":["Repo","Reverse Repo","GMRA","Collateral Giver","Collateral Taker","Broker","Buy-Side","Sell-Side","Central Bank","Investment Bank"],"stage":null},{"num":4,"title":"Sale & Repurchase (Repo) Trades and Collateral – Classic Repo Trades","pages":"33–78","digest":["A classic repo is two linked legs of ONE trade (not two separate trades): opening leg (cash out, collateral in) and closing leg (cash + interest back, collateral back) — the link between the legs is what makes daily mark-to-market and margin calls apply throughout the trade's life; this is exactly what distinguishes it from a buy/sell-back, where the two legs are legally independent.","Repo 'leg' terminology is genuinely inconsistent across the market — opening leg is also called the 1st/onside/start/near/purchase leg, closing leg the 2nd/offside/end/far/repurchase leg — all describing the identical two-leg structure.","Term repo fixes the closing date at trade execution; open repo leaves it undefined and rolls daily until either party gives notice to close by an agreed daily deadline (e.g. 13:00 CET) — an open repo can be closed for its entire value or only part of it, and settles either same-day or next-day depending on the collateral market.","Europe's repo settlement cycle tightened from T+2 to T+1 in October 2014 (alongside the broader 'cash' securities market move to T+2, ahead of Target2-Securities in 2015) — this dramatically compressed the window to spot and fix a trade-confirmation discrepancy before it's actually due to settle, since checking now effectively has to happen on trade date itself.","The GMRA is the standard legal wrapper for repo, and its single most valuable clause is close-out netting on default: it lets a non-defaulting party settle everything with a defaulting counterparty as one net payment instead of gross trade-by-trade — exactly like the ISDA Master Agreement does for OTC derivatives. Firm-specific terms (eligible collateral, haircuts, margin-call deadlines, whether substitution is permitted) live in the negotiated Annex 1 ('Supplemental Terms and Conditions'), not the largely un-negotiated main body — so no two firms' GMRA relationships are guaranteed identical.","Under the GMRA, collateral moves on a title-transfer basis: the collateral taker becomes full legal owner and can freely reuse the collateral (sell it, repo it, lend it, or deliver it to satisfy an entirely different margin call elsewhere) — the giver keeps only 'beneficial ownership' and must be given back EQUIVALENT (not necessarily identical) securities at close; if the original ISIN no longer exists (e.g. replaced via a corporate action), the taker delivers the replacement instead.","Eligible collateral for a classic repo is agreed trade-by-trade around a specific issuer/liquidity rather than off a fixed universal list, but Annex 1 typically still lists acceptable and unacceptable bond types by name (e.g. flagging Italian government bonds as awkward collateral due to withholding tax) plus a minimum issuer credit rating; a firm should also actively monitor concentration limits so it isn't over-exposed to one single issuer's default across ALL its collateral-taking activity (repo, SL&B, and OTC derivatives combined), and should be wary of accepting collateral issued by the counterparty giving it.","General collateral (GC) repo — any bond meeting a quality bar — trades at a market-wide repo rate; special collateral repo — a SPECIFIC bond the lender wants (e.g. to cover a short sale) — trades at a discounted rate because the securities borrower is effectively paying for the privilege of getting that exact bond, sometimes down to negative rates when demand is extreme; a cash lender who's short-sold a bond can borrow it back via a stock-based repo specifically to settle that sale and collect proceeds early, then must return an equivalent bond at close.","Repo interest always uses actual calendar days (day count is 'from' date inclusive, 'to' date exclusive) divided by a currency-specific divisor — 360 for EUR/USD, 365 for GBP/AUD — meaning identical rate and day-count can still produce different cash amounts across currencies purely due to the divisor convention; this is a completely separate calculation from a bond's own accrued interest, which is used (alongside clean price) to derive the bond's market value rather than the cash side of the trade.","Over-collateralization can be expressed two mathematically different ways that land close but NOT identical: haircut (market value × (100% − haircut%) = cash borrowable) or initial margin (market value ÷ (initial margin% / 100) = cash borrowable) — a 2.5% haircut and a 102.5% initial margin look equivalent but produce slightly different numbers; whichever is used, it's fixed for that trade's entire term once agreed, in advance via Annex 1 or ad hoc at execution via the trade confirmation.","The ECB's own haircut regime (effective since Jan 2011) is a real, worked example of how professional haircut-setting actually works: bonds are sorted into 5 liquidity categories (central government debt down to asset-backed securities), then a haircut percentage is read off a grid crossing credit-quality band (upper: AAA to A−, lower: BBB+ to BBB−), residual-maturity bucket, and coupon type (fixed vs. zero) — e.g. a AAA supranational bond (Category II) with 5-7 years to maturity and a fixed coupon carries a 4.5% haircut, while a BBB-rated uncovered bank bond (Category IV, lower band) at the same maturity carries 38.5% — credit quality and category matter far more than maturity alone once you're below investment grade.","Calculating the actual bond QUANTITY needed to cover a cash exposure is a real three-step procedure: 1) compute the collateral value of a reference lot (e.g. €100,000 face) after haircut, 2) divide the exposure by that per-unit collateral value to get a pre-rounded quantity, 3) round UP to the nearest valid denomination — under-rounding would leave the exposure short-covered, which is why the method always rounds toward MORE collateral, never less.","Trade confirmation (and the passive 'affirmation' variant used when a dealer services a buy-side client rather than another dealer) exists to catch capture mismatches — wrong counterparty, wrong office, reversed borrower/lender, wrong rate — before they propagate; trade-related fields (counterparty, dates, rate) are the trader's to verify, settlement-detail fields (custodian accounts) are typically Operations'/Middle Office's job. Repo trade-matching platforms (e.g. Omgeo's CTM) automate this comparison and flag 'unmatched' trades for investigation before any delay pushes settlement past the due date.","Settling either leg via DvP requires four things simultaneously true: instructions matched, value date reached, seller holding sufficient bonds, buyer holding sufficient cash (or a credit line) — miss any one and settlement genuinely FAILS (delayed, not cancelled) until the missing piece resolves; critically, if the CASH BORROWER caused the fail by lacking bonds, it has no valid interest claim against the cash lender for the resulting delay.","Throughout a repo's life, exposure is recalculated daily as the difference between two independently-tracked numbers — current collateral value (mark-to-market clean/dirty price plus haircut) and current cash value (original principal plus accrued repo interest to date, net of any margin calls already settled in cash) — netted against any threshold and minimum transfer amount (MTA) before a call is valid; portfolio reconciliation services like triResolve exist specifically to confirm both parties still agree on which trades are even open, since a mismatched trade population would silently corrupt the whole exposure calculation.","A real exposure can exist and still not trigger a margin call if it's below the agreed MTA — the exposure simply carries forward uncollateralized until a later mark-to-market pushes it above the MTA threshold; margin call notifications typically must arrive by a fixed daily deadline (e.g. 14:00 CET), and while some counterparties informally honour late calls, relying on that leniency is a real, un-forced operational risk.","Cash-settled margin calls carry a rebate rate: the recipient reinvests the cash at the going money-market rate and pays that rate back to the original payer — effectively the margin call cash still earns/costs interest for whoever's money it economically is, distinct from the underlying repo rate itself.","At trade close, the closing leg settlement is prepared in advance (submitted ~2 days before the closing value date) and, critically, closing the trade doesn't automatically unwind margin calls already made — any cash or bonds transferred via margin calls during the trade's life must be separately returned to their original owner, since the closing leg settlement only covers the ORIGINAL principal and collateral quantity."],"examples":[{"title":"Repo interest across three real trades","body":"USD 5,000,000 lent at 2.75% for 1 day (divisor 360): interest = 5,000,000 × 2.75% / 360 × 1 = USD 381.94. A 32-day EUR loan of 15,000,000 at 3.07% (divisor 360): interest = 15,000,000 × 3.07% / 360 × 32 = EUR 40,933.33. A 70-day GBP loan of 27,500,000 at 2.45% (divisor 365): interest = 27,500,000 × 2.45% / 365 × 70 = GBP 129,212.33 — same formula, just scaled by the actual day count and the currency-specific divisor."},{"title":"Special collateral used to cover a short sale","body":"Party B has short-sold a bond it doesn't own and needs to deliver it to the buyer. Party B executes a stock-based repo with Party A: lends cash to Party A in exchange for the specific bond, immediately on-delivers that bond to the buying counterparty to settle the short sale and collect the sale proceeds, then must return an equivalent bond to Party A at the repo's close. Because Party A is supplying a bond in high demand, Party A accepts a lower repo rate than a general-collateral trade would pay."},{"title":"The ECB haircut grid, applied","body":"EUR 10,000,000 nominal of a AAA-rated World Bank 4.75% bond maturing in just over 6 years, clean price 99.1875%. World Bank is a supranational (Category II), AAA sits in the upper credit band, 6 years falls in the 5-7 year bucket, fixed coupon → haircut 4.5%. Clean value = EUR 9,918,750; plus 279 days' accrued interest (30/360 basis) = +EUR 368,125; market value EUR 10,286,875; less 4.5% haircut (−EUR 462,909.38) = collateral value EUR 9,823,965.62."},{"title":"Working out the exact bond quantity to deliver","body":"Counterparty B must cover a EUR 85,000,000 cash borrowing using a Category I, upper-band, 7-10 year floating rate note at a 98.15% dirty price and a 0.5% haircut. Collateral value per EUR 100,000 lot = 100,000 × 98.15% × (1 − 0.5%) = EUR 97,659.25. Pre-rounded quantity = 85,000,000 / 0.9765925 = EUR 87,037,326.21. Rounded UP to the nearest EUR 100,000 = EUR 87,100,000 must be delivered — rounding down would leave the exposure short-covered by design, which is why the method always rounds toward more collateral, never less."},{"title":"Haircut vs. initial margin, side by side","body":"A EUR 30,000,000 bond, once with a 2.5% haircut: 30,000,000 × (100% − 2.5%) = EUR 29,250,000 borrowable. The same bond with a 102.5% initial margin instead: 30,000,000 / (102.5/100) = EUR 29,268,292.68 borrowable — close, but not identical, which is exactly why a firm must know which convention a given counterparty relationship actually uses."}],"key_terms":["Classic Repo","GMRA","Haircut","Initial Margin","General Collateral","Special Collateral","Title Transfer","Concentration Limit","Repo Rate","Threshold","Minimum Transfer Amount","Portfolio Reconciliation","Trade Confirmation","Mark-to-Market","Rebate Rate","Beneficial Owner and Beneficial Ownership","Equivalent Security","Credit Rating"],"stage":null},{"num":5,"title":"Sale & Repurchase (Repo) Trades and Collateral – The Repo Trade Lifecycle","pages":"79–100","digest":["This chapter is a single worked repo trade walked through six stages end to end — it's the book's own template for how every other lifecycle chapter (SL&B, and the 20-chapter OTC collateral lifecycle) is structured, so understanding this one chapter unlocks the shape of the whole rest of the book.","Nothing about margin calls or settlement can work unless the pre-trading groundwork (signed GMRA and Annex, exchanged SSIs, and static data covering the counterparty, eligible collateral, exposure-calc frequency, pricing source, MTA, and margin-call deadlines) is already in place — the lifecycle assumes this is done BEFORE trade execution, not scrambled together afterward.","Trade execution is really three quiet steps before the trader ever calls the counterparty: determine the cash borrowing requirement (amount, currency, period), identify which bond in inventory to offer as collateral, then execute — agreeing counterparty, trade date, both value dates, quantity, bond, price, repo rate, and haircut/initial margin all at once.","Pre-settlement is itself a three-part chain, each step verifying the last: trade capture (the trader's own record, updating books & records), trade enrichment (static data fills in accrued days/interest and both parties' settlement accounts automatically), and trade confirmation — Firm A sends the full economic detail to the counterparty, who compares it against its OWN independent capture of the same trade before anything is allowed to proceed to settlement.","Settlement of the opening leg genuinely requires four conditions simultaneously: instructions matched, value date reached, seller holding the bonds, buyer holding the cash (or a credit line) — only then does the CSD execute, after which it sends an advice of settlement that triggers the firm's own books & records update AND two separate reconciliations (depot: securities balance vs. CSD statement; nostro: cash balance vs. CSD statement) — both must independently confirm the CSD did what it says it did.","Once the opening leg has settled, a strict daily cycle repeats for as long as the trade is open: mark the bond to an independent close-of-business price, run portfolio reconciliation (e.g. via triResolve) to confirm both firms still agree on which trades are even open, THEN calculate exposure the next morning from that price.","Exposure calculation itself is two independently-derived numbers compared: current collateral value (bond's clean price × quantity, plus accrued interest, less haircut) versus current value of cash lent (original principal plus repo interest accrued day-by-day, net of any margin calls already settled in cash) — whichever number is smaller identifies which party is exposed, and by how much (the gross exposure amount).","A gross exposure only becomes a valid call once it's tested against the minimum transfer amount: in the book's worked week, Firm A has a real USD 118,563.50 exposure on Day 4 that is explicitly NOT called because it sits below the USD 150,000 MTA — the exposure simply carries forward, uncollateralized, until a later day's price move pushes it above the threshold (which happens the very next day, flipping direction entirely and triggering a real call the other way).","Once a margin call is agreed, the non-exposed party chooses cash or bonds (per the legal documentation); cash settles same-day with no instruction-matching required (just a payment to the exposed party's nostro), while the RECEIVING party may need to issue its own funds preadvice to its nostro to avoid the payment being credited at 'next day' value and losing a night of interest — a real, avoidable cost purely from an ops-process gap, not a counterparty failure.","Every margin call, once cash-settled, is tracked in a running per-trade balance table alongside the original principal and collateral — this running balance is exactly what makes it possible to correctly compute NEXT day's exposure (since the current value of cash lent must net OUT prior margin calls already paid, not just the original principal).","At close, the closing leg settlement instruction is submitted roughly two days BEFORE the actual closing value date specifically to surface any unmatched-instruction problems while there's still time to fix them, rather than discovering a mismatch on the day itself.","Closing settlement itself mirrors the opening leg exactly (same four conditions: matched, value date reached, bonds available, cash available) but for the ORIGINAL principal plus total accrued repo interest against the original bond quantity — it does NOT automatically reverse any margin-call transfers made during the trade's life; those cash or securities movements must be unwound and returned to their original owner as a separate, explicit step once the trade is fully closed.","The chapter's closing notes flag two real-world wrinkles the clean worked example skips over: margin calls are commonly rounded to a tidy cash figure (e.g. the nearest USD 50,000) rather than called for the exact cent amount, and — separately from the underlying repo rate — cash-settled margin calls carry their own rebate rate paid back to whichever party's cash is economically tied up in the call."],"examples":[{"title":"A full week of a real USD 30,000,000 repo trade","body":"Firm A borrows USD 30,000,000 for 7 days from Party G at 2.42% repo rate against Issuer ABC 4.35% bonds (2.5% haircut). Opening leg (8 June): Firm A delivers the bonds and receives USD 30,320,428.12 (gross bond value 29,985,000 + accrued interest 1,112,875, less 2.5% haircut, i.e. the collateral value backs the cash lent). Day 1 M2M (9 June): bond price falls to 99.32%, collateral value drops to 30,139,687.50 against a cash value (with accrued repo interest) of 30,322,466.33 — Party G is exposed by USD 182,778.83 and receives a cash margin call for that amount. Day 4 M2M (12 June): Firm A is technically exposed by USD 118,563.50, but since that's below the agreed USD 150,000 minimum transfer amount, no call is made. Day 5 M2M (13 June): bond price recovers to 100.09%; now Firm A is exposed by USD 231,209.68 (above the MTA) and receives a cash margin call back from Party G. Closing leg (15 June): Firm A repays USD 30,334,695.57 (original 30,320,428.12 + 7 days' repo interest at 2.42%) and receives its bonds back; the margin call cash movements are unwound separately from this closing settlement."},{"title":"Why the running balance table matters","body":"By Day 5 (13 June), Firm A's 'current value of cash borrowed' isn't just the original USD 30,320,428.12 plus 5 days of repo interest (USD 10,191.03) — it must also subtract the USD 182,778.83 already paid to Party G as a margin call on Day 1, giving a true current cash value of USD 30,147,840.32. Comparing that against the bond's current collateral value of USD 30,379,050.00 is what correctly reveals Firm A's USD 231,209.68 exposure — using the ORIGINAL principal without netting out the prior margin call would have produced a materially wrong exposure figure."}],"key_terms":["Repo","Trade Confirmation","Static Data and Static Data Repository","Standing Settlement Instruction","Mark-to-Market","Portfolio Reconciliation","Minimum Transfer Amount","Margin Call","DvP","Settlement Instruction","Rebate Rate","Funds Pre-Advice","Nostro"],"stage":null},{"num":6,"title":"Sale & Repurchase (Repo) Trades and Collateral – Stock-Based Classic Repo Trades","pages":"101–102","digest":["A stock-based classic repo is mechanically identical to a cash-based repo (same GMRA, same cash-for-bonds structure) — the only thing that changes is WHY the trade happens: the securities borrower needs a specific ISIN, not just any acceptable collateral.","The usual trigger is a delivery commitment the borrower can't otherwise meet — a prior sale it can't settle, a client waiting on delivery, or the threat of a costly forced 'buy-in' if it doesn't produce the security in time; this is the identical motivation covered in far more depth for securities lending & borrowing in Part 3.","Because the cash lender in a stock-based repo actually wants the specific bond (not just security for its cash), it's willing to accept a lower repo rate than general collateral would command — the securities borrower is effectively paying for access to that specific ISIN through a cheaper cost of cash, mirroring the special-collateral dynamic from Chapter 4.","The parties in a stock-based repo have a specific dual identity worth keeping straight: the securities lender is simultaneously the seller of securities AND the borrower of cash; the securities borrower is simultaneously the buyer of securities AND the lender of cash — the cash flow and the securities flow run in opposite directions between the same two counterparties.","When demand for a specific security is exceptionally high relative to its available supply, the repo rate can be forced into negative territory — securities borrowers will accept paying to hold cash rather than miss out on the specific bond they need, which is the extreme end of the same special-collateral logic.","This chapter is deliberately short because stock-based repo's real depth of coverage — the motivations and mechanics of borrowing securities — lives in Part 3 (Securities Lending & Borrowing); a repo agreement is just an alternative legal wrapper for functionally the same borrow."],"examples":[],"key_terms":["Stock-Based Repo","GMRA","Special Collateral","Repo Rate"],"stage":null},{"num":7,"title":"Sale & Repurchase (Repo) Trades and Collateral – Repo Trade Variations","pages":"103–120","digest":["Buy/sell-backs (BSB) look like a repo economically but are legally two independent, unlinked trades (a spot sale + a forward repurchase) rather than one two-legged trade — which means no ongoing mark-to-market, no margin calls, and no collateral substitution during the trade's life, since there's no 'open position' linking the legs together; only 'term' BSBs are possible, since the closing leg is priced at trade execution for a specific closing date.","BSB pricing folds repo interest into the closing leg's clean price rather than showing it as a separate cash amount — the final settlement total is identical to an equivalent classic repo, just presented differently (percentage price + accrued interest to the closing date instead of principal + a separate interest line); if the bond pays a coupon during the trade, the closing cash amount is explicitly adjusted for that coupon value instead of being paid out separately as it would be in a classic repo.","Tri-party repo outsources the entire operational burden — collateral selection (sometimes fully automated 'auto-select' from a defined collateral basket), mark-to-market, margin calls, substitution, even coupon collection — to a neutral third-party agent (the two ICSDs, or custodian banks like BNY Mellon/J.P. Morgan) under a signed three-way service-level agreement; the trading parties just agree the trade's commercial terms and let the agent run the mechanics, trading a bit of control for a lot of reduced operational risk and effort, plus the benefit that collateral sits with a neutral party rather than the counterparty itself.","Delivery by Value (DBV) is a UK/Ireland-specific (Crest, operated by Euroclear UK & Ireland) mechanism for very short-term collateralized cash swaps where Crest itself auto-selects collateral from a predefined 'basket' (e.g. all equities, FTSE-100 only, all gilts) rather than the trading parties naming a specific bond — Overnight DBVs auto-close and refresh collateral every single business day; Term DBVs (introduced July 2011) let two parties agree a real forward closing date up to two years out, with Crest automatically substituting collateral whenever the borrower needs to deliver out securities currently tied up in the DBV.","Central clearing (via a Central Counterparty, CCP) solves bilateral counterparty risk at its root: novation legally re-splits every trade so the CCP becomes seller-to-every-buyer and buyer-to-every-seller, meaning a firm's true, single counterparty for risk purposes becomes the (heavily regulated) CCP rather than a scattered web of bilateral relationships — the CCP itself must stay perfectly market-risk-neutral (zero net position) at all times.","Multilateral netting is the CCP's real structural advantage over even bilateral netting: the book's own worked example shows a firm's 9 separate gross repo trades (5 repos + 4 reverse repos, all in the same bond, with different counterparties) collapsing, once novated to a CCP, into a single net settlement obligation — one delivery quantity against one net cash figure — versus having to risk-manage and potentially margin-call all 9 counterparties individually under a purely bilateral model.","Repo central clearing isn't mandatory — a firm chooses trade-by-trade whether to centrally clear (if it has real credit concerns about the counterparty) or stay bilateral (to avoid the cost, where it has little concern) — and clearing arrives at the CCP either via a matching/validation platform (e.g. ETCMS feeding into RepoClear) after bilateral voice/screen executio
